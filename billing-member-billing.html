:root{

  --secondary:#10b981; --secondary-light:#34d399; --secondary-dark:#059669;
  --success:#10b981; --success-bg:#d1fae5; --success-dark:#047857;
  --info:#3b82f6; --info-bg:#eff6ff; --info-dark:#1d4ed8; --info-hover:#2563eb;
  --bg-default:#f8fafc; --bg-paper:#ffffff;
  --text-primary:#0f172a; --text-secondary:#64748b;
  --border:#f1f5f9; --border-input:#cbd5e1; --border-input-hover:#94a3b8;
  --hover-row:#f1f5f9; --action-hover:rgba(71,85,105,.04); --action-selected:rgba(71,85,105,.08);
  --danger:#ef4444; --warning:#f59e0b;
  --radius-card:10px; --radius-base:8px; --radius-control:6px; --radius-chip:4px;
  --shadow-card:0 2px 4px rgba(0,0,0,.02),0 1px 2px rgba(0,0,0,.03);
  --shadow-1:0 1px 3px rgba(0,0,0,.05);
  --shadow-appbar:0 1px 1px rgba(51,65,85,.03);
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Inter","Roboto","Helvetica","Arial",sans-serif;color:var(--text-primary);}
.app{display:flex;height:100vh;overflow:hidden;}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;}
.tabular{font-variant-numeric:tabular-nums;}

/* ---------- Sidebar ---------- */
.sidebar{width:240px;flex:0 0 240px;background:var(--primary-dark);color:#f8fafc;display:flex;flex-direction:column;overflow-y:auto;}
.logo{display:flex;align-items:center;gap:10px;padding:20px 20px 16px;}
.logo svg{flex:0 0 auto;}
.logo span{font-weight:700;font-size:1.05rem;letter-spacing:.02em;}
.nav{padding:8px 12px;display:flex;flex-direction:column;gap:2px;flex:1;}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-base);color:#f8fafc;font-size:.9rem;font-weight:500;text-decoration:none;cursor:pointer;}
.nav-item .material-symbols-rounded{font-size:20px;min-width:24px;color:rgba(248,250,252,.7);}
.nav-item.disabled{opacity:.42;cursor:not-allowed;}
.nav-item:not(.disabled):hover{background:rgba(248,250,252,.08);}
.nav-item.active{background:rgba(248,250,252,.14);}
.nav-item.active .material-symbols-rounded{color:#f8fafc;}
.nav-section{margin:16px 12px 6px;font-size:.7rem;font-weight:700;letter-spacing:.08em;color:rgba(248,250,252,.45);text-transform:uppercase;}
.sidebar-foot{padding:14px 20px;font-size:.7rem;color:rgba(248,250,252,.4);border-top:1px solid rgba(248,250,252,.08);}

/* ---------- Main / Topbar ---------- */
.main{flex:1;display:flex;flex-direction:column;background:var(--bg-default);height:100vh;overflow:hidden;}
.topbar{height:64px;flex:0 0 64px;background:#fff;box-shadow:var(--shadow-appbar);display:flex;align-items:center;gap:16px;padding:0 24px;}
.topbar-search{position:relative;width:320px;}
.topbar-search input{width:100%;height:36px;padding:8px 12px 8px 36px;font-size:.875rem;border:1px solid var(--border-input);border-radius:var(--radius-control);background:#fff;font-family:inherit;}
.topbar-search input:hover{border-color:var(--border-input-hover);}
.topbar-search input:focus{border-color:var(--primary);outline:none;}
.topbar-search .material-symbols-rounded{position:absolute;left:9px;top:8px;font-size:18px;color:var(--text-secondary);}
.topbar-spacer{flex:1;}
.icon-btn{position:relative;width:36px;height:36px;border-radius:50%;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);}
.icon-btn:hover{background:var(--action-hover);}
.icon-btn .dot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--danger);}
.avatar-32{width:32px;height:32px;border-radius:50%;background:#d1fae5;color:var(--success-dark);font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;}
.loc-pill{display:flex;align-items:center;gap:5px;font-size:.825rem;font-weight:600;color:var(--text-secondary);background:var(--bg-default);border:1px solid var(--border-input);border-radius:6px;padding:5px 10px;}
.user-btn{display:inline-flex;align-items:center;gap:5px;background:#fff;color:var(--text-primary);border:1px solid var(--border-input);border-radius:6px;padding:4px 9px;font-size:.75rem;font-weight:600;cursor:pointer;}
.user-btn:hover{border-color:var(--border-input-hover);background:var(--action-hover);}

/* ---------- Page ---------- */
.page{flex:1;overflow-y:auto;padding:24px;}
.page-header{margin-bottom:20px;}
h1.page-title{font-size:1.75rem;font-weight:600;letter-spacing:-.01em;margin:0 0 4px;color:var(--text-primary);}
.page-subtitle{font-size:.8rem;font-weight:400;color:var(--text-secondary);margin:0;}

.card{background:var(--bg-paper);border-radius:var(--radius-card);box-shadow:var(--shadow-card);border:none;}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;gap:12px;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.search-wrap{position:relative;width:280px;}
.search-wrap input{width:100%;height:36px;padding:8px 12px 8px 34px;font-size:.875rem;border:1px solid var(--border-input);border-radius:var(--radius-control);background:#fff;font-family:inherit;}
.search-wrap input:hover{border-color:var(--border-input-hover);}
.search-wrap input:focus{border-color:var(--primary);outline:none;}
.search-wrap .material-symbols-rounded{position:absolute;left:9px;top:8px;font-size:18px;color:var(--text-secondary);}
select.filter-select{width:170px;height:36px;padding:8px 12px;font-size:.875rem;border:1px solid var(--border-input);border-radius:var(--radius-control);background:#fff;color:var(--text-primary);font-family:inherit;}
select.filter-select:hover{border-color:var(--border-input-hover);}
select.filter-select:focus{border-color:var(--primary);outline:none;}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;border:none;border-radius:var(--radius-control);padding:8px 16px;font-weight:600;font-size:.875rem;cursor:pointer;box-shadow:none;font-family:inherit;text-decoration:none;}
.btn .material-symbols-rounded{font-size:18px;}
.btn-outline{background:#fff;color:var(--text-primary);border:1px solid var(--border-input);}
.btn-outline:hover{border-color:var(--primary);background:var(--action-hover);}
.btn-export{margin-left:auto;}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:1000px;}
th{font-size:.725rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary);padding:12px 16px;border-bottom:1px solid var(--border);background:transparent;text-align:left;}
th.col-chevron{width:44px;}
td{font-size:.875rem;padding:16px;border-bottom:1px solid var(--border);color:var(--text-primary);vertical-align:middle;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:var(--hover-row);}
tbody tr:last-child td{border-bottom:0;}
tbody tr:hover .chevron{color:var(--text-primary);}
.col-member{display:flex;align-items:center;gap:12px;}
.avatar{width:32px;height:32px;border-radius:50%;font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.member-name{font-size:.875rem;font-weight:600;color:var(--text-primary);}
.member-id{font-size:.75rem;font-weight:400;color:var(--text-secondary);}
.membership-plan{font-size:.875rem;color:var(--text-primary);}
.membership-price{font-size:.75rem;font-weight:400;color:var(--text-secondary);}
.date-cell{font-size:.875rem;color:var(--text-primary);}
.date-never{color:var(--text-secondary);font-style:italic;}
.date-dash{color:var(--text-secondary);}
.chevron{color:var(--text-secondary);font-size:20px;}
.col-chevron-cell{text-align:right;}

/* ---------- Chips ---------- */
.chip{height:24px;border-radius:var(--radius-chip);font-size:.75rem;font-weight:600;padding:0 8px;display:inline-flex;align-items:center;white-space:nowrap;}
.chip-success{background:var(--success-bg);color:var(--success-dark);}
.chip-info{background:var(--info-bg);color:var(--info-dark);}
.chip-warning{background:#fef3c7;color:#b45309;}
.chip-danger{background:#fee2e2;color:#b91c1c;}
.chip-muted{background:#f1f5f9;color:var(--text-secondary);}

/* ---------- Empty state ---------- */
.empty-cell{padding:48px 24px;text-align:center;}
.empty-icon{font-size:40px;color:#cbd5e1;}
.empty-title{font-size:.875rem;font-weight:600;color:var(--text-primary);margin:12px 0 4px;}
.empty-sub{font-size:.8rem;font-weight:400;color:var(--text-secondary);margin:0 0 16px;}

/* ---------- Footer ---------- */
.footer{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-top:1px solid var(--border);}
.footer-count{font-size:.8rem;font-weight:400;color:var(--text-secondary);}
.pagination{display:flex;gap:6px;}
.page-btn{width:32px;height:32px;border-radius:var(--radius-control);font-size:.8rem;font-weight:600;border:1px solid var(--border);background:#fff;color:var(--text-primary);cursor:pointer;font-family:inherit;}
.page-btn:hover{background:var(--hover-row);}
.page-btn.active{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark);}

/* ---------- Drawer ---------- */
.drawer-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:40;}
.drawer-backdrop.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;height:100vh;width:420px;background:var(--bg-paper);box-shadow:-8px 0 24px rgba(0,0,0,.10);display:flex;flex-direction:column;overflow-y:auto;transform:translateX(100%);transition:transform .22s ease;z-index:41;}
.drawer.open{transform:translateX(0);}
@media (max-width:1024px){.drawer{width:100%;}}
.drawer-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;gap:14px;align-items:flex-start;position:relative;flex:0 0 auto;}
.drawer-avatar{width:40px;height:40px;border-radius:50%;font-size:.9rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.drawer-title{font-size:1.25rem;font-weight:600;color:var(--text-primary);margin:0;}
.drawer-id{font-size:.8rem;font-weight:400;color:var(--text-secondary);margin:2px 0 8px;}
.drawer-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.drawer-close:hover{background:var(--action-hover);}
.drawer-section{padding:20px 24px;border-bottom:1px solid var(--border);}
.drawer-eyebrow{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary);margin:0 0 14px;}
.kv-grid{display:grid;grid-template-columns:130px 1fr;row-gap:10px;}
.kv-label{font-size:.75rem;font-weight:600;color:var(--text-secondary);}
.kv-value{font-size:.875rem;font-weight:400;color:var(--text-primary);}
.kv-value.danger{color:var(--danger);font-weight:600;}
.kv-note{font-size:.75rem;color:var(--text-secondary);}
.activity-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.activity-row:last-child{border-bottom:0;}
.activity-date{font-size:.75rem;font-weight:400;color:var(--text-secondary);min-width:120px;}
.activity-batch{font-size:.75rem;font-weight:600;color:var(--info-dark);min-width:110px;background:none;border:none;font-family:inherit;text-align:left;cursor:pointer;padding:0;}
.activity-amount{font-size:.8rem;font-weight:600;text-align:right;flex:1;}
.drawer-footer{position:sticky;bottom:0;padding:16px 24px;border-top:1px solid var(--border);background:var(--bg-paper);display:flex;flex-direction:column;gap:8px;margin-top:auto;}
.drawer-btn{width:100%;height:36px;border-radius:var(--radius-control);font-size:.875rem;font-weight:600;background:#fff;border:1px solid var(--border-input);color:var(--text-primary);cursor:pointer;font-family:inherit;}
.drawer-btn:hover{border-color:var(--primary);background:var(--action-hover);}
.drawer-btn.hold{color:var(--danger);border-color:#fecaca;}
.drawer-btn.hold:hover{background:#fee2e2;}
.drawer-btn.release{color:var(--secondary-dark);border-color:#a7f3d0;}
.drawer-btn.release:hover{background:#d1fae5;}
.drawer-btn:disabled{opacity:.5;cursor:not-allowed;}
.drawer-btn:disabled:hover{background:#fff;border-color:var(--border-input);}
.drawer-helper{font-size:.75rem;font-weight:400;color:var(--text-secondary);margin-top:-4px;}

  var planSelect = document.getElementById("planSelect");
  var statusSelect = document.getElementById("statusSelect");
  var exportBtn = document.getElementById("exportBtn");
  var drawer = document.getElementById("drawer");
  var backdrop = document.getElementById("backdrop");
  var drawerContent = document.getElementById("drawerContent");

  function matchesFilters(row){
    var s = state.search.trim().toLowerCase();
    if(s){
      var hay = (row.name + " " + row.id).toLowerCase();
      if(hay.indexOf(s) === -1) return false;
    }
    if(state.plan && row.plan !== state.plan) return false;
    if(state.status && row.status !== state.status) return false;
    return true;
  }

  function computePopulationTotal(searchLower, plan, status){
    if(searchLower){
      if(POP_SEARCH.hasOwnProperty(searchLower)) return POP_SEARCH[searchLower];
      if(plan && status){
        var key = plan + "|" + status;
        if(POP_COMBO.hasOwnProperty(key)) return POP_COMBO[key];
        return Math.round(POP_BY_PLAN[plan] * POP_BY_STATUS[status] / TOTAL_POP);
      }
      if(status) return POP_BY_STATUS[status];
      if(plan) return POP_BY_PLAN[plan];
      return TOTAL_POP;
    }
    if(plan && status){
      var key2 = plan + "|" + status;
      if(POP_COMBO.hasOwnProperty(key2)) return POP_COMBO[key2];
      return Math.round(POP_BY_PLAN[plan] * POP_BY_STATUS[status] / TOTAL_POP);
    }
    if(status) return POP_BY_STATUS[status];
    if(plan) return POP_BY_PLAN[plan];
    return TOTAL_POP;
  }

  function pluralize(n, word){
    return n === 1 ? ("1 " + word) : (n + " " + word + "s");
  }

  function dateCellHtml(value){
    if(value === "Never") return '<span class="date-never">Never</span>';
    if(value === "—") return '<span class="date-dash">—</span>';
    return value;
  }

  function renderRow(row){
    var tint = AVATAR_TINT[row.status];
    var chipClass = STATUS_CHIP[row.status];
    var tr = document.createElement("tr");
    tr.dataset.memberId = row.id;
    tr.innerHTML =
      '<td><div class="col-member">' +
        '<div class="avatar" style="background:' + tint.bg + ';color:' + tint.fg + ';">' + row.initials + '</div>' +
        '<div><div class="member-name">' + row.name + '</div><div class="member-id tabular">' + row.id + '</div></div>' +
      '</div></td>' +
      '<td><div class="membership-plan">' + row.plan + '</div><div class="membership-price">' + row.price + '</div></td>' +
      '<td class="date-cell">' + row.contractStart + '</td>' +
      '<td class="date-cell">' + dateCellHtml(row.lastBilled) + '</td>' +
      '<td class="date-cell">' + dateCellHtml(row.nextBilling) + '</td>' +
      '<td><span class="chip ' + chipClass + '">' + row.status + '</span></td>' +
      '<td class="col-chevron-cell"><span class="material-symbols-rounded chevron">chevron_right</span></td>';
    tr.addEventListener("click", function(e){ openDrawer(row.id, tr); });
    return tr;
  }

  function render(){
    var visible = seed.filter(matchesFilters);

    tbody.innerHTML = "";

    if(visible.length === 0){
      var tr = document.createElement("tr");
      var td = document.createElement("td");
      td.colSpan = 7;
      td.className = "empty-cell";
      td.innerHTML =
        '<span class="material-symbols-rounded empty-icon" aria-hidden="true">search_off</span>' +
        '<p class="empty-title">No members match these filters</p>' +
        '<p class="empty-sub">Try a different plan or status, or clear the search.</p>' +
        '<button class="btn btn-outline" id="clearFiltersBtn">Clear filters</button>';
      tr.appendChild(td);
      tbody.appendChild(tr);
      document.getElementById("clearFiltersBtn").addEventListener("click", clearFilters);

      footerText.textContent = "Showing 0 of " + TOTAL_POP + " members";
      subtitleCount.textContent = pluralize(TOTAL_POP, "member");
      pagination.innerHTML = "";
      return;
    }

    visible.forEach(function(row){ tbody.appendChild(renderRow(row)); });

    var searchLower = state.search.trim().toLowerCase();
    var total = computePopulationTotal(searchLower, state.plan || null, state.status || null);

    footerText.textContent = "Showing 1–" + visible.length + " of " + total + " members";
    subtitleCount.textContent = pluralize(total, "member");

    if(total > PAGE_SIZE){
      pagination.innerHTML =
        '<button class="page-btn active">1</button>' +
        '<button class="page-btn" data-noop>2</button>' +
        '<button class="page-btn" data-noop>3</button>';
    } else {
      pagination.innerHTML = "";
    }
  }

  function clearFilters(){
    state.search = "";
    state.plan = "";
    state.status = "";
    state.page = 1;
    searchInput.value = "";
    planSelect.value = "";
    statusSelect.value = "";
    render();
  }

  searchInput.addEventListener("input", function(){
    state.search = searchInput.value;
    state.page = 1;
    render();
  });
  planSelect.addEventListener("change", function(){
    state.plan = planSelect.value;
    state.page = 1;
    render();
  });
  statusSelect.addEventListener("change", function(){
    state.status = statusSelect.value;
    state.page = 1;
    render();
  });
  exportBtn.addEventListener("click", function(){ /* data-noop */ });

  /* ---------------- Drawer ---------------- */

  function actionButtonsHtml(row){
    var status = row.status;
    if(status === "Current" || status === "Prorated"){
      return '<button class="drawer-btn" data-noop>Charge Now</button>' +
             '<button class="drawer-btn hold" data-noop>Place Billing Hold</button>';
    }
    if(status === "In Arrears"){
      return '<button class="drawer-btn" data-noop>Bill Arrears Now</button>' +
             '<button class="drawer-btn hold" data-noop>Place Billing Hold</button>';
    }
    if(status === "Failed"){
      return '<button class="drawer-btn" data-noop>Retry Payment</button>' +
             '<button class="drawer-btn" id="viewInFailedBtn">View in Failed Payments</button>' +
             '<button class="drawer-btn hold" data-noop>Place Billing Hold</button>';
    }
    if(status === "On Hold"){
      return '<button class="drawer-btn release" data-noop>Release Billing Hold</button>' +
             '<button class="drawer-btn" id="chargeNowDisabledBtn" disabled aria-disabled="true">Charge Now</button>' +
             '<p class="drawer-helper">Release the billing hold before charging this member.</p>';
    }
    return "";
  }

  function activityRowsHtml(activity){
    return activity.map(function(a){
      var chip = OUTCOME_CHIP[a.outcome] || "chip-muted";
      return '<div class="activity-row">' +
        '<span class="activity-date">' + a.date + '</span>' +
        '<button class="activity-batch" data-noop>' + a.batch + '</button>' +
        '<span class="activity-amount tabular">' + a.amount + '</span>' +
        '<span class="chip ' + chip + '">' + a.outcome + '</span>' +
      '</div>';
    }).join("");
  }

  function renderDrawerContent(memberId){
    var row = seed.filter(function(r){ return r.id === memberId; })[0];
    var data = drawerData[memberId];
    if(!row || !data) return;

    var tint = AVATAR_TINT[row.status];
    var chipClass = STATUS_CHIP[row.status];
    var m = data.membership, s = data.schedule, p = data.payment;

    var paymentSection;
    if(p){
      paymentSection =
        '<div class="kv-grid">' +
          '<div class="kv-label">Card</div><div class="kv-value">' + p.card + '</div>' +
          '<div class="kv-label">Expires</div><div class="kv-value tabular">' + p.expires + '</div>' +
          '<div class="kv-label">Added</div><div class="kv-value">' + p.added + '</div>' +
        '</div>';
    } else {
      paymentSection =
        '<div class="kv-grid">' +
          '<div class="kv-label">Card</div><div class="kv-value danger">No card on file</div>' +
        '</div>';
    }

    var nextScheduledHtml = s.nextScheduled === "—"
      ? '<span class="date-dash">—</span>' + (s.nextNote ? '  <span class="kv-note">' + s.nextNote + '</span>' : '')
      : s.nextScheduled;

    drawerContent.innerHTML =
      '<div class="drawer-header">' +
        '<div class="drawer-avatar" style="background:' + tint.bg + ';color:' + tint.fg + ';">' + row.initials + '</div>' +
        '<div>' +
          '<p class="drawer-title">' + row.name + '</p>' +
          '<p class="drawer-id tabular">' + row.id + '</p>' +
          '<span class="chip ' + chipClass + '">' + row.status + '</span>' +
        '</div>' +
        '<button class="drawer-close" id="drawerCloseBtn" aria-label="Close">' +
          '<span class="material-symbols-rounded">close</span>' +
        '</button>' +
      '</div>' +
      '<div class="drawer-section">' +
        '<p class="drawer-eyebrow">Membership</p>' +
        '<div class="kv-grid">' +
          '<div class="kv-label">Plan</div><div class="kv-value">' + m.plan + '</div>' +
          '<div class="kv-label">Price</div><div class="kv-value tabular">' + m.price + '</div>' +
          '<div class="kv-label">Contract start</div><div class="kv-value">' + m.contractStart + '</div>' +
          '<div class="kv-label">Term</div><div class="kv-value">' + m.term + '</div>' +
          '<div class="kv-label">Billing anchor</div><div class="kv-value">' + m.anchor + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="drawer-section">' +
        '<p class="drawer-eyebrow">Billing Schedule</p>' +
        '<div class="kv-grid">' +
          '<div class="kv-label">Last successful</div><div class="kv-value">' + dateCellHtml(s.lastSuccessful) + '</div>' +
          '<div class="kv-label">Next scheduled</div><div class="kv-value">' + nextScheduledHtml + '</div>' +
          '<div class="kv-label">Cycle</div><div class="kv-value">' + s.cycle + '</div>' +
          '<div class="kv-label">Cycles billed</div><div class="kv-value">' + s.cyclesBilled + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="drawer-section">' +
        '<p class="drawer-eyebrow">Payment Method</p>' +
        paymentSection +
      '</div>' +
      '<div class="drawer-section">' +
        '<p class="drawer-eyebrow">Recent Billing Activity</p>' +
        activityRowsHtml(data.activity) +
      '</div>' +
      '<div class="drawer-footer">' +
        actionButtonsHtml(row) +
      '</div>';

    document.getElementById("drawerCloseBtn").addEventListener("click", closeDrawer);
    var viewInFailedBtn = document.getElementById("viewInFailedBtn");
    if(viewInFailedBtn){
      viewInFailedBtn.addEventListener("click", function(){
        window.location.href = "billing-failed-payments.html";
      });
    }
    var chargeDisabled = document.getElementById("chargeNowDisabledBtn");
    if(chargeDisabled){
      chargeDisabled.addEventListener("click", function(e){ e.preventDefault(); });
    }
  }

  function openDrawer(memberId, triggerEl){
    if(triggerEl) lastFocusedRow = triggerEl;
    state.drawerMemberId = memberId;
    renderDrawerContent(memberId);
    drawer.classList.add("open");
    drawer.setAttribute("aria-hidden", "false");
    backdrop.classList.add("open");
    var closeBtn = document.getElementById("drawerCloseBtn");
    if(closeBtn) closeBtn.focus();
  }

  function closeDrawer(){
    drawer.classList.remove("open");
    drawer.setAttribute("aria-hidden", "true");
    backdrop.classList.remove("open");
    state.drawerMemberId = null;
    if(lastFocusedRow) lastFocusedRow.focus();
  }

  backdrop.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && drawer.classList.contains("open")){
      closeDrawer();
    }
    if(e.key === "Tab" && drawer.classList.contains("open")){
      var focusable = drawer.querySelectorAll('button:not([disabled]), [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      if(focusable.length === 0) return;
      var first = focusable[0];
      var last = focusable[focusable.length - 1];
      if(e.shiftKey && document.activeElement === first){
        e.preventDefault();
        last.focus();
      } else if(!e.shiftKey && document.activeElement === last){
        e.preventDefault();
        first.focus();
      }
    }
  });

  render();
})();
</script>
</body>
</html>
