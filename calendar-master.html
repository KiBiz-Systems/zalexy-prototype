<!--
  Zalexy Prototype — Calendar Master Schedule (Staff Pivot View)
  Spec:   ai-workspace/prototypes/staff/calendar-master.md
  Design: ai-workspace/prototypes/_shared/design-system.md
  Static prototype. Not production code. No app dependencies.
  Rev 2 — grid rebuild (2026-09-10). See spec §2.11-2.16 for what Rev 1 got wrong.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Zalexy — Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root{--primary:#334155;--primary-dark:#1e293b;--info:#3b82f6;--info-bg:#eff6ff;--info-dark:#1d4ed8;--success:#10b981;--success-bg:#d1fae5;--success-dark:#047857;--warning:#f59e0b;--danger:#ef4444;--text-primary:#0f172a;--text-secondary:#64748b;--border:#f1f5f9;--border-input:#cbd5e1;--bg-default:#f8fafc;--radius-card:10px;--radius-base:8px;--radius-control:6px;--shadow-card:0 2px 4px rgba(0,0,0,0.02),0 1px 2px rgba(0,0,0,0.03)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg-default);color:var(--text-primary);font-size:14px;height:100vh;overflow:hidden}
body.density-compact{--slot-h:32px}
body.density-comfortable{--slot-h:56px}
button{font:inherit;cursor:pointer}
select,input{font:inherit}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:18px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;vertical-align:middle}
.app{display:flex;height:100vh;overflow:hidden}
.main-shell{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;padding:0 20px;gap:10px;flex-shrink:0}
.loc-pill{display:flex;align-items:center;gap:5px;font-size:.825rem;font-weight:600;color:var(--text-secondary);background:var(--bg-default);border:1px solid var(--border-input);border-radius:6px;padding:5px 10px}
.role-sel{border:none;background:transparent;font-weight:700;font-size:.825rem;color:var(--text-secondary);cursor:pointer;outline:none}
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:16px 16px 0}
.page-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-shrink:0}
.breadcrumb{font-size:.72rem;color:var(--text-secondary);margin-bottom:3px}
.page-title{font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
.page-sub{font-size:.8rem;color:var(--text-secondary);margin-top:2px}
.page-hd-r{display:flex;gap:7px}
.btn{border-radius:var(--radius-control);padding:6px 12px;font-size:.82rem;font-weight:600;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all 140ms}
.btn-blue{background:var(--info);color:#fff}.btn-blue:hover{background:#2563eb}
.btn-out{background:#fff;color:var(--text-primary);border:1px solid var(--border-input)}.btn-out:hover{border-color:#64748b;background:var(--bg-default)}
.btn-out:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:4px 9px;font-size:.75rem}
.btn:focus-visible,select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--info);outline-offset:2px}
/* FILTER BAR */
.filter-bar{background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:10px 14px;margin-bottom:0;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.f-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filter-bar select{border:1px solid var(--border-input);border-radius:6px;padding:5px 8px;font-size:.78rem;background:#fff;color:var(--text-primary);cursor:pointer;outline:none}
.date-nav{display:flex;align-items:center;gap:6px}
.date-lbl{font-size:.9rem;font-weight:700;color:var(--text-primary);white-space:nowrap;min-width:110px;text-align:center}
.jump-wrap{display:flex;flex-direction:column;gap:2px}
.jump-lbl{font-size:.68rem;font-weight:600;color:var(--text-secondary)}
.date-input{height:36px;padding:6px 10px;font-size:.8rem;border:1px solid var(--border-input);border-radius:6px;background:#fff;outline:none;width:160px}
.date-input:focus{border-color:var(--info)}
.sep{width:1px;height:20px;background:var(--border)}
.seg-track{background:#f1f5f9;border-radius:8px;padding:4px;display:inline-flex;gap:2px}
.seg-btn{border:none;background:transparent;padding:5px 12px;border-radius:6px;font-size:.78rem;font-weight:500;color:#64748b;cursor:pointer}
.seg-btn.active{background:#fff;font-weight:700;color:var(--text-primary);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.right-slot{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;height:24px;border-radius:4px;padding:0 8px;font-size:.7rem;font-weight:600;white-space:nowrap;border:none}
.c-ok{background:var(--success-bg);color:var(--success-dark)}.c-info{background:var(--info-bg);color:var(--info-dark)}.c-warn{background:#fef3c7;color:#b45309}.c-danger{background:#fee2e2;color:#b91c1c}.c-purple{background:#f3e8ff;color:#7c3aed}.c-muted{background:#f1f5f9;color:var(--text-secondary)}
.chip.clickable{cursor:pointer}
/* row 3 chips + count */
.chip-row{display:none;flex-wrap:wrap;gap:8px;align-items:center;padding-top:2px}
.fchip{display:inline-flex;align-items:center;gap:5px;height:24px;background:var(--info-bg);color:var(--info-dark);border-radius:4px;padding:0 6px 0 8px;font-size:.7rem;font-weight:600}
.fchip-x{background:none;border:none;color:inherit;font-size:.9rem;cursor:pointer;line-height:1;padding:0 2px}
.clear-all-btn{background:none;border:none;color:var(--info-dark);font-size:.72rem;font-weight:600;cursor:pointer;text-decoration:underline}
.result-count{margin-left:auto;font-size:.72rem;color:var(--text-secondary);font-weight:600}
/* CALENDAR WRAP */
.cal-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:var(--radius-card);border:1px solid var(--border);box-shadow:var(--shadow-card);position:relative;margin-top:12px}
.cal-scroll{flex:1;overflow:auto;min-height:0;position:relative}
.cal-grid{display:grid;position:relative}
.corner-cell{position:sticky;top:0;left:0;z-index:30;background:#f0f4f8;border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0}
.coach-header{position:sticky;top:0;z-index:20;background:#f8fafc;border-right:1px solid #f1f5f9;border-bottom:1px solid #e2e8f0;padding:6px 10px;height:48px;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden}
.coach-nm{font-size:.8rem;font-weight:700;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coach-util{font-size:.7rem;font-weight:600;color:#64748b;white-space:nowrap}
.time-gutter{position:sticky;left:0;z-index:10;background:#f8fafc;border-right:1px solid #e2e8f0}
.time-label{position:absolute;left:8px;font-size:.72rem;font-weight:600;color:#64748b;transform:translateY(-50%);white-space:nowrap}
.coach-lane{position:relative;border-right:1px solid #f1f5f9;background-color:#fff}
.edge-strip{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;background:#f8fafc;border:1px dashed #e2e8f0;font-size:.68rem;font-weight:500;color:var(--text-secondary);cursor:pointer;font-family:inherit}
.now-line-wrap{position:relative;pointer-events:none}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--danger)}
.now-dot{position:absolute;left:-4px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--danger)}
.now-label{position:absolute;left:5px;top:-16px;font-size:.65rem;font-weight:700;color:var(--danger)}
.block{position:absolute;border-radius:5px;padding:4px 7px;border-left-width:3px;border-left-style:solid;overflow:hidden;font-size:.7rem;cursor:pointer;text-align:left;background:none;transition:box-shadow 140ms;font-family:inherit}
body.density-comfortable .block{font-size:.75rem}
.block:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.block.conflict{outline:1px solid var(--danger);outline-offset:-1px}
.block.dimmed{opacity:.25;pointer-events:none}
.block-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.block-sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#374151;line-height:1.3;margin-top:1px}
.block-cap{font-size:.65rem;color:#6b7280;margin-top:2px}
.block-line3-mandated{font-size:.68rem;line-height:1.3;margin-top:2px;font-weight:600}
.ln-amber{color:#b45309}.ln-red{color:#b91c1c}.ln-green{color:#047857}.ln-slate{color:#64748b}
.b-confirmed{background:#eff6ff;border-left-color:#3b82f6}
.b-tentative{background:#fef3c7;border-left-color:#f59e0b}
.b-semi-pending{background:#f3e8ff;border-left-color:#7c3aed}
.b-waitlisted{background:#eff6ff;border-left-style:dashed;border-left-color:#3b82f6}
.b-authhold{background:#fef3c7;border-left-style:dashed;border-left-color:#b45309}
.b-paymenthold{background:#fee2e2;border-left-color:#ef4444}
.b-cancel-early{background:#f1f5f9;border-left-color:#10b981}
.b-cancel-late{background:#f1f5f9;border-left-color:#ef4444}
.b-noshow{background:#fee2e2;border-left-color:#b91c1c}
.b-completed{background:#f1f5f9;border-left-color:#64748b}
.b-break{background:#f1f5f9;border-left-color:#94a3b8;cursor:default}
.b-unavailable{background:#f8fafc;border-left-color:#e2e8f0;cursor:default}
.empty-res-bar{flex-shrink:0;padding:8px 12px;border-top:1px solid var(--border)}
.empty-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.empty-panel{pointer-events:auto;background:#fafafa;border:1px dashed #e2e8f0;border-radius:8px;padding:24px 32px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:#94a3b8;font-size:.85rem}
.drag-ghost{position:fixed;display:none;border:2px dashed var(--info);background:rgba(59,130,246,.08);border-radius:5px;pointer-events:none;z-index:100}
/* TOOLTIP */
.tooltip{position:fixed;background:#1e293b;color:#f8fafc;border-radius:8px;padding:10px 12px;font-size:.75rem;width:220px;pointer-events:none;z-index:200;line-height:1.5}
.tt-hidden{display:none}
.tooltip.side-below::after{content:'';position:absolute;top:-6px;left:14px;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:6px solid #1e293b}
.tooltip.side-above::after{content:'';position:absolute;bottom:-6px;left:14px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid #1e293b}
.tooltip.side-right::after{content:'';position:absolute;left:-6px;top:14px;border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:6px solid #1e293b}
.tooltip.side-left::after{content:'';position:absolute;right:-6px;top:14px;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:6px solid #1e293b}
/* DRAWER */
.drawer{position:absolute;right:0;top:0;bottom:0;width:400px;background:#fff;border-left:1px solid var(--border);box-shadow:-4px 0 16px rgba(0,0,0,.08);display:flex;flex-direction:column;z-index:40;transform:translateX(100%);transition:transform 240ms ease}
.drawer.open{transform:translateX(0)}
.drw-hd{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.drw-hd-top{display:flex;justify-content:space-between;align-items:flex-start}
.drw-tag{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary)}
.drw-nm{font-size:1rem;font-weight:700;color:var(--text-primary)}
.drw-dt{font-size:.8rem;color:var(--text-secondary);margin-top:2px}
.x-btn{background:none;border:none;cursor:pointer;color:var(--text-secondary);padding:3px;border-radius:4px;line-height:1;flex-shrink:0}
.x-btn:hover{background:var(--bg-default)}
.drw-body{flex:1;overflow-y:auto;padding:16px}
.drw-foot{padding:11px 16px;border-top:1px solid var(--border);display:flex;gap:7px;justify-content:flex-end;flex-shrink:0;flex-wrap:wrap}
.det-grid{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:12px}
.det-row{display:grid;grid-template-columns:120px 1fr;border-bottom:1px solid var(--border)}
.det-row:last-child{border-bottom:none}
.det-l{padding:8px 11px;font-size:.7rem;font-weight:600;color:var(--text-secondary);background:var(--bg-default)}
.det-r{padding:8px 11px;font-size:.82rem;color:var(--text-primary)}
.det-r.bal{font-weight:700;color:var(--info-dark)}
.px-section{margin-top:12px}
.sec-lbl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);margin-bottom:7px}
.px-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;margin-bottom:6px;flex-wrap:wrap}
.px-av{width:26px;height:26px;border-radius:50%;background:var(--info);color:#fff;display:grid;place-items:center;font-size:.65rem;font-weight:700;flex-shrink:0}
.px-nm{font-size:.82rem;font-weight:700;flex:1}
.wl-section{margin-top:12px}
.wl-note{font-size:.72rem;color:var(--text-secondary);font-style:italic;margin-bottom:7px}
.wl-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;margin-bottom:5px;flex-wrap:wrap}
.wl-pos{width:22px;height:22px;border-radius:50%;background:var(--info-bg);display:grid;place-items:center;font-size:.68rem;font-weight:700;color:var(--info-dark);flex-shrink:0}
.wl-nm{font-size:.82rem;font-weight:700;flex:1}
.px-search-wrap{margin-top:8px}
.s-input{width:100%;border:1px solid var(--border-input);border-radius:6px;padding:7px 10px;font-size:.82rem;background:#fff;outline:none}
.s-input:focus{border-color:var(--info)}
.px-dd{border:1px solid var(--border-input);border-radius:7px;overflow:hidden;margin-top:4px}
.px-res{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;cursor:pointer;border-bottom:1px solid var(--border);font-size:.82rem}
.px-res:last-child{border-bottom:none}.px-res:hover{background:var(--bg-default)}
.tent-notice{background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:12px;margin-top:10px;font-size:.8rem;color:#92400e}
.tent-notice strong{display:block;margin-bottom:3px}
.panel-amber{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:16px;margin-top:10px}
.panel-amber h4{font-size:.8rem;font-weight:700;margin-bottom:8px;letter-spacing:.03em;color:var(--text-primary)}
.panel-green{background:var(--success-bg);border:1px solid #a7f3d0;border-radius:8px;padding:16px;margin-top:10px;font-size:.82rem;color:var(--text-primary)}
.panel-green h4{color:var(--success-dark);font-size:.8rem;font-weight:700;margin-bottom:6px;letter-spacing:.03em}
.panel-blue{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px 14px;color:#1e40af;font-size:.8rem;margin-bottom:8px}
.panel-red{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px 14px;color:#991b1b;font-size:.8rem}
.panel-muted{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text-secondary);font-size:.8rem;margin-bottom:8px}
.body2-note{font-size:.8rem;color:var(--text-secondary);line-height:1.4}
.small-note{font-size:.72rem;color:var(--text-secondary);margin-top:4px}
.field-lbl{font-size:.72rem;font-weight:600;color:var(--text-secondary);margin:10px 0 4px}
.radio-row{display:flex;align-items:center;gap:6px;font-size:.82rem;margin-bottom:4px;font-weight:400}
.policy-list{margin:6px 0 0 18px;font-size:.8rem;line-height:1.5}
.textarea{width:100%;border:1px solid var(--border-input);border-radius:6px;padding:7px 10px;font-size:.82rem;min-height:56px;font-family:inherit;resize:vertical}
</style>
</head>
<body class="density-compact">
<div class="app">
  <script src="shared-sidebar.js" data-inject="true"></script>
  <div class="main-shell">
    <div class="topbar">
      <div class="loc-pill"><span class="ms" style="font-size:15px">location_on</span>Solar Swim (PDT)</div>
      <div class="loc-pill">Role:
        <select class="role-sel" id="roleSel" onchange="setRole(this.value)">
          <option value="staff">Staff</option>
          <option value="manager">Manager</option>
        </select>
      </div>
    </div>
    <div class="main-area">
      <div class="page-hd">
        <div>
          <div class="breadcrumb">Scheduling / Calendar</div>
          <h1 class="page-title">Calendar</h1>
          <div class="page-sub" id="pageSub"></div>
        </div>
        <div class="page-hd-r">
          <button class="btn btn-blue btn-sm" onclick="location.href='booking-flow-staff.html'"><span class="ms" style="font-size:15px">add</span> Book</button>
          <button class="btn btn-out btn-sm" onclick="location.href='master-schedule-staff.html'">Master Schedule <span class="ms" style="font-size:15px">arrow_forward</span></button>
        </div>
      </div>

      <div class="filter-bar">
        <div class="f-row">
          <div class="date-nav">
            <button class="btn btn-out btn-sm" onclick="navDay(-1)" aria-label="Previous day">&#8592;</button>
            <span class="date-lbl" id="dateLbl"></span>
            <button class="btn btn-out btn-sm" onclick="navDay(1)" aria-label="Next day">&#8594;</button>
          </div>
          <button class="btn btn-out btn-sm" onclick="goToday()">Today</button>
          <div class="jump-wrap">
            <label class="jump-lbl" for="datePicker">Jump to date</label>
            <input type="date" class="date-input" id="datePicker" onchange="onDatePicker(this.value)">
          </div>
          <div class="right-slot">
            <div class="seg-track" role="group" aria-label="Density">
              <button type="button" class="seg-btn" id="segCompact" onclick="setDensity('compact')">Compact</button>
              <button type="button" class="seg-btn" id="segComfortable" onclick="setDensity('comfortable')">Comfortable</button>
            </div>
            <span id="conflictChipSlot"></span>
          </div>
        </div>
        <div class="f-row">
          <select id="fLoc" onchange="setFilter('location',this.value)"><option>All Locations</option><option>Solar Swim — Main</option><option>Solar Swim — North Annex</option></select>
          <select id="fSvc" onchange="setFilter('service',this.value)"><option>All Services</option><option>Swim</option><option>Basketball</option><option>Group Fitness</option></select>
          <select id="fLvl" onchange="setFilter('level',this.value)"><option>All Levels</option><option>Beginner 1</option><option>Beginner 2</option><option>Unassigned</option></select>
          <select id="fStat" onchange="setFilter('status',this.value)"><option>All Statuses</option><option>Confirmed</option><option>Pending Partner</option><option>Waitlisted</option><option>Authorization Hold</option><option>Payment Hold</option><option>Cancelled (Early)</option><option>Cancelled (Late)</option><option>No-Show</option><option>Completed</option></select>
          <select id="fStaff" onchange="setFilter('staff',this.value)"><option>All Staff</option><option>Anthony Lee</option><option>Cory Davis</option><option>Derek Cole</option><option>Emma Cole</option><option>James Wright</option><option>Luke Dean</option><option>Michael Torres</option><option>Naya Fox</option><option>Priya Nair</option><option>Sarah Chen</option><option>Shaquem Hill</option><option>Tina Wu</option></select>
        </div>
        <div class="chip-row" id="chipRow"></div>
      </div>

      <div class="cal-wrap" id="calWrap">
        <div class="cal-scroll" id="calScroll"></div>
        <div class="empty-res-bar" id="emptyResBar"></div>
        <div class="drawer" id="drawer">
          <div class="drw-hd">
            <div class="drw-hd-top">
              <div>
                <div class="drw-tag">Booking Detail</div>
                <div class="drw-nm" id="drwNm"></div>
                <div class="drw-dt" id="drwDt"></div>
                <span class="chip c-info" id="drwStatus"></span>
              </div>
              <button class="x-btn" onclick="closeDrawer()" aria-label="Close"><span class="ms">close</span></button>
            </div>
          </div>
          <div class="drw-body" id="drwBody"></div>
          <div class="drw-foot" id="drwFoot"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="tooltip tt-hidden" id="tooltip"></div>
<div class="drag-ghost" id="dragGhost"></div>

<script>
// ─── CONSTANTS (data model) ─────────────────────────────────────────────────
const LOCATION_HOURS={Main:{open:360,close:1200},'North Annex':{open:480,close:1080}}; // minutes from midnight; never hardcode window bounds from these except here
const COACH_ORDER=['Michael Torres','Sarah Chen','James Wright','Anthony Lee','Shaquem Hill','Tina Wu','Derek Cole','Priya Nair','Cory Davis','Naya Fox','Luke Dean','Emma Cole'];
const COACH_LOCATION={'Naya Fox':'North Annex','Luke Dean':'North Annex'};
const COACH_SERVICES={'Michael Torres':['Swim','Basketball'],'Sarah Chen':['Swim'],'James Wright':['Swim'],'Anthony Lee':['Swim'],'Shaquem Hill':['Swim','Basketball'],'Tina Wu':['Group Fitness'],'Derek Cole':['Basketball'],'Priya Nair':['Swim'],'Cory Davis':['Group Fitness'],'Naya Fox':['Swim'],'Luke Dean':['Swim'],'Emma Cole':['Swim']};
const REQUIRED_PARTICIPANTS=2;

const WEEKDAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pad(n){return n<10?'0'+n:''+n;}
function toISO(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function parseISO(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);}
function fmtShort(d){return `${WEEKDAYS[d.getDay()]} ${MONTHS[d.getMonth()]} ${d.getDate()}`;}
function fmtLong(d){return `${fmtShort(d)}, ${d.getFullYear()}`;}
function curISO(){return toISO(STATE.curDate);}
function findBooking(id){return ALL_BOOKINGS.find(b=>b.id===id);}
function getFilled(b){ if(b.participants) return b.participants.filter(p=>p.attendance!=='CANCELLED_LATE'&&p.attendance!=='CANCELLED_EARLY').length; return b.filled||0; }
function getWaitingCount(b){ return b.waitlist?b.waitlist.length:0; }
function serviceCategory(service){ if(!service) return null; const s=service.toLowerCase(); if(s.includes('swim')) return 'Swim'; if(s.includes('basketball')) return 'Basketball'; if(s.includes('fitness')) return 'Group Fitness'; return service; }
function initials(name){ return name.split(' ').map(w=>w[0]).join('').toUpperCase(); }
function genToken(name){ const ini=name.split(' ').map(w=>w[0]).join('').toUpperCase(); const num=Math.floor(1000+Math.random()*9000); return `${ini}-${num}`; }
function nowStamp(){ return '10:04 AM, Sep 3, 2026'; }
function ordinal(n){ const s=['th','st','nd','rd']; const v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function fundingChip(f){ const map={RCEB:'c-warn',Voucher:'c-info','Self Pay':'c-muted','Regional Center':'c-warn'}; return `<span class="chip ${map[f]||'c-muted'}">${f||'—'}</span>`; }
function fmtTime(min){ let h=Math.floor(min/60), m=((min%60)+60)%60; const ap=h<12||h>=24?'AM':'PM'; let h12=h%12; if(h12===0) h12=12; if(h>=24) h12=12; return `${h12}:${pad(m)} ${ap}`; }
function unionLocationHours(){ const opens=Object.values(LOCATION_HOURS).map(h=>h.open); const closes=Object.values(LOCATION_HOURS).map(h=>h.close); return {open:Math.min(...opens),close:Math.max(...closes)}; }
function activeLocationHours(){ const loc=STATE.filters.location; if(loc==='Solar Swim — Main') return LOCATION_HOURS['Main']; if(loc==='Solar Swim — North Annex') return LOCATION_HOURS['North Annex']; return unionLocationHours(); }
function coachAvailability(coach){ if(COACH_LOCATION[coach]==='North Annex') return {open:480,close:1020}; return {open:480,close:1080}; }
function bookingStartDate(b){ const [y,m,d]=b.dateISO.split('-').map(Number); return new Date(y,m-1,d,Math.floor(b.startMin/60), b.startMin%60); }
function cancelCalc(b){ const start=bookingStartDate(b); const diffMs=start-FIXED_NOW; const diffH=diffMs/3600000; const isEarly=diffH>=24; const totalMin=Math.round(diffH*60); const hh=Math.floor(totalMin/60), mm=totalMin%60; const noticeLabel = mm===0?`${hh}h`:`${hh}h ${mm}m`; return {isEarly,noticeLabel}; }
function ensureParticipants(b){ if(!b.participants){ if(b.isGroup) b.participants=[]; else b.participants=[{name:b.client, funding:b.funding||'—', attendance: b.status==='COMPLETED'?'ATTENDED':b.status==='NO_SHOW'?'NO_SHOW':b.status==='CANCELLED_LATE'?'CANCELLED_LATE':b.status==='CANCELLED_EARLY'?'CANCELLED_EARLY':'NOT_MARKED'}]; } }
function groupLikeAddable(b){ return !!(b.isGroup || b.requiredParticipants); }

function blockContent(b){
  if(b.status==='BREAK') return {l1:'Paid Break',l2:`${b.durMin} min`,l3:''};
  if(b.status==='UNAVAILABLE') return {l1:'Unavailable',l2:b.reason,l3:''};
  if(b.status==='TENTATIVE') return {l1:'Tentative',l2:b.client,l3:b.service};
  let l1=b.service, l2=b.isGroup?`Group (${getFilled(b)} participants)`:b.client, l3='', l3cls='';
  switch(b.status){
    case 'CONFIRMED':
      if(b.isGroup) l3=`${getFilled(b)} / ${b.cap} spots`;
      else if(b.requiredParticipants) l3=`${getFilled(b)} / ${b.requiredParticipants}`;
      else l3='Confirmed. Session reserved.';
      break;
    case 'PENDING_PARTNER': l3=`${getFilled(b)} / ${b.requiredParticipants} — waiting for partner`; break;
    case 'WAITLISTED': l3=`${getFilled(b)} / ${b.cap} FULL — ${getWaitingCount(b)} waiting`; break;
    case 'AUTHORIZATION_HOLD': l3=PLAIN_LINE.AUTHORIZATION_HOLD; l3cls='ln-amber'; break;
    case 'PAYMENT_HOLD': l3=PLAIN_LINE.PAYMENT_HOLD; l3cls='ln-red'; break;
    case 'CANCELLED_EARLY': l3=PLAIN_LINE.CANCELLED_EARLY; l3cls='ln-green'; break;
    case 'CANCELLED_LATE': l3=PLAIN_LINE.CANCELLED_LATE; l3cls='ln-red'; break;
    case 'NO_SHOW': l3=PLAIN_LINE.NO_SHOW; l3cls='ln-red'; break;
    case 'COMPLETED': l3=PLAIN_LINE.COMPLETED; l3cls='ln-slate'; break;
  }
  return {l1,l2,l3,l3cls};
}
function ariaLabelFor(b){
  const subject=b.isGroup?`Group (${getFilled(b)} participants)`:(b.client||'');
  const line=PLAIN_LINE[b.status]||'';
  return `${subject}, ${b.service}, ${fmtTime(b.startMin)}–${fmtTime(b.startMin+b.durMin)}, ${line}`;
}
function isDimmed(b){
  const f=STATE.filters;
  if(b.status==='BREAK'||b.status==='UNAVAILABLE') return f.status!=='All Statuses';
  if(f.service!=='All Services' && serviceCategory(b.service)!==f.service) return true;
  if(f.level!=='All Levels' && (b.level||'Unassigned')!==f.level) return true;
  if(f.status!=='All Statuses' && STATUS_FILTER_MAP[f.status]!==b.status) return true;
  return false;
}
function computeClusters(blocks){
  const sorted=[...blocks].sort((a,b)=> a.startMin-b.startMin || (b.durMin-a.durMin) || (a.id<b.id?-1:1));
  const clusters=[]; let cur=[]; let curEnd=-1;
  sorted.forEach(b=>{
    if(cur.length===0){ cur=[b]; curEnd=b.startMin+b.durMin; }
    else if(b.startMin<curEnd){ cur.push(b); curEnd=Math.max(curEnd,b.startMin+b.durMin); }
    else { clusters.push(cur); cur=[b]; curEnd=b.startMin+b.durMin; }
  });
  if(cur.length) clusters.push(cur);
  return clusters;
}
function computeCoachStats(coach, dateBookingsAll){
  const avail=coachAvailability(coach);
  const totalMin=avail.close-avail.open;
  const coachBlocks=dateBookingsAll.filter(b=>b.coach===coach);
  let bookedMin=0, bookedCount=0;
  coachBlocks.forEach(b=>{
    if(['BREAK','UNAVAILABLE','CANCELLED_EARLY','CANCELLED_LATE','NO_SHOW'].includes(b.status)) return;
    bookedMin+=b.durMin; bookedCount++;
  });
  let openSlots=0;
  for(let t=avail.open;t<avail.close;t+=30){
    const covered=coachBlocks.some(b=> b.startMin<t+30 && (b.startMin+b.durMin)>t);
    if(!covered) openSlots++;
  }
  const pct=totalMin>0?Math.round((bookedMin/totalMin)*100):0;
  return {bookedCount,openSlots,pct};
}

  document.getElementById('segComfortable').classList.toggle('active',STATE.density==='comfortable');

  const iso=curISO();
  const meta=DATE_META[iso];
  document.getElementById('dateLbl').textContent=meta?meta.short:fmtShort(STATE.curDate);
  const dp=document.getElementById('datePicker'); if(dp) dp.value=iso;

  const f=STATE.filters;
  const dateBookingsAll=ALL_BOOKINGS.filter(b=>b.dateISO===iso);
  const totalBookingsForDay=dateBookingsAll.filter(b=>!['BREAK','UNAVAILABLE'].includes(b.status)).length;
  document.getElementById('pageSub').textContent=`${meta?meta.label:fmtLong(STATE.curDate)} · ${f.location} · ${totalBookingsForDay} bookings`;

  const candidateCoaches=COACH_ORDER.filter(c=>{
    if(f.location!=='All Locations'){
      const locName=`Solar Swim — ${COACH_LOCATION[c]||'Main'}`;
      if(locName!==f.location) return false;
    }
    if(f.staff!=='All Staff' && c!==f.staff) return false;
    if(f.service!=='All Services'){
      if(!COACH_SERVICES[c] || !COACH_SERVICES[c].includes(f.service)) return false;
    }
    return true;
  });

  const windowBookings=dateBookingsAll.filter(b=>candidateCoaches.includes(b.coach));

  const clustersByCoach={};
  candidateCoaches.forEach(c=>{ clustersByCoach[c]=computeClusters(windowBookings.filter(b=>b.coach===c)); });
  let totalConflictClusters=0;
  candidateCoaches.forEach(c=>{ totalConflictClusters+=clustersByCoach[c].filter(cl=>cl.length>=2).length; });
  const conflictCoaches=candidateCoaches.filter(c=>clustersByCoach[c].some(cl=>cl.length>=2));

  let displayCoaches=STATE.conflictsOnly?conflictCoaches:candidateCoaches;
  const withBlocks=displayCoaches.filter(c=>windowBookings.some(b=>b.coach===c));
  const emptyCoaches=STATE.conflictsOnly?[]:displayCoaches.filter(c=>!windowBookings.some(b=>b.coach===c));
  const shown=STATE.showEmptyResources?displayCoaches:withBlocks;
  const orderedShown=COACH_ORDER.filter(c=>shown.includes(c));

  // conflict chip in toolbar
  const conflictSlot=document.getElementById('conflictChipSlot');
  if(totalConflictClusters>0){
    conflictSlot.innerHTML=`<button type="button" class="chip c-danger clickable" onclick="toggleConflictsOnly()">⚠ ${totalConflictClusters} conflict${totalConflictClusters>1?'s':''} today${STATE.conflictsOnly?' ×':''}</button>`;
  } else { conflictSlot.innerHTML=''; }

  // chip row (active filters + result count)
  renderChipRow(dateBookingsAll, candidateCoaches);

  const isEmptyDay=dateBookingsAll.length===0;
  const isFilteredEmpty=!isEmptyDay && windowBookings.length===0;

  const scrollEl=document.getElementById('calScroll');
  let overlayHtml='';
  let gridHtml='';

  if(isEmptyDay||isFilteredEmpty){
    const uh=activeLocationHours();
    const cols=candidateCoaches.length?candidateCoaches:COACH_ORDER;
    gridHtml=buildGridHtml(cols,[],uh.open,uh.close,0,0,uh,dateBookingsAll,{});
    if(isEmptyDay){
      overlayHtml=`<div class="empty-overlay"><div class="empty-panel"><div>No bookings on ${meta?meta.label:fmtLong(STATE.curDate)}</div><button class="btn btn-out btn-sm" onclick="location.href='booking-flow-staff.html'"><span class="ms" style="font-size:15px">add</span> Book a session</button></div></div>`;
    } else {
      overlayHtml=`<div class="empty-overlay"><div class="empty-panel"><div>No bookings match the current filters for ${meta?meta.label:fmtLong(STATE.curDate)}</div><button class="btn btn-out btn-sm" onclick="clearAllFilters()">Clear filters</button></div></div>`;
    }
    NAV.order=[]; NAV.byCoach={};
  } else {
    const locHours=activeLocationHours();
    let minStart=Math.min(...windowBookings.map(b=>b.startMin));
    let maxEnd=Math.max(...windowBookings.map(b=>b.startMin+b.durMin));
    minStart=Math.floor(minStart/30)*30;
    maxEnd=Math.ceil(maxEnd/30)*30;
    const winStart=Math.max(minStart,locHours.open);
    const winEnd=Math.min(maxEnd,locHours.close);
    const leadMin=winStart-locHours.open;
    const trailMin=locHours.close-winEnd;
    // pick a default roving-tabindex block BEFORE building HTML so exactly one block renders tabindex=0
    const stillValid=STATE.focusedBlockId && orderedShown.some(c=>windowBookings.some(b=>b.id===STATE.focusedBlockId && b.coach===c && b.status!=='BREAK' && b.status!=='UNAVAILABLE' && !isDimmed(b)));
    if(!stillValid){
      let defaultId=null;
      for(const c of orderedShown){
        const candidate=windowBookings.filter(b=>b.coach===c && b.status!=='BREAK' && b.status!=='UNAVAILABLE' && !isDimmed(b)).sort((a,b2)=>a.startMin-b2.startMin)[0];
        if(candidate){ defaultId=candidate.id; break; }
      }
      STATE.focusedBlockId=defaultId;
    }
    gridHtml=buildGridHtml(orderedShown,windowBookings,winStart,winEnd,leadMin,trailMin,locHours,dateBookingsAll,clustersByCoach);
  }

  scrollEl.innerHTML=gridHtml+overlayHtml;

  // empty-resources bar
  const barEl=document.getElementById('emptyResBar');
  if(emptyCoaches.length>0){
    const n=emptyCoaches.length;
    barEl.innerHTML = STATE.showEmptyResources
      ? `<button type="button" class="btn btn-out btn-sm" onclick="toggleEmptyResources()">− hide ${n} empty</button>`
      : `<button type="button" class="btn btn-out btn-sm" onclick="toggleEmptyResources()">+ ${n} coach${n!==1?'es':''} with no booking${n!==1?'s':''}</button>`;
    barEl.style.display='block';
  } else { barEl.style.display='none'; barEl.innerHTML=''; }

  // roving tabindex default
  if(!isEmptyDay && !isFilteredEmpty){
    if(!STATE.focusedBlockId || !NAV.order.some(c=>NAV.byCoach[c] && NAV.byCoach[c].includes(STATE.focusedBlockId))){
      for(const c of NAV.order){ if(NAV.byCoach[c] && NAV.byCoach[c].length){ STATE.focusedBlockId=NAV.byCoach[c][0]; break; } }
    }
  }

  if(STATE.pendingFocus && STATE.focusedBlockId){
    const el=document.getElementById('blk_'+STATE.focusedBlockId);
    if(el) el.focus();
    STATE.pendingFocus=false;
  }

  // auto-scroll to now-line on first render of "today"
  if(iso==='2026-09-03' && STATE.lastDateISO!=='2026-09-03'){
    requestAnimationFrame(()=>{
      const nowEl=scrollEl.querySelector('.now-line');
      if(nowEl){
        const top=parseFloat(nowEl.style.top||'0');
        scrollEl.scrollTop=Math.max(0, top - scrollEl.clientHeight*0.25);
      }
    });
  }
  STATE.lastDateISO=iso;
}

function renderChipRow(dateBookingsAll, candidateCoaches){
  const f=STATE.filters;
  const active=[];
  if(f.location!=='All Locations') active.push(['location','Location',f.location]);
  if(f.service!=='All Services') active.push(['service','Service',f.service]);
  if(f.level!=='All Levels') active.push(['level','Level',f.level]);
  if(f.status!=='All Statuses') active.push(['status','Status',f.status]);
  if(f.staff!=='All Staff') active.push(['staff','Staff',f.staff]);
  const container=document.getElementById('chipRow');
  if(active.length===0){ container.style.display='none'; container.innerHTML=''; return; }
  container.style.display='flex';
  let x=0;
  dateBookingsAll.forEach(b=>{
    if(b.status==='BREAK'||b.status==='UNAVAILABLE') return;
    if(!candidateCoaches.includes(b.coach)) return;
    if(isDimmed(b)) return;
    x++;
  });
  const y=dateBookingsAll.filter(b=>!['BREAK','UNAVAILABLE'].includes(b.status)).length;
  let html=active.map(([key,label,val])=>`<span class="fchip">${label}: ${val} <button type="button" class="fchip-x" onclick="clearFilter('${key}')" aria-label="Clear ${label} filter">&times;</button></span>`).join('');
  if(active.length>=2) html+=`<button type="button" class="clear-all-btn" onclick="clearAllFilters()">Clear all</button>`;
  html+=`<span class="result-count">Showing ${x} of ${y} bookings</span>`;
  container.innerHTML=html;
}

// ─── RENDER: GRID ───────────────────────────────────────────────────────────
function gutterLabelsHtml(winStart,winEnd,density){
  let html='';
  for(let t=winStart;t<=winEnd;t+=30){
    if(STATE.density==='compact' && (t%60!==0)) continue;
    const top=(t-winStart)*density;
    html+=`<div class="time-label" style="top:${top}px">${fmtTime(t)}</div>`;
  }
  return html;
}
function renderCoachHeaderHtml(coach,col,dateBookingsAll,conflictCount){
  const stats=computeCoachStats(coach,dateBookingsAll);
  return `<div class="coach-header" style="grid-row:1;grid-column:${col}" role="columnheader">
    <div class="coach-nm">${coach}</div>
    <div class="coach-util">${stats.bookedCount}b · ${stats.openSlots}o · ${stats.pct}%</div>
    ${conflictCount>0?`<span class="chip c-danger" style="width:fit-content;height:18px;font-size:.62rem">${conflictCount} conflict${conflictCount>1?'s':''}</span>`:''}
  </div>`;
}
function blockHtml(b,top,height,widthCss,leftCss,isConflict){
  const dim=isDimmed(b);
  const cls=STATUS_CLASS[b.status]||'b-confirmed';
  const prefix=isConflict?'⚠ ':'';
  const c=blockContent(b);
  if(b.status==='BREAK'||b.status==='UNAVAILABLE'){
    return `<div class="block ${cls}${dim?' dimmed':''}${isConflict?' conflict':''}" style="top:${top}px;height:${height}px;left:${leftCss};width:${widthCss}" aria-hidden="true">
      <div class="block-title">${prefix}${c.l1}</div>
      ${height>=40?`<div class="block-sub">${c.l2}</div>`:''}
    </div>`;
  }
  let body;
  if(height<40) body=`<div class="block-title">${prefix}${c.l1}${c.l2?' · '+c.l2:''}</div>`;
  else if(height<60) body=`<div class="block-title">${prefix}${c.l1}</div><div class="block-sub">${c.l2}</div>`;
  else body=`<div class="block-title">${prefix}${c.l1}</div><div class="block-sub">${c.l2}</div>${c.l3?`<div class="${c.l3cls?'block-line3-mandated '+c.l3cls:'block-cap'}">${c.l3}</div>`:''}`;
  const tabIdx=dim?-1:(STATE.focusedBlockId===b.id?0:-1);
  return `<button type="button" class="block ${cls}${dim?' dimmed':''}${isConflict?' conflict':''}" id="blk_${b.id}" role="gridcell"
    style="top:${top}px;height:${height}px;left:${leftCss};width:${widthCss}"
    tabindex="${tabIdx}" aria-hidden="${dim?'true':'false'}" draggable="true"
    ondragstart="handleDragStart(event,'${b.id}')"
    onclick="onBlockClick(event,'${b.id}')"
    onkeydown="handleBlockKey(event,'${b.id}')"
    onmouseenter="showTip(event,'${b.id}')" onmouseleave="hideTip()" onfocus="showTip(event,'${b.id}')" onblur="hideTip()"
    aria-label="${ariaLabelFor(b).replace(/"/g,'&quot;')}">${body}</button>`;
}
function renderCoachLaneHtml(coach,windowBookings,winStart,density,clusters){
  const blocks=windowBookings.filter(b=>b.coach===coach);
  const meta={};
  clusters.forEach(cl=>cl.forEach((b,idx)=>{meta[b.id]={size:cl.length,idx};}));
  let html='';
  blocks.forEach(b=>{
    const top=(b.startMin-winStart)*density;
    const height=Math.max(20,b.durMin*density);
    const m=meta[b.id]||{size:1,idx:0};
    const isConflict=m.size>=2;
    const widthCss=m.size>1?`calc((100% - 6px)/${m.size})`:'calc(100% - 6px)';
    const leftCss=m.size>1?`calc(${m.idx} * (100%/${m.size}))`:'3px';
    html+=blockHtml(b,top,height,widthCss,leftCss,isConflict);
  });
  return html;
}
function buildGridHtml(orderedShown,windowBookings,winStart,winEnd,leadMin,trailMin,locHours,dateBookingsAll,clustersByCoach){
  const density=STATE.density==='compact'?32/30:56/30;
  const leadCollapsed=leadMin>0 && !STATE.expandedEdges.lead;
  const trailCollapsed=trailMin>0 && !STATE.expandedEdges.trail;
  const leadSegHeight=leadMin<=0?0:(leadCollapsed?24:leadMin*density);
  const trailSegHeight=trailMin<=0?0:(trailCollapsed?24:trailMin*density);
  const contentHeight=(winEnd-winStart)*density;
  GEOM.pxPerMin=density; GEOM.winStart=winStart; GEOM.winEnd=winEnd;

  const N=Math.max(orderedShown.length,1);
  let html=`<div class="cal-grid" style="grid-template-columns:72px repeat(${N}, minmax(140px,1fr))">`;
  html+=`<div class="corner-cell" style="grid-column:1;grid-row:1"></div>`;
  orderedShown.forEach((c,i)=>{
    const conflictCount=(clustersByCoach[c]||[]).filter(cl=>cl.length>=2).length;
    html+=renderCoachHeaderHtml(c,i+2,dateBookingsAll,conflictCount);
  });

  let rowCursor=2;
  if(leadMin>0){
    const label=leadCollapsed?`▲ ${fmtTime(locHours.open)} – ${fmtTime(winStart)} · no bookings · click to expand`:`▼ collapse`;
    html+=`<button type="button" class="edge-strip" style="grid-row:${rowCursor};grid-column:1/-1;height:${leadSegHeight}px" onclick="toggleEdge('lead')">${label}</button>`;
    rowCursor++;
  }
  const contentRow=rowCursor; rowCursor++;
  html+=`<div class="time-gutter" style="grid-row:${contentRow};grid-column:1;height:${contentHeight}px">${gutterLabelsHtml(winStart,winEnd,density)}</div>`;

  NAV.order=orderedShown.slice();
  NAV.byCoach={};
  orderedShown.forEach((c,i)=>{
    const col=i+2;
    const bg=`repeating-linear-gradient(to bottom,transparent 0,transparent calc(${density*30}px - 1px),#f1f5f9 calc(${density*30}px - 1px),#f1f5f9 ${density*30}px)`;
    html+=`<div class="coach-lane" style="grid-row:${contentRow};grid-column:${col};height:${contentHeight}px;background-image:${bg}" ondragover="handleDragOver(event,'${c.replace(/'/g,"\\'")}')" ondrop="handleDrop(event,'${c.replace(/'/g,"\\'")}')">`
      +renderCoachLaneHtml(c,windowBookings,winStart,density,clustersByCoach[c]||[])
      +`</div>`;
    NAV.byCoach[c]=windowBookings.filter(b=>b.coach===c && b.status!=='BREAK' && b.status!=='UNAVAILABLE' && !isDimmed(b)).sort((a,b2)=>a.startMin-b2.startMin).map(b=>b.id);
  });

  if(curISO()==='2026-09-03' && FIXED_NOW_MIN>=winStart && FIXED_NOW_MIN<=winEnd){
    const nowTop=(FIXED_NOW_MIN-winStart)*density;
    html+=`<div class="now-line-wrap" style="grid-row:${contentRow};grid-column:2/-1;height:${contentHeight}px"><div class="now-line" style="top:${nowTop}px"><div class="now-dot"></div><div class="now-label">10:00</div></div></div>`;
  }
  if(trailMin>0){
    const label=trailCollapsed?`▼ ${fmtTime(winEnd)} – ${fmtTime(locHours.close)} · no bookings · click to expand`:`▲ collapse`;
    html+=`<button type="button" class="edge-strip" style="grid-row:${rowCursor};grid-column:1/-1;height:${trailSegHeight}px" onclick="toggleEdge('trail')">${label}</button>`;
  }
  html+='</div>';
  return html;
}

function clearFilter(key){ const d={location:'All Locations',service:'All Services',level:'All Levels',status:'All Statuses',staff:'All Staff'}; STATE.filters[key]=d[key]; syncFilterSelects(); render(); }
function clearAllFilters(){ STATE.filters={location:'All Locations',service:'All Services',level:'All Levels',status:'All Statuses',staff:'All Staff'}; syncFilterSelects(); render(); }
function syncFilterSelects(){ document.getElementById('fLoc').value=STATE.filters.location; document.getElementById('fSvc').value=STATE.filters.service; document.getElementById('fLvl').value=STATE.filters.level; document.getElementById('fStat').value=STATE.filters.status; document.getElementById('fStaff').value=STATE.filters.staff; }

// ─── KEYBOARD (roving tabindex, arrow traversal) ────────────────────────────
function focusBlock(id){ STATE.focusedBlockId=id; STATE.pendingFocus=true; render(); }
function handleBlockKey(e,id){
  const key=e.key;
  if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','End'].includes(key)) return;
  e.preventDefault();
  const b=findBooking(id); if(!b) return;
  const coach=b.coach;
  const list=NAV.byCoach[coach]||[];
  const idx=list.indexOf(id);
  if(idx===-1) return;
  if(key==='ArrowDown'){ if(idx<list.length-1) focusBlock(list[idx+1]); return; }
  if(key==='ArrowUp'){ if(idx>0) focusBlock(list[idx-1]); return; }
  if(key==='Home'){ focusBlock(list[0]); return; }
  if(key==='End'){ focusBlock(list[list.length-1]); return; }
  if(key==='ArrowLeft'||key==='ArrowRight'){
    const ci=NAV.order.indexOf(coach);
    const step=key==='ArrowRight'?1:-1;
    let ni=ci+step;
    while(ni>=0 && ni<NAV.order.length){
      const targetCoach=NAV.order[ni];
      const tlist=NAV.byCoach[targetCoach]||[];
      if(tlist.length>0){
        let best=tlist[0], bestDiff=Infinity;
        tlist.forEach(tid=>{ const tb=findBooking(tid); const diff=Math.abs(tb.startMin-b.startMin); if(diff<bestDiff){bestDiff=diff;best=tid;} });
        focusBlock(best);
        return;
      }
      ni+=step;
    }
  }
}
function onBlockClick(e,id){
  const b=findBooking(id); if(!b) return;
  if(isDimmed(b)) return;
  STATE.focusedBlockId=id;
  openDrawer(id);
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    const drw=document.getElementById('drawer');
    if(drw.classList.contains('open')){
      const returnId=STATE.lastOpenerId;
      closeDrawer();
      if(returnId) focusBlock(returnId);
    }
  }
});

// ─── DRAG TO RESCHEDULE ─────────────────────────────────────────────────────
function findConflictAt(coach,start,dur,excludeId){
  const iso=curISO();
  const blocks=ALL_BOOKINGS.filter(b=>b.dateISO===iso && b.coach===coach && b.id!==excludeId);
  return blocks.find(b=> start<b.startMin+b.durMin && start+dur>b.startMin) || null;
}
function handleDragStart(e,id){
  const b=findBooking(id);
  if(!b || !DRAGGABLE_STATUSES.includes(b.status)){
    e.preventDefault();
    toast('Past or resolved bookings cannot be moved.');
    return false;
  }
  STATE.drag={id:id,durMin:b.durMin,targetCoach:b.coach,targetStart:b.startMin};
  e.dataTransfer.setData('text/plain',id);
  e.dataTransfer.effectAllowed='move';
  return true;
}
function handleDragOver(e,coach){
  if(!STATE.drag) return;
  e.preventDefault();
  const laneEl=e.currentTarget;
  const rect=laneEl.getBoundingClientRect();
  const density=GEOM.pxPerMin;
  const y=e.clientY-rect.top;
  let snappedStart=GEOM.winStart+Math.round((y/density)/30)*30;
  snappedStart=Math.max(GEOM.winStart, Math.min(snappedStart, GEOM.winEnd-STATE.drag.durMin));
  STATE.drag.targetCoach=coach; STATE.drag.targetStart=snappedStart;
  const ghost=document.getElementById('dragGhost');
  ghost.style.display='block';
  ghost.style.left=rect.left+'px';
  ghost.style.width=rect.width+'px';
  ghost.style.top=(rect.top+(snappedStart-GEOM.winStart)*density)+'px';
  ghost.style.height=(STATE.drag.durMin*density)+'px';
}
function handleDrop(e,coach){
  e.preventDefault();
  document.getElementById('dragGhost').style.display='none';
  if(!STATE.drag) return;
  const drag=STATE.drag;
  const b=findBooking(drag.id);
  const targetCoach=drag.targetCoach||coach;
  const targetStart=drag.targetStart!=null?drag.targetStart:b.startMin;
  STATE.drag=null;
  if(targetCoach===b.coach && targetStart===b.startMin) return;
  const conflictWith=findConflictAt(targetCoach,targetStart,b.durMin,b.id);
  STATE.pendingMove={id:b.id,fromCoach:b.coach,fromStart:b.startMin,toCoach:targetCoach,toStart:targetStart,conflictWith:conflictWith?conflictWith.id:null};
  openDrawer(b.id);
  STATE.panel='drag-confirm';
  refreshDrawer();
}
document.addEventListener('dragend', function(){
  STATE.drag=null;
  const ghost=document.getElementById('dragGhost');
  if(ghost) ghost.style.display='none';
});
function confirmMove(){
  const mv=STATE.pendingMove; if(!mv) return;
  const b=findBooking(mv.id);
  b.coach=mv.toCoach; b.startMin=mv.toStart;
  STATE.pendingMove=null; STATE.panel=null;
  reRenderAll();
}
function keepAsIsMove(){ STATE.pendingMove=null; STATE.panel=null; refreshDrawer(); }
function renderDragConfirmPanel(){
  const mv=STATE.pendingMove; if(!mv) return '';
  const b=findBooking(mv.id);
  const subject=b.isGroup?`Group (${getFilled(b)} participants)`:b.client;
  let conflictLine='';
  if(mv.conflictWith){
    const cb=findBooking(mv.conflictWith);
    const csubj=cb.isGroup?`Group (${getFilled(cb)} participants)`:(cb.client||cb.service);
    conflictLine=`<p style="margin-top:8px;font-weight:600;color:var(--danger)">This creates a conflict with ${csubj} ${fmtTime(cb.startMin)}–${fmtTime(cb.startMin+cb.durMin)}.</p>`;
  }
  return `<div class="panel-amber"><h4>MOVE BOOKING?</h4>
    <p>Move ${subject} from ${mv.fromCoach} ${fmtTime(mv.fromStart)} to ${mv.toCoach} ${fmtTime(mv.toStart)}?</p>
    ${conflictLine}
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-out btn-sm" onclick="keepAsIsMove()">Keep as is</button>
      <button class="btn btn-blue btn-sm" onclick="confirmMove()">Confirm move</button>
    </div></div>`;
}

// ─── TOOLTIP (edge-aware) ───────────────────────────────────────────────────
function showTip(e,id){
  const b=findBooking(id); if(!b) return;
  const t=document.getElementById('tooltip');
  const subject=b.isGroup?`Group (${getFilled(b)} participants)`:b.client;
  t.innerHTML=`<strong>${subject}</strong><br>${b.service}<br>Level: ${b.level||'Unassigned'}<br>Instructor: ${b.coach}<br>${fmtTime(b.startMin)} – ${fmtTime(b.startMin+b.durMin)}<br>Location: Solar Swim — ${COACH_LOCATION[b.coach]||'Main'}<br>${PLAIN_LINE[b.status]||''}<br>Funding: ${b.funding||'—'}`;
  t.classList.remove('tt-hidden');
  const trigger=e.currentTarget.getBoundingClientRect();
  const tw=220,pad8=8;
  const th=t.offsetHeight;
  const vw=window.innerWidth, vh=window.innerHeight;
  let placement,top,left;
  if(trigger.bottom+8+th<=vh-pad8){ placement='below'; top=trigger.bottom+8; left=trigger.left; }
  else if(trigger.top-8-th>=pad8){ placement='above'; top=trigger.top-8-th; left=trigger.left; }
  else if(trigger.right+8+tw<=vw-pad8){ placement='right'; top=trigger.top; left=trigger.right+8; }
  else if(trigger.left-8-tw>=pad8){ placement='left'; top=trigger.top; left=trigger.left-8-tw; }
  else { placement='below'; top=trigger.bottom+8; left=trigger.left; }
  left=Math.max(pad8,Math.min(left,vw-tw-pad8));
  top=Math.max(pad8,Math.min(top,vh-th-pad8));
  t.style.left=left+'px'; t.style.top=top+'px';
  t.className='tooltip side-'+placement;
}
function hideTip(){ document.getElementById('tooltip').classList.add('tt-hidden'); }

// ─── TOAST ──────────────────────────────────────────────────────────────────
let toastT;
function toast(m){
  let el=document.getElementById('toast_el');
  if(!el){el=document.createElement('div');el.id='toast_el';el.style.cssText='position:fixed;bottom:24px;right:24px;background:#1e293b;color:#f8fafc;padding:10px 16px;border-radius:8px;font-size:.82rem;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:300;transition:opacity 220ms;max-width:280px';document.body.appendChild(el);}
  el.textContent=m;el.style.opacity='1';
  clearTimeout(toastT);toastT=setTimeout(()=>{el.style.opacity='0';},2500);
}

// ─── DRAWER ─────────────────────────────────────────────────────────────────
function openDrawer(id){
  const b=findBooking(id);
  if(!b || b.status==='BREAK' || b.status==='UNAVAILABLE') return;
  const wasOpen=STATE.drawerId===id;
  STATE.drawerId=id; STATE.lastOpenerId=id;
  if(!wasOpen && STATE.panel!=='drag-confirm'){ STATE.panel=null; }
  STATE.paxSearchOpen=null; STATE.skipFormKey=null;
  STATE.grantForm=null; STATE.fundingForm=null; STATE.reschedForm=null; STATE.waitlistMsg=null;
  refreshDrawer();
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); STATE.drawerId=null; STATE.panel=null; STATE.pendingMove=null; }
function reRenderAll(){ render(); if(STATE.drawerId) refreshDrawer(); }
function refreshDrawer(){
  const b=findBooking(STATE.drawerId);
  if(!b) return;
  renderDrawerHeader(b);
  renderDrawerBody(b);
  renderDrawerFooter(b);
}
function renderDrawerHeader(b){
  document.getElementById('drwNm').textContent = b.isGroup ? `${b.service} — Group (${getFilled(b)} participants)` : `${b.client} — ${b.service}`;
  document.getElementById('drwDt').textContent = `${DATE_META[b.dateISO]?DATE_META[b.dateISO].label:fmtLong(parseISO(b.dateISO))} · ${fmtTime(b.startMin)} – ${fmtTime(b.startMin+b.durMin)}`;
  const sc=document.getElementById('drwStatus');
  const m=CHIP_META[b.status]||['—','c-muted'];
  sc.textContent=m[0]; sc.className='chip '+m[1];
}
function violationBannerHtml(client){
  if(!client) return '';
  const count=CLIENT_VIOLATIONS[client]||0;
  if(count<VIOLATION_THRESHOLD) return '';
  const res=STATE.violationResolutions[client];
  if(res) return `<div class="panel-muted">Action recorded: ${res.action} — by ${res.manager}, ${res.when}.</div>`;
  const disabled=STATE.role!=='manager';
  const btn=(label)=>`<button class="btn btn-out btn-sm" ${disabled?'disabled':''} onclick="resolveViolation('${client}','${label}')">${label}</button>`;
  return `<div class="panel-red"><strong>! CONSECUTIVE LATE-CANCEL / NO-SHOW</strong><br>${client} has reached ${count} of ${VIOLATION_THRESHOLD} consecutive late cancellations/no-shows — the configured threshold.
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${btn('Notify')}${btn('Hold')}${btn('Drop')}${btn('Require Staff Review')}</div>
    ${disabled?`<div class="small-note" style="color:#991b1b">Only a Manager can act on this — the flag is visible so you don't have to remember it.</div>`:''}
  </div>`;
}
function resolveViolation(client,action){ if(STATE.role!=='manager') return; STATE.violationResolutions[client]={action,manager:MANAGER_NAME,when:nowStamp()}; refreshDrawer(); }
function renderInfoGrid(b){
  const dt=`${DATE_META[b.dateISO]?DATE_META[b.dateISO].label:fmtLong(parseISO(b.dateISO))} · ${fmtTime(b.startMin)} – ${fmtTime(b.startMin+b.durMin)}`;
  const statusLine=PLAIN_LINE[b.status]||'';
  const statusCode=b.status==='TENTATIVE'?'Tentative (authorization pending)':b.status;
  const rows=[
    ['Client', b.isGroup?`Group (${getFilled(b)} participants)`:b.client],
    ['Service', b.service],
    ['Level', b.level||'Unassigned'],
    ['Instructor', b.coach],
    ['Location', `Solar Swim — ${COACH_LOCATION[b.coach]||'Main'}`],
    ['Date / Time', dt],
    ['Funding', b.funding||'—'],
    ['Balance', b.balance||'—','bal'],
    ['Status', `<div>${statusCode}</div><div class="body2-note">${statusLine}</div>${b.fundingOverrideNote?`<div class="body2-note" style="margin-top:4px">${b.fundingOverrideNote}</div>`:''}${b.resolvedNote?`<div class="body2-note" style="margin-top:4px">${b.resolvedNote}</div>`:''}`]
  ];
  return `<div class="det-grid">${rows.map(([l,v,cls])=>`<div class="det-row"><div class="det-l">${l}</div><div class="det-r${cls?' '+cls:''}">${v}</div></div>`).join('')}</div>`;
}
function tentativeNoteHtml(b){
  if(b.status!=='TENTATIVE') return '';
  return `<div class="tent-notice"><strong>Nothing reserved yet</strong>This slot is shown based on ${b.client}'s recurring subscription. It will be confirmed once Regional Center authorization is received. No record exists for this occurrence — it is recomputed every time this date is rendered (§2.3).</div>`;
}
function renderCancelPanel(b){
  const {isEarly,noticeLabel}=cancelCalc(b);
  if(isEarly){
    return `<div class="panel-amber"><h4>CANCEL THIS SESSION</h4>
      <p><strong>EARLY</strong> — this session starts in ${noticeLabel}. The configured window is 24 hours.</p>
      <div class="field-lbl">What happens:</div>
      <ul class="policy-list">
        <li>This session is cancelled and marked <strong>CANCELLED_EARLY</strong>.</li>
        <li>Session returned to your balance.</li>
        <li>A make-up token will be generated.</li>
        <li>This does NOT count toward the late-cancellation threshold.</li>
      </ul>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-out btn-sm" onclick="keepBooking()">Keep Booking</button>
        <button class="btn btn-sm" style="background:var(--danger);color:#fff" onclick="confirmCancel('${b.id}')">Confirm Cancellation</button>
      </div></div>`;
  }
  const count=(CLIENT_VIOLATIONS[b.client]||0)+1;
  return `<div class="panel-amber"><h4>CANCEL THIS SESSION</h4>
    <p><strong>LATE</strong> — this session starts in ${noticeLabel}. The configured window is 24 hours.</p>
    <div class="field-lbl">What happens:</div>
    <ul class="policy-list">
      <li>This session is cancelled and marked <strong>CANCELLED_LATE</strong>.</li>
      <li>The credit is already used — it is NOT returned to the balance.</li>
      <li>No make-up token is generated.</li>
      <li>This counts as this client's ${ordinal(count)} consecutive late cancellation/no-show toward the threshold of ${VIOLATION_THRESHOLD}.</li>
    </ul>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-out btn-sm" onclick="keepBooking()">Keep Booking</button>
      <button class="btn btn-sm" style="background:var(--danger);color:#fff" onclick="confirmCancel('${b.id}')">Confirm Cancellation</button>
    </div></div>`;
}
function keepBooking(){ STATE.panel=null; refreshDrawer(); }
function confirmCancel(id){
  const b=findBooking(id);
  const {isEarly}=cancelCalc(b);
  if(isEarly){ b.status='CANCELLED_EARLY'; b.makeupToken=b.makeupToken||genToken(b.client); STATE.panel='makeup'; }
  else { b.status='CANCELLED_LATE'; CLIENT_VIOLATIONS[b.client]=(CLIENT_VIOLATIONS[b.client]||0)+1; STATE.panel='late-summary'; }
  reRenderAll();
}
function renderMakeupPanel(b){
  return `<div class="panel-green"><h4>MAKE-UP TOKEN CREATED</h4>
    <p>Token ${b.makeupToken} created for ${b.client}. This token does not expire.</p>
    <p style="margin-top:8px">Booking Horizon: the client can see and book replacement slots for the next 7 days from today. This is a visibility window, not the token's expiration — the token itself never lapses.</p>
    <button class="btn btn-blue btn-sm" style="margin-top:10px" onclick="location.href='booking-flow-staff.html'">Book Make-Up Session</button>
  </div>`;
}
function renderLateSummary(b){
  return `<div class="panel-muted"><p style="font-weight:600;color:var(--text-primary)">Cancelled late. Session used.</p>${grantMakeupBlockHtml(b)}</div>`;
}
function grantMakeupBlockHtml(b){
  if(STATE.role!=='manager') return '';
  if(b.manualMakeup) return `<div class="small-note" style="color:var(--success-dark)">Make-up token ${b.makeupToken} granted by ${b.manualMakeup.manager} — ${b.manualMakeup.reason}</div>`;
  if(STATE.grantForm===b.id) return `<div style="margin-top:8px"><textarea class="textarea" id="grantReason" placeholder="Reason (required)"></textarea><button class="btn btn-out btn-sm" style="margin-top:6px;border-color:#fde68a;color:#b45309" onclick="grantMakeupAnyway('${b.id}')">Submit</button></div>`;
  return `<button class="btn btn-out btn-sm" style="margin-top:8px;border-color:#fde68a;color:#b45309" onclick="STATE.grantForm='${b.id}';refreshDrawer()">Grant Make-Up Anyway</button>`;
}
function grantMakeupAnyway(id){
  const reasonEl=document.getElementById('grantReason');
  const reason=reasonEl?reasonEl.value.trim():'';
  if(!reason) return;
  const b=findBooking(id);
  b.manualMakeup={reason,manager:MANAGER_NAME,when:nowStamp()};
  b.makeupToken=b.makeupToken||genToken(b.client);
  STATE.grantForm=null;
  reRenderAll();
}
function openFundingPanel(id){ STATE.panel='funding'; STATE.fundingForm={appliesTo:'this',funding:'',duration:'UNTIL_NEW_AUTHORIZATION',extra:'',reason:''}; refreshDrawer(); }
function captureFundingFields(){ const f=STATE.fundingForm; if(!f) return; const fund=document.getElementById('fovFunding'); if(fund) f.funding=fund.value; const extra=document.getElementById('fovExtra'); if(extra) f.extra=extra.value; const reason=document.getElementById('fovReason'); if(reason) f.reason=reason.value; }
function fundingDurationChange(v){ captureFundingFields(); STATE.fundingForm.duration=v; STATE.fundingForm.extra=''; refreshDrawer(); }
function refreshApplyBtn(){ const btn=document.getElementById('fovApplyBtn'); const note=document.getElementById('fovReasonNote'); const has=(STATE.fundingForm.reason||'').trim().length>0; if(btn) btn.disabled=!has; if(note) note.style.display=has?'none':''; }
function renderFundingPanel(b){
  const f=STATE.fundingForm;
  let extraField='';
  if(f.duration==='UNTIL_DATE') extraField=`<div class="field-lbl">End Date</div><input type="date" class="s-input" id="fovExtra" value="${f.extra}">`;
  else if(f.duration==='X_DAYS') extraField=`<div class="field-lbl">Number of Days</div><input type="number" min="1" class="s-input" id="fovExtra" value="${f.extra}">`;
  else if(f.duration==='MANUAL') extraField=`<div class="field-lbl">Manual review note</div><textarea class="textarea" id="fovExtra">${f.extra}</textarea>`;
  const hasReason=(f.reason||'').trim().length>0;
  return `<div class="panel-amber"><h4>FUNDING OVERRIDE</h4>
    <span class="chip c-warn" style="margin-bottom:8px">Override logged with your name, timestamp, and reason.</span>
    <div class="field-lbl">Appointments affected</div>
    <label class="radio-row"><input type="radio" name="fovScope" ${f.appliesTo==='this'?'checked':''} onchange="STATE.fundingForm.appliesTo='this'"> This appointment only</label>
    <label class="radio-row"><input type="radio" name="fovScope" ${f.appliesTo==='recurring'?'checked':''} onchange="STATE.fundingForm.appliesTo='recurring'"> This + future recurring</label>
    <div class="field-lbl">Funding expected</div>
    <input class="s-input" id="fovFunding" placeholder="e.g. Regional Center — SRA11" value="${f.funding}">
    <div class="field-lbl">Duration</div>
    <select class="s-input" id="fovDuration" onchange="fundingDurationChange(this.value)">
      <option value="ONE_APPOINTMENT" ${f.duration==='ONE_APPOINTMENT'?'selected':''}>One Appointment</option>
      <option value="UNTIL_DATE" ${f.duration==='UNTIL_DATE'?'selected':''}>Until Date</option>
      <option value="X_DAYS" ${f.duration==='X_DAYS'?'selected':''}>X Days</option>
      <option value="UNTIL_NEW_AUTHORIZATION" ${f.duration==='UNTIL_NEW_AUTHORIZATION'?'selected':''}>Until New Authorization</option>
      <option value="MANUAL" ${f.duration==='MANUAL'?'selected':''}>Manual</option>
    </select>
    ${extraField}
    <div class="field-lbl">Reason (required)</div>
    <textarea class="textarea" id="fovReason" oninput="STATE.fundingForm.reason=this.value;refreshApplyBtn()">${f.reason}</textarea>
    <div class="small-note" id="fovReasonNote" style="${hasReason?'display:none':''}">Reason is required to apply an override</div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-out btn-sm" onclick="STATE.panel=null;STATE.fundingForm=null;refreshDrawer()">Cancel</button>
      <button class="btn btn-blue btn-sm" id="fovApplyBtn" ${hasReason?'':'disabled'} onclick="applyFundingOverride('${b.id}')">Apply Override</button>
    </div>
  </div>`;
}
function applyFundingOverride(id){
  captureFundingFields();
  const f=STATE.fundingForm;
  if(!f.reason || !f.reason.trim()) return;
  const b=findBooking(id);
  const durLabels={ONE_APPOINTMENT:'One Appointment',UNTIL_DATE:'Until Date',X_DAYS:'X Days',UNTIL_NEW_AUTHORIZATION:'Until New Authorization',MANUAL:'Manual'};
  let reviewText='';
  if(f.duration==='UNTIL_DATE'&&f.extra) reviewText=`, review by ${f.extra}`;
  else if(f.duration==='X_DAYS'&&f.extra) reviewText=`, review in ${f.extra} days`;
  b.fundingOverrideNote=`Funding Override active — ${durLabels[f.duration]}${reviewText}. Applied by ${MANAGER_NAME}, ${nowStamp()}.`;
  b.status='CONFIRMED';
  STATE.panel=null; STATE.fundingForm=null;
  reRenderAll();
}
function openReschedule(id){ STATE.panel='reschedule'; const b=findBooking(id); STATE.reschedForm={date:b.dateISO,startMin:b.startMin}; refreshDrawer(); }
function renderReschedulePanel(b){
  const f=STATE.reschedForm;
  const uh=unionLocationHours();
  let opts='';
  for(let t=uh.open;t<=uh.close;t+=30){ opts+=`<option value="${t}" ${t===f.startMin?'selected':''}>${fmtTime(t)}</option>`; }
  return `<div class="panel-amber"><h4>RESCHEDULE</h4>
    <div class="field-lbl">Date</div><input type="date" class="s-input" id="reschedDate" value="${f.date}">
    <div class="field-lbl">Time</div><select class="s-input" id="reschedTime">${opts}</select>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-out btn-sm" onclick="STATE.panel=null;refreshDrawer()">Cancel</button>
      <button class="btn btn-blue btn-sm" onclick="submitReschedule('${b.id}')">Save</button>
    </div></div>`;
}
function submitReschedule(id){
  const b=findBooking(id);
  const date=document.getElementById('reschedDate').value;
  const startMin=parseInt(document.getElementById('reschedTime').value,10);
  if(date) b.dateISO=date;
  if(!isNaN(startMin)) b.startMin=startMin;
  STATE.panel=null;
  reRenderAll();
}
function renderParticipantRow(b,p,idx){
  const fundChip=fundingChip(p.funding);
  let attChip, controls;
  if(p.attendance==='CANCELLED_LATE'||p.attendance==='CANCELLED_EARLY'){
    attChip=`<span class="chip ${p.attendance==='CANCELLED_LATE'?'c-danger':'c-ok'}">Cancelled — ${p.attendance==='CANCELLED_LATE'?'Late':'Early'}</span>`;
    controls=`<span class="small-note">Resolved by cancellation</span>`;
  } else if(p.attendance==='ATTENDED'){
    attChip=`<span class="chip c-ok">Attended</span>`; controls=`<span class="small-note">Already marked — 1 session used</span>`;
  } else if(p.attendance==='NO_SHOW'){
    attChip=`<span class="chip c-danger">No-Show</span>`; controls=`<span class="small-note">Already marked — 1 session used</span>`;
  } else {
    attChip=`<span class="chip c-muted">Not Marked</span>`;
    controls=`<button class="btn btn-out btn-sm" onclick="markAttendance('${b.id}',${idx},'ATTENDED')">Check In</button><button class="btn btn-out btn-sm" style="color:var(--danger);border-color:#fca5a5" onclick="markAttendance('${b.id}',${idx},'NO_SHOW')">No-Show</button>`;
  }
  return `<div class="px-row"><div class="px-av">${initials(p.name)}</div><div class="px-nm">${p.name}</div>${fundChip}${attChip}<div style="display:flex;gap:5px;width:100%;justify-content:flex-end;margin-top:4px">${controls}</div></div>`;
}
function markAttendance(id,idx,state){ const b=findBooking(id); ensureParticipants(b); const p=b.participants[idx]; if(!p||p.attendance!=='NOT_MARKED') return; p.attendance=state; reRenderAll(); }
function checkInAll(id){ const b=findBooking(id); ensureParticipants(b); b.participants.forEach(p=>{ if(p.attendance==='NOT_MARKED') p.attendance='ATTENDED'; }); reRenderAll(); }
function allMarked(b){ ensureParticipants(b); return b.participants.length>0 && b.participants.every(p=>p.attendance!=='NOT_MARKED'); }
function checkInSingle(id){ markAttendance(id,0,'ATTENDED'); }
function singleResolved(b){ ensureParticipants(b); return !b.participants[0] || b.participants[0].attendance!=='NOT_MARKED'; }
function renderParticipants(b){
  ensureParticipants(b);
  let html=`<div class="px-section"><div class="sec-lbl">Participants${b.requiredParticipants?` (${getFilled(b)} / ${b.requiredParticipants})`:''}</div>`;
  if(b.participants.length===0){
    html+=`<div class="body2-note">${b.filled||0} participants enrolled. Individual roster is not itemized in this prototype's seed data.</div>`;
  } else {
    b.participants.forEach((p,idx)=>{ html+=renderParticipantRow(b,p,idx); });
  }
  if(b.participantsNote) html+=`<div class="body2-note" style="margin-top:6px">${b.participantsNote}</div>`;
  if(groupLikeAddable(b)){
    html+=`<button class="btn btn-out btn-sm" style="width:100%;justify-content:center;margin-top:6px" onclick="togglePaxSearch('${b.id}')"><span class="ms" style="font-size:15px">add</span> Add Participant</button>`;
    if(STATE.paxSearchOpen===b.id) html+=`<div class="px-search-wrap"><input class="s-input" id="drwPxSrch" placeholder="Search clients..." oninput="paxSearch('${b.id}',this.value)"><div class="px-dd" id="drwPxDD"></div></div>`;
  }
  html+='</div>';
  return html;
}
function togglePaxSearch(id){ STATE.paxSearchOpen = STATE.paxSearchOpen===id?null:id; refreshDrawer(); }
function paxSearch(id,q){
  const b=findBooking(id); ensureParticipants(b);
  const existing=new Set(b.participants.map(p=>p.name));
  const res=CLIENT_POOL.filter(n=>!existing.has(n)&&n.toLowerCase().includes(q.toLowerCase())).slice(0,5);
  const el=document.getElementById('drwPxDD'); if(!el) return;
  el.innerHTML=res.map(n=>`<div class="px-res" onclick="addPax('${b.id}','${n}')"><span>${n}</span><span class="chip c-ok">Eligible</span></div>`).join('')||`<div style="padding:8px 11px;font-size:.78rem;color:var(--text-secondary)">No results</div>`;
}
function addPax(id,name){ const b=findBooking(id); ensureParticipants(b); b.participants.push({name,funding:'Self Pay',attendance:'NOT_MARKED'}); STATE.paxSearchOpen=null; reRenderAll(); }
function renderWaitlistPanel(b){
  let html=`<div class="wl-section"><div class="sec-lbl">Waitlist</div>`;
  if(b.seatOpen){
    html+=`<div class="panel-blue"><strong>SEAT OPENED</strong> — ${b.seatOpen.time}<br>Manager notified. A seat is open — choose who to place from the list below.</div>`;
  } else {
    html+=`<div class="panel-muted">Class full. No seat open right now — the list below keeps its order for the next opening.</div>`;
  }
  if(STATE.waitlistMsg && STATE.waitlistMsg.forId===b.id) html+=`<div class="small-note" style="color:var(--success-dark)">${STATE.waitlistMsg.text}</div>`;
  b.waitlist.forEach((w,idx)=>{ html+=renderWaitlistRow(b,w,idx); });
  html+=`<div class="wl-note">Waitlist is shown for all classes — full or not.</div>`;
  html+=`<div class="small-note">No control on this panel offers automatic promotion — every promotion happens through Promote, chosen by a Manager.</div>`;
  html+='</div>';
  return html;
}
function renderWaitlistRow(b,w,idx){
  const key=`${b.id}:${idx}`;
  const canAct=STATE.role==='manager' && !!b.seatOpen;
  const elig=w.eligible?`<span class="chip c-ok">Eligible</span>`:`<span class="chip c-danger">Not Eligible — ${w.reason}</span>`;
  let row=`<div class="wl-row"><div class="wl-pos">${w.pos}</div><div class="wl-nm">${w.name}</div>${fundingChip(w.funding)}${elig}`;
  if(STATE.role==='manager'){
    row+=`<div style="display:flex;gap:6px;width:100%;justify-content:flex-end;margin-top:4px">
      <button class="btn btn-out btn-sm" ${canAct?'':'disabled'} onclick="promoteWaitlist('${b.id}',${idx})">Promote</button>
      <button class="btn btn-out btn-sm" ${canAct?'':'disabled'} onclick="toggleSkipForm('${key}')">Skip</button>
    </div>`;
    if(!canAct) row+=`<div class="small-note" style="width:100%;text-align:right">No seat open right now.</div>`;
    if(STATE.skipFormKey===key) row+=`<div style="width:100%;margin-top:6px"><input class="s-input" id="skipReasonInput" placeholder="Reason (required)"><button class="btn btn-out btn-sm" style="margin-top:5px" onclick="submitSkip('${b.id}',${idx})">Submit</button></div>`;
  }
  if(w.skipHistory) row+=`<div class="small-note" style="width:100%">Skipped ${w.skipHistory.when} — ${w.skipHistory.reason}</div>`;
  row+='</div>';
  return row;
}
function toggleSkipForm(key){ STATE.skipFormKey = STATE.skipFormKey===key?null:key; refreshDrawer(); }
function submitSkip(bid,idx){
  const val=document.getElementById('skipReasonInput')?.value?.trim();
  if(!val) return;
  const b=findBooking(bid);
  b.waitlist[idx].skipHistory={when:nowStamp(),reason:val,who:MANAGER_NAME};
  STATE.skipFormKey=null;
  refreshDrawer();
}
function promoteWaitlist(bid,idx){
  const b=findBooking(bid);
  if(!(STATE.role==='manager' && b.seatOpen)) return;
  ensureParticipants(b);
  const w=b.waitlist[idx];
  b.participants.push({name:w.name,funding:w.funding,attendance:'NOT_MARKED'});
  b.waitlist.splice(idx,1);
  b.seatOpen=null;
  STATE.waitlistMsg={forId:bid,text:'Booking confirmed. Client notified.'};
  if(b.waitlist.length===0 && getFilled(b)>=b.cap) b.status='CONFIRMED';
  reRenderAll();
}
function renderDrawerBody(b){
  let html='';
  html+=violationBannerHtml(b.client);
  html+=renderInfoGrid(b);
  html+=tentativeNoteHtml(b);
  if(STATE.panel==='drag-confirm') html+=renderDragConfirmPanel();
  else if(STATE.panel==='cancel') html+=renderCancelPanel(b);
  else if(STATE.panel==='makeup') html+=renderMakeupPanel(b);
  else if(STATE.panel==='late-summary') html+=renderLateSummary(b);
  else if(STATE.panel==='funding') html+=renderFundingPanel(b);
  else if(STATE.panel==='reschedule') html+=renderReschedulePanel(b);
  else {
    if(b.status==='CANCELLED_EARLY') html+=renderMakeupPanel(b);
    if(b.status==='CANCELLED_LATE') html+=renderLateSummary(b);
  }
  if(!['BREAK','UNAVAILABLE','TENTATIVE'].includes(b.status)) html+=renderParticipants(b);
  if(b.waitlist) html+=renderWaitlistPanel(b);
  document.getElementById('drwBody').innerHTML=html;
  if(STATE.paxSearchOpen===b.id) document.getElementById('drwPxSrch')?.focus();
}
function renderDrawerFooter(b){
  const foot=document.getElementById('drwFoot');
  if(b.status==='BREAK'||b.status==='UNAVAILABLE'){ foot.innerHTML=`<span class="body2-note">${b.status==='BREAK'?'Break':'Unavailable'} blocks have no actions.</span>`; return; }
  if(b.status==='TENTATIVE'){ foot.innerHTML=`<span class="body2-note">Tentative — a computed display, not a booking. No status-change actions exist here.</span>`; return; }
  if(['CANCELLED_EARLY','CANCELLED_LATE','NO_SHOW','COMPLETED'].includes(b.status)){
    foot.innerHTML = b.status==='CANCELLED_EARLY' ? `<button class="btn btn-blue btn-sm" onclick="location.href='booking-flow-staff.html'">Book Make-Up Session</button>` : `<span class="body2-note">No further actions — this booking is resolved.</span>`;
    return;
  }
  let btns=`<button class="btn btn-out btn-sm" onclick="openReschedule('${b.id}')">Reschedule</button>`;
  const isHold=b.status==='AUTHORIZATION_HOLD'||b.status==='PAYMENT_HOLD';
  const groupLike=groupLikeAddable(b);
  if(isHold){
    btns+=`<button class="btn btn-out btn-sm" style="border-color:#fca5a5;color:var(--danger)" onclick="STATE.panel='cancel';refreshDrawer()">Cancel</button>`;
    if(STATE.role==='manager') btns+=`<button class="btn btn-out btn-sm" onclick="openFundingPanel('${b.id}')">Funding Override</button>`;
  } else if(groupLike){
    const done=allMarked(b);
    btns+=`<button class="btn btn-blue btn-sm" onclick="checkInAll('${b.id}')" ${done?'disabled':''}>Check In All</button>`;
    if(done) btns+=`<span class="small-note">All participants already marked.</span>`;
  } else {
    btns+=`<button class="btn btn-out btn-sm" style="border-color:#fca5a5;color:var(--danger)" onclick="STATE.panel='cancel';refreshDrawer()">Cancel</button>`;
    const resolved=singleResolved(b);
    btns+=`<button class="btn btn-blue btn-sm" onclick="checkInSingle('${b.id}')" ${resolved?'disabled':''}>Check In</button>`;
  }
  foot.innerHTML=btns;
}

// ─── INIT ───────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
