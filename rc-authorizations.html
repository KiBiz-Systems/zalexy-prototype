<style>
:root{
  --primary:#334155; --primary-light:#475569; --primary-dark:#1e293b;
  --secondary:#10b981; --secondary-light:#34d399; --secondary-dark:#059669;
  --success:#10b981; --success-bg:#d1fae5; --success-dark:#047857;
  --info:#3b82f6; --info-bg:#eff6ff; --info-dark:#1d4ed8; --info-hover:#2563eb;
  --bg-default:#f8fafc; --bg-paper:#ffffff;
  --text-primary:#0f172a; --text-secondary:#64748b;
  --border:#f1f5f9; --border-input:#cbd5e1; --border-input-hover:#94a3b8;
  --hover-row:#f1f5f9; --action-hover:rgba(71,85,105,0.04); --action-selected:rgba(71,85,105,0.08);
  --danger:#ef4444; --warning:#f59e0b;
  --radius-card:10px; --radius-base:8px; --radius-control:6px; --radius-chip:4px;
  --shadow-card:0 2px 4px rgba(0,0,0,0.02), 0 1px 2px rgba(0,0,0,0.03);
  --shadow-1:0 1px 3px rgba(0,0,0,0.05);
  --shadow-appbar:0 1px 1px rgba(51,65,85,0.03);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Roboto","Helvetica","Arial",sans-serif;color:var(--text-primary);background:var(--bg-default);}
button,input,select,textarea{font-family:inherit;}
h1,h2,h3,h4,h5,h6,p{margin:0;}
.h1{font-size:2rem;font-weight:700;letter-spacing:-0.02em;}
.h2{font-size:1.75rem;font-weight:600;letter-spacing:-0.01em;}
.h3{font-size:1.5rem;font-weight:600;}
.h4{font-size:1.25rem;font-weight:600;}
.h5{font-size:1rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;}
.h6{font-size:.875rem;font-weight:600;}
.body1{font-size:.875rem;font-weight:400;line-height:1.6;color:var(--text-primary);}
.body2{font-size:.8rem;font-weight:400;line-height:1.5;color:var(--text-secondary);}
.muted{color:var(--text-secondary);}
a{color:var(--info-dark);}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;}

.app-shell{display:flex;height:100vh;overflow:hidden;}

/* ---------- Sidebar ---------- */
.sidebar{width:240px;flex:0 0 240px;background:var(--primary-dark);color:#f8fafc;display:flex;flex-direction:column;overflow-y:auto;}
.logo{display:flex;align-items:center;gap:10px;padding:20px 20px 16px;}
.logo svg{flex:0 0 auto;}
.logo span{font-weight:700;font-size:1.05rem;letter-spacing:.02em;}
.nav{padding:8px 12px;display:flex;flex-direction:column;gap:2px;flex:1;}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-base);color:#f8fafc;font-size:.9rem;font-weight:500;text-decoration:none;cursor:pointer;}
.nav-item .material-symbols-rounded{font-size:20px;min-width:24px;color:rgba(248,250,252,.7);}
.nav-item.disabled{opacity:.42;cursor:not-allowed;}
.nav-item:not(.disabled):hover{background:rgba(248,250,252,.08);}
.nav-item.active{background:rgba(248,250,252,.14);}
.nav-item.active .material-symbols-rounded{color:#f8fafc;}
.nav-section{margin:16px 12px 6px;font-size:.7rem;font-weight:700;letter-spacing:.08em;color:rgba(248,250,252,.45);text-transform:uppercase;}
.sidebar-foot{padding:14px 20px;font-size:.7rem;color:rgba(248,250,252,.4);border-top:1px solid rgba(248,250,252,.08);}

/* Main */
.main{flex:1;min-width:0;overflow-y:auto;background:var(--bg-default);}
.topbar{height:64px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:0 24px;}
.loc-pill{display:flex;align-items:center;gap:5px;font-size:.825rem;font-weight:600;color:var(--text-secondary);background:var(--bg-default);border:1px solid var(--border-input);border-radius:6px;padding:5px 10px;}
.user-btn{display:inline-flex;align-items:center;gap:5px;background:#fff;color:var(--text-primary);border:1px solid var(--border-input);border-radius:6px;padding:4px 9px;font-size:.75rem;font-weight:600;cursor:pointer;}
.user-btn:hover{border-color:var(--border-input-hover);background:var(--action-hover);}
.page{max-width:1440px;margin:0 auto;padding:24px;}
.breadcrumb{margin-bottom:8px;}
.breadcrumb a{color:var(--text-secondary);text-decoration:none;}
.breadcrumb a:hover{text-decoration:underline;}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.page-header .titles{min-width:280px;}
.page-header .subtitle{margin-top:4px;}
.header-actions{display:flex;gap:12px;flex-wrap:wrap;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:8px 16px;border-radius:var(--radius-control);font-weight:600;font-size:.875rem;text-transform:none;box-shadow:none;border:1px solid transparent;cursor:pointer;white-space:nowrap;}
.btn-primary{background:var(--info);color:#fff;}
.btn-primary:hover{background:var(--info-hover);}
.btn-primary:disabled{background:#93c5fd;cursor:not-allowed;}
.btn-secondary{background:var(--secondary);color:#fff;}
.btn-secondary:hover{background:var(--secondary-dark);}
.btn-outlined{background:#fff;color:var(--text-primary);border:1px solid var(--border-input);}
.btn-outlined:hover{border-color:var(--primary);background:var(--action-hover);}
.btn-outlined:disabled{color:var(--text-secondary);cursor:not-allowed;background:#fff;}
.btn-outlined-danger{background:#fff;color:var(--danger);border:1px solid #fecaca;}
.btn-outlined-danger:hover{background:#fef2f2;}
.btn-sm{height:28px;padding:4px 10px;font-size:.8rem;}
.link-btn{background:none;border:none;padding:0;color:var(--info-dark);font-weight:600;font-size:.875rem;cursor:pointer;text-decoration:underline;}
.icon-btn{background:none;border:none;cursor:pointer;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-control);color:var(--text-secondary);}
.icon-btn:hover{background:var(--action-hover);}

/* Inputs */
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:.75rem;font-weight:600;color:var(--text-secondary);}
.field label .req{color:var(--danger);font-weight:700;font-size:1.2em;margin-left:2px;}
.input, select.input, textarea.input{height:36px;padding:8px 12px;font-size:.875rem;border:1px solid var(--border-input);border-radius:var(--radius-control);background:#fff;color:var(--text-primary);}
textarea.input{height:auto;resize:vertical;}
.input:hover{border-color:var(--border-input-hover);}
.input:focus{border-color:var(--primary);outline:none;}
.input:disabled{background:#f8fafc;color:var(--text-secondary);cursor:not-allowed;}

/* Card */
.card{background:var(--bg-paper);border-radius:var(--radius-card);box-shadow:var(--shadow-card);border:none;}

/* KPI */
.kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:20px;}
.kpi-tile{padding:16px 20px;text-align:left;border:1px solid transparent;cursor:pointer;}
.kpi-tile .kpi-label{font-size:.725rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary);}
.kpi-tile .kpi-value{font-size:1.75rem;font-weight:700;color:var(--text-primary);margin-top:4px;}
.kpi-tile.active{border:1.5px solid var(--info);background:var(--info-bg);}

/* Filter bar */
.filter-bar{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.filter-bar .search-input{width:320px;max-width:100%;}
.filter-bar select.input{width:150px;}
.filter-bar .spacer{flex:1;}

/* Table */
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:1100px;}
th{font-size:.725rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary);padding:12px 16px;border-bottom:1px solid var(--border);background:transparent;text-align:left;white-space:nowrap;}
td{font-size:.875rem;padding:16px;border-bottom:1px solid var(--border);color:var(--text-primary);vertical-align:top;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:var(--hover-row);}
tbody tr:last-child td{border-bottom:0;}
.client-name{font-weight:600;}
.client-sub{font-size:.8rem;color:var(--text-secondary);margin-top:2px;}
.auth-provider{font-size:.75rem;color:var(--text-secondary);margin-top:2px;}
.units-value{font-weight:700;color:#1d4ed8;}
.table-caption{padding:12px 20px;font-size:.8rem;color:var(--text-secondary);}
.empty-state{padding:48px;text-align:center;}
.empty-state .material-symbols-rounded{font-size:32px;color:var(--text-secondary);}
.empty-state p{margin:12px 0 16px 0;color:var(--text-secondary);}

/* Chips */
.chip{height:24px;border-radius:var(--radius-chip);font-size:.75rem;font-weight:600;padding:0 8px;display:inline-flex;align-items:center;white-space:nowrap;}
.chip-success{background:var(--success-bg);color:var(--success-dark);}
.chip-info{background:var(--info-bg);color:var(--info-dark);}
.chip-warning{background:#fef3c7;color:#b45309;}
.chip-danger{background:#fee2e2;color:#b91c1c;}
.chip-muted{background:#f1f5f9;color:var(--text-secondary);}
.status-cell{display:flex;flex-direction:column;gap:4px;align-items:flex-start;}

/* Backdrop */
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,0.45);z-index:40;}

/* Drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:100%;background:#fff;border-radius:16px 0 0 16px;box-shadow:0 20px 25px -5px rgba(0,0,0,.1);z-index:41;display:flex;flex-direction:column;}
.drawer-body{flex:1;overflow-y:auto;padding:0 24px;}
.drawer-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.drawer-section{padding:20px 0;border-bottom:1px solid var(--border);}
.drawer-section:last-child{border-bottom:none;}
.override-banner{margin:16px 0 0 0;background:#fef3c7;border-left:3px solid var(--warning);padding:12px 16px;border-radius:var(--radius-base);}
.override-banner-title{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:8px;}
.override-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:.8rem;}
.override-grid .k{color:var(--text-secondary);font-weight:600;}
.metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px 0;border-bottom:1px solid var(--border);}
.metric-row .metric-label{font-size:.8rem;color:var(--text-secondary);}
.metric-row .metric-value{font-size:1.25rem;font-weight:700;margin-top:2px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-grid.full{grid-column:1 / -1;}
.kv{display:flex;flex-direction:column;gap:2px;}
.kv .k{font-size:.75rem;font-weight:600;color:var(--text-secondary);}
.kv .v{font-size:.875rem;}
.sub-panel{background:var(--bg-default);padding:16px;border-radius:var(--radius-base);}
.sub-panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.875rem;}
.formula-line{margin-top:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem;color:var(--text-primary);}
.section-title-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.chip-btn{border:none;cursor:pointer;font:inherit;}
.activity-item{padding:10px 0;border-bottom:1px solid var(--border);}
.activity-item:last-child{border-bottom:none;}
.activity-title{font-weight:600;font-size:.875rem;}
.activity-detail{font-size:.8rem;color:var(--text-secondary);}
.drawer-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:12px;}

/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;}
.modal{background:#fff;border-radius:var(--radius-card);box-shadow:0 20px 25px -5px rgba(0,0,0,.1), 0 8px 10px -6px rgba(0,0,0,.1);max-width:560px;width:92%;max-height:88vh;display:flex;flex-direction:column;}
.modal.wide{max-width:720px;}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.modal-body{padding:20px 24px;overflow-y:auto;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:12px;}
.radio-group{display:flex;flex-direction:column;gap:8px;}
.radio-option{display:flex;align-items:center;gap:8px;font-size:.875rem;}

/* Import overlay */
.import-overlay{position:absolute;inset:0;background:var(--bg-default);z-index:30;display:flex;flex-direction:column;overflow-y:auto;}
.import-header{padding:20px 24px;border-bottom:1px solid var(--border);background:#fff;display:flex;justify-content:space-between;align-items:flex-start;}
.import-stepper{display:flex;gap:24px;padding:16px 24px;background:#fff;border-bottom:1px solid var(--border);}
.import-step{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;color:var(--text-secondary);padding-bottom:8px;border-bottom:2px solid transparent;}
.import-step.done{color:var(--success-dark);}
.import-step.active{color:var(--info);border-bottom-color:var(--info);}
.import-body{padding:24px;flex:1;}
.banner{padding:12px 16px;border-radius:var(--radius-base);font-size:.875rem;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.banner-info{background:var(--info-bg);color:var(--info-dark);}
.banner-success{background:var(--success-bg);color:var(--success-dark);}
.banner-warning{background:#fef3c7;color:#b45309;}
.result-tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:16px;}
.result-tile{padding:14px 16px;}
.result-tile .rt-label{font-size:.725rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary);}
.result-tile .rt-value{font-size:1.5rem;font-weight:700;margin-top:4px;}
.segmented{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.import-footer{padding:16px 24px;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;}
.summary-panel{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 20px;margin-bottom:16px;}
.summary-panel .sk{color:var(--text-secondary);font-size:.875rem;}
.summary-panel .sv{font-weight:700;font-size:.875rem;}
.checkbox-row{display:flex;align-items:center;gap:8px;margin:16px 0;font-size:.875rem;}

@media (max-width:1024px){
  .kpi-strip{grid-template-columns:repeat(2,1fr);}
  .form-grid{grid-template-columns:1fr;}
  .metric-row{grid-template-columns:repeat(2,1fr);}
  .result-tiles{grid-template-columns:repeat(2,1fr);}
  .drawer{width:100%;border-radius:0;}
}
</style>
</head>

  function filteredAuths(){
    return authorizations.filter(function(a){
      if(state.activeTile==="PENDING" && a.status!=="PENDING") return false;
      if(state.activeTile==="AUTHORIZED" && a.status!=="AUTHORIZED") return false;
      if(state.activeTile==="EXPIRING" && a.status!=="EXPIRING") return false;
      if(state.activeTile==="TENTATIVE" && scheduleState(a)==="NONE") return false;
      if(state.activeTile==="BALANCES_DUE" && !(a.balance>0)) return false;
      if(state.filterStatus && a.status!==state.filterStatus) return false;
      if(state.filterProvider && a.provider!==state.filterProvider) return false;
      if(state.filterService && (a.service+" / "+a.subtype)!==state.filterService) return false;
      if(state.filterExpiry==="EXPIRING_SOON" && a.status!=="EXPIRING") return false;
      if(state.filterExpiry==="EXPIRED_ONLY" && a.status!=="EXPIRED") return false;
      if(state.filterExpiry==="NOT_EXPIRING" && (a.status==="EXPIRING"||a.status==="EXPIRED")) return false;
      var q = state.search.trim().toLowerCase();
      if(q){
        var hay = (a.client+" "+a.authId+" "+a.code+" "+a.caseManager).toLowerCase();
        if(hay.indexOf(q)===-1) return false;
      }
      return true;
    });

  /* ---------- render with focus preservation ---------- */

  function render(){
    var root = document.getElementById("app-root");
    var active = document.activeElement;
    var activeId = (active && active.id) ? active.id : null;
    var selStart = null, selEnd = null;
    if(active && (typeof active.selectionStart === "number")){
      selStart = active.selectionStart; selEnd = active.selectionEnd;
    }
    root.innerHTML = buildApp();
    if(state.drawerOpen && state.drawerScrollTo){
      var target = document.getElementById(state.drawerScrollTo);
      if(target && target.scrollIntoView){ target.scrollIntoView({block:"start"}); }
      state.drawerScrollTo = null;
    }
    if(activeId){
      var el = document.getElementById(activeId);
      if(el){
        el.focus();
        if(selStart!==null && el.setSelectionRange){
          try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
        }
      }
    }
  }

  /* ---------- event delegation ---------- */

  function onClick(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    if(el.hasAttribute("data-noop")){ return; }
    var action = el.getAttribute("data-action");

    switch(action){
      case "toggle-tile": {
        var tile = el.getAttribute("data-tile");
        state.activeTile = (state.activeTile===tile) ? null : tile;
        render();
        break;
      }
      case "clear-filters": {
        if(el.disabled) return;
        state.search=""; state.filterStatus=""; state.filterProvider=""; state.filterService=""; state.filterExpiry=""; state.activeTile=null;
        render();
        break;
      }
      case "open-drawer": {
        var id = parseInt(el.getAttribute("data-id"),10);
        state.drawerOpen = true; state.drawerAuthId = id; state.drawerScrollTo = null;
        render();
        break;
      }
      case "open-drawer-schedule": {
        e.stopPropagation();
        var id2 = parseInt(el.getAttribute("data-id"),10);
        state.drawerOpen = true; state.drawerAuthId = id2; state.drawerScrollTo = "recurring-schedule";
        render();
        break;
      }
      case "close-drawer": {
        state.drawerOpen = false; state.drawerAuthId = null; state.drawerScrollTo = null;
        render();
        break;
      }
      case "open-override-modal": {
        var mode = el.getAttribute("data-mode");
        state.overrideModalMode = mode;
        var a = findAuth(state.drawerAuthId);
        if(mode==="edit" && a && a.override && a.override.active){
          var apptMap = "All future occurrences";
          var fundMap = a.override.fundingExpected && a.override.fundingExpected.indexOf("No")===0 ? "No" : "Yes";
          state.overrideForm = {
            role: a.override.role, reason: a.override.reason, appointments: apptMap,
            funding: fundMap, duration: a.override.duration, untilDate:"", days:"", reviewDate:""
          };
        } else {
          state.overrideForm = {role:"Billing Admin", reason:"", appointments:"This appointment only", funding:"Yes", duration:"", untilDate:"", days:"", reviewDate:""};
        }
        state.overrideModalOpen = true;
        render();
        break;
      }
      case "close-override-modal": {
        state.overrideModalOpen = false;
        render();
        break;
      }
      case "submit-override": {
        if(el.disabled) return;
        var f = state.overrideForm;
        var a2 = findAuth(state.drawerAuthId);
        if(a2){
          var durationText = f.duration;
          if(f.duration==="UNTIL_DATE" && f.untilDate) durationText = "UNTIL_DATE (until "+f.untilDate+")";
          if(f.duration==="X_DAYS" && f.days) durationText = "X_DAYS ("+f.days+" days)";
          a2.override = {
            active:true, role:f.role, who:"Staff User", when: TODAY_LABEL,
            reason: f.reason, appointments: f.appointments, fundingExpected: f.funding, duration: durationText
          };
          a2.status = a2.status; // status unaffected; override chip renders in addition
        }
        state.overrideModalOpen = false;
        render();
        break;
      }
      case "remove-override": {
        var a3 = findAuth(state.drawerAuthId);
        if(a3) a3.override = {active:false};
        render();
        break;
      }
      case "open-add-modal": {
        state.addForm = {client:"Maria Garcia", authId:"", provider:"", code:"", serviceSubtype:"", start:"", end:"", units:"", proration:"", rounding:"", caseManager:"", caseManagerEmail:"", notes:""};
        state.addModalOpen = true;
        render();
        break;
      }
      case "close-add-modal": {
        state.addModalOpen = false;
        render();
        break;
      }
      case "submit-add": {
        if(el.disabled) return;
        var af = state.addForm;
        var parts = (af.serviceSubtype||"Swim / Private").split(" / ");
        var newAuth = {
          id: state.nextAuthSeq++, client: af.client, caseManager: af.caseManager||"—", caseManagerEmail: af.caseManagerEmail||"—",
          uci:"—", authId: af.authId, provider: af.provider||"RCEB", code: af.code||"—",
          service: parts[0]||"Swim", subtype: parts[1]||"Private",
          periodStart: af.start||"—", periodEnd: af.end||"—",
          authorized: parseInt(af.units,10)||0, used:0, reserved:0, balance:0,
          status:"PENDING", prorated:false, subtypeLimit:"—",
          sourceDoc:null, sourceBatch:null, sourceImportDate:null,
          proration:{method: af.proration||"NONE"},
          override:{active:false},
          onExpiry:"—",
          recurring:{when:"—"},
          settlement:{invoice:null, balance:0, note:"No balance due."},
          activity:[{date:"Apr 17", title:"Authorization created", detail:"Added manually by staff"}]
        };
        authorizations.push(newAuth);
        state.addModalOpen = false;
        render();
        break;
      }
      case "open-import": {
        state.importOpen = true; state.importStep = 1; state.importSegment = "All";
        render();
        break;
      }
      case "close-import": {
        state.importOpen = false;
        render();
        break;
      }
      case "import-goto": {
        if(el.disabled) return;
        var step = parseInt(el.getAttribute("data-step"),10);
        state.importStep = step;
        render();
        break;
      }
      case "import-segment": {
        state.importSegment = el.getAttribute("data-segment");
        render();
        break;
      }
      case "open-match-modal": {
        state.matchModalOpen = true; state.matchSelected = null;
        render();
        break;
      }
      case "close-match-modal": {
        state.matchModalOpen = false;
        render();
        break;
      }
      case "confirm-match": {
        if(el.disabled) return;
        for(var i=0;i<importRows.length;i++){
          if(importRows[i].sourceRow===14){ importRows[i].decisionValue = "Accept Add"; }
        }
        state.matchModalOpen = false;
        render();
        break;
      }
      case "apply-import": {
        if(el.disabled) return;
        state.importOpen = false;
        state.successBanner = "Import IMP-0418 applied — 24 added, 12 updated, 88 skipped.";
        render();
        break;
      }
      case "dismiss-banner": {
        state.successBanner = null;
        render();
        break;
      }
      default: break;
    }
  }

  function onChangeOrInput(e){
    var el = e.target;
    var action = el.getAttribute && el.getAttribute("data-action");
    if(!action) return;

    switch(action){
      case "search-input": state.search = el.value; render(); break;
      case "filter-status": state.filterStatus = el.value; render(); break;
      case "filter-provider": state.filterProvider = el.value; render(); break;
      case "filter-service": state.filterService = el.value; render(); break;
      case "filter-expiry": state.filterExpiry = el.value; render(); break;

      case "ov-role": state.overrideForm.role = el.value; render(); break;
      case "ov-duration": state.overrideForm.duration = el.value; render(); break;
      case "ov-reason": state.overrideForm.reason = el.value; render(); break;
      case "ov-appointments": state.overrideForm.appointments = el.value; render(); break;
      case "ov-funding": state.overrideForm.funding = el.value; render(); break;
      case "ov-until-date": state.overrideForm.untilDate = el.value; render(); break;
      case "ov-days": state.overrideForm.days = el.value; render(); break;
      case "ov-review-date": state.overrideForm.reviewDate = el.value; render(); break;

      case "add-client": state.addForm.client = el.value; render(); break;
      case "add-authid": state.addForm.authId = el.value; render(); break;
      case "add-provider": state.addForm.provider = el.value; render(); break;
      case "add-code": state.addForm.code = el.value; render(); break;
      case "add-service-subtype": state.addForm.serviceSubtype = el.value; render(); break;
      case "add-start": state.addForm.start = el.value; render(); break;
      case "add-end": state.addForm.end = el.value; render(); break;
      case "add-units": state.addForm.units = el.value; render(); break;
      case "add-proration": state.addForm.proration = el.value; render(); break;
      case "add-rounding": state.addForm.rounding = el.value; render(); break;
      case "add-case-manager": state.addForm.caseManager = el.value; render(); break;
      case "add-case-manager-email": state.addForm.caseManagerEmail = el.value; render(); break;
      case "add-notes": state.addForm.notes = el.value; render(); break;

      case "import-decision": {
        var row = parseInt(el.getAttribute("data-row"),10);
        for(var i=0;i<importRows.length;i++){
          if(importRows[i].sourceRow===row){ importRows[i].decisionValue = el.value || null; }
        }
        render();
        break;
      }
      case "select-candidate": state.matchSelected = el.value; render(); break;
      case "approve-checkbox": state.approveChecked = el.checked; render(); break;

      default: break;
    }
  }

  function onKeydown(e){
    if(e.key==="Escape"){
      if(state.matchModalOpen){ state.matchModalOpen = false; render(); return; }
      if(state.overrideModalOpen){ state.overrideModalOpen = false; render(); return; }
      if(state.addModalOpen){ state.addModalOpen = false; render(); return; }
      if(state.drawerOpen){ state.drawerOpen = false; state.drawerAuthId = null; render(); return; }
    }
  }

  document.addEventListener("click", onClick);
  document.addEventListener("change", onChangeOrInput);
  document.addEventListener("input", function(e){
    var action = e.target.getAttribute && e.target.getAttribute("data-action");
    if(action==="search-input" || action==="ov-reason"){ onChangeOrInput(e); }
  });
  document.addEventListener("keydown", onKeydown);

  render();
})();
</script>
</body>
