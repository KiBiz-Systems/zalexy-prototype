<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Zalexy — New Booking (Staff)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root{--primary:#334155;--primary-dark:#1e293b;--secondary:#10b981;--secondary-dark:#059669;--success:#10b981;--success-bg:#d1fae5;--success-dark:#047857;--info:#3b82f6;--info-bg:#eff6ff;--info-dark:#1d4ed8;--info-hover:#2563eb;--bg-default:#f8fafc;--bg-paper:#fff;--text-primary:#0f172a;--text-secondary:#64748b;--border:#f1f5f9;--border-input:#cbd5e1;--border-input-hover:#94a3b8;--hover-row:#f1f5f9;--danger:#ef4444;--warning:#f59e0b;--radius-card:10px;--radius-base:8px;--radius-control:6px;--shadow-card:0 2px 4px rgba(0,0,0,0.02),0 1px 2px rgba(0,0,0,0.03)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg-default);color:var(--text-primary);font-size:14px;height:100vh;overflow:hidden}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:18px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;vertical-align:middle}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;flex-shrink:0;background:var(--primary-dark);display:flex;flex-direction:column}
.sb-logo{height:58px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,0.07)}
.sb-badge{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#10b981);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.sb-logo strong{color:#f8fafc;font-size:16px;font-weight:700}
.sb-nav{flex:1;overflow-y:auto;padding:10px 8px}
.sb-section{font-size:.68rem;font-weight:700;color:rgba(248,250,252,.35);text-transform:uppercase;letter-spacing:.08em;padding:10px 12px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:7px;color:rgba(248,250,252,.65);font-size:.85rem;font-weight:500;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;margin-bottom:1px;transition:background 120ms}
.nav-item:hover{background:rgba(255,255,255,.06);color:#f8fafc}
.nav-item.active{background:rgba(59,130,246,.2);color:#93c5fd}
.main-shell{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;padding:0 20px;gap:10px;flex-shrink:0}
.loc-pill{display:flex;align-items:center;gap:5px;font-size:.825rem;font-weight:600;color:var(--text-secondary);background:var(--bg-default);border:1px solid var(--border-input);border-radius:6px;padding:5px 10px}
.main-area{flex:1;overflow-y:auto;background:var(--bg-default)}
.page-wrap{max-width:1180px;margin:0 auto;padding:22px 22px 130px}
.breadcrumb{font-size:.72rem;color:var(--text-secondary);margin-bottom:4px}
.page-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.page-title{font-size:1.4rem;font-weight:700;letter-spacing:-.02em}
.page-sub{font-size:.825rem;color:var(--text-secondary);margin-top:2px}
.role-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;padding:8px 12px;background:#fff;border-radius:8px;border:1px solid var(--border)}
.role-lbl{font-size:.72rem;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.type-tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:7px;margin-bottom:12px;position:sticky;top:0;z-index:20;box-shadow:var(--shadow-card)}
.t-tab{flex:1;padding:8px 14px;border-radius:7px;font-size:.85rem;font-weight:600;border:1.5px solid var(--border-input);background:transparent;color:var(--text-secondary);transition:all 140ms;cursor:pointer}
.t-tab.active{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark)}
.stepper{display:flex;align-items:center;background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:12px 18px;margin-bottom:16px;position:sticky;top:56px;z-index:19;box-shadow:var(--shadow-card)}
.s-item{display:flex;align-items:center;gap:7px;flex:1}
.s-item:last-child{flex:0 0 auto}
.s-dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;flex-shrink:0;transition:all 200ms}
.s-dot.done{background:var(--success-bg);color:var(--success-dark)}
.s-dot.act{background:var(--info);color:#fff}
.s-dot.fut{background:#e2e8f0;color:var(--text-secondary)}
.s-lbl{font-size:.77rem;font-weight:600;white-space:nowrap}
.s-lbl.done{color:var(--success-dark)}.s-lbl.act{color:var(--text-primary)}.s-lbl.fut{color:var(--text-secondary)}
.s-line{flex:1;height:1px;background:var(--border);margin:0 6px}
.wizard-layout{display:flex;gap:20px;align-items:flex-start}
.wizard-main{flex:1;min-width:0}
@media(max-width:1280px){.wizard-layout{flex-direction:column}.queue-panel{width:100%;position:static;order:-1}}
.card{background:#fff;border-radius:var(--radius-card);box-shadow:var(--shadow-card);margin-bottom:10px;overflow:hidden}
.card-hd{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-hd h3{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary)}
.card-bd{padding:18px}
.collapsed{display:flex;align-items:center;background:#fff;border:1px solid var(--border);border-radius:8px;padding:11px 15px;margin-bottom:8px;gap:10px}
.chk-c{width:20px;height:20px;border-radius:50%;background:var(--success-bg);display:grid;place-items:center;flex-shrink:0;font-size:11px;color:var(--success-dark);font-weight:700}
.coll-txt{flex:1;font-size:.85rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edit-btn{background:none;border:none;color:var(--info);font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap}
.s-input{width:100%;border:1px solid var(--border-input);border-radius:6px;padding:8px 12px;font-size:.875rem;background:#fff;outline:none;transition:border-color 140ms}
.s-input:focus{border-color:var(--info);outline:2px solid rgba(59,130,246,.25);outline-offset:1px}
.cl-row{border:1px solid var(--border);border-radius:8px;padding:12px 15px;margin-top:8px;cursor:pointer;transition:all 140ms;display:flex;align-items:center;gap:11px}
.cl-row:hover{background:var(--hover-row);border-color:var(--border-input-hover)}
.cl-row.sel{border:1.5px solid var(--info);background:var(--info-bg)}
.cl-radio{width:17px;height:17px;border-radius:50%;border:2px solid var(--border-input);flex-shrink:0;transition:all 140ms}
.cl-radio.on{background:var(--info);border-color:var(--info);box-shadow:inset 0 0 0 3px #fff}
.ctx-panel{margin-top:14px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.ctx-row{display:grid;grid-template-columns:170px 1fr;border-bottom:1px solid var(--border)}
.ctx-row:last-child{border-bottom:none}
.ctx-lbl{padding:10px 14px;font-size:.75rem;font-weight:600;color:var(--text-secondary);background:var(--bg-default)}
.ctx-val{padding:10px 14px;font-size:.875rem;color:var(--text-primary)}
.ctx-val.bal{font-weight:700;color:var(--info-dark)}
.chip{display:inline-flex;align-items:center;height:24px;border-radius:4px;padding:0 8px;font-size:.75rem;font-weight:600;white-space:nowrap}
.c-ok{background:var(--success-bg);color:var(--success-dark)}.c-info{background:var(--info-bg);color:var(--info-dark)}.c-warn{background:#fef3c7;color:#b45309}.c-danger{background:#fee2e2;color:#b91c1c}.c-muted{background:#f1f5f9;color:var(--text-secondary)}
.btn{border-radius:6px;padding:7px 14px;font-size:.85rem;font-weight:600;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all 140ms}
.btn-blue{background:var(--info);color:#fff}.btn-blue:hover{background:var(--info-hover)}.btn-blue:disabled{opacity:.4;cursor:not-allowed}
.btn-green{background:var(--secondary);color:#fff}.btn-green:hover{background:var(--secondary-dark)}
.btn-out{background:#fff;color:var(--text-primary);border:1px solid var(--border-input)}.btn-out:hover{border-color:var(--primary);background:var(--hover-row)}
.btn-out:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{padding:5px 10px;font-size:.78rem}
.btn-amber{border-color:#fed7aa !important;color:#92400e !important}.btn-amber:hover{background:#fff7ed !important}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px;margin-top:6px}
.svc-card{border:1px solid var(--border);border-radius:10px;padding:14px 12px;cursor:pointer;transition:all 140ms;position:relative}
.svc-card:hover:not(.inelig){border-color:var(--border-input-hover);background:var(--hover-row)}
.svc-card.sel-svc{border:1.5px solid var(--info);background:var(--info-bg)}
.svc-card.inelig{opacity:.55;cursor:not-allowed}
.svc-tag{position:absolute;top:8px;right:8px;font-size:.65rem;font-weight:700;color:var(--text-secondary);text-transform:uppercase}
.px-row{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:10px 13px;margin-bottom:7px}
.px-av{width:30px;height:30px;border-radius:50%;background:var(--info);color:#fff;display:grid;place-items:center;font-size:.7rem;font-weight:700;flex-shrink:0}
.px-av.sec{background:#7c3aed}
.add-px-btn{display:flex;align-items:center;gap:6px;border:1.5px dashed var(--border-input);border-radius:8px;padding:9px 13px;background:transparent;color:var(--text-secondary);font-size:.85rem;font-weight:600;cursor:pointer;width:100%;transition:all 140ms;margin-top:4px}
.add-px-btn:hover{border-color:var(--info);color:var(--info)}
.px-dd-wrap{margin-top:7px;position:relative}
.px-dd{position:absolute;top:calc(100% + 3px);left:0;right:0;background:#fff;border:1px solid var(--border-input);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.1);z-index:50;overflow:hidden}
.px-res{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--border)}
.px-res:last-child{border-bottom:none}.px-res:hover{background:var(--hover-row)}
.day-grid{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.d-row{display:grid;grid-template-columns:46px 1fr 1fr;align-items:center;gap:9px;border-radius:8px;padding:9px 12px}
.d-row.chk{background:#f0fdf4;border:1px solid #bbf7d0}
.d-row.uchk{background:var(--bg-default);border:1px solid var(--border);opacity:.6}
.d-badge{background:var(--primary-dark);color:#fff;border-radius:5px;padding:5px 3px;font-size:.67rem;font-weight:700;text-align:center;line-height:1.3}
.d-label{display:flex;align-items:center;gap:6px;font-size:.85rem;cursor:pointer}
.t-sel{border:1px solid var(--border-input);border-radius:6px;padding:5px 7px;font-size:.78rem;background:#fff}
.rec-pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.rec-p{padding:6px 13px;border-radius:8px;border:1.5px solid var(--border-input);background:transparent;color:var(--text-secondary);font-size:.78rem;font-weight:600;cursor:pointer;transition:all 140ms}
.rec-p.act{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark)}
.banner{border-radius:8px;padding:11px 15px;font-size:.8rem;margin-top:11px}
.b-info{background:var(--info-bg);border:1px solid #bfdbfe;color:#1e40af}
.b-warn{background:#fef3c7;border:1px solid #fde68a;color:#92400e}
.b-ok{background:var(--success-bg);border:1px solid #a7f3d0;color:var(--success-dark)}
.b-danger{background:#fee2e2;border:1px solid #fecaca;color:#991b1b}
.dg-lbl{font-size:.78rem;font-weight:700;color:var(--text-primary);margin:14px 0 7px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.slots-row{display:flex;flex-wrap:wrap;gap:9px}
.no-slots{color:var(--text-secondary);font-size:.78rem;padding:6px 3px;font-style:italic}
.s-card{width:212px;min-height:190px;border:1px solid var(--border);border-radius:10px;padding:11px;cursor:pointer;position:relative;transition:all 140ms;display:flex;flex-direction:column;gap:3px;background:#fff}
.s-card:hover{border-color:var(--border-input-hover);box-shadow:0 2px 8px rgba(0,0,0,.07)}
.s-card.sel-slot{border:1.5px solid var(--info);background:var(--info-bg)}
.s-card.blocked{opacity:.6;cursor:not-allowed}
.s-sel-dot{position:absolute;top:7px;right:7px;width:17px;height:17px;border-radius:50%;border:2px solid var(--border-input);background:#fff;transition:all 140ms}
.s-card.sel-slot .s-sel-dot{background:var(--info);border-color:var(--info);box-shadow:inset 0 0 0 3px #fff}
.cap-bar-w{margin-top:auto;padding-top:5px}
.cap-bar{height:5px;border-radius:3px;background:#e2e8f0;overflow:hidden}
.cap-fill{height:100%;border-radius:3px}
.cap-fill.low{background:var(--success)}.cap-fill.med{background:var(--warning)}.cap-fill.full{background:var(--danger)}
.s-btns{display:flex;gap:5px;margin-top:7px}
.out-banner{border-radius:8px;padding:14px 18px;border-left:4px solid;margin-bottom:14px}
.out-banner.confirmed{background:var(--success-bg);border-left-color:var(--secondary)}
.out-banner.pending{background:#fef3c7;border-left-color:var(--warning)}
.out-banner.waitlisted{background:var(--info-bg);border-left-color:var(--info)}
.out-banner.authhold{background:#fef3c7;border-left-color:var(--warning)}
.out-banner.paymenthold{background:#fee2e2;border-left-color:var(--danger)}
.out-t{font-size:1rem;font-weight:700}.out-s{font-size:.78rem;margin-top:3px;opacity:.85}
.rev-grid{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:12px}
.rev-row{display:grid;grid-template-columns:170px 1fr;border-bottom:1px solid var(--border)}
.rev-row:last-child{border-bottom:none}
.rl{padding:10px 14px;font-size:.75rem;font-weight:600;color:var(--text-secondary);background:var(--bg-default)}
.rv{padding:10px 14px;font-size:.875rem;color:var(--text-primary)}
.ovr-panel{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:16px;margin-top:12px}
.ovr-panel label{display:block;font-size:.72rem;font-weight:600;color:var(--text-secondary);margin-bottom:4px;margin-top:10px}
.ovr-panel select,.ovr-panel textarea,.ovr-panel input{width:100%;border:1px solid var(--border-input);border-radius:6px;padding:7px 10px;font-size:.85rem;background:#fff}
.ovr-panel textarea{resize:vertical;min-height:60px}
.ovr-note{font-size:.75rem;color:var(--text-secondary);margin-top:6px}
.succ-state{text-align:center;padding:56px 22px}
.succ-icon{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;font-size:1.7rem}
.succ-t{font-size:1.3rem;font-weight:700;margin-bottom:5px}
.succ-s{font-size:.85rem;color:var(--text-secondary);margin-bottom:8px}
.sf{position:fixed;bottom:0;left:240px;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--border);padding:13px 22px;display:flex;justify-content:space-between;align-items:center;z-index:30}
.sf-r{display:flex;gap:7px}
.drawer{position:fixed;right:0;top:58px;bottom:0;width:480px;background:#fff;border-left:1px solid var(--border);box-shadow:-4px 0 16px rgba(0,0,0,.08);display:flex;flex-direction:column;z-index:50;transform:translateX(100%);transition:transform 240ms ease}
.drawer.open{transform:translateX(0)}
.drw-hd{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.drw-body{flex:1;overflow-y:auto;padding:18px}
.drw-foot{padding:11px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:7px}
.x-btn{background:none;border:none;cursor:pointer;color:var(--text-secondary);padding:4px;border-radius:4px;line-height:1}
.x-btn:hover{background:var(--hover-row)}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:.72rem;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
.fg select,.fg input,.fg textarea{width:100%;border:1px solid var(--border-input);border-radius:6px;padding:7px 10px;font-size:.85rem;background:#fff}
.fg textarea{resize:vertical;min-height:56px}
.form-r{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;top:75px;right:22px;background:var(--primary-dark);color:#f8fafc;padding:11px 16px;border-radius:8px;font-size:.85rem;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:100;transform:translateY(-8px);opacity:0;transition:all 220ms;pointer-events:none;max-width:340px}
.toast.show{transform:translateY(0);opacity:1}
.divider{height:1px;background:var(--border);margin:14px 0}
.sec-lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);margin:12px 0 7px}
.staff-sec{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.queue-panel{width:260px;flex-shrink:0;background:var(--bg-default);border:1px solid var(--border);border-radius:10px;padding:16px;position:sticky;top:112px}
.qp-title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);margin-bottom:8px}
.qp-h{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);margin:12px 0 6px}
.qp-h:first-of-type{margin-top:0}
.qp-now{display:flex;align-items:center;gap:7px;font-weight:700;color:var(--text-primary);font-size:.85rem;padding:4px 0}
.qp-dot{width:8px;height:8px;border-radius:50%;background:var(--info);flex-shrink:0}
.qp-next{display:flex;align-items:center;gap:7px;color:var(--text-secondary);font-size:.82rem;padding:5px 4px;cursor:pointer;border-radius:6px;background:none;border:none;width:100%;text-align:left}
.qp-next:hover{background:var(--hover-row)}
.qp-ring{width:13px;height:13px;border-radius:50%;border:2px solid var(--border-input);flex-shrink:0}
.qp-done-row{display:flex;align-items:center;gap:7px;color:var(--success-dark);font-size:.82rem;padding:4px 0}
.qp-check{width:14px;height:14px;border-radius:50%;background:var(--success-bg);color:var(--success-dark);display:grid;place-items:center;font-size:9px;font-weight:700;flex-shrink:0}
.qp-empty{color:var(--text-secondary);font-size:.76rem;font-style:italic}
.px-tabs{display:flex;gap:6px;margin-bottom:10px;align-items:center}
.px-tab{padding:7px 14px;border-radius:8px;font-size:.82rem;font-weight:600;border:1.5px solid var(--border-input);background:transparent;color:var(--text-secondary);cursor:pointer}
.px-tab.act{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark)}
.mkt-panel{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:18px;margin:8px 0 14px}
.mkt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
@media(max-width:720px){.mkt-grid{grid-template-columns:1fr}}
.mkt-card{border:1px solid var(--border);border-radius:8px;padding:14px}
.mkt-card.disabled{opacity:.55}
.mkt-price{font-weight:700;color:var(--info-dark);font-size:1rem;margin-top:6px}
.mkt-std{font-size:.78rem;color:var(--text-secondary)}
.mkt-disable-reason{font-size:.72rem;color:var(--danger);margin-top:6px}
.buying-chip{background:var(--info-bg);color:var(--info-dark)}
.svc-remove{background:none;border:none;color:var(--danger);font-size:.72rem;font-weight:600;cursor:pointer;margin-top:6px;padding:0}
.wl-item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:8px;padding:10px 13px;margin-bottom:7px}
.instr-empty{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px 15px;font-size:.8rem;color:#991b1b;margin-top:8px}
.dim-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;font-size:.75rem}
.dim-ok{color:var(--success-dark)}.dim-bad{color:var(--danger);font-weight:700}
.overlap-block{font-size:.72rem;color:var(--danger);margin-top:4px;font-weight:600}
.overlap-note{font-size:.72rem;color:var(--text-secondary);margin-top:4px;font-style:italic}

<body>
<div class="app">
  <script src="shared-sidebar.js" data-inject="true"></script>
<div class="main-shell">
  <div class="topbar">
    <div class="loc-pill"><span class="ms" style="font-size:15px">location_on</span>Solar Swim (PDT)</div>
    <button class="btn btn-out btn-sm" data-noop>Michael Torres &#9662;</button>
  </div>
  <main class="main-area">
    <div class="page-wrap">
      <div class="page-h">
        <div>
          <div class="breadcrumb">Scheduling / New Booking</div>
          <h1 class="page-title">New Booking</h1>
          <p class="page-sub">Private / Semi-Private / Group</p>

        <button class="btn btn-out btn-sm" id="rStaff" onclick="setRole('staff')">Staff</button>
        <button class="btn btn-blue btn-sm" id="rManager" onclick="setRole('manager')">Manager &#10003;</button>

</div>

  </div>

    <button class="btn btn-blue" id="nextBtn" onclick="goNext()" disabled>Select Client</button>
  </div>

<script>
/* ---------- Reference data ---------- */
const POLICY={requiredParticipants:2,source:'policy engine, this service'};
const HORIZON_DAYS=7;
const TODAY=new Date(2026,8,8); // Sep 8, 2026
const CLOSURES={'2026-09-23':'Staff Training Day'};
const AD=['MON','TUE','WED','THU','FRI','SAT','SUN'];
const DAY_JS={MON:1,TUE:2,WED:3,THU:4,FRI:5,SAT:6,SUN:0};
const DD={MON:'Sep 14',TUE:'Sep 15',WED:'Sep 16',THU:'Sep 17',FRI:'Sep 18',SAT:'Sep 19',SUN:'Sep 20'};
const DATE_ISO={MON:'2026-09-14',TUE:'2026-09-15',WED:'2026-09-16',THU:'2026-09-17',FRI:'2026-09-18',SAT:'2026-09-19',SUN:'2026-09-20'};
const PRIVATE_PRICE={30:45,60:70};

const CLIENTS={
 mg:{id:'mg',nm:'Maria Garcia',email:'maria.garcia@email.com',phone:'555-0142',cid:'C-10231',rel:'Primary · Caroline Garcia household',lvl:'Beginner 2',fund:'Regional Center',fs:'RCEB Pending',bal:'5 / 8 sessions',balAvail:5,balTotal:8,mu:1,pkg:'8-Class Group Pack (purchased Aug 2026)',voucher:'RC Auth #RC-2291, expires Oct 31, 2026',assess:'Approved — Aug 20, 2026',rest:'None',labels:['Priority Family'],notes:'Prefers afternoon sessions.',init:'MG',female:false,paymentIssue:false},
 cg:{id:'cg',nm:'Carlos Garcia',email:'carlos.garcia@email.com',phone:'555-0143',cid:'C-10232',rel:'Spouse · Caroline Garcia household',lvl:'Intermediate',fund:'Self Pay',fs:'Active',bal:'2 / 4 sessions',balAvail:2,balTotal:4,mu:0,pkg:'4-Class Basketball Pack',voucher:'—',assess:'N/A',rest:'None',labels:[],notes:'Card on file declined Sep 5, 2026.',init:'CG',female:false,paymentIssue:true,membership:'Family Membership Plus'},
 as:{id:'as',nm:'Ava Smith',email:'ava.smith@email.com',phone:'555-0201',cid:'C-10233',rel:'Single account',lvl:'Beginner 1',fund:'Voucher',fs:'Active',bal:'7 / 8 sessions',balAvail:7,balTotal:8,mu:0,pkg:'8-Class Group Pack',voucher:'Voucher Active',assess:'Approved',rest:'Female instructor only',labels:[],notes:'Female instructor only.',init:'AS',female:true,paymentIssue:false},
 lb:{id:'lb',nm:'Lucas Brown',email:'lucas.brown@email.com',phone:'555-0301',cid:'C-10234',rel:'Brown Family',lvl:'Unassigned',fund:'Self Pay',fs:'Active',bal:'4 / 4 sessions',balAvail:4,balTotal:4,mu:0,pkg:'—',voucher:'—',assess:'Pending',rest:'None',labels:[],notes:'—',init:'LB',female:false,paymentIssue:false},
 lt:{id:'lt',nm:'Liam Turner',email:'liam.turner@email.com',phone:'555-0410',cid:'C-10235',rel:'Turner Family',lvl:'Beginner 2',fund:'Self Pay',fs:'Active',bal:'3 / 8 sessions',balAvail:3,balTotal:8,mu:1,pkg:'8-Class Pack',voucher:'—',assess:'Approved',rest:'None',labels:[],notes:'On Swim waitlist, Thu PM preferred.',init:'LT',female:false,paymentIssue:false}
};
const CL=Object.values(CLIENTS);

const SERVICE_CATALOG={
 mg:[{id:'swim',nm:'Swim',wet:true,status:'ok',bal:'5 / 8',balAvail:5},{id:'fit',nm:'Fitness',wet:false,status:'ok',bal:'3 / 6',balAvail:3},{id:'bb',nm:'Basketball',wet:false,status:'buy',reason:'No pack'}],
 cg:[{id:'bb',nm:'Basketball',wet:false,status:'buy',reason:'No pack'}],
 as:[{id:'swim',nm:'Swim',wet:true,status:'ok',bal:'7 / 8',balAvail:7}],
 lb:[{id:'swim',nm:'Swim',wet:true,status:'hard',reason:'Assessment required'}],
 lt:[{id:'swim',nm:'Swim',wet:true,status:'ok',bal:'3 / 8',balAvail:3}]
};
const MARKET={bb:{svcNm:'Basketball',block:{nm:'Basketball 5-Pack',units:5,standard:150,member:135},sub:{nm:'Basketball Monthly',units:'8 units / month',standard:89,member:79},membershipNeeded:'Family Membership Plus'}};

const SG=[
 {id:'g1',day:'MON',date:'2026-09-14',time:'12:30–1:55 PM',start:750,end:835,inst:'mt',loc:'Pool Lane 8',spots:3,cap:8},
 {id:'g2',day:'MON',date:'2026-09-14',time:'4:00–5:00 PM',start:960,end:1020,inst:'sc',loc:'Pool Lane 4',spots:8,cap:8},
 {id:'g3',day:'WED',date:'2026-09-16',time:'9:00–10:30 AM',start:540,end:630,inst:'sc',loc:'Pool Lane 10',spots:6,cap:8},
 {id:'g4',day:'WED',date:'2026-09-16',time:'6:00–7:25 AM',start:360,end:445,inst:'mt',loc:'Pool Lane 2',spots:7,cap:8}
];
const SS=[
 {id:'s1',day:'MON',date:'2026-09-14',time:'12:30–1:30 PM',start:750,end:810,inst:'mt',loc:'Pool Lane 8',roster:1},
 {id:'s2',day:'WED',date:'2026-09-16',time:'9:00–10:00 AM',start:540,end:600,inst:'sc',loc:'Pool Lane 10',roster:2}
];
const SP=[
 {id:'p1',day:'MON',date:'2026-09-14',time:'12:30–1:30 PM',start:750,end:810,inst:'mt',loc:'Pool Lane 8',len:60},
 {id:'p2',day:'MON',date:'2026-09-14',time:'3:00–3:30 PM',start:900,end:930,inst:'jw',loc:'Pool Lane 6',len:30},
 {id:'p3',day:'WED',date:'2026-09-16',time:'8:00–9:00 AM',start:480,end:540,inst:'sc',loc:'Pool Lane 4',len:60}
];
const INSTRUCTORS={mt:{nm:'Michael Torres',female:false,days:['MON','WED']},sc:{nm:'Sarah Chen',female:true,days:['MON','WED']},jw:{nm:'James Wright',female:false,days:['MON']}};
const WL_SEED={matched:[{nm:'Liam Turner',wanted:'Swim Beginner 2 — wanted Thu afternoon'},{nm:'Noah Kim',wanted:'Swim Beginner 2 — wanted Thu evening'}],notMatched:[{nm:'Ava Smith',wanted:'Swim Beginner 1 — any day',reason:'level does not match'}]};

const OUTCOME_META={
 CONFIRMED:{icon:'check_circle',bg:'#d1fae5',fg:'#047857',title:'Booking Confirmed',chipClass:'c-ok',line:'Booked. A session is reserved.',bannerClass:'confirmed'},
 PENDING_PARTNER:{icon:'hourglass_top',bg:'#fef3c7',fg:'#b45309',title:'Booked — Waiting on a Partner',chipClass:'c-warn',line:'Waiting for a second participant.',bannerClass:'pending'},
 WAITLISTED:{icon:'list_alt',bg:'#eff6ff',fg:'#1d4ed8',title:'Added to Waitlist',chipClass:'c-info',line:'On the waitlist. Nothing reserved yet.',bannerClass:'waitlisted'},
 AUTHORIZATION_HOLD:{icon:'hourglass_top',bg:'#fef3c7',fg:'#b45309',title:'Booked — Awaiting Authorization',chipClass:'c-warn',line:'Waiting on Regional Center authorization.',bannerClass:'authhold'},
 PAYMENT_HOLD:{icon:'warning',bg:'#fee2e2',fg:'#b91c1c',title:'Booked — Awaiting Payment',chipClass:'c-danger',line:'Waiting on payment.',bannerClass:'paymenthold'}
};

/* ---------- State ---------- */
let S={
 role:'manager',type:'group',step:1,success:false,outcome:null,
 participants:[],activePIdx:0,queue:[],queuePos:0,
 fundingPanelOpen:false,overridesApplied:[],
 slotReservations:{}, // slotId -> [pIdx,...]
 marketOpenFor:null,
 drawer:{open:false,mode:'form',svc:'Swim',ctype:'Group',level:'Beginner 2',inst:'mt',date:'2026-09-17',time:'16:00',dur:'60',cap:8,resource:'Pool Lane 4',notes:'',pulled:[],created:null}
};

/* ---------- Helpers ---------- */
function catalogFor(clientId){return SERVICE_CATALOG[clientId]||[];}
function sortDryWet(arr){return [...arr].sort((a,b)=>(a.wet?1:0)-(b.wet?1:0));}
function fmtMoney(n){return '$'+Number(n).toFixed(2);}
function pxObj(pIdx){return S.participants[pIdx];}
function curItem(){return S.queue[S.queuePos];}
function curSvc(){const it=curItem();if(!it)return null;return S.participants[it.pIdx].services[it.sIdx];}
function curParticipant(){const it=curItem();if(!it)return null;return S.participants[it.pIdx];}
function slotPool(){return S.type==='group'?SG:S.type==='semi'?SS:SP;}
function findSlot(id){return slotPool().find(s=>s.id===id);}
function muDetailStr(c){return c.mu>0?`${c.mu} available (Swim / ${c.lvl} / Solar Swim, no expiration, Booking Horizon ${HORIZON_DAYS} days)`:'None';}

function withFocusPreserved(fn){
  const ae=document.activeElement;
  const id=ae&&ae.id?ae.id:null;
  let start=null,end=null;
  if(ae&&typeof ae.selectionStart==='number'){start=ae.selectionStart;end=ae.selectionEnd;}
  fn();
  if(id){
    const el=document.getElementById(id);
    if(el){el.focus();if(start!==null&&el.setSelectionRange){try{el.setSelectionRange(start,end);}catch(e){}}}
  }
}

function matchInstructors(client,days){
  const restrictFemale=client.rest==='Female instructor only';
  let pool=Object.entries(INSTRUCTORS);
  const afterRestrict=pool.filter(([k,i])=>!restrictFemale||i.female);
  const afterAvail=afterRestrict.filter(([k,i])=>!days.length||days.some(d=>i.days.includes(d)));
  return {list:afterAvail.map(([k])=>k),restrictFailed:restrictFemale&&afterRestrict.length===0,availFailed:afterRestrict.length>0&&afterAvail.length===0};
}

function generateDates(days,rec,creditsAvail,searchThrough){
  const out=[],skipped=[];let d=new Date(TODAY);d.setDate(d.getDate()+1);
  const maxIter=90;let iter=0;
  const stEnd=searchThrough?new Date(searchThrough+'T00:00:00'):null;
  while(iter<maxIter && out.length<creditsAvail){
    iter++;
    const iso=d.toISOString().slice(0,10);
    const dayName=Object.keys(DAY_JS).find(k=>DAY_JS[k]===d.getDay());
    if(days.includes(dayName)){
      if(CLOSURES[iso]){skipped.push({date:iso,label:CLOSURES[iso]});}
      else{
        out.push(iso);
        if(rec==='once')break;
        if(rec==='date'&&stEnd&&d>stEnd)break;
      }
    }
    if(rec==='date'&&stEnd&&d>stEnd)break;
    d.setDate(d.getDate()+1);
  }
  let stopReason='';
  if(rec==='once')stopReason='One time only — a single session.';
  else if(out.length>=creditsAvail)stopReason=`${out.length} of ${creditsAvail} available credits used. Cannot extend further — this uses all remaining credits in the current package.`;
  else if(rec==='date')stopReason='Stopped at the selected end date.';
  return {dates:out,skipped,stopReason};
}

function fmtDateLong(iso){
  const d=new Date(iso+'T00:00:00');
  const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  return `${wd} ${mo} ${d.getDate()}`;
}

/* ---------- Render pipeline ---------- */
function render(){
  withFocusPreserved(()=>{
    renderTypeTabs();renderRoleButtons();renderStepper();renderParticipantTabs();
    renderQueuePanel();renderStepsArea();renderFooter();renderDrawer();
  });
}
function renderTypeTabs(){
  ['tabGroup','tabSemi','tabPrivate'].forEach(id=>document.getElementById(id).classList.remove('active'));
  const m={group:'tabGroup',semi:'tabSemi',private:'tabPrivate'};
  document.getElementById(m[S.type]).classList.add('active');
}
function renderRoleButtons(){
  ['rStaff','rManager','rFD'].forEach(id=>{const b=document.getElementById(id);if(b)b.className='btn btn-out btn-sm';});
  const m={staff:'rStaff',manager:'rManager',frontdesk:'rFD'};
  const b=document.getElementById(m[S.role]);if(b)b.className='btn btn-blue btn-sm';
}
function renderStepper(){
  const L=['Client','Service','Preferences','Slots','Review'];
  document.getElementById('stepper').innerHTML=L.map((l,i)=>{
    const n=i+1,st=S.success?'done':n<S.step?'done':n===S.step?'act':'fut',ic=st==='done'?'&#10003;':n;
    return`<div class="s-item"><div class="s-dot ${st}">${ic}</div><span class="s-lbl ${st}">${l}</span>${n<5?'<div class="s-line"></div>':''}</div>`;
  }).join('');
}
function renderParticipantTabs(){
  const el=document.getElementById('participantTabs');
  if(S.participants.length<2||S.step>2||S.success){el.innerHTML='';return;}
  el.innerHTML=`<div class="px-tabs">${S.participants.map((p,i)=>`<button class="px-tab ${i===S.activePIdx?'act':''}" onclick="switchActivePx(${i})">${p.client.nm}</button>`).join('')}
    <button class="btn btn-out btn-sm" style="margin-left:auto;color:var(--danger);border-color:#fecaca" onclick="removeParticipant(${S.participants.length-1})">Remove ${S.participants[S.participants.length-1].client.nm}</button></div>`;
}
function renderQueuePanel(){
  const el=document.getElementById('queuePanel');
  const show=(S.step===3||S.step===4||S.step===5)&&!S.success&&S.queue.length>1;
  if(!show){el.style.display='none';return;}
  el.style.display='block';
  const rows=S.queue.map((it,i)=>{
    const p=S.participants[it.pIdx],sv=p.services[it.sIdx];
    const svcCount=p.services.length;
    return{i,label:`${p.client.nm} — ${sv.svcNm} (${it.sIdx+1} of ${svcCount})`,done:sv.slot!=null||sv.waitlist};
  });
  const now=rows[S.queuePos];
  const next=rows.filter((r,i)=>i>S.queuePos);
  const done=rows.filter((r,i)=>i<S.queuePos);
  el.innerHTML=`<div class="qp-title">Schedule Queue</div>
    <div class="qp-h">Now Scheduling</div>
    ${now?`<div class="qp-now"><span class="qp-dot"></span>${now.label}</div>`:'<div class="qp-empty">—</div>'}
    <div class="qp-h">Up Next</div>
    ${next.length?next.map(r=>`<button class="qp-next" onclick="jumpQueue(${r.i})"><span class="qp-ring"></span>${r.label}</button>`).join(''):'<div class="qp-empty">Nothing queued</div>'}
    <div class="qp-h">Done</div>
    ${done.length?done.map(r=>`<div class="qp-done-row"><span class="qp-check">&#10003;</span>${r.label}</div>`).join(''):'<div class="qp-empty">(none yet)</div>'}`;
}
function renderStepsArea(){
  let h='';
  if(S.success){h=successBlock();document.getElementById('stepsArea').innerHTML=h;return;}
  if(S.step>1)h+=collapse1();
  if(S.step>2)h+=collapse2();
  if(S.step===5){h+=collapseQueueSummary();h+=step5();}
  else if(S.step===4){h+=queueDoneSummary();h+=step4();}
  else if(S.step===3){h+=queueDoneSummary();h+=step3();}
  else if(S.step===2)h+=step2();
  else h+=step1();
  document.getElementById('stepsArea').innerHTML=h;
}
function queueDoneSummary(){
  if(S.queue.length<2||S.queuePos===0)return'';
  const done=S.queue.slice(0,S.queuePos).map(it=>{const p=S.participants[it.pIdx],sv=p.services[it.sIdx];return`${p.client.nm} — ${sv.svcNm} scheduled`;});
  return`<div class="collapsed"><div class="chk-c">&#10003;</div><span class="coll-txt">${done.join(' · ')}</span></div>`;
}
function collapseQueueSummary(){
  if(!S.queue.length)return'';
  const items=S.queue.map(it=>{const p=S.participants[it.pIdx],sv=p.services[it.sIdx];const s=sv.slot?findSlot(sv.slot):null;return`${p.client.nm} — ${sv.svcNm}${s?` (${DD[s.day]}, ${s.time})`:sv.waitlist?' (waitlisted)':''}`;});
  return`<div class="collapsed"><div class="chk-c">&#10003;</div><span class="coll-txt">Preferences &amp; Slots — ${items.join(' · ')}</span><button class="edit-btn" onclick="editQueueFromStart()">Edit</button></div>`;
}
function collapse1(){
  const names=S.participants.map(p=>p.client.nm).join(' + ');
  return`<div class="collapsed"><div class="chk-c">&#10003;</div><span class="coll-txt">Step 1 — ${names}</span><button class="edit-btn" onclick="editStep(1)">Edit</button></div>`;
}
function collapse2(){
  const desc=S.participants.map(p=>`${p.client.nm}: ${sortDryWet(p.services).map(s=>s.svcNm).join(', ')||'no service'}`).join(' · ');
  return`<div class="collapsed"><div class="chk-c">&#10003;</div><span class="coll-txt">Step 2 — ${desc}</span><button class="edit-btn" onclick="editStep(2)">Edit</button></div>`;
}

/* ---------- Step 1 ---------- */
function step1(){
  const q=(document.getElementById('cSrch')||{}).value||'';
  const qn=q.trim().toLowerCase();
  const already=S.participants.map(p=>p.client.id);
  const fc=qn.length<2?CL.filter(c=>!already.includes(c.id)):CL.filter(c=>!already.includes(c.id)&&(c.nm.toLowerCase().includes(qn)||c.email.toLowerCase().includes(qn)||c.phone.toLowerCase().includes(qn)||c.cid.toLowerCase().includes(qn)));
  const primary=S.participants[0];
  return`<div class="card"><div class="card-hd"><h3>Step 1 — Select Client</h3></div><div class="card-bd">
  <input class="s-input" id="cSrch" placeholder="Search by name, email, phone, or ID…" oninput="render()" value="${q.replace(/"/g,'&quot;')}" autocomplete="off">
  ${qn.length>0&&qn.length<2?'<p style="color:var(--text-secondary);font-size:.78rem;margin-top:8px">Type at least 2 characters to search.</p>':''}
  ${qn.length>=2&&fc.length===0?'<p style="color:var(--text-secondary);font-size:.78rem;margin-top:10px;font-style:italic">No clients found. Check spelling or try a different identifier.</p>':''}
  ${fc.map(c=>`<div class="cl-row ${primary&&primary.client.id===c.id?'sel':''}" onclick="selC('${c.id}')">
    <div class="cl-radio ${primary&&primary.client.id===c.id?'on':''}"></div>
    <div style="flex:1"><div style="font-size:.875rem;font-weight:700">${c.nm}</div><div style="font-size:.775rem;color:var(--text-secondary);margin-top:2px">${c.rel}</div>
      <div style="margin-top:3px"><span class="chip ${c.fs==='RCEB Pending'?'c-warn':'c-info'}">${c.fund} · ${c.fs}</span>${c.mu>0?`<span class="chip c-ok" style="margin-left:4px">${c.mu} Make-Up</span>`:''}</div>
    </div><div style="font-size:.78rem;font-weight:700;color:var(--info-dark);white-space:nowrap">Balance: ${c.bal}</div>
  </div>`).join('')}
  ${!primary?'':`<button class="add-px-btn" style="margin-top:12px" onclick="addSecondParticipant()" ${S.participants.length>1?'disabled':''}><span class="ms" style="font-size:16px">group_add</span> + Add a second participant</button>`}
  ${primary?ctx(primary.client):''}
  </div></div>`;
}
function ctx(p){
  const c=p.client;
  const rows=[
    ['Service',c.fund==='Regional Center'||c.fund==='Voucher'||c.fund==='Self Pay'?(SERVICE_CATALOG[c.id]?sortDryWet(SERVICE_CATALOG[c.id]).map(s=>s.nm).join(', '):'—'):'—'],
    ['Level',c.lvl],
    ['Package',c.pkg],
    ['Credits (Balance)',`__BAL__${c.bal}`],
    ['Make-Up Tokens',muDetailStr(c)],
    ['Funding Status',`${c.fund} <span class="chip ${c.fs==='RCEB Pending'?'c-warn':'c-ok'}">${c.fs}</span>`],
    ['Voucher / Authorization',c.voucher],
    ['Assessment',c.assess],
    ['Restrictions',c.rest],
    ['Labels',c.labels.length?c.labels.map(l=>`<span class="chip c-muted">${l}</span>`).join(' '):'—'],
    ['Client Notes',`&ldquo;${c.notes}&rdquo;`]
  ];
  return`<div class="ctx-panel">${rows.map(([l,v])=>`<div class="ctx-row"><div class="ctx-lbl">${l}</div><div class="ctx-val${v.toString().startsWith('__BAL__')?' bal':''}">${v.toString().startsWith('__BAL__')?`Balance: ${v.slice(6)}`:v}</div></div>`).join('')}</div>`;
}

/* ---------- Step 2 ---------- */
function step2(){
  const p=S.participants[S.activePIdx];
  if(!p)return'';
  const c=p.client;
  if(S.type==='semi')return step2Semi(p);

function entitlementBlock(p){

function makeUpRules(c){

  </div>`;
}
function sessionLengthBlock(p){

  const mk=MARKET[sv.id];if(!mk)return'';

        <button class="btn btn-blue btn-sm" style="margin-top:8px" ${blockDisabled?'disabled':''} onclick="selectMarket(${S.activePIdx},'${sv.id}','block')">Select Block</button>
        ${blockDisabled?`<div class="mkt-disable-reason">${scheduledCount} classes already scheduled — this pack covers only ${mk.block.units}. Remove a class first to switch.</div>`:''}
      </div>

        <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;color:var(--text-secondary)">Subscription</div>
        <div style="font-weight:700;margin-top:4px">${mk.sub.nm}</div>
        <div style="font-size:.78rem;color:var(--text-secondary)">${mk.sub.units}</div>
        ${hasMembership?`<div class="mkt-price">Member price: ${fmtMoney(mk.sub.member)}/mo</div><div class="mkt-std">Standard: ${fmtMoney(mk.sub.standard)}/mo</div>`:`<div class="mkt-price">${fmtMoney(mk.sub.standard)}/mo</div>`}
        <button class="btn btn-blue btn-sm" style="margin-top:8px" onclick="selectMarket(${S.activePIdx},'${sv.id}','sub')">Select Subscription</button>
      </div>
    </div>
    <p class="req-note">A membership would also cover this for less overall — <span style="color:var(--info);cursor:pointer" onclick="toast('Membership options are out of scope for this prototype')">See Membership Options</span></p>
  </div>`;
}
function queueCountFor(pIdx,svcId){
  return S.queue.filter(it=>it.pIdx===pIdx&&S.participants[pIdx].services[it.sIdx]&&S.participants[pIdx].services[it.sIdx].svcId===svcId&&S.participants[pIdx].services[it.sIdx].slot).length;
}
function toggleMarket(pIdx,svcId){S.marketOpenFor=(S.marketOpenFor===`${pIdx}:${svcId}`)?null:`${pIdx}:${svcId}`;render();}
function selectMarket(pIdx,svcId,kind){
  const mk=MARKET[svcId];const item=kind==='block'?mk.block:mk.sub;
  const c=S.participants[pIdx].client;
  const hasMembership=c.membership===mk.membershipNeeded;
  const price=hasMembership?item.member:item.standard;
  const p=S.participants[pIdx];p.purchases=p.purchases||{};
  p.purchases[svcId]={kind,nm:item.nm,price};
  S.marketOpenFor=null;
  toast(`${item.nm} added — provisional units granted. Marked "Buying".`);
  render();
}
function removePurchase(pIdx,svcId){
  const p=S.participants[pIdx];
  const svItem=p.services.find(s=>s.svcId===svcId);
  const scheduled=svItem&&svItem.slot?1:0;
  if(scheduled>0){
    const slot=findSlot(svItem.slot);
    const ok=confirm(`Removing this purchase will drop ${scheduled} scheduled class(es): ${slot?DD[slot.day]+' '+slot.time:'(scheduled session)'}. Continue?`);
    if(!ok)return;
    p.services=p.services.filter(s=>s.svcId!==svcId);
    S.queue=S.queue.filter(it=>!(it.pIdx===pIdx&&S.participants[pIdx].services.indexOf===undefined));
    rebuildQueuePreserving();
  }
  delete p.purchases[svcId];
  render();
}
function rebuildQueuePreserving(){
  const oldQueue=S.queue;const newQueue=[];
  S.participants.forEach((p,pIdx)=>{p.services.forEach((sv,sIdx)=>newQueue.push({pIdx,sIdx}));});
  S.queue=newQueue;
  if(S.queuePos>=S.queue.length)S.queuePos=Math.max(0,S.queue.length-1);
}

    ${gen.stopReason?`<br>${gen.stopReason}`:''}
  </div>
  ${rc&&ps?`<div class="banner b-info"><strong>&#8505; </strong>Sessions after the first will appear on the calendar as Tentative until Regional Center authorization is confirmed. Nothing is reserved for those dates yet.</div>`:''}
  </div></div>`;
}
function clearDays(){curSvc().days=[];render();}

function setTime(d,which,val){const sv=curSvc();sv.times[d]=sv.times[d]||{from:'6:00 AM',to:'8:00 PM'};sv.times[d][which]=val;render();}

/* ---------- Step 4 ---------- */
function step4(){
  const item=curItem();if(!item)return'';
  const p=S.participants[item.pIdx],sv=p.services[item.sIdx];
  const c=p.client;
  const cc=S.role!=='frontdesk';
  let pool=slotPool().slice();
  if(sv.source==='makeup'){
    const thru=new Date(TODAY);thru.setDate(thru.getDate()+HORIZON_DAYS);
    pool=pool.filter(s=>new Date(s.date+'T00:00:00')<=thru);

  const chosenDays=AD.filter(d=>sv.days.includes(d));

  const m=matchInstructors(c,sv.days);
  return`<div class="card"><div class="card-hd"><h3>Step 4 — Available Slots</h3></div><div class="card-bd">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <span style="font-size:.85rem"><strong>${total} slots found</strong> · ${sv.svcNm} · ${c.lvl} · ${chosenDays.join(', ')||'no days selected'} (from Step 3)</span>
    ${cc?`<button class="btn btn-out btn-sm" onclick="openDrawer()"><span class="ms" style="font-size:15px">add</span> Create New Class Slot</button>`:''}
  </div>
  ${chosenDays.length===0?'<p class="no-slots">Select at least one day in Step 3 to see slots.</p>':''}
  ${dayGroups.map(g=>{

      return`<div class="dg-lbl">${g.d} ${DD[g.d]}</div><div class="instr-empty">No instructor matches every requirement for ${DD[g.d]}.
        <div class="dim-list"><span class="dim-ok">&#10003; Location</span><span class="dim-ok">&#10003; Service</span><span class="dim-ok">&#10003; Level</span><span class="dim-ok">&#10003; Qualification</span>
        <span class="${m.availFailed?'dim-bad':'dim-ok'}">${m.availFailed?'✗':'✓'} Availability</span><span class="${m.restrictFailed?'dim-bad':'dim-ok'}">${m.restrictFailed?'✗':'✓'} Restrictions</span></div>

    }
    if(!g.slots.length)return`<div class="dg-lbl">${g.d} ${DD[g.d]}</div><p class="no-slots">No slots match your preferences for ${g.d} ${DD[g.d]}.</p>`;
    return`<div class="dg-lbl">${g.d} ${DD[g.d]}</div><div class="slots-row">${g.slots.map(s=>sCard(s,p,sv)).join('')}</div>`;
  }).join('')}
  </div></div>`;

function overlapCheck(p,sv,slot){
  for(const other of p.services){
    if(other===sv||!other.slot)continue;
    const os=findSlot(other.slot)|| (S.type==='group'?SG:S.type==='semi'?SS:SP).find(x=>x.id===other.slot);
    if(!os||os.date!==slot.date)continue;
    const overlap=slot.start<os.end&&os.start<slot.end;
    if(overlap)return{blocked:true,msg:`Overlaps your ${other.svcNm} session on ${DD[slot.day]}, ${os.time}.`};
    const backToBack=slot.start===os.end||os.start===slot.end;
    if(backToBack&&other.wet!==sv.wet)return{blocked:false,note:`Note: this follows straight after a ${other.svcNm} (${other.wet?'wet':'dry'}) session — you may want a change of clothes break.`};
  }
  return null;
}
function sCard(s,p,sv){
  const sel=sv.slot===s.id;
  const inst=INSTRUCTORS[s.inst].nm;
  const ov=overlapCheck(p,sv,s);
  const overlapBlocked=ov&&ov.blocked;
  if(S.type==='group'){
    const pct=Math.round(s.spots/s.cap*100),fc=pct<60?'low':pct<100?'med':'full',full=s.spots>=s.cap;
    const existingRes=(S.slotReservations[s.id]||[]).filter(pi=>pi!==p===false);

function jointBlocked(slotId,pIdx){
  const s=findSlot(slotId);if(!s||S.type!=='group')return null;
  const open=s.cap-s.spots;
  const reservedOthers=(S.slotReservations[slotId]||[]).filter(pi=>pi!==pIdx).length;
  if(reservedOthers+1>open){
    return`Only ${open} spot${open===1?'':'s'} left in this class — ${reservedOthers+1} participants need a spot here. Move one participant to a different slot, or join the waitlist for the second.`;
  }
  return null;
}
function chooseSlot(slotId,waitlisted){
  const item=curItem();const p=S.participants[item.pIdx],sv=p.services[item.sIdx];
  const ov=overlapCheck(p,sv,findSlot(slotId));
  if(ov&&ov.blocked){toast(ov.msg);return;}
  if(!waitlisted){
    const block=jointBlocked(slotId,item.pIdx);
    if(block){S.blockedMsg={slot:slotId,msg:block};render();return;}
  }
  S.blockedMsg=null;
  sv.slot=slotId;sv.waitlist=waitlisted;
  S.slotReservations[slotId]=S.slotReservations[slotId]||[];
  if(!S.slotReservations[slotId].includes(item.pIdx))S.slotReservations[slotId].push(item.pIdx);
  advanceQueue();
}
function selS(id){ // click on card body selects without booking (semi/private convenience) — routes to Book
  chooseSlot(id,false);
}
function advanceQueue(){
  if(S.queuePos<S.queue.length-1){S.queuePos++;S.step=3;}
  else{S.step=5;}
  render();
}
function jumpQueue(i){S.queuePos=i;S.step=3;render();}

/* ---------- Step 5 ---------- */
function resolveOutcome(item){
  const p=S.participants[item.pIdx],sv=p.services[item.sIdx],c=p.client;
  if(sv.waitlist)return'WAITLISTED';
  if(c.paymentIssue&&c.fund==='Self Pay')return'PAYMENT_HOLD';
  if(c.fund==='Regional Center'&&(S.type==='private'||S.type==='semi')&&sv.rec==='once')return'AUTHORIZATION_HOLD';
  if(S.type==='semi'){const roster=sv.roster||[c.id];if(roster.length<POLICY.requiredParticipants)return'PENDING_PARTNER';}
  return'CONFIRMED';
}
function entitlementLabel(sv,outcome){
  if(outcome==='WAITLISTED')return'No credit reserved — credit reserved only when promoted off waitlist.';
  if(sv.source==='makeup')return'Make-Up token — 1 consumed on confirm. 0 remaining.';
  if(sv.source==='voucher')return'Voucher unit — reserve 1 unit on confirm.';
  return'Package credit — reserve 1 session on confirm ("1 session reserved — not used yet").';
}
function step5(){
  const item=S.queue[0];if(!item)return'';
  const p=S.participants[item.pIdx],sv=p.services[item.sIdx],c=p.client;
  S.outcome=resolveOutcome(item);
  const meta=OUTCOME_META[S.outcome];
  const s=sv.slot?findSlot(sv.slot):null;
  const rc=c.fund==='Regional Center',ps=S.type!=='group';
  const rows=[

    ['Date / Time',s?`${DD[s.day]} · ${s.time}`:'—'],
    ['Location',s?`Solar Swim · ${s.loc}`:'—'],
    ['Recurrence',recurrenceLabel(sv)],
    ['Funding',c.fund],
    ['Entitlement',entitlementLabel(sv,S.outcome)],
    ['Status',`${S.outcome} — "${meta.line}"`]
  ];
  const multiRows=S.queue.length>1?S.queue.map(it=>{
    const pp=S.participants[it.pIdx],ss=pp.services[it.sIdx],slt=ss.slot?findSlot(ss.slot):null;

    return`${pp.client.nm} — ${ss.svcNm} (${slt?`${DD[slt.day]} ${slt.time}`:ss.waitlist?'Waitlisted':'—'}) — ${buying?`Buying (${buying.nm}, provisional)`:entitlementLabel(ss,resolveOutcome(it)).split(' —')[0]}`;
  }).join('<br>'):'';
  const purchaseRows=[];
  S.participants.forEach(pp=>{Object.values(pp.purchases||{}).forEach(pu=>purchaseRows.push(`${pu.nm} — ${pp.client.nm} — ${fmtMoney(pu.price)}`));});
  return`<div class="card"><div class="card-hd"><h3>Step 5 — Review &amp; Confirm</h3></div><div class="card-bd">
  <div class="out-banner ${meta.bannerClass}"><div class="out-t">${S.outcome}</div><div class="out-s">${meta.line}</div></div>
  <div class="sec-lbl">Booking Details</div>
  <div class="rev-grid">${rows.map(([l,v])=>`<div class="rev-row"><div class="rl">${l}</div><div class="rv">${v}</div></div>`).join('')}</div>
  ${S.queue.length>1?`<div class="sec-lbl">Multi-Participant / Multi-Service Summary</div><div class="rev-grid"><div class="rev-row" style="grid-template-columns:1fr"><div class="rv" style="grid-column:1/-1">${multiRows}</div></div></div>`:''}
  ${purchaseRows.length?`<div class="sec-lbl">Marketplace Purchases</div><div class="rev-grid"><div class="rev-row" style="grid-template-columns:1fr"><div class="rv">${purchaseRows.join('<br>')}</div></div></div><div style="font-size:.78rem;font-weight:700">Marketplace total this booking: ${fmtMoney(marketplaceTotal())}</div>`:''}
  ${S.overridesApplied.length?`<div class="sec-lbl">Overrides Applied</div><div class="rev-grid"><div class="rev-row" style="grid-template-columns:1fr"><div class="rv">${S.overridesApplied.map(o=>o.text).join('<br>')}</div></div></div>`:''}
  ${rc&&ps?`<div class="banner b-info"><strong>&#8505; </strong>Sessions after the first will appear on the calendar as Tentative until RC authorization is confirmed. Nothing is reserved for those dates yet.</div>`:''}
  ${S.role==='manager'?`<div class="sec-lbl" style="margin-top:14px">Manager Only</div>
    <button class="btn btn-out btn-amber" onclick="toggleFundingPanel()">Funding Override</button>
    ${S.fundingPanelOpen?fundingPanel():''}`:''}
  </div></div>`;
}
function recurrenceLabel(sv){
  const gen=generateDates(sv.days,sv.rec,curClientBal(),sv.searchThrough);
  const labels={credits:'Until Credits Used',weeks:'Next N Weeks',date:'Until End Date',once:'One Time Only'};
  return`${labels[sv.rec]} (${sv.days.join(' / ')||'no days'}) — ${gen.dates.length} date${gen.dates.length===1?'':'s'}${gen.skipped.length?`, ${gen.skipped.length} closure skipped (see Step 3)`:''}`;
}

function createAndSearchWaitlist(){
  const d=S.drawer;
  const wd=new Date(d.date+'T00:00:00');
  const dayName=Object.keys(DAY_JS).find(k=>DAY_JS[k]===wd.getDay())||'MON';
  const hh=parseInt(d.time.split(':')[0],10),mm=parseInt(d.time.split(':')[1],10);
  const start=hh*60+mm,dur=parseInt(d.dur,10),end=start+dur;
  const timeStr=formatTimeRange(start,end);
  const newSlot={id:'newslot'+Date.now(),day:dayName,date:d.date,time:timeStr,start,end,inst:d.inst,loc:d.resource,spots:0,cap:parseInt(d.cap||8,10),len:dur};
  const pool=d.ctype==='Group'?SG:d.ctype==='Semi-Private'?SS:SP;
  if(d.ctype==='Semi-Private')newSlot.roster=0;
  pool.push(newSlot);
  S.drawer.newSlotId=newSlot.id;
  S.drawer.created={svc:`${d.ctype} ${d.svc}`,level:d.level,date:fmtDateLong(d.date),time:timeStr,resource:d.resource};
  S.drawer.mode='waitlist';
  toast('Class created — confirmed immediately, no minimum enrolment (D2). Searching waitlist…');
  render();
}
function formatTimeRange(start,end){
  function fmt(m){let h=Math.floor(m/60),mi=m%60;const ap=h>=12?'PM':'AM';h=h%12;if(h===0)h=12;return `${h}:${mi.toString().padStart(2,'0')} ${ap}`;}
  return `${fmt(start)}–${fmt(end)}`;
}
function pullIn(nm){S.drawer.pulled.push(nm);toast(`${nm} ran through eligibility checks — added, confirmed.`);render();}
function closeSelectSlot(){
  const item=curItem();
  if(item){
    const p=S.participants[item.pIdx],sv=p.services[item.sIdx];
    sv.slot=S.drawer.newSlotId;sv.waitlist=false;
  }
  S.drawer.open=false;S.drawer.mode='form';
  advanceQueue();
}

/* ---------- Participants / clients ---------- */
function newParticipant(client){return{client,services:[],purchases:{}};}
function selC(id){
  const c=CLIENTS[id];
  if(S.participants.length===0)S.participants.push(newParticipant(c));
  else S.participants[0]=newParticipant(c);
  S.activePIdx=0;render();
}
function addSecondParticipant(){
  if(S.participants.length<1){toast('Select a primary client first.');return;}
  if(S.participants.length>1)return;
  document.getElementById('cSrch')&&(document.getElementById('cSrch').value='');
  S.addingSecond=true;
  const remaining=CL.filter(c=>c.id!==S.participants[0].client.id);
  const nm=remaining[1]||remaining[0];
  S.participants.push(newParticipant(nm));
  toast(`${nm.nm} added as second participant. Use the tabs in Step 2 to schedule independently.`);
  render();
}
function removeParticipant(i){
  const nm=S.participants[i].client.nm;
  const hasScheduled=S.participants[i].services.some(s=>s.slot);
  if(hasScheduled){
    const ok=confirm(`${nm} has scheduled classes. Removing will drop them. Continue?`);
    if(!ok)return;
  }
  S.participants.splice(i,1);
  S.activePIdx=0;
  rebuildQueuePreserving();
  render();
}
function switchActivePx(i){S.activePIdx=i;render();}

/* ---------- Step 2 handlers ---------- */
function toggleSvc(pIdx,svcId){
  const p=S.participants[pIdx];
  const cat=catalogFor(p.client.id).find(s=>s.id===svcId);
  const idx=p.services.findIndex(s=>s.svcId===svcId);
  if(idx>=0){p.services.splice(idx,1);}
  else{
    if(p.services.length>=3){toast('Up to 3 services per participant.');return;}
    p.services.push({svcId,svcNm:cat.nm,wet:cat.wet,source:null,instr:'any',days:['MON','WED'],times:{},rec:'credits',searchThrough:'2026-09-30',slot:null,waitlist:false,length:60});
  }
  render();
}
function setSource(pIdx,svcId,src){const sv=S.participants[pIdx].services.find(s=>s.svcId===svcId);if(sv)sv.source=src;render();}
function setInstrPref(v){const p=S.participants[S.activePIdx];p.services.forEach(s=>s.instr=v);render();}
function setLength(len){
  const p=S.participants[S.activePIdx];
  const anyPicked=p.services.some(s=>s.slot);
  if(anyPicked){
    const n=p.services.filter(s=>s.slot).length;
    const ok=confirm(`Changing session length will clear your ${n} selected session(s). Continue?`);
    if(!ok)return;
    p.services.forEach(s=>{s.slot=null;s.waitlist=false;});
  }
  p.length=len;render();
}
function togSemiSearch(){S.semiSearchOpen=!S.semiSearchOpen;render();}
function paxRes(q){
  const el=document.getElementById('pDD');if(!el)return;
  if(!q||q.trim().length<2){el.innerHTML='';return;}
  const p=S.participants[S.activePIdx];
  const sv=p.services[0];
  const roster=sv.roster||[p.client.id];
  const res=CL.filter(c=>!roster.includes(c.id)&&(c.nm.toLowerCase().includes(q.toLowerCase())||c.email.toLowerCase().includes(q.toLowerCase())||c.phone.includes(q))).slice(0,5);
  el.innerHTML=res.map(c=>{const ok=c.lvl===p.client.lvl;return`<div class="px-res" onclick="addSemiPax('${c.id}')"><div><div style="font-size:.85rem;font-weight:700">${c.nm}</div><div style="font-size:.72rem;color:var(--text-secondary)">${c.lvl}</div></div><span class="chip ${ok?'c-ok':'c-danger'}">${ok?'✓ Eligible':'✗ Level mismatch'}</span></div>`;}).join('')||'<div style="padding:9px 13px;font-size:.78rem;color:var(--text-secondary)">No results</div>';
}
function addSemiPax(id){
  const p=S.participants[S.activePIdx];const sv=p.services[0];
  sv.roster=sv.roster||[p.client.id];
  if(!sv.roster.includes(id))sv.roster.push(id);
  S.semiSearchOpen=false;render();
}
function remSemiPax(id){const p=S.participants[S.activePIdx];const sv=p.services[0];sv.roster=(sv.roster||[]).filter(x=>x!==id);render();}

/* ---------- Navigation ---------- */
function switchType(t){
  if(S.step>1){
    const ok=confirm('Switching type resets your slot selection. Continue?');
    if(!ok)return;
  }
  S.type=t;S.step=Math.min(S.step,2);S.queue=[];S.queuePos=0;S.slotReservations={};S.marketOpenFor=null;
  S.participants.forEach(p=>{p.services=[];});
  render();
}
function setRole(r){S.role=r;render();}
function goNext(){
  if(S.step===1){S.step=2;render();return;}
  if(S.step===2){
    if(S.participants.length>1&&S.activePIdx===0){S.activePIdx=1;render();return;} // ensure 2nd participant also configures services
    buildQueueAndAdvance();return;
  }
  if(S.step===5){confirmBooking();return;}
  S.step=Math.min(5,S.step+1);render();
}
function buildQueueAndAdvance(){
  S.queue=[];
  S.participants.forEach((p,pIdx)=>{p.services.forEach((sv,sIdx)=>S.queue.push({pIdx,sIdx}));});
  if(!S.queue.length){toast('Select at least one service.');return;}
  S.queuePos=0;S.step=3;render();
}
function goBack(){
  if(S.step===3&&S.queuePos>0){S.queuePos--;S.step=4;render();return;}
  if(S.step===5){S.step=4;render();return;}
  S.step=Math.max(1,S.step-1);render();
}
function editStep(n){S.step=n;render();}
function editQueueFromStart(){S.queuePos=0;S.step=3;render();}
function confirmBooking(){S.success=true;render();}
function bookAgain(){
  S={role:S.role,type:'group',step:1,success:false,outcome:null,participants:[],activePIdx:0,queue:[],queuePos:0,fundingPanelOpen:false,overridesApplied:[],slotReservations:{},marketOpenFor:null,drawer:{open:false,mode:'form',svc:'Swim',ctype:'Group',level:'Beginner 2',inst:'mt',date:'2026-09-17',time:'16:00',dur:'60',cap:8,resource:'Pool Lane 4',notes:'',pulled:[],created:null}};
  ['tabGroup','tabSemi','tabPrivate'].forEach(id=>document.getElementById(id).classList.remove('active'));
  render();
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._toastT);window._toastT=setTimeout(()=>t.classList.remove('show'),3200);}

render();
</script>
</body>
</html>
