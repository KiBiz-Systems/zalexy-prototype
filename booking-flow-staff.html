<!--
  Zalexy Prototype — Staff / Manager / Front Desk Booking Flow
  Spec:   ai-workspace/prototypes/staff/booking-flow.md
  Design: ai-workspace/prototypes/_shared/design-system.md
  Static prototype. Not production code. No app dependencies.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Zalexy — New Booking (Staff)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root{--primary:#334155;--primary-dark:#1e293b;--secondary:#10b981;--secondary-dark:#059669;--success:#10b981;--success-bg:#d1fae5;--success-dark:#047857;--info:#3b82f6;--info-bg:#eff6ff;--info-dark:#1d4ed8;--info-hover:#2563eb;--bg-default:#f8fafc;--bg-paper:#fff;--text-primary:#0f172a;--text-secondary:#64748b;--border:#f1f5f9;--border-input:#cbd5e1;--border-input-hover:#94a3b8;--hover-row:#f1f5f9;--danger:#ef4444;--warning:#f59e0b;--radius-card:10px;--radius-base:8px;--radius-control:6px;--shadow-card:0 2px 4px rgba(0,0,0,0.02),0 1px 2px rgba(0,0,0,0.03)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg-default);color:var(--text-primary);font-size:14px;height:100vh;overflow:hidden}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:18px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;vertical-align:middle}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;flex-shrink:0;background:var(--primary-dark);display:flex;flex-direction:column}
.sb-logo{height:58px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,0.07)}
.sb-badge{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#10b981);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.sb-logo strong{color:#f8fafc;font-size:16px;font-weight:700}
.sb-nav{flex:1;overflow-y:auto;padding:10px 8px}
.sb-section{font-size:.68rem;font-weight:700;color:rgba(248,250,252,.35);text-transform:uppercase;letter-spacing:.08em;padding:10px 12px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:7px;color:rgba(248,250,252,.65);font-size:.85rem;font-weight:500;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;margin-bottom:1px;transition:background 120ms}
.nav-item:hover{background:rgba(255,255,255,.06);color:#f8fafc}
.nav-item.active{background:rgba(59,130,246,.2);color:#93c5fd}
.main-shell{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;padding:0 20px;gap:10px;flex-shrink:0}
.loc-pill{display:flex;align-items:center;gap:5px;font-size:.825rem;font-weight:600;color:var(--text-secondary);background:var(--bg-default);border:1px solid var(--border-input);border-radius:6px;padding:5px 10px}
.main-area{flex:1;overflow-y:auto;background:var(--bg-default)}
.page-wrap{max-width:900px;margin:0 auto;padding:22px 22px 130px}
.breadcrumb{font-size:.72rem;color:var(--text-secondary);margin-bottom:4px}
.page-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.page-title{font-size:1.4rem;font-weight:700;letter-spacing:-.02em}
.page-sub{font-size:.825rem;color:var(--text-secondary);margin-top:2px}
.role-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;padding:8px 12px;background:#fff;border-radius:8px;border:1px solid var(--border)}
.role-lbl{font-size:.72rem;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.type-tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:7px;margin-bottom:12px;position:sticky;top:0;z-index:20;box-shadow:var(--shadow-card)}
.t-tab{flex:1;padding:8px 14px;border-radius:7px;font-size:.85rem;font-weight:600;border:1.5px solid var(--border-input);background:transparent;color:var(--text-secondary);transition:all 140ms;cursor:pointer}
.t-tab.active{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark)}
.stepper{display:flex;align-items:center;background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:12px 18px;margin-bottom:16px;position:sticky;top:56px;z-index:19;box-shadow:var(--shadow-card)}
.s-item{display:flex;align-items:center;gap:7px;flex:1}
.s-item:last-child{flex:0 0 auto}
.s-dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;flex-shrink:0;transition:all 200ms}
.s-dot.done{background:var(--success-bg);color:var(--success-dark)}
.s-dot.act{background:var(--info);color:#fff}
.s-dot.fut{background:#e2e8f0;color:var(--text-secondary)}
.s-lbl{font-size:.77rem;font-weight:600;white-space:nowrap}
.s-lbl.done{color:var(--success-dark)}.s-lbl.act{color:var(--text-primary)}.s-lbl.fut{color:var(--text-secondary)}
.s-line{flex:1;height:1px;background:var(--border);margin:0 6px}
.card{background:#fff;border-radius:var(--radius-card);box-shadow:var(--shadow-card);margin-bottom:10px;overflow:hidden}
.card-hd{padding:14px 18px;border-bottom:1px solid var(--border)}
.card-hd h3{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary)}
.card-bd{padding:18px}
.collapsed{display:flex;align-items:center;background:#fff;border:1px solid var(--border);border-radius:8px;padding:11px 15px;margin-bottom:8px;gap:10px}
.chk-c{width:20px;height:20px;border-radius:50%;background:var(--success-bg);display:grid;place-items:center;flex-shrink:0;font-size:11px;color:var(--success-dark);font-weight:700}
.coll-txt{flex:1;font-size:.85rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edit-btn{background:none;border:none;color:var(--info);font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap}
.s-input{width:100%;border:1px solid var(--border-input);border-radius:6px;padding:8px 12px;font-size:.875rem;background:#fff;outline:none;transition:border-color 140ms}
.s-input:focus{border-color:var(--info);outline:2px solid rgba(59,130,246,.25);outline-offset:1px}
.cl-row{border:1px solid var(--border);border-radius:8px;padding:12px 15px;margin-top:8px;cursor:pointer;transition:all 140ms;display:flex;align-items:center;gap:11px}
.cl-row:hover{background:var(--hover-row);border-color:var(--border-input-hover)}
.cl-row.sel{border:1.5px solid var(--info);background:var(--info-bg)}
.cl-radio{width:17px;height:17px;border-radius:50%;border:2px solid var(--border-input);flex-shrink:0;transition:all 140ms}
.cl-radio.on{background:var(--info);border-color:var(--info);box-shadow:inset 0 0 0 3px #fff}
.ctx-panel{margin-top:14px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.ctx-row{display:grid;grid-template-columns:155px 1fr;border-bottom:1px solid var(--border)}
.ctx-row:last-child{border-bottom:none}
.ctx-lbl{padding:9px 13px;font-size:.72rem;font-weight:600;color:var(--text-secondary);background:var(--bg-default)}
.ctx-val{padding:9px 13px;font-size:.85rem;color:var(--text-primary)}
.ctx-val.bal{font-weight:700;color:var(--info-dark)}
.chip{display:inline-flex;align-items:center;height:21px;border-radius:4px;padding:0 7px;font-size:.7rem;font-weight:600;white-space:nowrap}
.c-ok{background:var(--success-bg);color:var(--success-dark)}.c-info{background:var(--info-bg);color:var(--info-dark)}.c-warn{background:#fef3c7;color:#b45309}.c-danger{background:#fee2e2;color:#b91c1c}.c-muted{background:#f1f5f9;color:var(--text-secondary)}.c-purple{background:#f3e8ff;color:#7c3aed}
.btn{border-radius:6px;padding:7px 14px;font-size:.85rem;font-weight:600;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all 140ms}
.btn-blue{background:var(--info);color:#fff}.btn-blue:hover{background:var(--info-hover)}.btn-blue:disabled{opacity:.4;cursor:not-allowed}
.btn-green{background:var(--secondary);color:#fff}.btn-green:hover{background:var(--secondary-dark)}
.btn-out{background:#fff;color:var(--text-primary);border:1px solid var(--border-input)}.btn-out:hover{border-color:var(--primary);background:var(--hover-row)}
.btn-sm{padding:5px 10px;font-size:.78rem}
.btn-amber{border-color:#fed7aa !important;color:#92400e !important}.btn-amber:hover{background:#fff7ed !important}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px;margin-top:6px}
.svc-card{border:1px solid var(--border);border-radius:10px;padding:14px 12px;cursor:pointer;transition:all 140ms}
.svc-card:hover:not(.inelig){border-color:var(--border-input-hover);background:var(--hover-row)}
.svc-card.sel-svc{border:1.5px solid var(--info);background:var(--info-bg)}
.svc-card.inelig{opacity:.5;cursor:not-allowed}
.px-row{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:10px 13px;margin-bottom:7px}
.px-av{width:30px;height:30px;border-radius:50%;background:var(--info);color:#fff;display:grid;place-items:center;font-size:.7rem;font-weight:700;flex-shrink:0}
.px-av.sec{background:#7c3aed}
.add-px-btn{display:flex;align-items:center;gap:6px;border:1.5px dashed var(--border-input);border-radius:8px;padding:9px 13px;background:transparent;color:var(--text-secondary);font-size:.85rem;font-weight:600;cursor:pointer;width:100%;transition:all 140ms;margin-top:4px}
.add-px-btn:hover{border-color:var(--info);color:var(--info)}
.px-dd-wrap{margin-top:7px;position:relative}
.px-dd{position:absolute;top:calc(100% + 3px);left:0;right:0;background:#fff;border:1px solid var(--border-input);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.1);z-index:50;overflow:hidden}
.px-res{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--border)}
.px-res:last-child{border-bottom:none}.px-res:hover{background:var(--hover-row)}
.day-grid{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.d-row{display:grid;grid-template-columns:44px 1fr 1fr;align-items:center;gap:9px;border-radius:8px;padding:9px 12px}
.d-row.chk{background:#f0fdf4;border:1px solid #bbf7d0}
.d-row.uchk{background:var(--bg-default);border:1px solid var(--border);opacity:.6}
.d-badge{background:var(--primary-dark);color:#fff;border-radius:5px;padding:5px 3px;font-size:.67rem;font-weight:700;text-align:center;line-height:1.3}
.d-label{display:flex;align-items:center;gap:6px;font-size:.85rem;cursor:pointer}
.t-sel{border:1px solid var(--border-input);border-radius:6px;padding:5px 7px;font-size:.78rem;background:#fff}
.rec-pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.rec-p{padding:6px 13px;border-radius:8px;border:1.5px solid var(--border-input);background:transparent;color:var(--text-secondary);font-size:.78rem;font-weight:600;cursor:pointer;transition:all 140ms}
.rec-p.act{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark)}
.banner{border-radius:8px;padding:11px 15px;font-size:.8rem;margin-top:11px}
.b-info{background:var(--info-bg);border:1px solid #bfdbfe;color:#1e40af}
.b-warn{background:#fef3c7;border:1px solid #fde68a;color:#92400e}
.b-ok{background:var(--success-bg);border:1px solid #a7f3d0;color:var(--success-dark)}
.dg-lbl{font-size:.78rem;font-weight:700;color:var(--text-primary);margin:14px 0 7px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.slots-row{display:flex;flex-wrap:wrap;gap:9px}
.no-slots{color:var(--text-secondary);font-size:.78rem;padding:6px 3px;font-style:italic}
.s-card{width:205px;min-height:180px;border:1px solid var(--border);border-radius:10px;padding:11px;cursor:pointer;position:relative;transition:all 140ms;display:flex;flex-direction:column;gap:3px;background:#fff}
.s-card:hover{border-color:var(--border-input-hover);box-shadow:0 2px 8px rgba(0,0,0,.07)}
.s-card.sel-slot{border:1.5px solid var(--info);background:var(--info-bg)}
.s-sel-dot{position:absolute;top:7px;right:7px;width:17px;height:17px;border-radius:50%;border:2px solid var(--border-input);background:#fff;transition:all 140ms}
.s-card.sel-slot .s-sel-dot{background:var(--info);border-color:var(--info);box-shadow:inset 0 0 0 3px #fff}
.cap-bar-w{margin-top:auto;padding-top:5px}
.cap-bar{height:5px;border-radius:3px;background:#e2e8f0;overflow:hidden}
.cap-fill{height:100%;border-radius:3px}
.cap-fill.low{background:var(--success)}.cap-fill.med{background:var(--warning)}.cap-fill.full{background:var(--danger)}
.s-btns{display:flex;gap:5px;margin-top:7px}
.out-banner{border-radius:8px;padding:13px 17px;border-left:4px solid;margin-bottom:14px}
.out-banner.confirmed{background:var(--success-bg);border-left-color:var(--secondary)}
.out-banner.pending{background:#fef3c7;border-left-color:var(--warning)}
.out-banner.waitlisted{background:var(--info-bg);border-left-color:var(--info)}
.out-t{font-size:1rem;font-weight:700}.out-s{font-size:.78rem;margin-top:3px;opacity:.8}
.rev-grid{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:12px}
.rev-row{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--border)}
.rev-row:last-child{border-bottom:none}
.rl{padding:9px 13px;font-size:.72rem;font-weight:600;color:var(--text-secondary);background:var(--bg-default)}
.rv{padding:9px 13px;font-size:.85rem;color:var(--text-primary)}
.ovr-panel{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:15px;margin-top:11px}
.ovr-panel label{display:block;font-size:.72rem;font-weight:600;color:var(--text-secondary);margin-bottom:4px;margin-top:10px}
.ovr-panel select,.ovr-panel textarea,.ovr-panel input{width:100%;border:1px solid var(--border-input);border-radius:6px;padding:7px 10px;font-size:.85rem;background:#fff}
.ovr-panel textarea{resize:vertical;min-height:60px}
.succ-state{text-align:center;padding:56px 22px}
.succ-icon{width:60px;height:60px;border-radius:50%;background:var(--success-bg);display:grid;place-items:center;margin:0 auto 18px;font-size:1.8rem;color:var(--success-dark);font-weight:700}
.succ-t{font-size:1.3rem;font-weight:700;margin-bottom:5px}
.succ-s{font-size:.85rem;color:var(--text-secondary);margin-bottom:20px}
.sf{position:fixed;bottom:0;left:240px;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--border);padding:13px 22px;display:flex;justify-content:space-between;align-items:center;z-index:30}
.sf-r{display:flex;gap:7px}
.drawer{position:fixed;right:0;top:58px;bottom:0;width:460px;background:#fff;border-left:1px solid var(--border);box-shadow:-4px 0 16px rgba(0,0,0,.08);display:flex;flex-direction:column;z-index:50;transform:translateX(100%);transition:transform 240ms ease}
.drawer.open{transform:translateX(0)}
.drw-hd{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.drw-body{flex:1;overflow-y:auto;padding:18px}
.drw-foot{padding:11px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:7px}
.x-btn{background:none;border:none;cursor:pointer;color:var(--text-secondary);padding:4px;border-radius:4px;line-height:1}
.x-btn:hover{background:var(--hover-row)}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:.72rem;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
.fg select,.fg input{width:100%;border:1px solid var(--border-input);border-radius:6px;padding:7px 10px;font-size:.85rem;background:#fff}
.form-r{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;top:75px;right:22px;background:var(--primary-dark);color:#f8fafc;padding:11px 16px;border-radius:8px;font-size:.85rem;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:100;transform:translateY(-8px);opacity:0;transition:all 220ms;pointer-events:none;max-width:320px}
.toast.show{transform:translateY(0);opacity:1}
.divider{height:1px;background:var(--border);margin:14px 0}
.sec-lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);margin:12px 0 7px}
.staff-sec{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="sb-logo"><div class="sb-badge">Z</div><strong>Zalexy</strong></div>
  <nav class="sb-nav">
    <div class="sb-section">Scheduling</div>
    <button class="nav-item" onclick="location.href='calendar-master.html'"><span class="ms">calendar_today</span>Calendar</button>
    <button class="nav-item active"><span class="ms">add_circle</span>New Booking</button>
    <button class="nav-item" data-noop><span class="ms">group</span>Waitlist</button>
    <div class="sb-section">Clients</div>
    <button class="nav-item" data-noop><span class="ms">person</span>Profiles</button>
    <div class="sb-section">Prototypes</div>
    <button class="nav-item active"><span class="ms">edit_calendar</span>Staff Booking</button>
    <button class="nav-item" onclick="location.href='booking-flow-client.html'"><span class="ms">person</span>Client Booking</button>
    <button class="nav-item" onclick="location.href='calendar-master.html'"><span class="ms">grid_on</span>Calendar Master</button>
  </nav>
</aside>
<div class="main-shell">
  <div class="topbar">
    <div class="loc-pill"><span class="ms" style="font-size:15px">location_on</span>Solar Swim (PDT)</div>
    <button class="btn btn-out btn-sm" data-noop>Michael Torres ▾</button>
  </div>
  <main class="main-area">
    <div class="page-wrap">
      <div class="page-h">
        <div>
          <div class="breadcrumb">Scheduling / New Booking</div>
          <h1 class="page-title">New Booking</h1>
          <p class="page-sub">Book a session — Private, Semi-Private, or Group</p>
        </div>
        <button class="btn btn-out" onclick="history.back()">Cancel</button>
      </div>
      <div class="role-row">
        <span class="role-lbl">Demo Role:</span>
        <button class="btn btn-out btn-sm" id="rStaff" onclick="setRole('staff')">Staff</button>
        <button class="btn btn-blue btn-sm" id="rManager" onclick="setRole('manager')">Manager ✓</button>
        <button class="btn btn-out btn-sm" id="rFD" onclick="setRole('frontdesk')">Front Desk</button>
      </div>
      <div class="type-tabs">
        <button class="t-tab active" id="tabGroup" onclick="switchType('group')">Group Classes</button>
        <button class="t-tab" id="tabSemi" onclick="switchType('semi')">Semi-Private</button>
        <button class="t-tab" id="tabPrivate" onclick="switchType('private')">Private</button>
      </div>
      <div class="stepper" id="stepper"></div>
      <div id="stepsArea"></div>
    </div>
  </main>
</div>
</div>

<!-- DRAWER -->
<div class="drawer" id="cDrawer">
  <div class="drw-hd"><span style="font-size:.95rem;font-weight:700">Create New Class Slot</span><button class="x-btn" onclick="closeDrawer()"><span class="ms">close</span></button></div>
  <div class="drw-body">
    <div class="form-r"><div class="fg"><label>Service</label><select><option>Swimming</option><option>Basketball</option><option>Fitness</option></select></div><div class="fg"><label>Class Type</label><select><option>Group</option><option>Semi-Private</option><option>Private</option></select></div></div>
    <div class="form-r"><div class="fg"><label>Level</label><select><option>Beginner 2</option><option>Beginner 1</option><option>Intermediate</option></select></div><div class="fg"><label>Instructor</label><select><option>Michael Torres</option><option>Sarah Chen</option><option>James Wright</option></select></div></div>
    <div class="form-r"><div class="fg"><label>Date</label><input type="date" value="2026-09-14"></div><div class="fg"><label>Start Time</label><input type="time" value="12:30"></div></div>
    <div class="form-r"><div class="fg"><label>Duration</label><select><option>30 min</option><option>45 min</option><option selected>60 min</option><option>90 min</option></select></div><div class="fg"><label>Capacity</label><input type="number" value="8" min="1"></div></div>
    <div class="fg"><label>Resource</label><select><option>Pool Lane 8</option><option>Pool Lane 4</option><option>Pool Lane 10</option></select></div>
    <div class="fg"><label>Notes (optional)</label><textarea style="width:100%;border:1px solid var(--border-input);border-radius:6px;padding:8px 10px;resize:vertical;min-height:56px;font-size:.85rem"></textarea></div>
  </div>
  <div class="drw-foot"><button class="btn btn-out" onclick="closeDrawer()">Cancel</button><button class="btn btn-blue" onclick="createAndSelect()">Create &amp; Select</button></div>
</div>

<!-- FOOTER -->
<div class="sf">
  <div>
    <strong id="sfTitle" style="font-size:.875rem;font-weight:700">Select a client to begin</strong>
    <div id="sfSub" style="font-size:.72rem;color:var(--text-secondary);margin-top:2px">Manager view — override controls available</div>
  </div>
  <div class="sf-r">
    <button class="btn btn-out" id="backBtn" onclick="goBack()" style="display:none">&#8592; Back</button>
    <button class="btn btn-blue" id="nextBtn" onclick="goNext()" disabled>Select Client</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const S={type:'group',role:'manager',step:1,client:null,pax:[],days:['MON','TUE','WED'],rec:'credits',slot:null,ovr:false,paxSearch:false,success:false,wl:false};
const CL=[{id:'mg',nm:'Maria Garcia',rel:'Primary · Caroline Garcia household',lvl:'Swim Beginner 2',fund:'Regional Center',fs:'RCEB Pending',bal:'5 / 8 sessions',mu:1,assess:'Approved',rest:'None',init:'MG'},
  {id:'cg',nm:'Carlos Garcia',rel:'Spouse · Caroline Garcia household',lvl:'Basketball',fund:'Self Pay',fs:'Active',bal:'2 / 4 sessions',mu:0,assess:'N/A',rest:'None',init:'CG'},
  {id:'as',nm:'Ava Smith',rel:'Single account',lvl:'Swim Beginner 1',fund:'Voucher',fs:'Active',bal:'7 / 8 sessions',mu:0,assess:'Approved',rest:'None',init:'AS'},
  {id:'lb',nm:'Lucas Brown',rel:'Brown Family',lvl:'Swim Unassigned',fund:'Self Pay',fs:'Active',bal:'4 / 4 sessions',mu:0,assess:'Pending',rest:'None',init:'LB'},
  {id:'lt',nm:'Liam Turner',rel:'Turner Family',lvl:'Swim Beginner 2',fund:'Self Pay',fs:'Active',bal:'3 / 8 sessions',mu:1,assess:'Approved',rest:'None',init:'LT'}];
const SG=[{id:'g1',day:'MON Sep 14',time:'12:30\u20131:55 PM',svc:'Group Swim',lvl:'Beginner 2',inst:'Michael Torres',loc:'Pool Lane 8',spots:3,cap:8},
  {id:'g2',day:'MON Sep 14',time:'4:00\u20135:00 PM',svc:'Group Swim',lvl:'Beginner 2',inst:'Sarah Chen',loc:'Pool Lane 4',spots:8,cap:8},
  {id:'g3',day:'WED Sep 16',time:'9:00\u201310:30 AM',svc:'Group Swim',lvl:'Beginner 2',inst:'Sarah Chen',loc:'Pool Lane 10',spots:6,cap:8},
  {id:'g4',day:'WED Sep 16',time:'6:00\u20137:25 AM',svc:'Group Swim',lvl:'Beginner 2',inst:'Michael Torres',loc:'Pool Lane 2',spots:1,cap:8}];
const SS=[{id:'s1',day:'MON Sep 14',time:'12:30\u20131:30 PM',svc:'Semi-Private Swim',lvl:'Beginner 2',inst:'Michael Torres',loc:'Pool Lane 8',px:1,max:3},
  {id:'s2',day:'WED Sep 16',time:'9:00\u201310:00 AM',svc:'Semi-Private Swim',lvl:'Beginner 2',inst:'Sarah Chen',loc:'Pool Lane 10',px:2,max:3}];
const SP=[{id:'p1',day:'MON Sep 14',time:'12:30\u20131:30 PM',svc:'Private Swim',lvl:'Beginner 2',inst:'Michael Torres',loc:'Pool Lane 8'},
  {id:'p2',day:'MON Sep 14',time:'3:00\u20134:00 PM',svc:'Private Swim',lvl:'Beginner 2',inst:'James Wright',loc:'Pool Lane 6'},
  {id:'p3',day:'WED Sep 16',time:'8:00\u20139:00 AM',svc:'Private Swim',lvl:'Beginner 2',inst:'Sarah Chen',loc:'Pool Lane 4'}];
const AD=['MON','TUE','WED','THU','FRI','SAT','SUN'];
const DD={MON:'Sep 14',TUE:'Sep 15',WED:'Sep 16',THU:'Sep 17',FRI:'Sep 18',SAT:'Sep 19',SUN:'Sep 20'};

function render(){renderStepper();renderSteps();renderFooter();}
function renderStepper(){
  const L=['Client','Service','Preferences','Slots','Review'];
  document.getElementById('stepper').innerHTML=L.map((l,i)=>{
    const n=i+1,st=n<S.step?'done':n===S.step?'act':'fut',ic=st==='done'?'&#10003;':n;
    return`<div class="s-item"><div class="s-dot ${st}">${ic}</div><span class="s-lbl ${st}">${l}</span>${n<5?'<div class="s-line"></div>':''}</div>`;
  }).join('');}
function renderSteps(){
  let h='';
  for(let i=1;i<S.step;i++)h+=coll(i);
  h+=S.success?succ():active(S.step);
  document.getElementById('stepsArea').innerHTML=h;
  const p=document.getElementById('pSrch');if(p)p.focus();
}
function coll(n){
  const sm={1:S.client?`${S.client.nm} \u00b7 ${S.client.lvl} \u00b7 ${S.client.fund}`:'',2:S.type==='semi'?`Semi-Private Swim \u00b7 ${S.pax.length} participant(s)`:'Swimming \u00b7 Beginner 2',3:`${S.days.slice(0,3).join('/')} \u00b7 ${S.rec==='credits'?'Until Credits Used':S.rec==='once'?'One Time':'Recurring'}`,4:S.slot?slotSm():''};
  return`<div class="collapsed"><div class="chk-c">&#10003;</div><span class="coll-txt">Step ${n} \u2014 ${sm[n]}</span><button class="edit-btn" onclick="editStep(${n})">Edit</button></div>`;}
function slotSm(){const a=S.type==='group'?SG:S.type==='semi'?SS:SP;const s=a.find(x=>x.id===S.slot);return s?`${s.day} \u00b7 ${s.time}`:''}
function active(n){if(n===1)return step1();if(n===2)return step2();if(n===3)return step3();if(n===4)return step4();if(n===5)return step5();}

function step1(){
  const q=(document.getElementById('cSrch')||{}).value||'';
  const fc=CL.filter(c=>!q||c.nm.toLowerCase().includes(q.toLowerCase()));
  return`<div class="card"><div class="card-hd"><h3>Step 1 \u2014 Select Client</h3></div><div class="card-bd">
  <input class="s-input" id="cSrch" placeholder="Search by name, email, phone, or ID\u2026" oninput="renderSteps()" value="${q.replace(/"/g,'&quot;')}" autocomplete="off">
  ${fc.length===0?'<p style="color:var(--text-secondary);font-size:.78rem;margin-top:10px;font-style:italic">No clients found. Check spelling or try a different identifier.</p>':''}
  ${fc.map(c=>`<div class="cl-row ${S.client&&S.client.id===c.id?'sel':''}" onclick="selC('${c.id}')">
    <div class="cl-radio ${S.client&&S.client.id===c.id?'on':''}"></div>
    <div style="flex:1"><div style="font-size:.875rem;font-weight:700">${c.nm}</div><div style="font-size:.775rem;color:var(--text-secondary);margin-top:2px">${c.rel}</div>
      <div style="margin-top:3px"><span class="chip ${c.fs==='RCEB Pending'?'c-warn':'c-info'}">${c.fs}</span>${c.mu>0?`<span class="chip c-ok" style="margin-left:4px">${c.mu} Make-Up</span>`:''}</div>
    </div><div style="font-size:.78rem;font-weight:700;color:var(--info-dark);white-space:nowrap">Balance: ${c.bal}</div>
  </div>`).join('')}
  ${S.client?ctx(S.client):''}
  </div></div>`;}

function ctx(c){
  const rows=[['Assessment',c.assess],['Swim Level',c.lvl],['Funding',`${c.fund} <span class="chip ${c.fs==='RCEB Pending'?'c-warn':'c-ok'}">${c.fs}</span>`],['Balance','BAL'],['Make-Up Tokens',c.mu>0?c.mu+' available':'None'],['Restrictions',c.rest]];
  return`<div class="ctx-panel">${rows.map(([l,v])=>`<div class="ctx-row"><div class="ctx-lbl">${l}</div><div class="ctx-val${l==='Balance'?' bal':''}">${l==='Balance'?`Balance: ${c.bal}`:v}</div></div>`).join('')}</div>`;}

function step2(){
  const isSemi=S.type==='semi',isMgr=S.role==='manager',isFD=S.role==='frontdesk';
  return`<div class="card"><div class="card-hd"><h3>Step 2 \u2014 ${isSemi?'Service &amp; Participants':'Service'}</h3></div><div class="card-bd">
  <p style="font-size:.78rem;color:var(--text-secondary);margin-bottom:10px">Eligible services for <strong>${S.client.nm}</strong> \u00b7 ${S.client.lvl}</p>
  <div class="svc-grid">
    <div class="svc-card sel-svc"><div style="font-size:1.4rem;margin-bottom:7px">\U0001f3ca</div><div style="font-size:.875rem;font-weight:700">Swimming</div><div style="font-size:.72rem;color:var(--text-secondary);margin-top:3px">Beginner 2 \u00b7 Regional Center</div><div style="margin-top:5px"><span class="chip c-warn">RCEB Pending</span></div></div>
    <div class="svc-card inelig"><div style="font-size:1.4rem;margin-bottom:7px">\U0001f3be</div><div style="font-size:.875rem;font-weight:700">Tennis</div><div style="font-size:.72rem;color:var(--danger);margin-top:3px">Level not matched</div></div>
    <div class="svc-card inelig"><div style="font-size:1.4rem;margin-bottom:7px">\U0001f3c0</div><div style="font-size:.875rem;font-weight:700">Basketball</div><div style="font-size:.72rem;color:var(--danger);margin-top:3px">Assessment required</div></div>
  </div>
  ${isSemi?semiPax():''}
  ${!isFD?`<div class="staff-sec"><div class="sec-lbl">Staff Filters</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px">
      <div><label style="display:block;font-size:.72rem;font-weight:600;color:var(--text-secondary);margin-bottom:4px">Preferred Instructor</label>
        <select style="width:100%;border:1px solid var(--border-input);border-radius:6px;padding:7px 10px;font-size:.85rem"><option>All Eligible Instructors</option><option>Michael Torres</option><option>Sarah Chen</option></select></div>
      <div><label style="display:block;font-size:.72rem;font-weight:600;color:var(--text-secondary);margin-bottom:4px">Level Filter</label>
        <select style="width:100%;border:1px solid var(--border-input);border-radius:6px;padding:7px 10px;font-size:.85rem"><option>Beginner 2 (auto)</option><option>Adjacent Levels</option></select></div>
    </div>
    ${isMgr?`<button class="btn btn-out btn-sm btn-amber" style="margin-top:8px" onclick="toast('Level/Instructor override \u2014 reason required')">Override Level / Instructor</button>`:''}
  </div>`:''}
  </div></div>`;}

function semiPax(){
  const ex=S.pax.filter(p=>p.id!==S.client.id);
  return`<div class="divider"></div><div class="sec-lbl">Participants <span style="font-weight:400;color:var(--text-secondary)">(min 1 \u00b7 max 3)</span></div>
  <div class="px-row"><div class="px-av">${S.client.init}</div><div style="flex:1"><div style="font-size:.85rem;font-weight:700">${S.client.nm}</div><div style="font-size:.72rem;color:var(--text-secondary)">Primary \u00b7 ${S.client.lvl} \u00b7 eligible</div></div></div>
  ${ex.map(p=>`<div class="px-row"><div class="px-av sec">${p.init}</div><div style="flex:1"><div style="font-size:.85rem;font-weight:700">${p.nm}</div><div style="font-size:.72rem;color:var(--text-secondary)">${p.lvl} \u00b7 eligible</div></div><button style="background:none;border:none;color:var(--danger);font-size:.78rem;font-weight:600;cursor:pointer;margin-left:auto" onclick="remPax('${p.id}')">Remove</button></div>`).join('')}
  ${ex.length<2?`<button class="add-px-btn" onclick="togPS()"><span class="ms" style="font-size:16px">add</span> Add Participant</button>
  ${S.paxSearch?`<div class="px-dd-wrap"><input class="s-input" id="pSrch" placeholder="Search clients by name, email, phone\u2026" oninput="paxRes(this.value)" autocomplete="off"><div class="px-dd" id="pDD"></div></div>`:''}`:''} 
  ${ex.length===0?`<div class="banner b-warn" style="margin-top:8px"><strong>1 participant</strong> \u2014 slot shows as <strong>PENDING PARTNER</strong> on the calendar. A second participant can be added later from the slot detail.</div>`:''}`;
}

function step3(){
  const rc=S.client&&S.client.fund==='Regional Center',ps=S.type!=='group';
  return`<div class="card"><div class="card-hd"><h3>Step 3 \u2014 Day &amp; Time Preferences</h3></div><div class="card-bd">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <p style="font-size:.78rem;color:var(--text-secondary)">Select days and time windows to search. Eligible instructors filtered automatically.</p>
    <div style="display:flex;gap:5px"><button class="btn btn-out btn-sm" onclick="S.days=[];render()">Clear</button><button class="btn btn-out btn-sm" onclick="S.days=['MON','TUE','WED','THU','FRI'];render()">Weekdays</button></div>
  </div>
  <div class="day-grid">${AD.map(d=>{
    const on=S.days.includes(d),cnt=SG.filter(s=>s.day.startsWith(d)).length;
    return`<div class="d-row ${on?'chk':'uchk'}">
      <div class="d-badge">${d}<br>${DD[d].split(' ')[1]}</div>
      <label class="d-label"><input type="checkbox" ${on?'checked':''} onchange="togD('${d}',this.checked)"> ${d} ${DD[d]}</label>
      <div style="display:flex;align-items:center;gap:5px">
        <select class="t-sel"><option>6:00 AM</option><option>8:00 AM</option><option>12:00 PM</option></select>
        <span style="font-size:.72rem;color:var(--text-secondary)">\u2013</span>
        <select class="t-sel"><option>8:00 PM</option><option>6:00 PM</option></select>
        ${on&&cnt>0?`<span style="font-size:.7rem;font-weight:700;color:var(--success-dark);white-space:nowrap">${cnt} slot${cnt!==1?'s':''}</span>`:''}
      </div></div>`;}).join('')}</div>
  <div class="sec-lbl" style="margin-top:14px">Recurrence</div>
  <div class="rec-pills">${[['credits','Until Credits Used'],['weeks','Next N Weeks'],['date','Until End Date'],['once','One Time Only']].map(([v,l])=>`<button class="rec-p ${S.rec===v?'act':''}" onclick="S.rec='${v}';render()">${l}</button>`).join('')}</div>
  <div style="display:flex;align-items:center;gap:8px;margin-top:12px"><span style="font-size:.78rem;color:var(--text-secondary)">Search through:</span><input type="date" value="2026-09-30" style="border:1px solid var(--border-input);border-radius:6px;padding:6px 10px;font-size:.85rem"></div>
  ${rc&&ps?`<div class="banner b-info" style="margin-top:12px"><strong>\u2139 RCEB Note:</strong> Recurring selections cannot extend beyond confirmed authorization dates. The calendar shows this series as <em>tentative</em> until authorization is confirmed. No hold record is created.</div>`:''}
  </div></div>`;}

function step4(){
  const cc=S.role!=='frontdesk';
  const all=S.type==='group'?SG:S.type==='semi'?SS:SP;
  const days=[...new Set(all.map(s=>s.day))];
  return`<div class="card"><div class="card-hd"><h3>Step 4 \u2014 Available Slots</h3></div><div class="card-bd">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <span style="font-size:.85rem"><strong>${all.length} slots found</strong> \u00b7 Swimming \u00b7 Beginner 2</span>
    ${cc?`<button class="btn btn-out btn-sm" onclick="openDrawer()"><span class="ms" style="font-size:15px">add</span> Create New Slot</button>`:''}
  </div>
  ${days.map(day=>`<div class="dg-lbl">${day}</div><div class="slots-row">${all.filter(s=>s.day===day).map(sCard).join('')}</div>`).join('')}
  ${S.days.includes('TUE')?'<div class="dg-lbl">TUE Sep 15</div><p class="no-slots">No slots match your preferences for this day.</p>':''}
  </div></div>`;}

function sCard(s){
  const sel=S.slot===s.id;
  if(S.type==='group'){
    const pct=Math.round(s.spots/s.cap*100),fc=pct<60?'low':pct<90?'med':'full',full=s.spots===s.cap;
    return`<div class="s-card ${sel?'sel-slot':''}" onclick="selS('${s.id}')"><div class="s-sel-dot"></div>
      <div style="font-size:.78rem;font-weight:700">${s.time}</div><div style="font-size:.875rem;font-weight:700;margin-top:2px">${s.svc}</div>
      <div style="font-size:.72rem;color:var(--text-secondary)">(${s.lvl})</div>
      <div style="font-size:.72rem;color:var(--text-secondary);margin-top:1px">\U0001f464 ${s.inst}</div>
      <div style="font-size:.72rem;color:var(--text-secondary)">\U0001f4cd ${s.loc}</div>
      <div class="cap-bar-w"><div class="cap-bar"><div class="cap-fill ${fc}" style="width:${pct}%"></div></div>
        <div style="font-size:.68rem;color:var(--text-secondary);margin-top:3px">${full?'Class is full':`${s.cap-s.spots} / ${s.cap} spots`}</div></div>
      <div class="s-btns">${!full?`<button class="btn btn-blue btn-sm" onclick="event.stopPropagation();doBook('${s.id}')">Book</button>`:''}<button class="btn btn-out btn-sm" onclick="event.stopPropagation();doWL('${s.id}')">${full?'Waitlist only':'Waitlist'}</button></div>
    </div>`;
  }else if(S.type==='semi'){
    const pend=s.px<2;
    return`<div class="s-card ${sel?'sel-slot':''}" onclick="selS('${s.id}')"><div class="s-sel-dot"></div>
      <div style="font-size:.78rem;font-weight:700">${s.time}</div><div style="font-size:.875rem;font-weight:700;margin-top:2px">${s.svc}</div>
      <div style="font-size:.72rem;color:var(--text-secondary)">(${s.lvl})</div>
      <div style="font-size:.72rem;color:var(--text-secondary);margin-top:1px">\U0001f464 ${s.inst}</div>
      <div style="font-size:.72rem;color:var(--text-secondary)">\U0001f4cd ${s.loc}</div>
      <div style="margin-top:auto;padding-top:7px"><span class="chip ${pend?'c-warn':'c-ok'}">${s.px}/${s.max} \u00b7 ${pend?'PENDING PARTNER':'CONFIRMED'}</span></div>
      <div class="s-btns"><button class="btn btn-blue btn-sm" onclick="event.stopPropagation();doBook('${s.id}')">Join Slot</button><button class="btn btn-out btn-sm" onclick="event.stopPropagation();doWL('${s.id}')">Waitlist</button></div>
    </div>`;
  }else{
    return`<div class="s-card ${sel?'sel-slot':''}" onclick="doBook('${s.id}')"><div class="s-sel-dot"></div>
      <div style="font-size:.78rem;font-weight:700">${s.time}</div><div style="font-size:.875rem;font-weight:700;margin-top:2px">${s.svc}</div>
      <div style="font-size:.72rem;color:var(--text-secondary)">(${s.lvl})</div>
      <div style="font-size:.9rem;font-weight:700;margin-top:4px">\U0001f464 ${s.inst}</div>
      <div style="font-size:.72rem;color:var(--text-secondary)">\U0001f4cd ${s.loc}</div>
      <div class="s-btns" style="margin-top:auto"><button class="btn btn-blue btn-sm" onclick="event.stopPropagation();doBook('${s.id}')">Book</button><button class="btn btn-out btn-sm" onclick="event.stopPropagation();doWL('${s.id}')">Waitlist</button></div>
    </div>`;}
}

function step5(){
  const all=S.type==='group'?SG:S.type==='semi'?SS:SP;
  const sl=all.find(s=>s.id===S.slot);
  const rc=S.client.fund==='Regional Center',ps=S.type!=='group';
  const onePax=S.type==='semi'&&S.pax.filter(p=>p.id!==S.client.id).length===0;
  let out,oc,os;
  if(S.wl){out='WAITLISTED';oc='waitlisted';os='No credit reserved \u2014 reserved when promoted off waitlist.';}
  else if(onePax){out='PENDING PARTNER';oc='pending';os='Held for 1 participant. Credit reserved when minimum is met.';}
  else{out='CONFIRMED';oc='confirmed';os='All eligibility checks passed. Entitlement reserved on confirm.';}
  const rows=[['Client',S.client.nm],['Service',`${S.type==='group'?'Group':S.type==='semi'?'Semi-Private':'Private'} Swimming \u00b7 Beginner 2`],
    sl?['Instructor',sl.inst]:null,sl?['Date / Time',`${sl.day} \u00b7 ${sl.time}`]:null,
    sl?['Location',`Solar Swim \u00b7 ${sl.loc}`]:null,
    ['Recurrence',S.rec==='credits'?'Until Credits Used (Mon & Wed)':'One time only'],
    ['Funding',S.client.fund],['Entitlement',S.wl?'No credit reserved until promoted':'Reserve 1 session on confirm']
  ].filter(Boolean);
  return`<div class="card"><div class="card-hd"><h3>Step 5 \u2014 Review &amp; Confirm</h3></div><div class="card-bd">
  <div class="out-banner ${oc}"><div class="out-t">${out}</div><div class="out-s">${os}</div></div>
  <div class="sec-lbl">Booking Details</div>
  <div class="rev-grid">${rows.map(([l,v])=>`<div class="rev-row"><div class="rl">${l}</div><div class="rv">${v}</div></div>`).join('')}</div>
  ${rc&&ps?`<div class="banner b-info"><strong>\u2139 Calendar note:</strong> This recurring series appears as <em>tentative</em> on the calendar until RC authorization is confirmed. No hold record is created.</div>`:''}
  ${S.role==='manager'?`<div class="sec-lbl" style="margin-top:14px">Manager Overrides</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap">
      <button class="btn btn-out btn-amber" onclick="S.ovr=!S.ovr;render()">Funding Override</button>
      <button class="btn btn-out btn-amber" onclick="S.ovr=!S.ovr;render()">Capacity Override</button>
    </div>
    ${S.ovr?`<div class="ovr-panel"><div style="margin-bottom:8px"><span class="chip c-warn">\u26a0 Override logged with your name, timestamp, and reason</span></div>
      <label>Override Scope</label><select><option>One Appointment</option><option>Until Date</option><option>Until New Authorization</option></select>
      <label>End Date</label><input type="date">
      <label>Reason (required)</label><textarea placeholder="Stored in audit log\u2026"></textarea>
    </div>`:''}`:''} 
  </div></div>`;}

function succ(){
  const t=S.type==='group'?'Group':S.type==='semi'?'Semi-Private':'Private';
  return`<div class="card"><div class="card-bd"><div class="succ-state">
    <div class="succ-icon">\u2713</div>
    <div class="succ-t">Booking Confirmed</div>
    <div class="succ-s">${S.client.nm} \u00b7 ${t} Swimming \u00b7 Mon Sep 14 \u00b7 12:30 PM</div>
    <div style="margin-bottom:18px"><span class="chip c-ok" style="font-size:.85rem;height:26px;padding:0 12px">CONFIRMED</span></div>
    <div style="display:flex;gap:9px;justify-content:center">
      <button class="btn btn-out" onclick="location.href='calendar-master.html'">Back to Calendar</button>
      <button class="btn btn-blue" onclick="bookAgain()">Book Another Client</button>
    </div>
  </div></div></div>`;}

function renderFooter(){
  const tm={1:S.client?`${S.client.nm} selected`:'Select a client to begin',2:'Select service',3:'Set day & time preferences',4:S.slot?'Slot selected \u2014 proceed to review':'Select an available slot',5:S.wl?`${S.client?.nm} \u00b7 Joining waitlist`:`${S.client?.nm} \u00b7 Review booking`};
  document.getElementById('sfTitle').textContent=S.success?'Booking complete':tm[S.step]||'';
  document.getElementById('sfSub').textContent=S.role==='manager'?'Manager view \u2014 override controls available':S.role==='staff'?'Staff view':'Front Desk view';
  const bb=document.getElementById('backBtn'),nb=document.getElementById('nextBtn');
  bb.style.display=S.step>1&&!S.success?'inline-flex':'none';
  if(S.success){nb.style.display='none';return;}nb.style.display='inline-flex';
  nb.disabled=(S.step===1&&!S.client)||(S.step===4&&!S.slot);
  nb.textContent=S.step===5?(S.wl?'Join Waitlist':'Confirm Booking'):S.step===4&&!S.slot?'Select a Slot \u2192':'Next Step \u2192';
  nb.className=`btn ${S.step===5?'btn-green':'btn-blue'}`;}

function selC(id){S.client=CL.find(c=>c.id===id);S.pax=[{...S.client}];render();}
function switchType(t){
  if(S.step>1){toast('Switching type resets slot selection. Steps 2\u20135 reset.');S.step=Math.min(S.step,2);}
  S.type=t;S.slot=null;S.pax=S.client?[{...S.client}]:[];S.paxSearch=false;S.wl=false;
  ['tabGroup','tabSemi','tabPrivate'].forEach(id=>document.getElementById(id)?.classList.remove('active'));
  const m={group:'tabGroup',semi:'tabSemi',private:'tabPrivate'};
  document.getElementById(m[t])?.classList.add('active');render();}
function setRole(r){
  S.role=r;['rStaff','rManager','rFD'].forEach(id=>{const b=document.getElementById(id);if(b)b.className='btn btn-out btn-sm';});
  const m={staff:'rStaff',manager:'rManager',frontdesk:'rFD'};
  const b=document.getElementById(m[r]);if(b)b.className='btn btn-blue btn-sm';render();}
function goNext(){if(S.step===5){S.success=true;render();return;}S.step=Math.min(5,S.step+1);render();}
function goBack(){S.step=Math.max(1,S.step-1);S.success=false;render();}
function editStep(n){S.step=n;S.success=false;render();}
function selS(id){S.slot=id;render();}
function doBook(id){S.slot=id;S.wl=false;S.step=5;render();}
function doWL(id){S.slot=id;S.wl=true;S.step=5;render();}
function togD(d,v){if(v){if(!S.days.includes(d))S.days.push(d);}else{S.days=S.days.filter(x=>x!==d);}render();}
function togPS(){S.paxSearch=!S.paxSearch;render();}
function paxRes(q){
  const el=document.getElementById('pDD');if(!el)return;
  if(!q){el.innerHTML='';return;}
  const res=CL.filter(c=>c.id!==S.client.id&&!S.pax.find(p=>p.id===c.id)&&c.nm.toLowerCase().includes(q.toLowerCase())).slice(0,5);
  el.innerHTML=res.map(c=>{const ok=c.lvl.includes('Swim');return`<div class="px-res" onclick="addPax('${c.id}')"><div><div style="font-size:.85rem;font-weight:700">${c.nm}</div><div style="font-size:.72rem;color:var(--text-secondary)">${c.lvl}</div></div><span class="chip ${ok?'c-ok':'c-danger'}">${ok?'\u2713 Eligible':'\u2717 Level mismatch'}</span></div>`;}).join('')||'<div style="padding:9px 13px;font-size:.78rem;color:var(--text-secondary)">No results</div>';}
function addPax(id){const c=CL.find(x=>x.id===id);if(c&&!S.pax.find(p=>p.id===id))S.pax.push({...c});S.paxSearch=false;render();}
function remPax(id){S.pax=S.pax.filter(p=>p.id!==id);render();}
function bookAgain(){S.client=null;S.step=1;S.slot=null;S.success=false;S.pax=[];S.wl=false;render();}
function openDrawer(){document.getElementById('cDrawer').classList.add('open');}
function closeDrawer(){document.getElementById('cDrawer').classList.remove('open');}
function createAndSelect(){closeDrawer();toast('New class slot created & selected');S.slot='g1';render();}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
render();
</script>
</body>
</html>
