function crFor(id){
  if(!state.cr[id]){
    var cust = CUSTOMERS[id];
    var keys = Object.keys(cust.services);
    keys.sort(function(a,b){
      var ka = cust.services[a].kind==='dry'?0:1, kb = cust.services[b].kind==='dry'?0:1;
      return ka-kb;
    });
    var services = {};
    keys.forEach(function(k){
      services[k] = {
        picks:[],                 // {day,time,instructor,location,mode:'book'|'waitlist'}
        complete:keys.indexOf(k)===0, // first (dry-first) section starts complete/open by default
        funding:defaultFunding(id,k),
        overrideOpen:false,
        levelOverride:false        // Staff override for check 5 (skill level), §2.19
      };
    });
    state.cr[id] = {
      orderMode:'drywet',            // 'drywet' | 'wetdry' | 'flexible'
      openSection: keys.length>1 ? keys[1] : keys[0],
      svcOrder: keys,
      services: services,
      marketplace:{},                // svcKey -> {bought:bool,item:string,price:number}
      overrides:[],                  // [{svc, who, when, reason, duration, ...}]
      participants:{}                // svcKey -> extra participant names added (semi-private)
    };
  }
  return state.cr[id];
}

// ============================== TIME HELPERS ==============================
function toMinutes(t){
  var m = /^(\d+):(\d+)\s*([AP]M)$/i.exec(t.trim());
  if(!m) return 0;
  var h = parseInt(m[1],10)%12, mi = parseInt(m[2],10);
  if(/PM/i.test(m[3])) h += 12;
  return h*60+mi;
}
function overlaps(aStart,aEnd,bStart,bEnd){
  return toMinutes(aStart) < toMinutes(bEnd) && toMinutes(bStart) < toMinutes(aEnd);
}

// Per-day time accessor: services that vary by day (e.g. Maria's Swim, Michael Torres)
// carry a timeByDay map alongside the flat time/start/end fields; every other service
// falls back to those flat fields unchanged.
function svcTimeFor(svc, day){
  if(svc.timeByDay){
    var key = day.charAt(0).toUpperCase()+day.slice(1).toLowerCase();
    if(svc.timeByDay[key]) return svc.timeByDay[key];
  }
  return {time:svc.time, start:svc.start, end:svc.end};
}
// Summary (§9) class-schedule text — per-day when timeByDay exists, else unchanged
function svcScheduleText(svc){
  if(svc.timeByDay){
    return svc.days.map(function(d){ return d+' '+svcTimeFor(svc,d).time; }).join(' / ');
  }
  return svc.days.join('/')+' '+svc.time;
}

// Order-mode + overlap enforcement (D9, §6.1) for a candidate pick in the active section
function checkSlotAllowed(custId, svcKey, day, start, end){
  var cust = CUSTOMERS[custId];
  var cr = crFor(custId);
  var svc = cust.services[svcKey];
  var otherKeys = cr.svcOrder.filter(function(k){ return k!==svcKey; });
  for(var i=0;i<otherKeys.length;i++){
    var ok = otherKeys[i];
    var other = cust.services[ok];
    if(other.days.indexOf(day)===-1) continue; // not scheduled that day
    var oTime = svcTimeFor(other, day);
    var oStart = oTime.start, oEnd = oTime.end;
    if(overlaps(start,end,oStart,oEnd)){
      return {allowed:false, reason:'Overlaps your '+other.name+' session on '+day+' '+oStart+'–'+oEnd+'.'};
    }
    if(cr.orderMode!=='flexible'){
      var svcIsDry = svc.kind==='dry';
      if(cr.orderMode==='drywet'){
        // dry must end before wet starts
        if(svcIsDry){ if(toMinutes(end) > toMinutes(oStart) && other.kind==='wet'){ return {allowed:false, reason:'Under Dry → Wet, '+svc.name+' (dry) must end before '+other.name+' (wet) starts. Conflicts with '+other.name+' on '+day+' '+oStart+'–'+oEnd+'.'}; } }
        else { if(toMinutes(start) < toMinutes(oEnd) && other.kind==='dry'){ return {allowed:false, reason:'Under Dry → Wet, '+other.name+' (dry) must end before '+svc.name+' (wet) starts. Conflicts with '+other.name+' on '+day+' '+oStart+'–'+oEnd+', pick a later time, or switch this customer to Flexible.'}; } }
      } else if(cr.orderMode==='wetdry'){
        if(svc.kind==='wet'){ if(toMinutes(end) > toMinutes(oStart) && other.kind==='dry'){ return {allowed:false, reason:'Under Wet → Dry, '+svc.name+' (wet) must end before '+other.name+' (dry) starts. Conflicts with '+other.name+' on '+day+' '+oStart+'–'+oEnd+'.'}; } }
        else { if(toMinutes(start) < toMinutes(oEnd) && other.kind==='wet'){ return {allowed:false, reason:'Under Wet → Dry, '+other.name+' (wet) must end before '+svc.name+' (dry) starts. Conflicts with '+other.name+' on '+day+' '+oStart+'–'+oEnd+', pick a later time, or switch this customer to Flexible.'}; } }
      }
    }
  }
  return {allowed:true};
}

// ============================== FUNDING / OUTCOME ==============================
function rcebMatch(custId, svcKey, code){
  var cust = CUSTOMERS[custId];
  var svc = cust.services[svcKey];
  if(custId==='maria' && code==='RC-2291'){
    return {matched:true, text:'RC Auth #RC-2291 covers '+svc.name+' — Match'};
  }
  if(custId==='maria' && code){
    var other = cust.services[Object.keys(cust.services).filter(function(k){return k!==svcKey;})[0]];
    return {matched:false, text:'This authorization does not cover '+svc.name+' — it is scoped to '+(other?other.name:'a different service')+' only.'};
  }
  return {matched:false, text:'No Regional Center authorization on file matches this code.'};
}

function computeOutcome(custId, svcKey){
  var cust = CUSTOMERS[custId];
  var cr = crFor(custId);
  var svc = cust.services[svcKey];
  var rt = cr.services[svcKey];
  if(state.bookingType==='group' && rt.picks.length && rt.picks[rt.picks.length-1].mode==='waitlist'){
    return {code:'WAITLISTED', line:'On the waitlist. Nothing reserved yet.'};
  }
  if(state.bookingType==='semiprivate'){
    var need = 2;
    var have = 1 + (Object.keys(cr.participants[svcKey]||{}).length);
    if(have < need) return {code:'PENDING_PARTNER', line:'Waiting for a second participant.'};
  }
  var f = rt.funding;
  if(!f.processed) return {code:'CONFIRMED', line:'Booked. A session is reserved.'};
  if(f.type==='RCEB'){
    if(f.rceb.authStatus==='pending') return {code:'AUTHORIZATION_HOLD', line:'Waiting on Regional Center authorization.'};
    return {code:'CONFIRMED', line:'Booked. A session is reserved.'};
  }
  if(f.type==='SelfPay'){
    if(f.selfpay.method==='card' && f.selfpay.cardOnFile && f.selfpay.cardOnFile.declined && !f.selfpay.newCard){
      return {code:'PAYMENT_HOLD', line:'Waiting on payment.'};
    }
    return {code:'CONFIRMED', line:'Booked. A session is reserved.'};
  }
  return {code:'CONFIRMED', line:'Booked. A session is reserved.'};
}

}

function renderFooterWrap(){
  if(state.success) return '';
  var backDisabled = state.step===1;

    if(!state.selected.length){ nextDisabled=true; note='Select a customer to continue.'; }

    var hasWaitlist = outcomes.some(function(o){ return o.code==='WAITLISTED'; });
    var hasOther = outcomes.some(function(o){ return o.code!=='WAITLISTED'; });
    nextLabel = hasWaitlist ? (hasOther ? 'Confirm & Join Waitlist' : 'Join Waitlist') : 'Confirm Booking';

  var h = '<div class="footer-wrap"><div class="footer">';
  h += '<button class="btn btn-out" '+(backDisabled?'disabled':'')+' onclick="Z.back()">Back</button>';

function allOutcomes(){

  return out.map(function(x){ return {custId:x.custId, svcKey:x.svcKey, code:x.o.code, line:x.o.line}; });

  h += '<div style="margin-top:12px">';
  if(q.length>=2 && results.length===0){
    h += '<div class="no-slots">No customers found. Check spelling or try a different identifier.</div>';
  } else {
    results.forEach(function(c){
      var sel = state.selected.indexOf(c.id)!==-1;
      var atCap = state.selected.length>=3 && !sel;
      h += '<div class="cl-row '+(sel?'sel':'')+' '+(atCap?'dis':'')+'" onclick="'+(atCap?'':'Z.selectCustomer(\''+c.id+'\')')+'">';
      h += '<div class="cl-radio '+(sel?'on':'')+'"></div><div style="flex:1">';
      h += '<div style="font-weight:700;font-size:.9rem">'+esc(c.name)+' ';
      c.badges.forEach(function(b){ h += '<span class="chip '+b.c+'" style="margin-left:5px">'+esc(b.t)+'</span>'; });
      h += '</div>';
      h += '<div style="font-size:.78rem;color:var(--text-secondary);margin-top:3px">'+esc(c.household)+'</div>';
      h += '<div style="font-size:.78rem;color:var(--text-secondary);margin-top:2px">Interested (from Intake): '+c.interested.join(', ')+'</div>';
      h += '</div></div>';
    });
  }
  h += '</div>';
  var addDisabled = state.selected.length>=3;
  h += '<button class="btn btn-out" style="margin-top:12px" '+(addDisabled?'disabled':'')+' data-noop>+ Add a customer</button>';
  if(addDisabled) h += '<span class="next-note" style="margin-left:10px">Up to 3 customers per booking journey.</span>';
  h += '</div></div>';

  state.selected.forEach(function(id){
    h += renderCustomerDetail(id);
  });
  return h;
}

function renderCustomerDetail(id){
  var c = CUSTOMERS[id];
  var h = '<div class="card"><div class="card-hd"><h3>Context — '+esc(c.name)+'</h3></div><div class="card-bd">';
  h += '<div class="ctx-panel">';
  c.context.forEach(function(row){
    var isBal = row[0]==='Credits (Balance)';
    h += '<div class="ctx-row"><div class="ctx-lbl">'+row[0]+'</div><div class="ctx-val '+(isBal?'bal':'')+'">'+row[1]+'</div></div>';
  });
  h += '</div>';

  var keys = crFor(id).svcOrder;
  keys.forEach(function(k){
    var svc = c.services[k];
    h += '<div class="svc-block"><div class="svc-hd"><h4>'+svc.name.toUpperCase()+' — '+svc.level+' <span style="font-weight:500;color:var(--text-secondary);font-size:.8rem">('+svc.kind+')</span></h4></div>';
    h += '<div class="svc-row"><span class="svc-lbl">Skillset level required</span>'+svc.level+' <span class="chip '+(svc.levelOk?'c-ok':'c-danger')+'" style="margin-left:6px">'+(svc.levelOk?'Approved':'Not Approved')+'</span></div>';
    h += '<div class="svc-row"><span class="svc-lbl">Age group</span>'+svc.ageGroup+' <span class="chip '+(svc.ageOk?'c-ok':'c-danger')+'" style="margin-left:6px">'+(svc.ageOk?'Approved':'Not Approved')+'</span></div>';
    var mkt = crFor(id).marketplace[k];
    if(svc.hasPackage || (mkt && mkt.bought)){
      var pkgName = mkt && mkt.bought ? mkt.item : svc.packageName;
      h += '<div class="svc-row"><span class="svc-lbl">Active service package</span>Yes — '+pkgName+(mkt&&mkt.bought?' <span class="chip c-info">Buying</span>':'')+'</div>';
      var units = mkt && mkt.bought ? mkt.units : svc.unitsLeft;
      h += '<div class="svc-row"><span class="svc-lbl">Units left</span>'+units+'</div>';
      var term = mkt && mkt.bought ? null : svc.term;
      if(term){
        h += '<div class="svc-row"><span class="svc-lbl">Active payment term</span>Active payment term: '+term.start+' – '+term.end+' · '+term.units+' units unlocked</div>';
      } else if(mkt && mkt.bought){
        h += '<div class="svc-row"><span class="svc-lbl">Active payment term</span>Provisional — units granted pending payment (Buying)</div>';
      }
    } else {
      h += '<div class="svc-row"><span class="svc-lbl">Active service package</span>No — reason: No pack</div>';
      h += '<button class="btn btn-blue btn-sm" style="margin-top:6px" onclick="Z.openMarketplace(\''+id+'\',\''+k+'\')">Buy</button>';
      h += renderMarketplace(id,k);
    }
    h += '<div class="svc-row"><span class="svc-lbl">Intake preferences</span>'+c.context[c.context.length-1][1]+' (read-only)</div>';
    h += '</div>';
  });

  var mktTotal = 0;
  Object.keys(crFor(id).marketplace).forEach(function(k){ var m=crFor(id).marketplace[k]; if(m.bought) mktTotal+=m.price; });
  if(mktTotal>0){
    h += '<div class="banner b-info">Marketplace total this booking: $'+mktTotal.toFixed(2)+'</div>';
  }
  h += '</div></div>';
  return h;
}

function renderMarketplace(id,k){
  var cr = crFor(id);
  if(!cr.marketplace[k] || !cr.marketplace[k].open) return '';
  var c = CUSTOMERS[id];
  var svc = c.services[k];
  var scheduledCount = cr.services[k].picks.length;
  var blockDisabled = scheduledCount > 5;
  var h = '<div class="mkt-panel">';
  h += '<div style="font-weight:700;font-size:.85rem">BUY — '+svc.name.toUpperCase()+' — '+esc(c.name)+'</div>';
  h += '<div class="next-note" style="margin-top:2px">Reason this is needed: No pack</div>';
  h += '<div style="font-size:.78rem;font-weight:700;color:var(--text-secondary);margin-top:10px;text-transform:uppercase;letter-spacing:.05em">Eligible for: '+svc.level+' ('+c.name.split(' ')[0]+"'s level)</div>";
  h += '<div class="mkt-grid">';
  h += '<div class="mkt-card"><div style="font-weight:700">Block</div><div style="font-size:.82rem;margin:4px 0">'+svc.name+' 5-Pack — 5 class units</div>';
  h += '<div class="mkt-price">Member price: $135.00</div><div style="font-size:.78rem;color:var(--text-secondary)">Standard: $150.00</div>';
  h += '<div style="font-size:.72rem;color:var(--text-secondary);margin-top:4px">(Caroline Garcia household holds Family Membership Plus)</div>';
  if(blockDisabled){
    h += '<div class="next-note" style="color:var(--danger);margin-top:6px">'+scheduledCount+' classes already scheduled — this pack covers only 5. Remove a class first to switch.</div>';
    h += '<button class="btn btn-out btn-sm" style="margin-top:6px" disabled>Select Block</button>';
  } else {
    h += '<button class="btn btn-blue btn-sm" style="margin-top:6px" onclick="Z.buyItem(\''+id+'\',\''+k+'\',\''+svc.name+' 5-Pack\',135,5)">Select Block</button>';
  }
  h += '</div>';
  h += '<div class="mkt-card"><div style="font-weight:700">Subscription</div><div style="font-size:.82rem;margin:4px 0">'+svc.name+' Monthly — 8 units / month</div>';
  h += '<div class="mkt-price">Member price: $79/mo</div><div style="font-size:.78rem;color:var(--text-secondary)">Standard: $89/mo</div>';
  h += '<div style="font-size:.72rem;color:var(--text-secondary);margin-top:4px">(Caroline Garcia household holds Family Membership Plus)</div>';
  h += '<button class="btn btn-blue btn-sm" style="margin-top:6px" onclick="Z.buyItem(\''+id+'\',\''+k+'\',\''+svc.name+' Monthly\',79,8)">Select Subscription</button>';
  h += '</div></div>';
  h += '<div class="next-note" style="margin-top:10px">A membership would also cover this for less overall — <a href="#" data-noop style="color:var(--info)">See Membership Options</a></div>';

  return h;
}
// ============================== STEP 2 — WHEN & WITH WHOM? ==============================
function renderStep2(){
  var c = activeCustomer();
  if(!c) return '<div class="card"><div class="card-bd">No customer selected.</div></div>';
  var cr = crFor(c.id);
  var h = '<div class="card"><div class="card-hd"><h3>Step 2 — When &amp; with whom? ('+esc(c.name)+')</h3></div><div class="card-bd">';

  if(cr.svcOrder.length>1){
    h += renderOrderMode(c,cr);
  }

  cr.svcOrder.forEach(function(k,idx){
    h += renderServiceSection(c,cr,k,idx);
  });

  h += '</div></div>';
  return h;
}

function orderRuleText(cr){
  if(cr.orderMode==='flexible') return 'No ordering rule — any time may be picked for any day. Overlap is still always blocked.';
  if(cr.orderMode==='drywet') return 'On a shared day, the wet service must start after the dry service ends. Overlap is always blocked, in every mode.';
  return 'On a shared day, the dry service must start after the wet service ends. Overlap is always blocked, in every mode.';
}

function renderOrderMode(c,cr){
  var h = '<div class="order-box"><div style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary)">Service order for '+esc(c.name)+'</div>';
  h += '<div class="pill-row">';
  h += '<button class="pill '+(cr.orderMode==='drywet'?'act':'')+'" onclick="Z.setOrderMode(\''+c.id+'\',\'drywet\')">Dry → Wet</button>';
  h += '<button class="pill '+(cr.orderMode==='wetdry'?'act':'')+'" onclick="Z.setOrderMode(\''+c.id+'\',\'wetdry\')">Wet → Dry</button>';
  h += '<button class="pill '+(cr.orderMode==='flexible'?'act':'')+'" onclick="Z.setOrderMode(\''+c.id+'\',\'flexible\')">Flexible</button>';
  h += '</div>';
  h += '<div class="rule-txt">Active rule: '+orderRuleText(cr)+'</div>';
  h += '</div>';
  return h;
}

function renderServiceSection(c,cr,k,idx){
  var svc = c.services[k];
  var rt = cr.services[k];
  var locked = state.bookingType==='private' && idx>0 && !cr.services[cr.svcOrder[idx-1]].complete;
  var open = cr.openSection===k && !locked;
  var h = '<div class="svc-section '+(locked?'locked':'')+'">';
  h += '<div class="sec-hd" onclick="'+(locked?'':'Z.toggleSection(\''+c.id+'\',\''+k+'\')')+'"><h4>'+(open?'▾':'▸')+' '+svc.name.toUpperCase()+' — '+svc.level+' ('+svc.kind+')</h4>';
  if(locked){ h += '<span class="next-note">complete '+esc(c.services[cr.svcOrder[idx-1]].name)+' above first</span>'; }
  else if(rt.complete){ h += '<span class="chip c-ok">complete</span>'; }
  h += '</div>';
  if(open){
    h += '<div class="sec-bd">';
    if(!svc.hasPackage && !(cr.marketplace[k]&&cr.marketplace[k].bought)){
      h += '<div class="banner b-warn">No active package for '+svc.name+'. Go to Step 1 to Buy before scheduling.</div>';
    } else {
      h += renderDayTimePicker(c,cr,k,svc);
      if(state.bookingType==='semiprivate') h += renderParticipantPanel(c,cr,k);
      h += renderClassList(c,cr,k,svc,idx);
    }
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function renderDayTimePicker(c,cr,k,svc){
  var days=['MON','TUE','WED','THU','FRI','SAT','SUN'];
  var checkedDays = svc.days.map(function(d){ return d.toUpperCase(); });
  var h = '<div style="font-size:.82rem;color:var(--text-secondary)">Select which days and time windows to search. Zalexy filters qualified instructors automatically.</div>';
  h += '<div class="day-grid">';
  days.forEach(function(d){
    var chk = checkedDays.indexOf(d)!==-1;
    h += '<div class="d-row '+(chk?'chk':'uchk')+'"><div class="d-badge">'+d+'</div><label class="d-label"><input type="checkbox" '+(chk?'checked':'')+' onchange="Z.toggleDay(\''+c.id+'\',\''+k+'\',\''+d+'\')"/>'+(chk?'6:00 AM – 8:00 PM':'')+'</label><span></span></div>';
  });
  h += '</div>';
  h += '<div class="dg-lbl" style="margin-top:14px">Recurrence</div>';
  h += '<div class="pill-row"><button class="pill act">Recurring</button><button class="pill" data-noop>One-Time Only</button></div>';
  h += '<div style="font-size:.8rem;margin-top:8px">Repeat every <strong>1</strong> week(s)</div>';
  h += '<div class="pill-row"><button class="pill act">Unlimited (until cancelled)</button><button class="pill" data-noop>Fixed start + end date</button></div>';
  h += '<div class="dg-lbl" style="margin-top:14px">Instructors (multi-select)</div>';
  h += '<div class="instr-list">';
  INSTRUCTORS.forEach(function(name){
    var checked = svc.instructor===name;
    h += '<label class="instr-chk"><input type="checkbox" '+(checked?'checked':'')+' data-noop/> '+name+'</label>';
  });
  h += '</div>';
  h += '<div class="next-note" style="margin-top:6px">Filters on 6 dimensions per instructor: location, service, level, qualification, availability, restrictions.</div>';
  return h;
}

function renderParticipantPanel(c,cr,k){
  var svc = c.services[k];
  var extra = Object.keys(cr.participants[k]||{});
  var have = 1+extra.length;
  var h = '<div class="order-box" style="margin-top:14px"><div style="font-size:.75rem;font-weight:700;text-transform:uppercase;color:var(--text-secondary)">Participants for this '+svc.name+' session</div>';
  h += '<div style="font-size:.85rem;margin-top:4px">Participants needed: <strong>2</strong></div>';
  h += '<div class="next-note">(this service\'s Required Participants setting — policy engine, default 2, D4)</div>';
  h += '<div class="cl-row sel" style="cursor:default"><div class="cl-radio on"></div><div><div style="font-weight:700;font-size:.85rem">'+esc(c.name)+'</div><div class="next-note">'+svc.label+' / eligible — (this tab\'s customer — auto-added)</div></div></div>';
  extra.forEach(function(name){
    h += '<div class="cl-row" style="cursor:default"><div class="cl-radio on"></div><div style="flex:1"><div style="font-weight:700;font-size:.85rem">'+esc(name)+'</div><div class="next-note">Eligible</div></div><button class="rm-link" onclick="Z.removeParticipant(\''+c.id+'\',\''+k+'\',\''+name+'\')">Remove</button></div>';
  });
  h += '<button class="btn btn-out btn-sm" style="margin-top:8px" onclick="Z.addParticipant(\''+c.id+'\',\''+k+'\')">+ Add Participant</button>';
  if(have<2){
    h += '<div class="banner b-warn">With '+have+' of 2 participants this slot will show as PENDING PARTNER — "Waiting for a second participant." on the calendar.</div>';
  }
  h += '</div>';
  return h;
}

function slotsForType(svcKey){
  if(state.bookingType==='group'){
    if(svcKey==='fitness') return CLASS_SLOTS.groupFitness;
    if(svcKey==='basketball') return CLASS_SLOTS.groupBasketball;
  }
  return CLASS_SLOTS[state.bookingType];
}

function renderClassList(c,cr,k,svc,idx){
  var checkedDays = svc.days.map(function(d){ return d.toUpperCase(); });
  var allDays=['MON','TUE','WED','THU','FRI','SAT','SUN'];
  var stmt = state.bookingType==='group' ? 'These are scheduled classes you can join.' : 'These are times this instructor is free.';
  var h = '<div class="dg-lbl" style="margin-top:16px">'+svc.name+' / '+svc.level+' / '+svc.days.join(', ')+' (from the day picker above)</div>';
  h += '<div class="next-note" style="margin-bottom:8px">'+stmt+'</div>';
  if(state.role!=='frontdesk'){
    h += '<button class="btn btn-out btn-sm" style="margin-bottom:10px" onclick="Z.openDrawer(\''+c.id+'\',\''+k+'\')">+ Create New Class Slot</button>';
  }

  var slots = slotsForType(svc.key);
  allDays.forEach(function(day){
    if(checkedDays.indexOf(day)===-1) return;
    var daySlots = slots.filter(function(s){ return s.day.toUpperCase()===day; });
    h += '<div class="instr-name" style="border-top:1px solid var(--border);padding-top:8px">— '+day+' —</div>';
    if(!daySlots.length){
      h += '<div class="no-slots">No slots match your preferences for '+day+'.</div>';
      return;
    }
    var byInstr = {};
    daySlots.forEach(function(s){ (byInstr[s.instructor]=byInstr[s.instructor]||[]).push(s); });
    Object.keys(byInstr).forEach(function(instr){
      h += '<div class="instr-name">'+instr+'</div>';
      h += '<div class="slots-flex">';
      byInstr[instr].forEach(function(s){
        h += renderClassCard(c,cr,k,svc,s,idx);
      });
      h += '</div>';
    });
  });
  return h;
}

function slotPickedInfo(cr,k,s){
  return cr.services[k].picks.find(function(p){ return p.day===s.day && p.time===s.time; });
}

function renderClassCard(c,cr,k,svc,s,idx){
  var picked = slotPickedInfo(cr,k,s);
  var rt = cr.services[k];
  // Check 5 (skill level) — never filtered out; shown with a badge and gated at
  // selection instead (§2.19, §3.8, §6.5 — developer decision 2026-09-09).
  var levelBlocked = !svc.levelOk && !rt.levelOverride;
  var h = '<div class="s-card '+(picked?'sel':'')+'">';
  h += '<div class="s-name">'+svc.name+'</div><div class="s-instr">'+s.instructor+'</div>';
  h += '<div class="s-time">'+s.day.toUpperCase()+' · '+s.time+'</div>';
  if(!svc.levelOk){
    h += '<div style="margin-top:2px"><span class="chip c-danger">Level '+esc(svc.level)+' required — '+esc(c.name.split(' ')[0])+' is '+esc(svc.customerLevel||'a different level')+'</span></div>';
  } else {
    h += '<div style="margin-top:2px"><span class="chip c-muted">'+svc.level+' allowed</span></div>';
  }
  h += '<div><span class="chip c-muted">'+svc.ageGroup+' allowed</span></div>';
  h += '<div class="s-loc">📍 '+s.location+'</div>';

  var levelNote = '';
  if(levelBlocked){
    levelNote = '<div class="next-note" style="color:var(--danger);margin-top:4px">This session is for Level '+esc(svc.level)+'. <button class="rm-link" style="color:var(--info)" onclick="Z.applyLevelOverride(\''+c.id+'\',\''+k+'\')">Staff Override</button></div>';
  } else if(!svc.levelOk && rt.levelOverride){
    levelNote = '<div class="next-note" style="color:var(--success-dark);margin-top:4px">Staff override applied — level mismatch waived for this booking (recorded, §9).</div>';
  }

  if(state.bookingType==='group'){
    h += seatIcons(s.booked,s.capacity);
    h += '<div class="ratio-txt">'+s.booked+' booked / '+s.capacity+' spots</div>';
    var full = s.booked>=s.capacity;
    h += '<div class="s-btns">';
    if(full){
      h += '<button class="btn btn-out btn-sm" onclick="Z.pickSlot(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+s.time+'\',\'waitlist\')">Waitlist only</button>';
    } else {
      h += '<button class="btn btn-blue btn-sm" '+(levelBlocked?'disabled':'')+' onclick="'+(levelBlocked?'':('Z.pickSlot(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+s.time+'\',\'book\')'))+'">Book</button>';
      h += '<button class="btn btn-out btn-sm" onclick="Z.pickSlot(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+s.time+'\',\'waitlist\')">Waitlist</button>';
    }
    h += '</div>';
    h += levelNote;
    // Joint capacity check across customers in this journey assigned to this exact slot
    var joint = jointCapacityMessage(k,s);
    if(joint) h += '<div class="banner b-danger" style="margin-top:6px">'+joint+'</div>';
  } else if(state.bookingType==='semiprivate'){
    h += seatIcons(s.participants,s.required);
    var status = s.participants>=s.required ? 'CONFIRMED' : 'PENDING_PARTNER';
    h += '<div class="ratio-txt">'+s.participants+' / '+s.required+' — '+status+'</div>';
    h += '<div class="s-btns"><button class="btn btn-blue btn-sm" '+(levelBlocked?'disabled':'')+' onclick="'+(levelBlocked?'':('Z.pickSlot(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+s.time+'\',\'book\')'))+'">Select</button></div>';
    h += levelNote;
  } else { // private
    h += '<div class="next-note" style="margin-top:2px">Session length</div>';
    h += '<div class="pill-row">';
    [30,60].forEach(function(len){
      var active = (picked&&picked.length===len) || (!picked && len===60);
      h += '<button class="pill '+(active?'act':'')+'" onclick="Z.pickPrivate(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+s.time+'\','+len+')">'+len+' min — $'+PRIVATE_PRICE[len]+(len===60?' <span style=\'font-size:.65rem\'>Better rate/min</span>':'')+'</button>';
    });
    h += '</div>';
    h += '<div class="s-btns"><button class="btn btn-blue btn-sm" '+(levelBlocked?'disabled':'')+' onclick="'+(levelBlocked?'':('Z.pickPrivate(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+s.time+'\','+(picked?picked.length:60)+')'))+'">'+(picked?'Selected':'Select')+'</button></div>';
    h += levelNote;
  }
  h += '</div>';
  return h;
}

function jointCapacityMessage(k,s){
  var assigned = [];
  state.selected.forEach(function(id){
    var cr = state.cr[id];
    if(!cr) return;
    var rt = cr.services[k];
    if(!rt) return;
    var p = rt.picks.find(function(pp){ return pp.day===s.day && pp.time===s.time && pp.mode==='book'; });
    if(p) assigned.push(id);
  });
  if(assigned.length<2) return null;
  var remaining = s.capacity - s.booked;
  if(assigned.length>remaining){
    return 'Only '+remaining+' spot'+(remaining===1?'':'s')+' left in this class — '+assigned.length+' customers need a spot here. Move one customer to a different slot, or join the waitlist for the second.';
  }
  return null;
}

// ============================== STEP 3 — PREVIEW ==============================
function renderStep3(){
  var c = activeCustomer();
  if(!c) return '<div class="card"><div class="card-bd">No customer selected.</div></div>';
  var cr = crFor(c.id);
  var view = cr.previewView || 'list';
  var h = '<div class="card"><div class="card-hd"><h3>Step 3 — Preview ('+esc(c.name)+')</h3></div><div class="card-bd">';
  h += '<div class="toggle-pair"><button class="pill '+(view==='list'?'act':'')+'" onclick="Z.setPreviewView(\''+c.id+'\',\'list\')">List</button><button class="pill '+(view==='calendar'?'act':'')+'" onclick="Z.setPreviewView(\''+c.id+'\',\'calendar\')">Calendar</button></div>';

  var pv = PREVIEW[c.id] || {};
  var palette = ['#3b82f6','#10b981','#f59e0b'];
  cr.svcOrder.forEach(function(k,idx){
    var svc = c.services[k];
    var data = pv[k];
    if(!data){
      h += '<div class="dg-lbl">'+svc.name.toUpperCase()+' — '+svc.level+' ('+svc.kind+')</div><div class="no-slots">No generated dates yet — complete Step 1/2 for this service.</div>';
      return;
    }
    h += '<div class="dg-lbl">'+svc.name.toUpperCase()+' — '+svc.level+' ('+svc.kind+')</div>';
    if(svc.term) h += '<div class="next-note" style="margin-bottom:6px">Active payment term: '+svc.term.start+' – '+svc.term.end+' · '+svc.term.units+' units unlocked</div>';

    if(view==='list'){
      var byDay = {};
      data.dates.forEach(function(dt){ (byDay[dt.day]=byDay[dt.day]||[]).push(dt); });
      var skipByDay = {};
      data.skipped.forEach(function(sk){ (skipByDay[sk.day]=skipByDay[sk.day]||[]).push(sk); });
      var allDays = Object.keys(byDay).concat(Object.keys(skipByDay).filter(function(d){return byDay[d]===undefined;}));
      var seen = {};
      ['MON','TUE','WED','THU','FRI','SAT','SUN'].forEach(function(d){
        if(!byDay[d] && !skipByDay[d]) return;
        if(seen[d]) return; seen[d]=true;
        h += '<div class="instr-name">'+d+'</div>';
        (byDay[d]||[]).forEach(function(dt){
          var id = c.id+'_'+k+'_'+dt.date;
          var checked = cr.previewChecks && cr.previewChecks[id]===false ? '' : 'checked';
          h += '<div class="date-row"><input type="checkbox" '+checked+' onchange="Z.togglePreviewDate(\''+c.id+'\',\''+id+'\')"/>'+dt.date+' — '+data.instructor+' — '+svcTimeFor(svc,dt.day).start+'</div>';
        });
        (skipByDay[d]||[]).forEach(function(sk){
          h += '<div class="date-skip">'+sk.date+' — skipped — centre closure "'+sk.reason+'"</div>';
        });
      });
      h += '<div class="banner b-warn">Stopped: '+data.stopText+'.'+(data.tentative.length?' Further dates beyond the term are shown below as Tentative.':'')+'</div>';
      if(data.tentative.length){
        h += '<div class="dg-lbl">Beyond the active payment term (Tentative)</div>';
        data.tentative.forEach(function(dt){
          h += '<div class="date-row tentative"><input type="checkbox" disabled/>'+dt.date+' — '+data.instructor+' — '+svcTimeFor(svc,dt.day).start+' <span class="tag-tentative">TENTATIVE</span><span class="next-note">— "Shown from a recurring schedule. Not reserved."</span></div>';
        });
        h += '<div class="next-note">Beyond the active payment term — nothing can be reserved here yet.</div>';
      }
    } else {
      h += '<div class="cal-grid">';
      for(var i=1;i<=30;i++){
        var found = data.dates.find(function(dt){ return dt.date.indexOf(i+(i===1||i===21||i===31?'st':i===2||i===22?'nd':i===3||i===23?'rd':'th')+' Sep')===0; });
        var tent = data.tentative.find(function(dt){ return dt.date.indexOf(i+'')===0; });
        h += '<div class="cal-cell">'+i;
        if(found) h += '<br/><span class="cal-dot" style="background:'+palette[idx%3]+'"></span>';
        if(tent) h += '<br/><span class="cal-dot" style="background:'+palette[idx%3]+';opacity:.4;border:1px dashed '+palette[idx%3]+'"></span>';
        h += '</div>';
      }
      h += '</div>';
      h += '<div class="banner b-warn">Stopped: '+data.stopText+'.</div>';
    }
  });

  if(rcebActive(c.id) && state.bookingType!=='group'){
    h += '<div class="banner b-info">Sessions after the first will appear on the calendar as Tentative until Regional Center authorization is confirmed. Nothing is reserved for those dates yet.</div>';
  }
  h += '</div></div>';
  return h;
}

function rcebActive(custId){
  var cr = state.cr[custId];
  if(!cr) return false;
  return Object.keys(cr.services).some(function(k){ return cr.services[k].funding.type==='RCEB'; });
}
// ============================== STEP 4 — FUNDING ==============================
function renderStep4(){
  var c = activeCustomer();
  if(!c) return '<div class="card"><div class="card-bd">No customer selected.</div></div>';
  var cr = crFor(c.id);
  var h = '<div class="card"><div class="card-hd"><h3>Step 4 — Funding ('+esc(c.name)+')</h3></div><div class="card-bd">';
  cr.svcOrder.forEach(function(k,idx){
    var svc = c.services[k];
    var rt = cr.services[k];
    h += '<div class="svc-block">';
    h += '<div class="svc-hd"><h4>'+svc.name.toUpperCase()+' — '+svc.level+' ('+svc.kind+')</h4></div>';
    h += '<div class="dg-lbl">Funding Type</div>';
    h += '<div class="pill-row">';
    var types = ['RCEB','Voucher'];
    if(CUSTOMERS[c.id].makeUpTokens>0) types.push('Make-Up');
    types.push('Self Pay');
    types.forEach(function(t){
      var val = t.replace(' ','').replace('-','');
      var active = rt.funding.type===('SelfPay'===val?'SelfPay':val==='MakeUp'?'MakeUp':val);
      h += '<button class="pill '+(rt.funding.type===val?'act':'')+'" onclick="Z.setFundingType(\''+c.id+'\',\''+k+'\',\''+val+'\')">'+t+(t==='Make-Up'?' <span style="font-size:.65rem">1 available</span>':'')+'</button>';
    });
    h += '</div>';

    if(rt.funding.type==='RCEB'){
      h += renderRcebBlock(c,cr,k,svc,rt);
    } else if(rt.funding.type==='Voucher'){
      h += '<div class="order-box" style="margin-top:10px"><div class="next-note">Existing voucher balance/authorization on file (read-only).</div>';
      h += '<button class="btn btn-blue btn-sm" style="margin-top:8px" onclick="Z.processFunding(\''+c.id+'\',\''+k+'\')">Process</button></div>';
    } else if(rt.funding.type==='MakeUp'){
      h += renderMakeUpBlock(c,cr,k,svc,rt);
    } else {
      h += renderSelfPayBlock(c,cr,k,svc,rt);
    }

    if(rt.funding.processed){
      var o = computeOutcome(c.id,k);
      h += '<div class="banner '+(o.code==='CONFIRMED'?'b-ok':(o.code==='PAYMENT_HOLD'?'b-danger':'b-warn'))+'">'+o.code+' — '+o.line+'</div>';
    }

      if(rt.overrideOpen) h += renderOverridePanel(c,cr,k,svc);
    }
    h += '</div>';
  });
  h += '</div></div>';
  return h;

function renderSummaryCustomer(id){
  var c = CUSTOMERS[id];
  var cr = crFor(id);
  var h = '<div style="font-weight:700;font-size:1.05rem;margin-bottom:8px">'+esc(c.name)+'</div>';
  var overridesForCust = [];
  cr.svcOrder.forEach(function(k){
    var svc = c.services[k];
    var rt = cr.services[k];
    var o = computeOutcome(id,k);
    h += '<div class="out-banner '+outcomeBannerClass(o.code)+'"><div class="out-t">'+o.code+'</div><div class="out-s">'+o.line+'</div></div>';
    var dates = (PREVIEW[id]&&PREVIEW[id][k]) ? PREVIEW[id][k].dates.map(function(d){return d.date;}).join(', ') : '—';
    var nDates = (PREVIEW[id]&&PREVIEW[id][k]) ? PREVIEW[id][k].dates.length : 0;
    var fundingText = fundingSummaryText(rt.funding, k, id);
    h += '<div class="dg-lbl">'+svc.name.toUpperCase()+' — '+svc.level+' ('+svc.kind+') — Detail</div>';
    h += '<div class="rev-grid">';
    [['Customer',c.name],['Service',svc.name+' / '+svc.level],['Instructor',svc.instructor],
     ['Class Schedule',svcScheduleText(svc)+' — '+nDates+' dates: '+dates],
     ['Location','Solar Swim — '+(state.bookingType==='private'?'Pool Lane':'Pool Lane 8')],
     ['Recurrence','Recurring, every 1 week, unlimited (until cancelled) — stopped: '+((PREVIEW[id]&&PREVIEW[id][k])?PREVIEW[id][k].stopText:'—')],
     ['Funding',fundingText],
     ['Status',o.code+' — "'+o.line+'"']
    ].forEach(function(row){
      h += '<div class="rev-row"><div class="rl">'+row[0]+'</div><div class="rv">'+row[1]+'</div></div>';
    });
    h += '</div>';
    cr.overrides.filter(function(ov){ return ov.svc===k; }).forEach(function(ov){ overridesForCust.push(svc.name+': '+ov.reason+' (by '+ov.who+', '+ov.when+')'); });
  });
  if(rcebActive(id) && state.bookingType!=='group'){
    h += '<div class="banner b-info">Sessions after the first will appear on the calendar as Tentative until RC authorization is confirmed. Nothing is reserved for those dates yet.</div>';
  }
  h += '<div class="dg-lbl">Overrides Applied</div>';
  h += overridesForCust.length ? overridesForCust.map(function(t){return '<div class="next-note">'+t+'</div>';}).join('') : '<div class="next-note">(none for '+c.name+')</div>';
  return h;
}

function fundingSummaryText(funding,k,custId){
  if(!funding.processed) return 'Not yet processed';
  if(funding.type==='RCEB'){
    var m = rcebMatch(custId,k,funding.rceb.code);
    return 'RCEB — '+m.text+(funding.rceb.authStatus==='pending'?' — authorization pending':' — Processed');
  }
  if(funding.type==='Voucher') return 'Voucher — on file, verified — Processed';
  if(funding.type==='MakeUp') return 'Make-Up — 1 consumed on confirm. 0 remaining.';
  var sp = funding.selfpay;
  if(sp.cardOnFile && sp.cardOnFile.declined && !sp.newCard) return 'Self Pay — Card on file (Visa …'+sp.cardOnFile.last4+') — declined '+sp.cardOnFile.declinedDate+' — Processed to PAYMENT_HOLD';
  if(sp.newCard) return 'Self Pay — new card entered — processed successfully';
  return 'Self Pay — '+sp.method+' — Processed';
}

        state.bookingType=t; state.cr={}; state.step=Math.min(state.step,2); render();
      }, function(){ render(); });
    } else { state.bookingType=t; render(); }
  },

  setActiveTab:function(i){ state.activeTab=i; render(); },
  goToStep:function(n){ state.step=n; render(); },

  removeCustomer:function(id){
    var cr = state.cr[id];
    var scheduled = [];
    if(cr){ Object.keys(cr.services).forEach(function(k){ cr.services[k].picks.forEach(function(p){ scheduled.push(CUSTOMERS[id].services[k].name+' '+p.day+' '+p.time); }); }); }
    var msg = scheduled.length ? ('Removing '+CUSTOMERS[id].name+' will drop '+scheduled.length+' scheduled class(es): '+scheduled.join(', ')+'.') : ('Remove '+CUSTOMERS[id].name+' from this booking journey?');
    showToast(msg, function(){
      var idx=state.selected.indexOf(id); if(idx!==-1) state.selected.splice(idx,1);
      delete state.cr[id];
      if(state.activeTab>=state.selected.length) state.activeTab=Math.max(0,state.selected.length-1);
      render();
    }, function(){ render(); });
  },

  back:function(){ state.step=Math.max(1,state.step-1); render(); },
  next:function(){
    if(state.step===1 && !state.selected.length) return;
    state.step = Math.min(5,state.step+1);
    if(state.activeTab>=state.selected.length) state.activeTab=0;
    render();
  },

  confirmBooking:function(){
    var list=[];
    state.selected.forEach(function(id){
      var c=CUSTOMERS[id]; var cr=crFor(id);
      cr.svcOrder.forEach(function(k){
        var o=computeOutcome(id,k);
        var svc=c.services[k];
        var pv=PREVIEW[id]&&PREVIEW[id][k];
        var dateSummary = pv ? (pv.dates.length+' sessions, '+svc.days.join('/')+' through Sep 30, 2026') : svc.days.join('/');
        list.push({custName:c.name, svcName:svc.label, code:o.code, line:o.line, dateSummary:dateSummary});
      });
    });
    state.success=list;
    render();
  },
  backToCalendar:function(){ window.location.href='calendar-master.html'; },
  bookAnother:function(){ state.success=null; state.selected=[]; state.cr={}; state.step=1; state.activeTab=0; state.search=''; render(); },

  toastGo:function(){ var t=state.toast; state.toast=null; if(t&&t.onGo) t.onGo(); else render(); },
  toastNo:function(){ var t=state.toast; state.toast=null; if(t&&t.onNo) t.onNo(); else render(); },

  setSearch:function(v){ state.search=v; render(); },
  selectCustomer:function(id){
    var idx=state.selected.indexOf(id);
    if(idx!==-1){ state.selected.splice(idx,1); delete state.cr[id]; if(state.activeTab>=state.selected.length) state.activeTab=Math.max(0,state.selected.length-1); render(); return; }
    if(state.selected.length>=3) return;
    state.selected.push(id); crFor(id); render();
  },

  openMarketplace:function(id,k){ var cr=crFor(id); cr.marketplace[k]=cr.marketplace[k]||{}; cr.marketplace[k].open=true; render(); },
  buyItem:function(id,k,name,price,units){ var cr=crFor(id); cr.marketplace[k]={open:false,bought:true,item:name,price:price,units:units}; render(); },

  setOrderMode:function(id,mode){
    var cr=crFor(id);
    cr.orderMode=mode;
    var cleared=[];
    Object.keys(cr.services).forEach(function(k){
      var rt=cr.services[k];
      var kept=[];
      rt.picks.forEach(function(p){
        var chk=checkSlotAllowed(id,k,p.day,p.start,p.end);
        if(chk.allowed) kept.push(p); else cleared.push(CUSTOMERS[id].services[k].name+' '+p.day+' '+p.time);
      });
      rt.picks=kept;
    });
    render();
    if(cleared.length) showToast('Cleared: '+cleared.join(', ')+' — no longer satisfies '+(mode==='drywet'?'Dry → Wet':mode==='wetdry'?'Wet → Dry':'the active mode')+'.', null, null);
  },

  toggleSection:function(id,k){ var cr=crFor(id); cr.openSection = (cr.openSection===k? null : k); render(); },
  toggleDay:function(id,k,day){
    var svc=CUSTOMERS[id].services[k];
    var full=toTitleDay(day);
    var idx=svc.days.indexOf(full);
    if(idx!==-1) svc.days.splice(idx,1); else svc.days.push(full);
    render();
  },

  addParticipant:function(id,k){
    var cr=crFor(id);
    cr.participants[k]=cr.participants[k]||{};
    var candidates=['Ava Smith','Lucas Brown'];
    var next=candidates.filter(function(n){ return !cr.participants[k][n]; })[0];
    if(next) cr.participants[k][next]=true;
    render();
  },
  removeParticipant:function(id,k,name){ var cr=crFor(id); if(cr.participants[k]) delete cr.participants[k][name]; render(); },

  openDrawer:function(custId,svcKey){ state.drawer={custId:custId,svcKey:svcKey,created:false,pulledIn:[]}; render(); },
  closeDrawer:function(){ state.drawer=null; render(); },
  createSlot:function(){ if(state.drawer){ state.drawer.created=true; } render(); },
  pullIn:function(name){ if(state.drawer){ state.drawer.pulledIn=state.drawer.pulledIn||[]; state.drawer.pulledIn.push(name); } render(); },

  pickSlot:function(custId,k,day,time,mode){
    var slots=slotsForType(k);
    var s=slots.filter(function(x){ return x.day===day && x.time===time; })[0];
    if(!s) return;
    if(mode==='book'){
      var chk=checkSlotAllowed(custId,k,day,s.start,s.end);
      if(!chk.allowed){ showToast(chk.reason,null,null); return; }
    }
    var cr=crFor(custId);
    var rt=cr.services[k];
    rt.picks=[{day:day,time:time,start:s.start,end:s.end,instructor:s.instructor,location:s.location,mode:mode}];
    rt.complete=true;
    render();
  },

  pickPrivate:function(custId,k,day,time,length){
    var slots=slotsForType(k);
    var s=slots.filter(function(x){ return x.day===day && x.time===time; })[0];
    if(!s) return;
    var cr=crFor(custId);
    var rt=cr.services[k];
    var existed = rt.picks.length>0;
    if(existed && rt.picks[0].length!==length){
      showToast('Changing session length will clear your '+rt.picks.length+' selected session(s). Continue?', function(){
        rt.picks=[{day:day,time:time,start:s.start,end:s.end,instructor:s.instructor,location:s.location,length:length,mode:'book'}];
        rt.complete=true; render();
      }, function(){ render(); });
      return;
    }
    rt.picks=[{day:day,time:time,start:s.start,end:s.end,instructor:s.instructor,location:s.location,length:length,mode:'book'}];
    rt.complete=true;
    render();
  },

  // Staff override for check 5 (skill level) — never a filter, only a selection gate
  // (§2.19, §3.8, §6.5). Recorded like every other override.
  applyLevelOverride:function(custId,k){
    var cr=crFor(custId);
    var rt=cr.services[k];
    var svc=CUSTOMERS[custId].services[k];
    rt.levelOverride=true;
    cr.overrides.push({svc:k, who:'Jordan Lee (Staff)', when:'Sep 9, 2026 10:02a', reason:'Level mismatch override — '+svc.name+' requires '+svc.level+', customer is '+(svc.customerLevel||'a different level')+'.', duration:'ONE_APPOINTMENT'});
    render();
  },

  setPreviewView:function(id,view){ crFor(id).previewView=view; render(); },
  togglePreviewDate:function(id,dateId){
    var cr=crFor(id); cr.previewChecks=cr.previewChecks||{};
    cr.previewChecks[dateId] = cr.previewChecks[dateId]===false ? true : false;
    render();
  },

  setFundingType:function(id,k,type){ var rt=crFor(id).services[k]; rt.funding.type=type; rt.funding.processed=false; render(); },
  setRcebCode:function(id,k,val){ crFor(id).services[k].funding.rceb.code=val; render(); },
  processFunding:function(id,k){ crFor(id).services[k].funding.processed=true; render(); },
  setSelfPayMethod:function(id,k,m){ crFor(id).services[k].funding.selfpay.method=m; render(); },
  useNewCard:function(id,k){ crFor(id).services[k].funding.selfpay.newCard=true; render(); },

  toggleOverride:function(id,k){ var rt=crFor(id).services[k]; rt.overrideOpen=!rt.overrideOpen; render(); },
  setOverrideField:function(id,k,field,val){ var rt=crFor(id).services[k]; rt.overrideDraft=rt.overrideDraft||{}; rt.overrideDraft[field]=val; render(); },
  applyOverride:function(id,k){
    var cr=crFor(id); var rt=cr.services[k];
    var ov=rt.overrideDraft||{};
    if(!ov.reason || !ov.expiry) return;
    cr.overrides.push({svc:k, who:'Jordan Lee (Manager)', when:'Sep 8, 2026 3:14p', reason:ov.reason, duration:ov.duration, expiry:ov.expiry, affected:ov.affected, expected:ov.expected});
    rt.funding.rcebOverride=true;
    rt.overrideOpen=false;
    render();
  }
};
window.Z = Z;

render();
/*APPEND_MARKER*/
</script>
</body>
</html>
