<!--
  Zalexy Prototype — Booking Flow (single file, two audiences)
  Spec:   ai-workspace/prototypes/staff/booking-flow.md
          ai-workspace/prototypes/client/booking-flow.md
  Design: ai-workspace/prototypes/_shared/design-system.md

  One implementation. `?mode=client` hides the staff-only affordances
  (role switch, create-slot drawer, manager funding override, level override,
  audit strings, internal notes). The workflow itself is identical.

  Flow (v2, per the whiteboard): Who -> What (services per person, packages
  bought here) -> When (order, how often, days & time, instructor multi-select)
  -> Classes board (ALL matching classes together at the end) -> Preview ->
  Payment -> Review. Customer details open in a modal, never inline.

  Static prototype. Not production code. No app dependencies.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Zalexy — New booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
/* ============================================================
   Zalexy — Booking Flow · refined visual system
   Palette unchanged: slate / emerald / blue on #f8fafc.
   Workflow unchanged: presentation layer only.
   ============================================================ */
:root{
  --primary:#334155;--primary-light:#475569;--primary-dark:#1e293b;
  --secondary:#10b981;--secondary-light:#34d399;--secondary-dark:#059669;
  --success:#10b981;--success-bg:#d1fae5;--success-dark:#047857;
  --info:#3b82f6;--info-bg:#eff6ff;--info-dark:#1d4ed8;--info-hover:#2563eb;
  --bg-default:#f8fafc;--bg-paper:#fff;
  --text-primary:#0f172a;--text-secondary:#64748b;
  --border:#f1f5f9;--line:#e2e8f0;--border-input:#cbd5e1;--border-input-hover:#94a3b8;
  --hover-row:#f1f5f9;--action-hover:rgba(71,85,105,.045);--action-selected:rgba(71,85,105,.08);
  --danger:#ef4444;--warning:#f59e0b;--warn-bg:#fef3c7;--warn-dark:#b45309;
  --danger-bg:#fee2e2;--danger-dark:#b91c1c;
  --radius-card:14px;--radius-base:10px;--radius-control:8px;--radius-chip:999px;
  --shadow-card:0 1px 2px rgba(15,23,42,.04),0 2px 8px rgba(15,23,42,.03);
  --shadow-pop:0 2px 4px rgba(15,23,42,.05),0 8px 20px rgba(15,23,42,.07);
  --ring:0 0 0 3px rgba(59,130,246,.16);
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Roboto','Helvetica','Arial',sans-serif;background:var(--bg-default);color:var(--text-primary);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--info-dark)}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:4px}
::selection{background:rgba(59,130,246,.16)}
.material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;line-height:1}
h1,h2,h3,h4,h5{letter-spacing:-.015em}

/* ---------- scrollbars ---------- */
.main-area::-webkit-scrollbar{width:12px}
.main-area::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;border:3px solid var(--bg-default)}
.main-area::-webkit-scrollbar-thumb:hover{background:var(--border-input-hover)}
.main-area::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.main-shell{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:58px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex-shrink:0;gap:16px}
.topbar-l{display:flex;align-items:center;gap:14px;min-width:0}
.brand{display:inline-flex;align-items:center;gap:9px}
.brand-mark{width:27px;height:27px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--text-primary));color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:800;letter-spacing:.02em;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(15,23,42,.2)}
.brand-name{font-size:.88rem;font-weight:700;letter-spacing:-.01em;color:var(--text-primary)}
.brand-div{width:1px;height:20px;background:var(--line)}
.loc-pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--text-secondary)}
.loc-pill .material-symbols-rounded{font-size:16px;color:var(--border-input-hover)}
.topbar-r{display:flex;align-items:center;gap:16px}
.mode-switch{display:flex;background:#eef2f7;border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.mode-switch button{border:none;background:transparent;border-radius:6px;padding:5px 12px;font-size:.75rem;font-weight:600;color:var(--text-secondary);transition:color .15s var(--ease),background .15s var(--ease),box-shadow .15s var(--ease)}
.mode-switch button:hover{color:var(--text-primary)}
.mode-switch button[aria-pressed="true"]{background:#fff;color:var(--text-primary);box-shadow:0 1px 2px rgba(15,23,42,.1),0 0 0 .5px rgba(15,23,42,.04)}
.role-select{border:1px solid var(--border-input);border-radius:var(--radius-control);padding:6px 10px;font-size:.78rem;font-weight:600;background:#fff;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.role-select:hover{border-color:var(--border-input-hover)}
.main-area{flex:1;overflow-y:auto;scroll-behavior:smooth;background:var(--bg-default)}

.shell{max-width:1240px;margin:0 auto;padding:26px 26px 56px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:24px;align-items:start}
@media(max-width:1180px){.grid{grid-template-columns:minmax(0,1fr)}}

/* ---------- page header ---------- */
.crumb{font-size:.76rem;color:var(--text-secondary);display:flex;align-items:center;gap:5px}
.crumb a{color:var(--text-secondary);text-decoration:none;transition:color .12s var(--ease)}
.crumb a:hover{color:var(--text-primary)}
.crumb .material-symbols-rounded{font-size:14px;color:#b6c2d1}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:10px 0 22px;flex-wrap:wrap}
h1{font-size:1.72rem;font-weight:800;letter-spacing:-.025em;line-height:1.12}
.head-sub{font-size:.84rem;color:var(--text-secondary);margin-top:5px}
.seg{display:inline-flex;background:#eef2f7;border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;border-radius:8px;padding:7px 16px;font-size:.82rem;font-weight:600;color:var(--text-secondary);white-space:nowrap;transition:color .15s var(--ease),background .15s var(--ease),box-shadow .15s var(--ease)}
.seg button:hover{color:var(--text-primary)}
.seg button[aria-pressed="true"]{background:var(--primary-dark);color:#fff;box-shadow:0 1px 2px rgba(15,23,42,.24)}

/* ---------- progress rail ---------- */
.rail-wrap{position:sticky;top:0;z-index:20;background:rgba(248,250,252,.92);backdrop-filter:blur(8px);padding:6px 0 14px;margin:-6px 0 0}
.rail{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 8px;height:54px;overflow:hidden;box-shadow:var(--shadow-card)}
.rnode{display:flex;align-items:center;gap:9px;padding:0 14px;height:100%;background:none;border:none;flex-shrink:0}
.rnode:disabled{cursor:default}
.rdot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:700;flex-shrink:0;transition:background .18s var(--ease),color .18s var(--ease)}
.rdot .material-symbols-rounded{font-size:14px;font-variation-settings:'wght' 700}
.rdot.done{background:var(--success-bg);color:var(--success-dark)}
.rdot.act{background:var(--primary-dark);color:#fff;box-shadow:0 0 0 4px rgba(30,41,59,.08)}
.rdot.fut{background:var(--border);color:var(--border-input-hover)}
.rlbl{font-size:.82rem;font-weight:600;white-space:nowrap;transition:color .15s var(--ease)}
.rlbl.done{color:var(--text-secondary)}
.rlbl.act{color:var(--text-primary);font-weight:700}
.rlbl.fut{color:#9aa8ba}
.rnode:not(:disabled):hover .rlbl{color:var(--text-primary)}
.rsep{flex:1;height:2px;background:var(--border);min-width:8px;border-radius:2px}

/* ---------- people strip ---------- */
.pstrip{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.ptab{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 7px;border-radius:999px;font-size:.82rem;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--text-secondary);transition:border-color .15s var(--ease),background .15s var(--ease),color .15s var(--ease),box-shadow .15s var(--ease)}
.ptab:hover{border-color:var(--border-input)}
.ptab[aria-pressed="true"]{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff;box-shadow:0 1px 3px rgba(15,23,42,.22)}
.ptab .av{width:24px;height:24px;font-size:.62rem}
.ptab-add{padding:7px 14px;border-radius:999px;font-size:.8rem;font-weight:600;border:1.5px dashed var(--border-input);background:transparent;color:var(--text-secondary);transition:border-color .15s var(--ease),color .15s var(--ease);display:inline-flex;align-items:center;gap:5px}
.ptab-add:hover{border-color:var(--primary-light);color:var(--text-primary)}

/* ---------- panels ---------- */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius-card);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow-card)}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 22px 16px;border-bottom:1px solid var(--border)}
.p-head h2{font-size:1.12rem;font-weight:700;letter-spacing:-.018em}
.p-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--info-dark);margin-bottom:5px}
.p-eyebrow::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--info);flex-shrink:0}
.p-hint{font-size:.82rem;color:var(--text-secondary);margin-top:4px;max-width:62ch;line-height:1.55}
.p-body{padding:18px 22px 22px}
.done-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-base);padding:11px 15px;margin-bottom:8px;transition:border-color .15s var(--ease)}
.done-row:hover{border-color:var(--border-input)}
.done-row .tick{width:20px;height:20px;border-radius:50%;background:var(--success-bg);color:var(--success-dark);display:grid;place-items:center;flex-shrink:0}
.done-row .tick .material-symbols-rounded{font-size:13px;font-variation-settings:'wght' 700}
.done-row .dk{font-size:.76rem;font-weight:700;color:var(--text-secondary);flex-shrink:0;width:66px;text-transform:uppercase;letter-spacing:.04em}
.done-row .dv{flex:1;font-size:.85rem;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-btn{background:none;border:none;color:var(--info-dark);font-size:.8rem;font-weight:600;padding:0;transition:color .12s var(--ease)}
.link-btn:hover{text-decoration:underline}

/* ---------- section label ---------- */
.sub{font-size:.92rem;font-weight:700;margin:24px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:-.01em}
.sub .c{font-size:.77rem;font-weight:500;color:var(--text-secondary);letter-spacing:0}
.sub .sp{flex:1}
.hint{font-size:.8rem;color:var(--text-secondary);line-height:1.6;max-width:68ch}

/* ---------- form controls ---------- */
.fld{margin-bottom:16px}
.fld label{display:block;font-size:.68rem;font-weight:700;color:var(--text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.inp{width:100%;height:40px;border:1px solid var(--border-input);border-radius:var(--radius-control);padding:8px 12px;font-size:.875rem;background:#fff;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.inp:hover{border-color:var(--border-input-hover)}
.inp:focus{border-color:var(--info);outline:none;box-shadow:var(--ring)}
.inp::placeholder{color:#9aa8ba}
textarea.inp{height:auto;min-height:64px;resize:vertical;line-height:1.55}
.search{position:relative}
.search>.material-symbols-rounded{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:19px;color:var(--border-input-hover);pointer-events:none}
.search .inp{padding-left:38px;height:42px}
select.inp{height:34px;padding:5px 10px;font-size:.8rem}

/* ---------- buttons ---------- */
.btn{border-radius:var(--radius-control);padding:0 16px;height:38px;font-size:.85rem;font-weight:600;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:background .15s var(--ease),border-color .15s var(--ease),box-shadow .15s var(--ease),color .15s var(--ease)}
.btn .material-symbols-rounded{font-size:17px}
.btn-primary{background:var(--info);color:#fff;box-shadow:0 1px 2px rgba(37,99,235,.28),inset 0 1px 0 rgba(255,255,255,.14)}
.btn-primary:hover{background:var(--info-hover)}
.btn-dark{background:var(--primary-dark);color:#fff;box-shadow:0 1px 2px rgba(15,23,42,.24),inset 0 1px 0 rgba(255,255,255,.1)}
.btn-dark:hover{background:var(--primary)}
.btn-go{background:var(--secondary);color:#fff;box-shadow:0 1px 2px rgba(5,150,105,.3),inset 0 1px 0 rgba(255,255,255,.16)}
.btn-go:hover{background:var(--secondary-dark)}
.btn-ghost{background:#fff;color:var(--text-primary);border-color:var(--border-input);box-shadow:0 1px 1.5px rgba(15,23,42,.05)}
.btn-ghost:hover{border-color:var(--border-input-hover);background:var(--bg-default)}
.btn-quiet{background:transparent;color:var(--text-secondary);border-color:transparent}
.btn-quiet:hover{background:var(--hover-row);color:var(--text-primary)}
.btn-warn{background:#fff;color:var(--warn-dark);border-color:#fcd34d;box-shadow:0 1px 1.5px rgba(15,23,42,.05)}
.btn-warn:hover{background:var(--warn-bg)}
.btn:disabled{cursor:not-allowed;background:var(--border);color:#9aa8ba;border-color:transparent;box-shadow:none}
.btn-ghost:disabled{background:#fff;border-color:var(--border)}
.btn-sm{padding:0 12px;height:32px;font-size:.79rem;border-radius:7px}
.btn-sm .material-symbols-rounded{font-size:15px}
.btn-block{width:100%}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;border-radius:var(--radius-chip);padding:0 9px;font-size:.72rem;font-weight:600;white-space:nowrap}
.chip .material-symbols-rounded{font-size:14px}
.k-ok{background:var(--success-bg);color:var(--success-dark)}
.k-info{background:var(--info-bg);color:var(--info-dark)}
.k-warn{background:var(--warn-bg);color:var(--warn-dark)}
.k-bad{background:var(--danger-bg);color:var(--danger-dark)}
.k-mute{background:var(--border);color:var(--primary-light)}
.tag{display:inline-flex;align-items:center;height:19px;border-radius:5px;padding:0 7px;font-size:.62rem;font-weight:700;letter-spacing:.08em;background:var(--border);color:var(--primary-light)}
.tag.wet{background:#e0f2fe;color:#0369a1}
.tag.dry{background:var(--warn-bg);color:var(--warn-dark)}

/* ---------- avatar ---------- */
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--primary-light),var(--primary-dark));color:#fff;display:grid;place-items:center;font-size:.7rem;font-weight:700;flex-shrink:0;letter-spacing:.03em;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.av.s{width:22px;height:22px;font-size:.58rem}
.av.q{background:var(--border);color:var(--text-secondary);box-shadow:none}

/* ---------- person row + disclosure ---------- */
.p-row{border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden;background:#fff;transition:border-color .15s var(--ease),box-shadow .15s var(--ease),background .15s var(--ease)}
.p-row:hover{border-color:var(--border-input)}
.p-row.sel{border-color:var(--primary-dark);box-shadow:inset 3px 0 0 var(--primary-dark),var(--shadow-card);background:#fbfcfe}
.p-row.off{opacity:.55}
.p-main{display:flex;align-items:center;gap:13px;padding:13px 16px;width:100%;background:none;border:none;text-align:left}
.p-main:not(:disabled){cursor:pointer}
.cbx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-input);flex-shrink:0;display:grid;place-items:center;background:#fff;transition:background .15s var(--ease),border-color .15s var(--ease)}
.cbx .material-symbols-rounded{font-size:15px;color:#fff;font-variation-settings:'wght' 700;opacity:0;transition:opacity .15s var(--ease)}
.p-row.sel .cbx{background:var(--primary-dark);border-color:var(--primary-dark)}
.p-row.sel .cbx .material-symbols-rounded{opacity:1}
.p-id{flex:1;min-width:0}
.p-name{font-size:.92rem;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.p-meta{font-size:.78rem;color:var(--text-secondary);margin-top:3px;display:block}
.p-act{display:flex;align-items:center;gap:6px;padding:0 14px 12px 49px;flex-wrap:wrap}
.disc{background:none;border:none;display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;color:var(--text-secondary);padding:5px 9px 5px 7px;border-radius:7px;flex-shrink:0;transition:background .15s var(--ease),color .15s var(--ease)}
.disc:hover{background:var(--hover-row);color:var(--text-primary)}
.disc .material-symbols-rounded{font-size:17px;transition:transform .18s var(--ease)}
.disc[aria-expanded="true"] .material-symbols-rounded{transform:rotate(180deg)}
.p-detail{border-top:1px solid var(--border);background:#f8fafc;padding:16px}

/* ---------- definition grid ---------- */
.dl{border:1px solid var(--line);border-radius:var(--radius-base);overflow:hidden;background:#fff}
.dl-row{display:grid;grid-template-columns:190px minmax(0,1fr)}
.dl-row+.dl-row{border-top:1px solid var(--border)}
.dl-k{padding:10px 14px;font-size:.74rem;font-weight:600;color:var(--text-secondary);background:#f8fafc}
.dl-v{padding:10px 14px;font-size:.85rem;color:var(--text-primary);min-width:0;overflow-wrap:anywhere}
.dl-v.bal{font-weight:700;color:var(--info-dark)}
@media(max-width:640px){.dl-row{grid-template-columns:1fr}.dl-v{padding-top:0}}

/* ---------- unit meter ---------- */
.meter{display:inline-flex;align-items:center;gap:9px;flex-wrap:wrap}
.meter-track{display:inline-flex;gap:3px}
.meter-track i{width:11px;height:14px;border-radius:3px;background:var(--line);display:block}
.meter-track i.on{background:var(--secondary-dark)}
.meter-txt{font-size:.78rem;font-weight:700;color:var(--info-dark);font-variant-numeric:tabular-nums}

/* ---------- eligibility card ---------- */
.elig{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px;background:#fff;box-shadow:var(--shadow-card)}
.elig-hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.elig-hd h4{font-size:.95rem;font-weight:700}
.elig-hd .sp{flex:1}
.kv{display:flex;align-items:baseline;gap:10px;font-size:.83rem;padding:4px 0}
.kv b{min-width:158px;color:var(--text-secondary);font-weight:600;flex-shrink:0;font-size:.79rem}
.kv .v{min-width:0;overflow-wrap:anywhere}
@media(max-width:560px){.kv{flex-direction:column;gap:2px}.kv b{min-width:0}}

/* ---------- notes ---------- */
.note{display:flex;gap:10px;border-radius:10px;padding:12px 15px;font-size:.82rem;line-height:1.55;margin-top:12px;align-items:flex-start}
.note>.material-symbols-rounded{font-size:18px;flex-shrink:0;margin-top:1px}
.n-info{background:var(--info-bg);color:#1e40af}
.n-warn{background:var(--warn-bg);color:#92400e}
.n-ok{background:var(--success-bg);color:var(--success-dark)}
.n-bad{background:var(--danger-bg);color:#991b1b}
.n-mute{background:var(--bg-default);color:var(--text-secondary)}
.reasons{list-style:none;margin-top:7px;display:flex;flex-direction:column;gap:4px}
.reasons li{font-size:.76rem;color:var(--warn-dark);display:flex;gap:7px;line-height:1.5}
.reasons li::before{content:'';width:3px;height:3px;border-radius:50%;background:currentColor;flex-shrink:0;margin-top:7px}

/* ---------- pills ---------- */
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:0 14px;height:34px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--text-secondary);font-size:.8rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s var(--ease),background .15s var(--ease),color .15s var(--ease),box-shadow .15s var(--ease)}
.pill:hover{border-color:var(--border-input);color:var(--text-primary)}
.pill[aria-pressed="true"]{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff;box-shadow:0 1px 3px rgba(15,23,42,.2)}
.pill small{font-size:.66rem;font-weight:600;opacity:.75}
.pill:disabled{opacity:.45;cursor:not-allowed}

/* ---------- day picker ---------- */
.dp{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px;background:#fff;box-shadow:var(--shadow-card)}
.dp-bar{display:flex;align-items:center;gap:8px;padding:11px 14px;background:#f8fafc;border-bottom:1px solid var(--border);flex-wrap:wrap}
.dp-bar .sp{flex:1;min-width:12px}
.dp-row{display:grid;grid-template-columns:160px minmax(0,1fr) 34px;align-items:center;gap:12px;padding:10px 14px;transition:background .15s var(--ease)}
.dp-row+.dp-row{border-top:1px solid var(--border)}
.dp-row.on{background:#f0fdf6}
.dp-row.off .dp-times{opacity:.45}
.dp-day{display:flex;align-items:center;gap:11px;font-size:.86rem;cursor:pointer}
.dp-day input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary-dark);flex-shrink:0;cursor:pointer}
.dp-day .d{font-weight:700;line-height:1.2}
.dp-day .dt{font-size:.72rem;color:var(--text-secondary);font-weight:500;display:block;margin-top:1px;font-variant-numeric:tabular-nums}
.dp-row.off .dp-day .d{color:var(--text-secondary)}
.dp-times{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--text-secondary);flex-wrap:wrap}
.dp-times select{width:auto;min-width:112px;flex:0 0 auto}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--border-input-hover);transition:background .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease)}
.icon-btn:hover{background:var(--hover-row);color:var(--text-primary);border-color:var(--line)}
.icon-btn .material-symbols-rounded{font-size:17px}
@media(max-width:700px){.dp-row{grid-template-columns:1fr 34px}.dp-times{grid-column:1/-1}}

/* ---------- class slot rail ---------- */
.dayband{display:flex;align-items:center;gap:10px;margin:20px 0 0}
.dayband h5{font-size:.84rem;font-weight:700}
.dayband .c{font-size:.76rem;color:var(--text-secondary)}
.dayband .ln{flex:1;height:1px;background:var(--border)}
.rail-scroll{display:flex;gap:12px;overflow-x:auto;padding:12px 2px 14px;scroll-snap-type:x proximity}
.rail-scroll::-webkit-scrollbar{height:8px}
.rail-scroll::-webkit-scrollbar-track{background:var(--border);border-radius:4px}
.rail-scroll::-webkit-scrollbar-thumb{background:var(--border-input);border-radius:4px}
.rail-scroll::-webkit-scrollbar-thumb:hover{background:var(--border-input-hover)}
.slot{flex:0 0 272px;scroll-snap-align:start;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;background:#fff;transition:border-color .16s var(--ease),box-shadow .16s var(--ease),background .16s var(--ease)}
.slot:hover{border-color:var(--border-input);box-shadow:var(--shadow-pop)}
.slot.sel{border-color:var(--info);box-shadow:inset 0 0 0 1px var(--info),var(--ring);background:var(--info-bg)}
.slot.blocked{background:#f8fafc}
.slot-time{font-size:1.02rem;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.slot-svc{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;margin-top:5px;flex-wrap:wrap}
.slot-svc .dot{width:7px;height:7px;border-radius:50%;background:var(--primary-light);flex-shrink:0}
.slot-line{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--text-secondary);margin-top:6px;flex-wrap:wrap}
.slot-line .material-symbols-rounded{font-size:15px;color:var(--border-input-hover)}
.slot-fill{display:flex;align-items:center;gap:9px;margin-top:12px;flex-wrap:wrap}
.seats{display:flex;gap:2.5px}
.seats i{width:9px;height:9px;border-radius:2.5px;background:var(--line);display:block}
.seats i.on{background:var(--primary)}
.fill-w{font-size:.74rem;font-weight:700}
.f-open{color:var(--success-dark)}.f-lim{color:var(--warn-dark)}.f-full{color:var(--danger-dark)}
.slot-bal{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.74rem;color:var(--text-secondary)}
.slot-acts{display:flex;flex-direction:column;gap:7px;margin-top:auto;padding-top:14px}
.slot-foot{border-top:1px solid var(--border);margin-top:12px;padding-top:10px}
.empty{font-size:.82rem;color:var(--text-secondary);padding:16px;display:flex;align-items:center;gap:9px;margin-top:8px;border:1.5px dashed var(--line);border-radius:12px;background:#fcfdfe;line-height:1.5}
.empty .material-symbols-rounded{font-size:19px;color:var(--border-input-hover);flex-shrink:0}

/* ---------- collapsible service section ---------- */
.svc{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:#fff;transition:border-color .15s var(--ease)}
.svc:hover{border-color:var(--border-input)}
.svc.locked{background:#f8fafc}
.svc-hd{display:flex;align-items:center;gap:11px;padding:14px 16px;width:100%;background:none;border:none;text-align:left}
.svc-hd:not(:disabled){cursor:pointer}
.svc-hd:not(:disabled):hover{background:#f8fafc}
.svc-hd .chev{font-size:20px;color:var(--border-input-hover);transition:transform .18s var(--ease);flex-shrink:0}
.svc-hd[aria-expanded="true"] .chev{transform:rotate(90deg)}
.svc-hd h3{font-size:.92rem;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.svc-hd .sp{flex:1}
.svc-bd{padding:0 16px 18px;border-top:1px solid var(--border)}
.svc-bd .sub:first-child{margin-top:16px}

/* ---------- selected-service band ---------- */
.band{display:flex;align-items:flex-start;gap:12px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:13px 15px;margin-top:10px}
.band .dot{width:8px;height:8px;border-radius:50%;background:var(--secondary-dark);flex-shrink:0;margin-top:6px}
.band-id{flex:1;min-width:0}
.band-t{font-size:.9rem;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.band-s{font-size:.78rem;color:var(--text-secondary);margin-top:2px}
.band-f{display:flex;align-items:center;gap:14px;margin-top:7px;flex-wrap:wrap;font-size:.76rem;color:var(--success-dark);font-weight:600}
.band-f .material-symbols-rounded{font-size:15px;vertical-align:-2px}

/* ---------- marketplace ---------- */
.mkt{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
@media(max-width:760px){.mkt{grid-template-columns:1fr}}
.mkt-card{border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;background:#fff;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.mkt-card:hover{border-color:var(--border-input);box-shadow:var(--shadow-pop)}
.mkt-card h4{font-size:.95rem;font-weight:700}
.mkt-card .what{font-size:.8rem;color:var(--text-secondary);margin:5px 0 12px;line-height:1.55}
.mkt-price{font-size:1.32rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mkt-was{font-size:.76rem;color:var(--text-secondary);margin-top:3px}
.mkt-foot{margin-top:auto;padding-top:14px}

/* ---------- preview list ---------- */
.dates{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px;background:#fff}
.dt-grp{display:flex;align-items:center;gap:8px;padding:9px 14px;background:#f8fafc;font-size:.74rem;font-weight:700;color:var(--text-secondary);border-bottom:1px solid var(--border);letter-spacing:.02em}
.dt-row{display:flex;align-items:center;gap:12px;padding:10px 14px;font-size:.85rem;flex-wrap:wrap;transition:background .12s var(--ease)}
label.dt-row{cursor:pointer}
label.dt-row:hover{background:#fbfdff}
.dt-row+.dt-row{border-top:1px solid var(--border)}
.dt-row .d{font-weight:600;min-width:92px;font-variant-numeric:tabular-nums}
.dt-row .m{color:var(--text-secondary);font-size:.79rem;flex:1;min-width:0}
.dt-row.skip .d{font-weight:500;text-decoration:line-through;color:var(--text-secondary)}
.dt-row.tent{background:#fcfdfe}
.dt-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary-dark);flex-shrink:0;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.cal-h{font-size:.66rem;font-weight:700;color:var(--text-secondary);text-align:center;padding-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.cal-c{border:1px solid var(--border);border-radius:9px;min-height:56px;padding:6px 7px;font-size:.73rem;color:var(--border-input-hover);background:#fcfdfe}
.cal-c.has{border-color:var(--border-input);color:var(--text-primary);font-weight:700;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.cal-c .cd{display:block;width:7px;height:7px;border-radius:50%;margin-top:6px}

/* ---------- summary rail ---------- */
.rail-col{position:sticky;top:88px;display:flex;flex-direction:column;gap:14px}
@media(max-width:1180px){.rail-col{position:static;top:auto}}
.sum{background:#fff;border:1px solid var(--line);border-radius:var(--radius-card);overflow:hidden;box-shadow:var(--shadow-card)}
.sum-hd{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sum-hd h3{font-size:.88rem;font-weight:700}
.sum-bd{padding:5px 18px 13px}
.sum-p{padding:12px 0;border-bottom:1px solid var(--border)}
.sum-p:last-child{border-bottom:none}
.sum-p-n{display:flex;align-items:center;gap:9px;font-size:.86rem;font-weight:700}
.sum-l{display:flex;justify-content:space-between;gap:12px;font-size:.79rem;margin-top:8px;padding-left:31px}
.sum-l .n{color:var(--text-secondary);min-width:0}
.sum-l .v{font-weight:600;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.sum-l.none .n{font-style:italic}
.sum-due{background:#f8fafc;border-top:1px solid var(--line);padding:16px 18px}
.due-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.due-row .n{font-size:.78rem;font-weight:600;color:var(--text-secondary)}
.due-row .v{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.due-note{font-size:.74rem;color:var(--text-secondary);margin-top:7px;line-height:1.55}
.sum-empty{font-size:.82rem;color:var(--text-secondary);line-height:1.6;padding:6px 0 10px}

/* ---------- footer ---------- */
.foot-wrap{position:sticky;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:30;box-shadow:0 -6px 18px rgba(15,23,42,.04)}
.foot{max-width:1240px;margin:0 auto;padding:13px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.foot-note{font-size:.79rem;color:var(--text-secondary);text-align:right;max-width:48ch;line-height:1.5}
.foot-r{display:flex;align-items:center;gap:14px}

/* ---------- drawer / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.42);backdrop-filter:blur(2px);z-index:60;border:none;animation:fadeIn .18s var(--ease)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:94vw;background:#fff;z-index:61;display:flex;flex-direction:column;box-shadow:-16px 0 44px rgba(15,23,42,.2);border-radius:16px 0 0 16px;animation:drawerIn .24s var(--ease)}
.dw-hd{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.dw-hd h3{font-size:1.05rem;font-weight:700}
.dw-bd{padding:20px 22px;overflow-y:auto;flex:1}
.dw-ft{padding:15px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:#fcfdfe;border-radius:0 0 0 16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.match{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px;background:#fff}
.match .m-id{flex:1;min-width:0}
.match .m-n{font-size:.85rem;font-weight:600}
.match .m-w{font-size:.76rem;color:var(--text-secondary);margin-top:2px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--text-primary);color:#fff;border-radius:12px;padding:13px 16px;font-size:.83rem;display:flex;align-items:center;gap:16px;z-index:80;box-shadow:0 12px 32px rgba(15,23,42,.35);max-width:min(660px,92vw);line-height:1.5;animation:toastIn .22s var(--ease)}
.toast>.material-symbols-rounded{font-size:19px;flex-shrink:0;color:#93c5fd}
.toast .t-txt{flex:1}
.toast button{border-radius:8px;padding:7px 14px;font-size:.79rem;font-weight:600;border:none;white-space:nowrap;transition:background .15s var(--ease)}
.toast .t-go{background:var(--info);color:#fff}
.toast .t-go:hover{background:var(--info-hover)}
.toast .t-no{background:rgba(255,255,255,.16);color:#fff}
.toast .t-no:hover{background:rgba(255,255,255,.26)}

/* ---------- customer details modal ---------- */
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:660px;max-width:94vw;max-height:86vh;background:#fff;z-index:71;border-radius:16px;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(15,23,42,.3);animation:modalIn .22s var(--ease)}
.modal-hd{padding:16px 52px 16px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative}
.modal-x{position:absolute;top:12px;right:12px}
.modal-id{min-width:0}
.modal-id .m-t{font-size:1.02rem;font-weight:700;letter-spacing:-.01em}
.modal-id .m-s{font-size:.78rem;color:var(--text-secondary);margin-top:2px}
.modal-bd{padding:18px 22px;overflow-y:auto;flex:1}
.modal-ft{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:#fcfdfe;border-radius:0 0 16px 16px;flex-wrap:wrap}
.modal-hd .sp{flex:1}

/* ---------- What step — service cards ---------- */
.wcard{border:1px solid var(--line);border-radius:12px;margin-top:12px;background:#fff;overflow:hidden;transition:border-color .15s var(--ease),box-shadow .15s var(--ease),background .15s var(--ease)}
.wcard:hover{border-color:var(--border-input)}
.wcard.sel{border-color:var(--primary-dark);box-shadow:inset 3px 0 0 var(--primary-dark),var(--shadow-card);background:#fbfcfe}
.wcard-hd{display:flex;align-items:center;gap:14px;padding:14px 16px;flex-wrap:wrap}
.wcard-id{flex:1;min-width:230px}
.wcard-t{font-size:.95rem;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wcard-s{font-size:.78rem;color:var(--text-secondary);margin-top:3px}
.wcard-chips{display:flex;align-items:center;gap:6px;padding:0 16px 13px;flex-wrap:wrap}
.wcard-bd{border-top:1px solid var(--border);background:#f8fafc;padding:14px 16px}
.wcard-hd .sp{flex:1}
.wcard-chips .pill{height:30px;padding:0 12px;font-size:.78rem}
.wcard-chips .pill .tag{height:16px;font-size:.56rem;padding:0 6px}

/* ---------- What step — chosen service rows ---------- */
.srow{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px 14px;margin-top:10px;transition:border-color .15s var(--ease)}
.srow.on{border-color:var(--primary-dark);background:#fbfcfe;box-shadow:inset 3px 0 0 var(--primary-dark)}
.srow .s-id{flex:1;min-width:260px}
.srow .s-t{font-size:.9rem;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.srow .s-m{font-size:.78rem;color:var(--text-secondary);margin-top:5px;line-height:1.55;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.srow .s-m .material-symbols-rounded{font-size:15px;color:var(--border-input-hover)}
.srow.on .cbx{background:var(--primary-dark);border-color:var(--primary-dark)}
.srow.on .cbx .material-symbols-rounded{opacity:1}

/* ---------- how often ---------- */
.freq{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.freq .fld{margin-bottom:0}
.freq .fld .inp{width:auto;min-width:160px}

/* ---------- classes board ---------- */
.classes-head{display:flex;align-items:center;gap:10px;margin:28px 0 2px;padding-top:20px;border-top:2px solid var(--line);flex-wrap:wrap}
.classes-head .ch-t{display:inline-flex;align-items:center;gap:7px;font-size:1.05rem;font-weight:800;letter-spacing:-.015em}
.classes-head .ch-t .material-symbols-rounded{font-size:20px;color:var(--info-dark)}
.classes-head .ch-s{font-size:.78rem;color:var(--text-secondary)}
.classes-head .ln{flex:1;height:1px;background:var(--border);min-width:24px}
.svc-band{display:flex;align-items:baseline;gap:9px;margin:20px 0 0;flex-wrap:wrap}
.svc-band h4{font-size:.94rem;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.svc-band .c{font-size:.76rem;color:var(--text-secondary)}

@keyframes modalIn{from{transform:translate(-50%,-48.5%) scale(.985);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}

/* ---------- override panel ---------- */
.ovr{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:16px;margin-top:11px}
.ovr .audit{font-size:.76rem;color:var(--warn-dark);margin-top:8px;line-height:1.55}
.ovr .fld label{color:#92400e}

/* ---------- outcome / success ---------- */
.out{border-radius:12px;padding:14px 16px;border-left:3px solid;display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.out>.material-symbols-rounded{font-size:21px;flex-shrink:0;margin-top:1px}
.out-t{font-size:.92rem;font-weight:700}
.out-s{font-size:.8rem;margin-top:3px;line-height:1.55}
.o-confirmed{background:var(--success-bg);border-left-color:var(--secondary-dark);color:var(--success-dark)}
.o-pending,.o-authhold{background:var(--warn-bg);border-left-color:var(--warning);color:#92400e}
.o-waitlisted{background:var(--info-bg);border-left-color:var(--info);color:#1e40af}
.o-paymenthold{background:var(--danger-bg);border-left-color:var(--danger);color:#991b1b}
.done-wrap{text-align:center;padding:48px 24px}
.done-ico{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px}
.done-ico .material-symbols-rounded{font-size:30px}
.done-wrap h2{font-size:1.42rem;font-weight:800;letter-spacing:-.02em}
.done-wrap .who{font-size:.87rem;color:var(--text-secondary);margin-top:6px}
.done-acts{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes drawerIn{from{transform:translateX(28px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toastIn{from{transform:translateX(-50%) translateY(10px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

body.client .staff-only{display:none!important}
.print-only{display:none}
@media print{
  .sidebar,.topbar,.rail-wrap,.head .seg,.pstrip,.foot-wrap,.toast,.drawer,.scrim,.modal,button{display:none!important}
  .main-area{overflow:visible!important}
  body,.app{display:block!important;height:auto!important}
  .grid{grid-template-columns:1fr!important}
  .rail-col,#flow{display:none!important}
  .print-only{display:block}
  .print-p{page-break-before:always}
  .print-p:first-child{page-break-before:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="app">
  <script src="shared-sidebar.js" data-inject="true"></script>
  <div class="main-shell">
    <div class="topbar">
      <div class="topbar-l">
        <span class="brand"><span class="brand-mark">Z</span><span class="brand-name">Zalexy</span></span>
        <span class="brand-div"></span>
        <span class="loc-pill"><span class="material-symbols-rounded">location_on</span>Solar Swim &middot; Pacific time</span>
      </div>
      <div class="topbar-r">
        <div class="mode-switch" role="group" aria-label="Prototype audience">
          <button type="button" id="ms-staff" onclick="Z.setMode('staff')">Staff view</button>
          <button type="button" id="ms-client" onclick="Z.setMode('client')">Client view</button>
        </div>
        <div class="staff-only" style="display:flex;align-items:center;gap:8px">
          <label for="role-sel" style="font-size:.75rem;font-weight:600;color:var(--text-secondary)">Signed in as</label>
          <select id="role-sel" class="role-select" onchange="Z.setRole(this.value)">
            <option value="frontdesk">Front desk</option>
            <option value="staff">Staff</option>
            <option value="manager" selected>Manager</option>
          </select>
        </div>
      </div>
    </div>
    <div class="main-area" id="main-area">
      <div class="shell" id="root">Loading&hellip;</div>
      <div id="footmount"></div>
    </div>
  </div>
</div>
<script>
/*SCRIPT_START*/
'use strict';

// ============================== MODE ==============================
// One implementation, two audiences. `staff` is the full flow; `client` hides
// the affordances only an employee may use. The workflow itself never changes.
var MODE = 'staff';
(function readMode(){
  var q = new URLSearchParams(window.location.search);
  var m = (q.get('mode') || '').toLowerCase();
  if(m === 'client' || m === 'portal') MODE = 'client';
})();

function crFor(id){
  if(!state.cr[id]){
    var cust = CUSTOMERS[id];
    var keys = orderedKeys(cust);
    var services = {};
    keys.forEach(function(k){
      var win = {};
      WEEK.forEach(function(d){
        var on = cust.services[k].days.indexOf(d.full)!==-1;
        win[d.k] = {on:on, from:DEFAULT_FROM, to:DEFAULT_TO};
      });
      services[k] = {
        picks:[],
        complete:false,
        funding:defaultFunding(id,k),
        overrideOpen:false,
        levelOverride:false,
        window:win,
        // How often (whiteboard): recurring weekly / one time / non-recurring.
        cadence:{mode:'recurring', everyN:1, start:'', endMode:'unlimited', endDate:''},
        // Instructor multi-select. Empty array = anyone qualified.
        instructors:[]
      };
    });
    var openSections = {};
    keys.forEach(function(k){ openSections[k] = true; });
    state.cr[id] = {
      orderMode:'drywet',
      openSections: openSections,
      svcOrder: [],   // chosen per person in What — nothing is assumed
      services: services,
      marketplace:{},
      overrides:[],
      participants:{}
    };
  }
  return state.cr[id];
}
// Every service on file, dry ones first (mirrors the whiteboard order:
// Service A (Dry) above Service B (Wet)).
function orderedKeys(cust){
  var keys = Object.keys(cust.services);
  keys.sort(function(a,b){
    var ka = cust.services[a].kind==='dry'?0:1, kb = cust.services[b].kind==='dry'?0:1;
    return ka-kb;
  });
  return keys;
}

// ============================== HELPERS ==============================
function esc(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// Seed strings carry intentional em dashes and typographic quotes; they are trusted.
function raw(s){ return (s===undefined||s===null) ? '' : String(s); }
function ic(n){ return '<span class="material-symbols-rounded">'+n+'</span>'; }
function initials(name){
  return name.split(/\s+/).slice(0,2).map(function(w){ return w.charAt(0); }).join('').toUpperCase();
}
function avatar(name,small){
  return '<span class="av'+(small?' s':'')+'" aria-hidden="true">'+initials(name)+'</span>';
}
function firstName(name){ return name.split(' ')[0]; }
function toTitleDay(d){ return d.charAt(0)+d.slice(1).toLowerCase(); }
function dayLabel(k){
  var w = WEEK.filter(function(d){ return d.k===k; })[0];
  return w ? w.full : k;
}

function toMinutes(t){
  var m = /^(\d+):(\d+)\s*([AP]M)$/i.exec(String(t).trim());
  if(!m) return 0;
  var h = parseInt(m[1],10)%12, mi = parseInt(m[2],10);
  if(/PM/i.test(m[3])) h += 12;
  return h*60+mi;
}
function overlaps(aStart,aEnd,bStart,bEnd){
  return toMinutes(aStart) < toMinutes(bEnd) && toMinutes(bStart) < toMinutes(aEnd);
}
function svcTimeFor(svc, day){
  if(svc.timeByDay){
    var key = day.charAt(0).toUpperCase()+day.slice(1).toLowerCase();
    if(svc.timeByDay[key]) return svc.timeByDay[key];
  }
  return {time:svc.time, start:svc.start, end:svc.end};
}
function svcScheduleText(svc){
  if(svc.timeByDay){
    return svc.days.map(function(d){ return d+' '+svcTimeFor(svc,d).time; }).join(' / ');
  }
  return svc.days.join('/')+' '+svc.time;
}

// Which days the day-picker currently has switched on, for this customer/service.
function activeDays(cr,k){
  var win = cr.services[k].window;
  return WEEK.filter(function(d){ return win[d.k].on; }).map(function(d){ return d.k; });
}
// A slot only shows if its day is on AND its start time falls in that day's window.
function slotInWindow(cr,k,slot){
  var w = cr.services[k].window[slot.day.toUpperCase()];
  if(!w || !w.on) return false;
  var s = toMinutes(slot.start);
  return s >= toMinutes(w.from) && s <= toMinutes(w.to);
}

function fillState(booked,capacity){
  if(booked >= capacity) return {w:'Full', c:'f-full'};
  var left = capacity - booked;
  if(left <= 1) return {w:'Nearly full', c:'f-lim'};
  if(left <= 3) return {w:'Limited', c:'f-lim'};
  return {w:left+' spots open', c:'f-open'};
}
function seatMeter(taken,total){
  var h = '<span class="seats" aria-hidden="true">';
  for(var i=0;i<total;i++) h += '<i'+(i<taken?' class="on"':'')+'></i>';
  return h + '</span>';
}
function unitMeter(left,total){
  var cap = Math.min(total,12);
  var h = '<span class="meter-track" aria-hidden="true">';
  for(var i=0;i<cap;i++) h += '<i'+(i<Math.min(left,cap)?' class="on"':'')+'></i>';
  return h + '</span>';
}
function balanceLine(left,total){
  return '<span class="meter">'+unitMeter(left,total)+
         '<span class="meter-txt">Balance: '+left+' / '+total+' sessions</span></span>';
}

// What-step gate: every selected person needs at least one service, and every
// chosen service needs funding behind it (package on file or bought in What).
function whatGaps(){
  var noSvc=[], noPkg=[];
  state.selected.forEach(function(id){
    var cr = state.cr[id];
    if(!cr || !cr.svcOrder.length){ noSvc.push(CUSTOMERS[id].name); return; }
    cr.svcOrder.forEach(function(k){
      var svc = CUSTOMERS[id].services[k];
      var mkt = cr.marketplace[k];
      if(!svc.hasPackage && !(mkt && mkt.bought)) noPkg.push(firstName(CUSTOMERS[id].name)+'’s '+svc.name);
    });
  });
  return {noSvc:noSvc, noPkg:noPkg};
}

function cadenceText(cad){
  if(!cad) return 'Weekly until cancelled';
  if(cad.mode==='once') return 'One time only';
  var freq = (!cad.everyN || cad.everyN===1) ? 'Weekly' : 'Every '+cad.everyN+' weeks';
  return freq + (cad.endMode==='date' && cad.endDate ? ' · until '+cad.endDate : ' · until cancelled');
}

// ============================== ORDER / OVERLAP RULES ==============================
function checkSlotAllowed(custId, svcKey, day, start, end){
  var cust = CUSTOMERS[custId];
  var cr = crFor(custId);
  var svc = cust.services[svcKey];
  var otherKeys = cr.svcOrder.filter(function(k){ return k!==svcKey; });
  for(var i=0;i<otherKeys.length;i++){
    var other = cust.services[otherKeys[i]];
    if(other.days.indexOf(day)===-1) continue;
    var oTime = svcTimeFor(other, day);
    var oStart = oTime.start, oEnd = oTime.end;
    if(overlaps(start,end,oStart,oEnd)){
      return {allowed:false, reason:'Overlaps the '+other.name+' session on '+day+' '+oStart+'–'+oEnd+'.'};
    }
    if(cr.orderMode!=='flexible'){
      var svcIsDry = svc.kind==='dry';
      if(cr.orderMode==='drywet'){
        if(svcIsDry){
          if(toMinutes(end) > toMinutes(oStart) && other.kind==='wet'){
            return {allowed:false, reason:'Dry before wet: '+svc.name+' must end before '+other.name+' starts. Conflicts with '+other.name+' on '+day+' '+oStart+'–'+oEnd+'.'};
          }
        } else if(toMinutes(start) < toMinutes(oEnd) && other.kind==='dry'){
          return {allowed:false, reason:'Dry before wet: '+other.name+' must end before '+svc.name+' starts. Conflicts with '+other.name+' on '+day+' '+oStart+'–'+oEnd+'. Pick a later time, or switch this person to Any order.'};
        }
      } else if(cr.orderMode==='wetdry'){
        if(svc.kind==='wet'){
          if(toMinutes(end) > toMinutes(oStart) && other.kind==='dry'){
            return {allowed:false, reason:'Wet before dry: '+svc.name+' must end before '+other.name+' starts. Conflicts with '+other.name+' on '+day+' '+oStart+'–'+oEnd+'.'};
          }
        } else if(toMinutes(start) < toMinutes(oEnd) && other.kind==='wet'){
          return {allowed:false, reason:'Wet before dry: '+other.name+' must end before '+svc.name+' starts. Conflicts with '+other.name+' on '+day+' '+oStart+'–'+oEnd+'. Pick a later time, or switch this person to Any order.'};
        }
      }
    }
  }
  return {allowed:true};
}

// ============================== FUNDING / OUTCOME ==============================
function rcebMatch(custId, svcKey, code){
  var cust = CUSTOMERS[custId];
  var svc = cust.services[svcKey];
  if(custId==='maria' && code==='RC-2291'){
    return {matched:true, text:'RC Auth #RC-2291 covers '+svc.name+'.'};
  }
  if(custId==='maria' && code){
    var otherKey = Object.keys(cust.services).filter(function(k){return k!==svcKey;})[0];
    var other = cust.services[otherKey];
    return {matched:false, text:'This authorization does not cover '+svc.name+' — it is scoped to '+(other?other.name:'a different service')+' only.'};
  }
  return {matched:false, text:'No Regional Center authorization on file matches this code.'};
}

function computeOutcome(custId, svcKey){
  var cust = CUSTOMERS[custId];
  var cr = crFor(custId);
  var rt = cr.services[svcKey];
  if(state.bookingType==='group' && rt.picks.length && rt.picks[rt.picks.length-1].mode==='waitlist'){
    return {code:'WAITLISTED', line:'On the waitlist. Nothing reserved yet.'};
  }
  if(state.bookingType==='semiprivate'){
    var have = 1 + Object.keys(cr.participants[svcKey]||{}).length;
    if(have < 2) return {code:'PENDING_PARTNER', line:'Waiting for a second participant.'};
  }
  var f = rt.funding;
  if(!f.processed) return {code:'CONFIRMED', line:'Booked. A session is reserved.'};
  if(f.type==='RCEB'){
    if(f.rceb.authStatus==='pending') return {code:'AUTHORIZATION_HOLD', line:'Waiting on Regional Center authorization.'};
    return {code:'CONFIRMED', line:'Booked. A session is reserved.'};
  }
  if(f.type==='SelfPay'){
    var sp = f.selfpay;
    if(sp.method==='card' && sp.cardOnFile && sp.cardOnFile.declined && !sp.newCard){
      return {code:'PAYMENT_HOLD', line:'Waiting on payment.'};
    }
  }
  return {code:'CONFIRMED', line:'Booked. A session is reserved.'};
}
var OUTCOME = {
  CONFIRMED:        {cls:'o-confirmed',   icon:'check_circle',  title:'Confirmed',            chip:'k-ok'},
  PENDING_PARTNER:  {cls:'o-pending',     icon:'hourglass_top', title:'Waiting on a partner', chip:'k-warn'},
  WAITLISTED:       {cls:'o-waitlisted',  icon:'list_alt',      title:'On the waitlist',      chip:'k-info'},
  AUTHORIZATION_HOLD:{cls:'o-authhold',   icon:'hourglass_top', title:'Awaiting authorization',chip:'k-warn'},
  PAYMENT_HOLD:     {cls:'o-paymenthold', icon:'error',         title:'Awaiting payment',     chip:'k-bad'}
};
function allOutcomes(){
  var out = [];
  state.selected.forEach(function(id){
    crFor(id).svcOrder.forEach(function(k){
      var o = computeOutcome(id,k);
      out.push({custId:id, svcKey:k, code:o.code, line:o.line});
    });
  });
  return out;
}
function rcebActive(custId){
  var cr = state.cr[custId];
  if(!cr) return false;
  return cr.svcOrder.some(function(k){ return cr.services[k].funding.type==='RCEB'; });
}

// Money the person owes right now: anything bought from the marketplace in this
// journey, plus per-session private pricing. Packages already paid for cost nothing.
function amountDue(){
  var total = 0;
  state.selected.forEach(function(id){
    var cr = state.cr[id];
    if(!cr) return;
    Object.keys(cr.marketplace).forEach(function(k){
      if(cr.marketplace[k].bought) total += cr.marketplace[k].price;
    });
    if(state.bookingType==='private'){
      cr.svcOrder.forEach(function(k){
        cr.services[k].picks.forEach(function(p){ total += PRIVATE_PRICE[p.length||60]; });
      });
    }
  });
  return total;
}

function renderDoneRow(n){
  var v;
  if(n===1){
    v = state.selected.map(function(id){ return CUSTOMERS[id].name; }).join(', ') || 'nobody selected yet';
  } else if(n===2){
    v = state.selected.map(function(id){
      var cr = state.cr[id];
      return firstName(CUSTOMERS[id].name)+': '+((cr && cr.svcOrder.length)
        ? cr.svcOrder.map(function(k){ return CUSTOMERS[id].services[k].name; }).join(' &middot; ')
        : 'nothing picked yet');
    }).join(' &nbsp;/&nbsp; ') || '&mdash;';
  } else if(n===3){
    var picks = [];
    state.selected.forEach(function(id){
      var cr = state.cr[id];
      if(!cr) return;
      cr.svcOrder.forEach(function(k){
        cr.services[k].picks.forEach(function(p){
          picks.push(CUSTOMERS[id].services[k].name+' '+p.day+' '+p.time);
        });
      });
    });
    v = picks.length ? picks.join(' &middot; ') : 'no class chosen yet';
  } else if(n===4){
    var total = 0;
    state.selected.forEach(function(id){
      crFor(id).svcOrder.forEach(function(k){
        if(PREVIEW[id] && PREVIEW[id][k]) total += PREVIEW[id][k].dates.length;
      });
    });
    v = total ? total+' dates generated' : 'nothing generated';
  } else {
    v = allOutcomes().map(function(o){ return OUTCOME[o.code].title; })
        .filter(function(t,i,a){ return a.indexOf(t)===i; }).join(', ');
  }
  return '<div class="done-row"><span class="tick">'+ic('check')+'</span>'+
         '<span class="dk">'+stepLabel(n)+'</span>'+
         '<span class="dv">'+v+'</span>'+
         '<button type="button" class="link-btn" onclick="Z.goToStep('+n+')">Change</button></div>';
}

  h += '<h2>'+stepTitle(n)+'</h2>';
  h += '<p class="p-hint">'+stepHint(n)+'</p></div>';
  h += right ? '<div class="p-head-side">'+right+'</div>' : '';

function renderActiveStep(){

       '<div class="wcard-s">'+esc(c.household)+' &middot; interested in '+c.interested.join(', ')+'</div></div>'+
       '<span class="sp"></span>'+
       '<button type="button" class="icon-btn" title="Remove '+esc(firstName(c.name))+' from this booking" '+
       'onclick="Z.removeCustomer(\''+id+'\')">'+ic('person_remove')+'</button>'+
       '</div>';
  h += '<div class="wcard-chips">';
  orderedKeys(c).forEach(function(k){
    var svc = c.services[k];
    var on = cr.svcOrder.indexOf(k)!==-1;
    h += '<button type="button" class="pill" aria-pressed="'+on+'" '+
         'onclick="Z.toggleWhatService(\''+id+'\',\''+k+'\')">'+
         ic(on?'check':'add')+esc(svc.name)+
         '<span class="tag '+svc.kind+'">'+svc.kind.toUpperCase()+'</span></button>';
  });
  h += '</div>';
  if(n){
    h += '<div class="wcard-bd">';
    cr.svcOrder.forEach(function(k){ h += renderWhatServiceRow(id,c,cr,k); });
    h += '</div>';
  } else {
    h += '<div class="wcard-bd" style="border-top:none;background:#fff;padding-top:4px">'+
         '<p class="hint">Tick what '+esc(firstName(c.name))+' is booking today. Nothing is pre-selected from '+
         'their enrolments or interests — and a missing package can be bought right here.</p></div>';
  }
  h += '</div>';
  return h;
}

function renderWhatServiceRow(id,c,cr,k){
  var svc = c.services[k];
  var mkt = cr.marketplace[k];
  var bought = mkt && mkt.bought;
  var hasPkg = svc.hasPackage || bought;
  var h = '<div class="srow on">';
  h += '<span class="cbx">'+ic('check')+'</span>';
  h += '<div class="s-id">';
  h += '<div class="s-t">'+esc(svc.label)+'<span class="tag '+svc.kind+'">'+svc.kind.toUpperCase()+'</span>'+
       (svc.levelOk ? '<span class="chip k-ok">Level approved</span>'
                    : '<span class="chip k-warn">Level override needed at scheduling</span>')+'</div>';
  h += '<div class="s-m">'+ic('person')+'Usual class: '+esc(svc.instructor)+' &middot; '+esc(svcScheduleText(svc))+'</div>';
  if(hasPkg){
    var pkgName = bought ? mkt.item : svc.packageName;
    var units   = bought ? mkt.units : svc.unitsLeft;
    var total   = bought ? mkt.units : (svc.unitsTotal || svc.unitsLeft);
    h += '<div class="s-m">'+balanceLine(units,total)+'<span>'+raw(pkgName)+
         (bought ? ' <span class="chip k-info">Buying now</span>' : '')+'</span></div>';
  } else {
    h += '<div class="s-m" style="color:var(--warn-dark);font-weight:600">'+ic('shopping_cart')+'No '+esc(svc.name)+
         ' package on file — buy one below; it applies to this booking.</div>';
  }
  h += '</div></div>';
  if(!hasPkg){
    h += '<div class="note n-warn" style="margin-top:10px">'+ic('info')+'<div>'+esc(firstName(c.name))+
         ' has no '+esc(svc.name)+' package. '+(isStaff()?'Add one below':'Choose one below')+
         ' to unlock scheduling for it.'+
         (!(mkt && mkt.open) ? ' <button type="button" class="link-btn" onclick="Z.openMarketplace(\''+id+'\',\''+k+'\')">Browse packages</button>' : '')+'</div></div>';
    if(mkt && mkt.open) h += renderMarketplace(c,cr,k);
  }
  return h;
}

// ============================== STEP 3 — WHEN ==============================
// Order, how often, days & time, and instructor multi-select are set per
// service; every matching class then gathers in ONE board at the end,
// arranged by the dry/wet order setting — never nested per service.
function renderStepWhen(){
  var c = activeCustomer();
  if(!c) return emptyPanel(3);
  var cr = crFor(c.id);
  var h = '<div class="panel">'+panelHead(3)+'<div class="p-body">';
  if(!cr.svcOrder.length){
    h += '<div class="empty">'+ic('event_busy')+'Nothing is being booked for '+esc(firstName(c.name))+
         ' yet. Go back to '+stepLabel(2)+' and pick their services first.</div></div></div>';
    return h;
  }
  cr.svcOrder.forEach(function(k,idx){ h += renderServiceSection(c,cr,k,idx); });
  h += renderClassesBoard(c,cr);
  h += '</div></div>';
  return h;
}
function emptyPanel(n){
  return '<div class="panel">'+panelHead(n)+'<div class="p-body"><div class="empty">'+
         ic('person_off')+'Nobody is selected yet. Go back to '+stepLabel(1)+' to choose someone.</div></div></div>';
}

var ORDER_MODES = [
  {k:'drywet', label:'Dry, then wet'},
  {k:'wetdry', label:'Wet, then dry'},
  {k:'flexible', label:'Flexible — any order'}
];
function orderRuleText(cr){
  if(cr.orderMode==='flexible') return 'Any time may be picked for any day. Two sessions still cannot overlap.';
  if(cr.orderMode==='drywet')  return 'On a shared day, the wet session starts after the dry one ends. Overlap is always blocked.';
  return 'On a shared day, the dry session starts after the wet one ends. Overlap is always blocked.';
}
function renderOrderMode(c,cr){
  var h = '<div class="sub">Session order for '+esc(firstName(c.name))+'</div>';
  h += '<div class="pills" role="group" aria-label="Session order">';
  ORDER_MODES.forEach(function(m){
    h += '<button type="button" class="pill" aria-pressed="'+(cr.orderMode===m.k)+'" onclick="Z.setOrderMode(\''+c.id+'\',\''+m.k+'\')">'+m.label+'</button>';
  });
  h += '</div>';
  h += '<p class="hint" style="margin-top:8px">'+orderRuleText(cr)+'</p>';
  return h;
}

function renderServiceSection(c,cr,k,idx){
  var svc = c.services[k];
  var rt = cr.services[k];
  var locked = state.bookingType==='private' && idx>0 && !cr.services[cr.svcOrder[idx-1]].complete;
  var open = cr.openSections[k]!==false && !locked;
  var picked = rt.picks[0];

  var h = '<div class="svc'+(locked?' locked':'')+'" style="margin-top:14px">';
  h += '<button type="button" class="svc-hd" aria-expanded="'+open+'" '+(locked?'disabled':'')+
       ' onclick="Z.toggleSection(\''+c.id+'\',\''+k+'\')">';
  h += '<span class="material-symbols-rounded chev">chevron_right</span>';
  h += '<h3>'+esc(svc.name)+' &middot; '+esc(svc.level)+'<span class="tag '+svc.kind+'">'+svc.kind.toUpperCase()+'</span></h3>';
  h += '<span class="sp"></span>';
  if(locked){
    h += '<span class="chip k-mute">Finish '+esc(c.services[cr.svcOrder[idx-1]].name)+' first</span>';
  } else if(picked){
    h += '<span class="chip '+(picked.mode==='waitlist'?'k-info':'k-ok')+'">'+ic(picked.mode==='waitlist'?'list_alt':'check')+
         esc(picked.day)+' '+esc(picked.time)+'</span>';
  } else {
    h += '<span class="chip k-mute">No class chosen</span>';
  }
  h += '</button>';

  if(open){
    h += '<div class="svc-bd">';
    var mkt = cr.marketplace[k];
    if(!svc.hasPackage && !(mkt && mkt.bought)){
      h += '<div class="note n-warn">'+ic('shopping_cart')+'<div>No '+esc(svc.name)+' package for '+esc(firstName(c.name))+
           '. <button type="button" class="link-btn" onclick="Z.goToStep(2)">Choose one in '+stepLabel(2)+'</button> before scheduling.</div></div>';
    } else {
      h += renderCadence(c,cr,k);
      h += renderDayPicker(c,cr,k,svc);
      h += renderInstructorPicker(c,cr,k);
      if(state.bookingType==='semiprivate') h += renderParticipants(c,cr,k);
    }
    h += '</div>';
  }
  h += '</div>';
  return h;
}

// ---- day + time-window picker -------------------------------------------------
function renderDayPicker(c,cr,k,svc){
  var win = cr.services[k].window;
  var onCount = activeDays(cr,k).length;

  var h = '<div class="sub">Which days and times work?<span class="c">'+onCount+' of 7 days on</span></div>';
  h += '<div class="dp">';
  h += '<div class="dp-bar">';
  Object.keys(PRESETS).forEach(function(p){
    h += '<button type="button" class="pill" onclick="Z.applyPreset(\''+c.id+'\',\''+k+'\',\''+p+'\')">'+PRESETS[p].label+'</button>';
  });
  h += '<span class="sp"></span>';
  h += '<button type="button" class="btn btn-quiet btn-sm" onclick="Z.setAllDays(\''+c.id+'\',\''+k+'\',true)">Select all</button>';
  h += '<button type="button" class="btn btn-quiet btn-sm" onclick="Z.setAllDays(\''+c.id+'\',\''+k+'\',false)">Clear all</button>';
  h += '</div>';

  WEEK.forEach(function(d){
    var w = win[d.k];
    h += '<div class="dp-row '+(w.on?'on':'off')+'">';
    h += '<label class="dp-day"><input type="checkbox" '+(w.on?'checked':'')+
         ' onchange="Z.toggleDay(\''+c.id+'\',\''+k+'\',\''+d.k+'\')"/>'+
         '<span><span class="d">'+d.full+'</span><span class="dt">'+d.date+'</span></span></label>';
    h += '<div class="dp-times">';
    h += '<span>from</span><select class="inp" '+(w.on?'':'disabled')+' aria-label="'+d.full+' earliest start" onchange="Z.setWindow(\''+c.id+'\',\''+k+'\',\''+d.k+'\',\'from\',this.value)">';
    HOURS.forEach(function(t){ h += '<option '+(w.from===t?'selected':'')+'>'+t+'</option>'; });
    h += '</select>';
    h += '<span>to</span><select class="inp" '+(w.on?'':'disabled')+' aria-label="'+d.full+' latest start" onchange="Z.setWindow(\''+c.id+'\',\''+k+'\',\''+d.k+'\',\'to\',this.value)">';
    HOURS.forEach(function(t){ h += '<option '+(w.to===t?'selected':'')+'>'+t+'</option>'; });
    h += '</select>';
    h += '</div>';
    h += '<button type="button" class="icon-btn" title="Reset '+d.full+' to all day" aria-label="Reset '+d.full+' times" '+
         (w.on?'':'disabled')+' onclick="Z.resetDay(\''+c.id+'\',\''+k+'\',\''+d.k+'\')">'+ic('restart_alt')+'</button>';
    h += '</div>';
  });
  h += '</div>';
  return h;
}

// ---- how often: a proper field row, wired to state -------------------------
function renderCadence(c,cr,k){
  var cad = cr.services[k].cadence;
  var h = '<div class="sub">How often?<span class="c">the repeat rhythm for '+esc(c.services[k].name)+'</span></div>';
  h += '<div class="freq">';
  h += '<div class="fld"><label for="cd-m-'+c.id+'-'+k+'">Frequency</label>'+
       '<select class="inp" id="cd-m-'+c.id+'-'+k+'" onchange="Z.setCadenceMode(\''+c.id+'\',\''+k+'\',this.value)">'+
       '<option value="1"'+(cad.mode==='recurring'&&(cad.everyN||1)===1?' selected':'')+'>Repeats weekly</option>'+
       '<option value="2"'+(cad.mode==='recurring'&&cad.everyN===2?' selected':'')+'>Every 2 weeks</option>'+
       '<option value="3"'+(cad.mode==='recurring'&&cad.everyN===3?' selected':'')+'>Every 3 weeks</option>'+
       '<option value="once"'+(cad.mode==='once'?' selected':'')+'>One time only</option>'+
       '</select></div>';
  if(cad.mode!=='once'){
    h += '<div class="fld"><label for="cd-e-'+c.id+'-'+k+'">Ends</label>'+
         '<select class="inp" id="cd-e-'+c.id+'-'+k+'" onchange="Z.setCadenceEnd(\''+c.id+'\',\''+k+'\',this.value)">'+
         '<option value="unlimited"'+(cad.endMode!=='date'?' selected':'')+'>Until cancelled</option>'+
         '<option value="date"'+(cad.endMode==='date'?' selected':'')+'>On a fixed date</option>'+
         '</select></div>';
    if(cad.endMode==='date'){
      h += '<div class="fld"><label for="cd-d-'+c.id+'-'+k+'">End date</label>'+
           '<input class="inp" id="cd-d-'+c.id+'-'+k+'" type="date" value="'+esc(cad.endDate||'')+
           '" onchange="Z.setCadenceDate(\''+c.id+'\',\''+k+'\',this.value)"/></div>';
    }
  }
  h += '</div>';
  if(cad.mode==='once') h += '<p class="hint" style="margin-top:8px">One visit only — no repeat series is created.</p>';
  return h;
}

// ---- instructors: true multi-select (empty = anyone qualified) --------------
function renderInstructorPicker(c,cr,k){
  var picked = cr.services[k].instructors || [];
  var h = '<div class="sub">Instructors<span class="c">multi-select &middot; leave empty for anyone qualified</span></div>';
  h += '<div class="pills" role="group" aria-label="Instructors for '+esc(c.services[k].name)+'">';
  INSTRUCTORS.forEach(function(name){
    var on = picked.indexOf(name)!==-1;
    h += '<button type="button" class="pill" aria-pressed="'+on+'" onclick="Z.toggleInstructor(\''+c.id+'\',\''+k+'\',\''+esc(name)+'\')">'+
         avatar(name,true)+esc(name)+(on?ic('check'):'')+'</button>';
  });
  h += '<button type="button" class="pill" aria-pressed="'+(picked.length===0)+'" onclick="Z.clearInstructors(\''+c.id+'\',\''+k+'\')">'+
       ic('groups')+'Anyone qualified</button>';
  h += '</div>';
  if(picked.length===1) h += '<p class="hint" style="margin-top:8px">Only classes taught by '+esc(picked[0])+' appear in the board below.</p>';
  if(picked.length>1)  h += '<p class="hint" style="margin-top:8px">Only classes taught by '+esc(picked.slice(0,-1).join(', '))+' or '+esc(picked[picked.length-1])+' appear in the board below.</p>';
  return h;
}

// ---- participants (semi-private) ---------------------------------------------
function renderParticipants(c,cr,k){
  var svc = c.services[k];
  var extra = Object.keys(cr.participants[k]||{});
  var have = 1+extra.length;
  var h = '<div class="sub">Who else is in this session?<span class="c">2 needed</span></div>';
  h += '<div class="p-row sel"><div class="p-main"><span class="cbx">'+ic('check')+'</span>'+avatar(c.name)+
       '<span class="p-id"><span class="p-name">'+esc(c.name)+'</span>'+
       '<span class="p-meta">'+raw(svc.label)+' &middot; added automatically</span></span></div></div>';
  extra.forEach(function(name){
    h += '<div class="p-row sel"><div class="p-main"><span class="cbx">'+ic('check')+'</span>'+avatar(name)+
         '<span class="p-id"><span class="p-name">'+esc(name)+'</span><span class="p-meta">Eligible</span></span>'+
         '<button type="button" class="btn btn-quiet btn-sm" onclick="Z.removeParticipant(\''+c.id+'\',\''+k+'\',\''+esc(name)+'\')">Remove</button></div></div>';
  });
  h += '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="Z.addParticipant(\''+c.id+'\',\''+k+'\')">'+
       ic('person_add')+' Add a participant</button>';
  if(have<2){
    h += '<div class="note n-warn">'+ic('hourglass_top')+'<div>With '+have+' of 2 participants this session shows as '+
         '<strong>Waiting on a partner</strong> on the calendar until someone joins.</div></div>';
  }
  return h;
}

// ---- classes board: every matching class together at the end, arranged ----
// ---- by the dry-wet / wet-dry / flexible order setting ---------------------
function slotsForType(svcKey){
  if(state.bookingType==='group'){
    if(svcKey==='fitness') return CLASS_SLOTS.groupFitness;
    if(svcKey==='basketball') return CLASS_SLOTS.groupBasketball;
  }
  return CLASS_SLOTS[state.bookingType];
}

// Everything that survives this service's day windows and instructor filter.
function slotsForService(cr,k){
  var rt = cr.services[k];
  var days = activeDays(cr,k);
  var out = [];
  slotsForType(k).forEach(function(s){
    if(days.indexOf(s.day.toUpperCase())===-1) return;
    if(!slotInWindow(cr,k,s)) return;
    if(rt.instructors.length && rt.instructors.indexOf(s.instructor)===-1) return;
    out.push(s);
  });
  return out;
}

function boardDayBand(dayKey,n,extra){
  return '<div class="dayband"><h5>'+dayLabel(dayKey)+'</h5>'+
         '<span class="c">'+n+(n===1?' option':' options')+(extra?' &middot; '+esc(extra):'')+'</span><span class="ln"></span></div>';
}

function renderClassesBoard(c,cr){
  var h = '<div class="classes-head"><span class="ch-t">'+ic('calendar_month')+'Matching classes</span>'+
          '<span class="ch-s">all of '+esc(firstName(c.name))+'&rsquo;s options in one board, arranged by the order setting</span>'+
          '<span class="ln"></span>';
  if(CAN.createSlot() && cr.svcOrder.length){
    h += '<button type="button" class="btn btn-ghost btn-sm staff-only" onclick="Z.openDrawer(\''+c.id+'\',\''+cr.svcOrder[0]+'\')">'+
         ic('add')+' Create a class</button>';
  }
  h += '</div>';

  if(!cr.svcOrder.length){
    h += '<div class="empty">'+ic('event_busy')+'Pick at least one service in '+stepLabel(2)+' — its classes will gather here.</div>';
    return h;
  }

  // The dry/wet setting sits directly above the board it arranges.
  if(cr.svcOrder.length>1) h += renderOrderMode(c,cr);

  var any = false;

  if(cr.orderMode==='flexible'){
    // Any order: one pass per weekday across every service, soonest first.
    WEEK.forEach(function(d){
      var items = [];
      cr.svcOrder.forEach(function(k){
        slotsForService(cr,k).forEach(function(s){
          if(s.day.toUpperCase()===d.k) items.push({k:k,s:s});
        });
      });
      if(!items.length) return;
      items.sort(function(a,b){ return toMinutes(a.s.start)-toMinutes(b.s.start); });
      any = true;
      h += boardDayBand(d.k,items.length);
      h += '<div class="rail-scroll" role="list">';
      items.forEach(function(it){
        h += renderSlot(c,cr,it.k,c.services[it.k],it.s,cr.svcOrder.indexOf(it.k));
      });
      h += '</div>';
    });
  } else {
    var order = cr.svcOrder.slice();
    if(cr.orderMode==='wetdry') order.reverse();   // cr.svcOrder is maintained dry-first
    order.forEach(function(k){
      var svc = c.services[k];
      var rt = cr.services[k];
      var slots = slotsForService(cr,k);
      var picked = rt.picks[0];
      h += '<div class="svc-band"><h4>'+esc(svc.name)+' &middot; '+esc(svc.level)+
           '<span class="tag '+svc.kind+'">'+svc.kind.toUpperCase()+'</span></h4>'+
           '<span class="c">'+slots.length+(slots.length===1?' option':' options')+
           (picked ? ' &middot; chosen: '+esc(picked.day)+' '+esc(picked.time) : '')+'</span></div>';
      if(!activeDays(cr,k).length){
        h += '<div class="empty">'+ic('event_busy')+'No days are switched on for '+esc(svc.name)+' yet — turn some on above.</div>';
      } else if(!slots.length){
        h += '<div class="empty">'+ic('event_busy')+'Nothing for '+esc(svc.name)+' inside those windows'+
             (rt.instructors.length ? ' and the instructor filter' : '')+'. Widen the times'+
             (CAN.createSlot() ? ', or create a class.' : ', or try another day.')+'</div>';
      } else {
        any = true;
        activeDays(cr,k).forEach(function(dk){
          var ds = slots.filter(function(s){ return s.day.toUpperCase()===dk; });
          if(!ds.length) return;
          var w = cr.services[k].window[dk];
          h += boardDayBand(dk,ds.length,w.from+' to '+w.to);
          h += '<div class="rail-scroll" role="list">';
          ds.forEach(function(s){ h += renderSlot(c,cr,k,svc,s,cr.svcOrder.indexOf(k)); });
          h += '</div>';
        });
      }
    });
  }

  if(!any){
    h += '<div class="empty">'+ic('event_busy')+'No classes match yet. Switch days on above and widen the windows'+
         (CAN.createSlot() ? ', or create a class' : '')+' — matches gather here.</div>';
  }
  return h;
}

function pickedInfo(cr,k,s){
  return cr.services[k].picks.filter(function(p){ return p.day===s.day && p.time===s.time; })[0];
}

function renderSlot(c,cr,k,svc,s,idx){
  var picked = pickedInfo(cr,k,s);
  var rt = cr.services[k];
  // Skill level is never a filter — the class still shows, with the mismatch stated
  // and selection gated until a staff override is recorded.
  var levelBlocked = !svc.levelOk && !rt.levelOverride;
  var reasons = [];
  if(levelBlocked){
    reasons.push('This class is '+svc.level+' &mdash; '+firstName(c.name)+' is '+(svc.customerLevel||'a different level'));
  }
  if(!svc.ageOk) reasons.push('Ages '+svc.ageGroup+' only');

  var h = '<div class="slot'+(picked?' sel':'')+(levelBlocked?' blocked':'')+'" role="listitem">';
  h += '<div class="slot-time">'+raw(s.time)+'</div>';
  h += '<div class="slot-svc"><span class="dot"></span>'+esc(svc.name)+' &middot; '+esc(svc.level)+
       '<span class="tag '+svc.kind+'">'+svc.kind.toUpperCase()+'</span></div>';
  h += '<div class="slot-line">'+avatar(s.instructor,true)+esc(s.instructor)+'</div>';
  h += '<div class="slot-line">'+ic('place')+esc(s.location)+'</div>';

  if(state.bookingType==='group'){
    var f = fillState(s.booked,s.capacity);
    h += '<div class="slot-fill">'+seatMeter(s.booked,s.capacity)+
         '<span class="fill-w '+f.c+'">'+f.w+'</span></div>';
    h += '<div class="slot-bal">'+esc(s.booked)+' of '+esc(s.capacity)+' spots taken</div>';
  } else if(state.bookingType==='semiprivate'){
    var pf = fillState(s.participants,s.required);
    h += '<div class="slot-fill">'+seatMeter(s.participants,s.required)+
         '<span class="fill-w '+(s.participants>=s.required?'f-open':'f-lim')+'">'+
         s.participants+' of '+s.required+' joined</span></div>';
    h += '<div class="slot-bal">'+(s.participants>=s.required ? 'Ready to confirm' : 'Needs one more participant')+'</div>';
  } else {
    h += '<div class="sub" style="margin:12px 0 6px;font-size:.78rem">Session length</div>';
    h += '<div class="pills">';
    [30,60].forEach(function(len){
      var on = (picked && picked.length===len) || (!picked && len===60);
      h += '<button type="button" class="pill" aria-pressed="'+on+'" onclick="Z.pickPrivate(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+raw(s.time)+'\','+len+')">'+
           len+' min &middot; $'+PRIVATE_PRICE[len]+(len===60?' <small>best rate</small>':'')+'</button>';
    });
    h += '</div>';
  }

  h += '<div class="slot-acts">';
  if(state.bookingType==='group'){
    var full = s.booked>=s.capacity;
    if(full){
      h += '<button type="button" class="btn btn-warn btn-sm btn-block" onclick="Z.pickSlot(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+raw(s.time)+'\',\'waitlist\')">'+
           ic('list_alt')+' Join the waitlist</button>';
      if(CAN.levelOverride()){
        h += '<button type="button" class="btn btn-quiet btn-sm btn-block staff-only" onclick="Z.squeezeIn(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+raw(s.time)+'\')">'+
             ic('lock_open')+' Squeeze in over capacity</button>';
      }
    } else if(picked && picked.mode==='book'){
      h += '<button type="button" class="btn btn-dark btn-sm btn-block" disabled>'+ic('check')+' Chosen</button>';
    } else {
      h += '<button type="button" class="btn btn-primary btn-sm btn-block" '+(levelBlocked?'disabled':'')+
           ' onclick="Z.pickSlot(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+raw(s.time)+'\',\'book\')">Choose this class</button>';
      h += '<button type="button" class="btn btn-quiet btn-sm btn-block" onclick="Z.pickSlot(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+raw(s.time)+'\',\'waitlist\')">Waitlist instead</button>';
    }
  } else if(state.bookingType==='semiprivate'){
    h += '<button type="button" class="btn '+(picked?'btn-dark':'btn-primary')+' btn-sm btn-block" '+
         (levelBlocked||picked?'disabled':'')+' onclick="Z.pickSlot(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+raw(s.time)+'\',\'book\')">'+
         (picked?ic('check')+' Chosen':'Choose this time')+'</button>';
  } else {
    h += '<button type="button" class="btn '+(picked?'btn-dark':'btn-primary')+' btn-sm btn-block" '+
         (levelBlocked?'disabled':'')+' onclick="Z.pickPrivate(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+raw(s.time)+'\','+(picked?picked.length:60)+')">'+
         (picked?ic('check')+' Chosen':'Choose this time')+'</button>';
  }
  h += '</div>';

  if(reasons.length || (!svc.levelOk && rt.levelOverride)){
    h += '<div class="slot-foot">';
    if(reasons.length){
      h += '<ul class="reasons">';
      reasons.forEach(function(r){ h += '<li><span>'+raw(r)+'</span></li>'; });
      h += '</ul>';
      if(levelBlocked && CAN.levelOverride()){
        h += '<button type="button" class="btn btn-warn btn-sm btn-block staff-only" style="margin-top:8px" onclick="Z.applyLevelOverride(\''+c.id+'\',\''+k+'\')">'+
             ic('lock_open')+' Override the level check</button>';
      }
    } else {
      h += '<div class="slot-bal" style="color:var(--success-dark);font-weight:600">'+
           ic('lock_open')+'Level override recorded for this booking</div>';
    }
    h += '</div>';
  }

  var joint = jointCapacityMessage(k,s);
  if(joint) h += '<div class="note n-bad">'+ic('error')+'<div>'+joint+'</div></div>';

  h += '</div>';
  return h;
}

function jointCapacityMessage(k,s){
  if(state.bookingType!=='group') return null;
  var assigned = [];
  state.selected.forEach(function(id){
    var cr = state.cr[id];
    if(!cr || !cr.services[k]) return;
    var hit = cr.services[k].picks.filter(function(p){
      return p.day===s.day && p.time===s.time && p.mode==='book';
    })[0];
    if(hit) assigned.push(id);
  });
  if(assigned.length<2) return null;
  var remaining = s.capacity - s.booked;
  if(assigned.length>remaining){
    return 'Only '+remaining+' spot'+(remaining===1?'':'s')+' left and '+assigned.length+
           ' people are assigned here. Move one to another time, or waitlist the second.';
  }
  return null;
}

var SVC_COLORS = ['#3b82f6','#10b981','#f59e0b'];

function renderStepPreview(){
  var c = activeCustomer();
  if(!c) return emptyPanel(4);
  var cr = crFor(c.id);
