<!--
  Zalexy Prototype — Booking Flow (single file, two audiences)
  Spec:   ai-workspace/prototypes/staff/booking-flow.md
          ai-workspace/prototypes/client/booking-flow.md
  Design: ai-workspace/prototypes/_shared/design-system.md

  One implementation. `?mode=client` hides the staff-only affordances
  (role switch, create-slot drawer, manager funding override, level override,
  audit strings, internal notes). The workflow itself is identical.

  Static prototype. Not production code. No app dependencies.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Zalexy — New booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root{
  --primary:#334155;--primary-light:#475569;--primary-dark:#1e293b;
  --secondary:#10b981;--secondary-light:#34d399;--secondary-dark:#059669;
  --success:#10b981;--success-bg:#d1fae5;--success-dark:#047857;
  --info:#3b82f6;--info-bg:#eff6ff;--info-dark:#1d4ed8;--info-hover:#2563eb;
  --bg-default:#f8fafc;--bg-paper:#fff;
  --text-primary:#0f172a;--text-secondary:#64748b;
  --border:#f1f5f9;--line:#e2e8f0;--border-input:#cbd5e1;--border-input-hover:#94a3b8;
  --hover-row:#f1f5f9;--action-hover:rgba(71,85,105,.04);--action-selected:rgba(71,85,105,.08);
  --danger:#ef4444;--warning:#f59e0b;--warn-bg:#fef3c7;--warn-dark:#b45309;
  --danger-bg:#fee2e2;--danger-dark:#b91c1c;
  --radius-card:10px;--radius-base:8px;--radius-control:6px;--radius-chip:4px;
  --shadow-card:0 2px 4px rgba(0,0,0,.02),0 1px 2px rgba(0,0,0,.03);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Roboto','Helvetica','Arial',sans-serif;background:var(--bg-default);color:var(--text-primary);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--info-dark)}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:3px}
.material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;line-height:1}

/* ---------- shell ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.main-shell{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;gap:16px}
.topbar-l{display:flex;align-items:center;gap:10px;min-width:0}
.loc-pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--text-secondary)}
.loc-pill .material-symbols-rounded{font-size:16px;color:var(--border-input-hover)}
.topbar-r{display:flex;align-items:center;gap:14px}
.mode-switch{display:flex;background:var(--bg-default);border:1px solid var(--line);border-radius:7px;padding:2px}
.mode-switch button{border:none;background:transparent;border-radius:5px;padding:4px 11px;font-size:.75rem;font-weight:600;color:var(--text-secondary)}
.mode-switch button[aria-pressed="true"]{background:#fff;color:var(--text-primary);box-shadow:0 1px 2px rgba(15,23,42,.08)}
.role-select{border:1px solid var(--border-input);border-radius:var(--radius-control);padding:6px 10px;font-size:.78rem;font-weight:600;background:#fff}
.main-area{flex:1;overflow-y:auto;scroll-behavior:smooth}

.shell{max-width:1220px;margin:0 auto;padding:22px 24px 40px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:22px;align-items:start}
@media(max-width:1180px){.grid{grid-template-columns:minmax(0,1fr)}}

/* ---------- page header ---------- */
.crumb{font-size:.75rem;color:var(--text-secondary);display:flex;align-items:center;gap:5px}
.crumb a{color:var(--text-secondary);text-decoration:none}
.crumb a:hover{color:var(--text-primary)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:6px 0 18px;flex-wrap:wrap}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.head-sub{font-size:.82rem;color:var(--text-secondary);margin-top:3px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;border-radius:6px;padding:7px 16px;font-size:.82rem;font-weight:600;color:var(--text-secondary);white-space:nowrap}
.seg button:hover{color:var(--text-primary)}
.seg button[aria-pressed="true"]{background:var(--primary-dark);color:#fff}

/* ---------- progress rail ---------- */
.rail-wrap{position:sticky;top:0;z-index:20;background:var(--bg-default);padding:4px 0 12px;margin:-4px 0 0}
.rail{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:0 6px;height:46px;overflow:hidden}
.rnode{display:flex;align-items:center;gap:8px;padding:0 12px;height:100%;background:none;border:none;flex-shrink:0}
.rnode:disabled{cursor:default}
.rdot{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:.68rem;font-weight:700;flex-shrink:0;transition:background .15s}
.rdot .material-symbols-rounded{font-size:14px;font-variation-settings:'wght' 600}
.rdot.done{background:var(--success-bg);color:var(--success-dark)}
.rdot.act{background:var(--primary-dark);color:#fff}
.rdot.fut{background:var(--border);color:var(--border-input-hover)}
.rlbl{font-size:.8rem;font-weight:600;white-space:nowrap}
.rlbl.done{color:var(--text-secondary)}
.rlbl.act{color:var(--text-primary)}
.rlbl.fut{color:var(--border-input-hover)}
.rnode:not(:disabled):hover .rlbl{color:var(--text-primary)}
.rsep{flex:1;height:1px;background:var(--line);min-width:8px}

/* ---------- people strip ---------- */
.pstrip{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.ptab{display:inline-flex;align-items:center;gap:7px;padding:6px 13px 6px 7px;border-radius:20px;font-size:.82rem;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--text-secondary)}
.ptab:hover{border-color:var(--border-input)}
.ptab[aria-pressed="true"]{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff}
.ptab .av{width:22px;height:22px;font-size:.62rem}
.ptab-add{padding:7px 13px;border-radius:20px;font-size:.8rem;font-weight:600;border:1px dashed var(--border-input);background:transparent;color:var(--text-secondary)}
.ptab-add:hover{border-color:var(--primary-light);color:var(--text-primary)}

/* ---------- panels ---------- */
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 20px 0}
.p-head h2{font-size:1.02rem;font-weight:700;letter-spacing:-.01em}
.p-hint{font-size:.8rem;color:var(--text-secondary);margin-top:3px;max-width:56ch;line-height:1.5}
.p-body{padding:14px 20px 20px}
.done-row{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 14px;margin-bottom:8px}
.done-row .tick{width:19px;height:19px;border-radius:50%;background:var(--success-bg);color:var(--success-dark);display:grid;place-items:center;flex-shrink:0}
.done-row .tick .material-symbols-rounded{font-size:13px;font-variation-settings:'wght' 700}
.done-row .dk{font-size:.78rem;font-weight:700;color:var(--text-secondary);flex-shrink:0;width:66px}
.done-row .dv{flex:1;font-size:.84rem;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-btn{background:none;border:none;color:var(--info-dark);font-size:.8rem;font-weight:600;padding:0}
.link-btn:hover{text-decoration:underline}

/* ---------- section label ---------- */
.sub{font-size:.85rem;font-weight:700;margin:20px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub .c{font-size:.78rem;font-weight:500;color:var(--text-secondary)}
.sub .sp{flex:1}
.hint{font-size:.8rem;color:var(--text-secondary);line-height:1.55;max-width:66ch}

/* ---------- form controls ---------- */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:.75rem;font-weight:600;color:var(--text-secondary);margin-bottom:5px}
.inp{width:100%;height:38px;border:1px solid var(--border-input);border-radius:var(--radius-control);padding:8px 12px;font-size:.875rem;background:#fff}
.inp:hover{border-color:var(--border-input-hover)}
.inp:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
textarea.inp{height:auto;min-height:60px;resize:vertical}
.search{position:relative}
.search>.material-symbols-rounded{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:19px;color:var(--border-input-hover);pointer-events:none}
.search .inp{padding-left:36px;height:40px}
select.inp{height:34px;padding:5px 8px;font-size:.8rem}

/* ---------- buttons ---------- */
.btn{border-radius:var(--radius-control);padding:8px 15px;font-size:.85rem;font-weight:600;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn .material-symbols-rounded{font-size:17px}
.btn-primary{background:var(--info);color:#fff}
.btn-primary:hover{background:var(--info-hover)}
.btn-dark{background:var(--primary-dark);color:#fff}
.btn-dark:hover{background:var(--primary)}
.btn-go{background:var(--secondary);color:#fff}
.btn-go:hover{background:var(--secondary-dark)}
.btn-ghost{background:#fff;color:var(--text-primary);border-color:var(--border-input)}
.btn-ghost:hover{border-color:var(--primary);background:var(--action-hover)}
.btn-quiet{background:transparent;color:var(--text-secondary);border-color:transparent}
.btn-quiet:hover{background:var(--hover-row);color:var(--text-primary)}
.btn-warn{background:#fff;color:var(--warn-dark);border-color:#fcd34d}
.btn-warn:hover{background:var(--warn-bg)}
.btn:disabled{opacity:.5;cursor:not-allowed;background:var(--border);color:var(--text-secondary);border-color:transparent}
.btn-ghost:disabled{background:#fff;border-color:var(--line)}
.btn-sm{padding:5px 11px;font-size:.78rem}
.btn-sm .material-symbols-rounded{font-size:15px}
.btn-block{width:100%}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;border-radius:var(--radius-chip);padding:0 7px;font-size:.72rem;font-weight:600;white-space:nowrap}
.chip .material-symbols-rounded{font-size:13px}
.k-ok{background:var(--success-bg);color:var(--success-dark)}
.k-info{background:var(--info-bg);color:var(--info-dark)}
.k-warn{background:var(--warn-bg);color:var(--warn-dark)}
.k-bad{background:var(--danger-bg);color:var(--danger-dark)}
.k-mute{background:var(--border);color:var(--text-secondary)}
.tag{display:inline-flex;align-items:center;height:18px;border-radius:3px;padding:0 5px;font-size:.62rem;font-weight:700;letter-spacing:.06em;background:var(--border);color:var(--text-secondary)}
.tag.wet{background:#e0f2fe;color:#0369a1}
.tag.dry{background:#fef3c7;color:var(--warn-dark)}

/* ---------- avatar ---------- */
.av{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:.7rem;font-weight:700;flex-shrink:0;letter-spacing:.02em}
.av.s{width:22px;height:22px;font-size:.6rem}
.av.q{background:var(--border);color:var(--text-secondary)}

/* ---------- person row + disclosure ---------- */
.p-row{border:1px solid var(--line);border-radius:10px;margin-top:8px;overflow:hidden;background:#fff;transition:border-color .12s}
.p-row:hover{border-color:var(--border-input)}
.p-row.sel{border-color:var(--primary-dark);box-shadow:inset 3px 0 0 var(--primary-dark)}
.p-row.off{opacity:.5}
.p-main{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:none;text-align:left}
.p-main:not(:disabled){cursor:pointer}
.cbx{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--border-input);flex-shrink:0;display:grid;place-items:center;background:#fff}
.cbx .material-symbols-rounded{font-size:14px;color:#fff;font-variation-settings:'wght' 700;opacity:0}
.p-row.sel .cbx{background:var(--primary-dark);border-color:var(--primary-dark)}
.p-row.sel .cbx .material-symbols-rounded{opacity:1}
.p-id{flex:1;min-width:0}
.p-name{font-size:.9rem;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.p-meta{font-size:.78rem;color:var(--text-secondary);margin-top:3px}
.p-act{display:flex;align-items:center;gap:4px;padding:0 12px 10px 45px;flex-wrap:wrap}
.disc{background:none;border:none;display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;color:var(--text-secondary);padding:5px 8px 5px 6px;border-radius:6px;flex-shrink:0}
.disc:hover{background:var(--hover-row);color:var(--text-primary)}
.disc .material-symbols-rounded{font-size:17px;transition:transform .16s}
.disc[aria-expanded="true"] .material-symbols-rounded{transform:rotate(180deg)}
.p-detail{border-top:1px solid var(--border);background:#fcfdfe;padding:14px}

/* ---------- definition grid ---------- */
.dl{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.dl-row{display:grid;grid-template-columns:190px minmax(0,1fr)}
.dl-row+.dl-row{border-top:1px solid var(--border)}
.dl-k{padding:9px 13px;font-size:.75rem;font-weight:600;color:var(--text-secondary);background:#fcfdfe}
.dl-v{padding:9px 13px;font-size:.84rem;color:var(--text-primary);min-width:0;overflow-wrap:anywhere}
.dl-v.bal{font-weight:700;color:var(--info-dark)}
@media(max-width:640px){.dl-row{grid-template-columns:1fr}.dl-v{padding-top:0}}

/* ---------- unit meter ---------- */
.meter{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.meter-track{display:inline-flex;gap:3px}
.meter-track i{width:11px;height:14px;border-radius:2px;background:var(--line);display:block}
.meter-track i.on{background:var(--secondary-dark)}
.meter-txt{font-size:.78rem;font-weight:700;color:var(--info-dark)}

/* ---------- eligibility card ---------- */
.elig{border:1px solid var(--line);border-radius:9px;padding:13px 14px;margin-top:10px;background:#fff}
.elig-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.elig-hd h4{font-size:.88rem;font-weight:700}
.elig-hd .sp{flex:1}
.kv{display:flex;align-items:baseline;gap:8px;font-size:.81rem;padding:3px 0}
.kv b{min-width:158px;color:var(--text-secondary);font-weight:600;flex-shrink:0}
.kv .v{min-width:0;overflow-wrap:anywhere}
@media(max-width:560px){.kv{flex-direction:column;gap:1px}.kv b{min-width:0}}

/* ---------- notes ---------- */
.note{display:flex;gap:9px;border-radius:8px;padding:10px 13px;font-size:.81rem;line-height:1.5;margin-top:11px;align-items:flex-start}
.note>.material-symbols-rounded{font-size:17px;flex-shrink:0;margin-top:1px}
.n-info{background:var(--info-bg);color:#1e40af}
.n-warn{background:var(--warn-bg);color:#92400e}
.n-ok{background:var(--success-bg);color:var(--success-dark)}
.n-bad{background:var(--danger-bg);color:#991b1b}
.n-mute{background:var(--bg-default);color:var(--text-secondary)}
.reasons{list-style:none;margin-top:7px;display:flex;flex-direction:column;gap:3px}
.reasons li{font-size:.76rem;color:var(--warn-dark);display:flex;gap:6px;line-height:1.45}
.reasons li::before{content:'';width:3px;height:3px;border-radius:50%;background:currentColor;flex-shrink:0;margin-top:7px}

/* ---------- pills ---------- */
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:6px 13px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--text-secondary);font-size:.79rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pill:hover{border-color:var(--border-input);color:var(--text-primary)}
.pill[aria-pressed="true"]{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff}
.pill small{font-size:.66rem;font-weight:600;opacity:.75}
.pill:disabled{opacity:.45;cursor:not-allowed}

/* ---------- day picker ---------- */
.dp{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px}
.dp-bar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#fcfdfe;border-bottom:1px solid var(--border);flex-wrap:wrap}
.dp-bar .sp{flex:1;min-width:12px}
.dp-row{display:grid;grid-template-columns:150px minmax(0,1fr) 34px;align-items:center;gap:10px;padding:8px 12px}
.dp-row+.dp-row{border-top:1px solid var(--border)}
.dp-row.on{background:#ecfdf5}
.dp-row.off .dp-times{opacity:.5}
.dp-day{display:flex;align-items:center;gap:10px;font-size:.85rem;cursor:pointer}
.dp-day input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary-dark);flex-shrink:0}
.dp-day .d{font-weight:700;line-height:1.2}
.dp-day .dt{font-size:.72rem;color:var(--text-secondary);font-weight:500;display:block;margin-top:1px}
.dp-row.off .dp-day .d{color:var(--text-secondary)}
.dp-times{display:flex;align-items:center;gap:7px;font-size:.75rem;color:var(--text-secondary);flex-wrap:wrap}
.dp-times select{min-width:106px}
.icon-btn{width:30px;height:30px;border-radius:7px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--border-input-hover)}
.icon-btn:hover{background:var(--hover-row);color:var(--text-primary);border-color:var(--line)}
.icon-btn .material-symbols-rounded{font-size:17px}
@media(max-width:700px){.dp-row{grid-template-columns:1fr 34px}.dp-times{grid-column:1/-1}}

/* ---------- class slot rail ---------- */
.dayband{display:flex;align-items:center;gap:10px;margin:18px 0 0}
.dayband h5{font-size:.82rem;font-weight:700}
.dayband .c{font-size:.76rem;color:var(--text-secondary)}
.dayband .ln{flex:1;height:1px;background:var(--border)}
.rail-scroll{display:flex;gap:10px;overflow-x:auto;padding:10px 2px 12px;scroll-snap-type:x proximity}
.rail-scroll::-webkit-scrollbar{height:8px}
.rail-scroll::-webkit-scrollbar-track{background:var(--border);border-radius:4px}
.rail-scroll::-webkit-scrollbar-thumb{background:var(--border-input);border-radius:4px}
.rail-scroll::-webkit-scrollbar-thumb:hover{background:var(--border-input-hover)}
.slot{flex:0 0 268px;scroll-snap-align:start;border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;background:#fff;transition:border-color .12s,box-shadow .12s}
.slot:hover{border-color:var(--border-input)}
.slot.sel{border-color:var(--info);box-shadow:inset 0 0 0 1px var(--info);background:var(--info-bg)}
.slot.blocked{background:#fcfdfe}
.slot-time{font-size:.98rem;font-weight:700;letter-spacing:-.01em}
.slot-svc{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;margin-top:5px;flex-wrap:wrap}
.slot-svc .dot{width:7px;height:7px;border-radius:50%;background:var(--primary-light);flex-shrink:0}
.slot-line{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--text-secondary);margin-top:6px;flex-wrap:wrap}
.slot-line .material-symbols-rounded{font-size:15px;color:var(--border-input-hover)}
.slot-fill{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.seats{display:flex;gap:2.5px}
.seats i{width:9px;height:9px;border-radius:2px;background:var(--line);display:block}
.seats i.on{background:var(--primary)}
.fill-w{font-size:.74rem;font-weight:700}
.f-open{color:var(--success-dark)}.f-lim{color:var(--warn-dark)}.f-full{color:var(--danger-dark)}
.slot-bal{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.74rem;color:var(--text-secondary)}
.slot-acts{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:12px}
.slot-foot{border-top:1px solid var(--border);margin-top:11px;padding-top:9px}
.empty{font-size:.8rem;color:var(--text-secondary);padding:10px 0 2px;display:flex;align-items:center;gap:7px}
.empty .material-symbols-rounded{font-size:17px;color:var(--border-input)}

/* ---------- collapsible service section ---------- */
.svc{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;background:#fff}
.svc.locked{background:#fcfdfe}
.svc-hd{display:flex;align-items:center;gap:10px;padding:13px 15px;width:100%;background:none;border:none;text-align:left}
.svc-hd:not(:disabled){cursor:pointer}
.svc-hd:not(:disabled):hover{background:var(--hover-row)}
.svc-hd .chev{font-size:19px;color:var(--border-input-hover);transition:transform .16s}
.svc-hd[aria-expanded="true"] .chev{transform:rotate(90deg)}
.svc-hd h3{font-size:.9rem;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.svc-hd .sp{flex:1}
.svc-bd{padding:0 15px 16px;border-top:1px solid var(--border)}
.svc-bd .sub:first-child{margin-top:14px}

.band-id{flex:1;min-width:0}
.band-t{font-size:.88rem;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.band-s{font-size:.78rem;color:var(--text-secondary);margin-top:2px}
.band-f{display:flex;align-items:center;gap:14px;margin-top:7px;flex-wrap:wrap;font-size:.76rem;color:var(--success-dark);font-weight:600}

.mkt-price{font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
.mkt-was{font-size:.76rem;color:var(--text-secondary);margin-top:2px}
.mkt-foot{margin-top:auto;padding-top:12px}

.dates{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:9px}

.dt-row{display:flex;align-items:center;gap:11px;padding:9px 13px;font-size:.84rem;flex-wrap:wrap}
.dt-row+.dt-row{border-top:1px solid var(--border)}
.dt-row .d{font-weight:600;min-width:92px}
.dt-row .m{color:var(--text-secondary);font-size:.79rem;flex:1;min-width:0}
.dt-row.skip .d{font-weight:500;text-decoration:line-through;color:var(--text-secondary)}
.dt-row.tent{background:#fcfdfe}
.dt-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary-dark);flex-shrink:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px}
.cal-h{font-size:.68rem;font-weight:700;color:var(--text-secondary);text-align:center;padding-bottom:2px}
.cal-c{border:1px solid var(--line);border-radius:7px;min-height:52px;padding:5px 6px;font-size:.72rem;color:var(--text-secondary);background:#fff}
.cal-c.has{border-color:var(--border-input);color:var(--text-primary);font-weight:600}
.cal-c .cd{display:block;width:7px;height:7px;border-radius:50%;margin-top:5px}

.ovr{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:15px;margin-top:11px}

.ovr .fld label{color:#92400e}

.o-paymenthold{background:var(--danger-bg);border-left-color:var(--danger);color:#991b1b}

.done-acts{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}

body.client .staff-only{display:none!important}
.print-only{display:none}
@media print{

var state = {
  role:'manager',
  bookingType:'group',
  step:1,
  search:'',

  activeTab:0,

  cr:{},
  drawer:null,
  toast:null,
  success:null
};

function crFor(id){
  if(!state.cr[id]){
    var cust = CUSTOMERS[id];
    var keys = Object.keys(cust.services);
    keys.sort(function(a,b){
      var ka = cust.services[a].kind==='dry'?0:1, kb = cust.services[b].kind==='dry'?0:1;
      return ka-kb;
    });
    var services = {};
    keys.forEach(function(k){
      var win = {};
      WEEK.forEach(function(d){
        var on = cust.services[k].days.indexOf(d.full)!==-1;
        win[d.k] = {on:on, from:DEFAULT_FROM, to:DEFAULT_TO};
      });
      services[k] = {
        picks:[],
        complete:keys.indexOf(k)===0,
        funding:defaultFunding(id,k),
        overrideOpen:false,
        levelOverride:false,
        window:win
      };
    });
    state.cr[id] = {
      orderMode:'drywet',
      openSection: keys.length>1 ? keys[1] : keys[0],
      svcOrder: keys,
      services: services,
      marketplace:{},
      overrides:[],
      participants:{}
    };
  }
  return state.cr[id];
}

// ============================== HELPERS ==============================
function esc(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// Seed strings carry intentional em dashes and typographic quotes; they are trusted.
function raw(s){ return (s===undefined||s===null) ? '' : String(s); }
function ic(n){ return '<span class="material-symbols-rounded">'+n+'</span>'; }
function initials(name){
  return name.split(/\s+/).slice(0,2).map(function(w){ return w.charAt(0); }).join('').toUpperCase();
}
function avatar(name,small){
  return '<span class="av'+(small?' s':'')+'" aria-hidden="true">'+initials(name)+'</span>';
}
function firstName(name){ return name.split(' ')[0]; }
function toTitleDay(d){ return d.charAt(0)+d.slice(1).toLowerCase(); }
function dayLabel(k){
  var w = WEEK.filter(function(d){ return d.k===k; })[0];
  return w ? w.full : k;
}

function toMinutes(t){
  var m = /^(\d+):(\d+)\s*([AP]M)$/i.exec(String(t).trim());
  if(!m) return 0;
  var h = parseInt(m[1],10)%12, mi = parseInt(m[2],10);
  if(/PM/i.test(m[3])) h += 12;
  return h*60+mi;
}
function overlaps(aStart,aEnd,bStart,bEnd){
  return toMinutes(aStart) < toMinutes(bEnd) && toMinutes(bStart) < toMinutes(aEnd);
}
function svcTimeFor(svc, day){
  if(svc.timeByDay){
    var key = day.charAt(0).toUpperCase()+day.slice(1).toLowerCase();
    if(svc.timeByDay[key]) return svc.timeByDay[key];
  }
  return {time:svc.time, start:svc.start, end:svc.end};
}
function svcScheduleText(svc){
  if(svc.timeByDay){
    return svc.days.map(function(d){ return d+' '+svcTimeFor(svc,d).time; }).join(' / ');
  }
  return svc.days.join('/')+' '+svc.time;
}

// Which days the day-picker currently has switched on, for this customer/service.
function activeDays(cr,k){
  var win = cr.services[k].window;
  return WEEK.filter(function(d){ return win[d.k].on; }).map(function(d){ return d.k; });
}
// A slot only shows if its day is on AND its start time falls in that day's window.
function slotInWindow(cr,k,slot){
  var w = cr.services[k].window[slot.day.toUpperCase()];
  if(!w || !w.on) return false;
  var s = toMinutes(slot.start);
  return s >= toMinutes(w.from) && s <= toMinutes(w.to);
}

function fillState(booked,capacity){
  if(booked >= capacity) return {w:'Full', c:'f-full'};
  var left = capacity - booked;
  if(left <= 1) return {w:'Nearly full', c:'f-lim'};
  if(left <= 3) return {w:'Limited', c:'f-lim'};
  return {w:left+' spots open', c:'f-open'};
}
function seatMeter(taken,total){
  var h = '<span class="seats" aria-hidden="true">';
  for(var i=0;i<total;i++) h += '<i'+(i<taken?' class="on"':'')+'></i>';
  return h + '</span>';
}
function unitMeter(left,total){
  var cap = Math.min(total,12);
  var h = '<span class="meter-track" aria-hidden="true">';
  for(var i=0;i<cap;i++) h += '<i'+(i<Math.min(left,cap)?' class="on"':'')+'></i>';
  return h + '</span>';
}
function balanceLine(left,total){
  return '<span class="meter">'+unitMeter(left,total)+
         '<span class="meter-txt">Balance: '+left+' / '+total+' sessions</span></span>';
}

function activeCustomer(){

// ============================== ORDER / OVERLAP RULES ==============================
function checkSlotAllowed(custId, svcKey, day, start, end){
  var cust = CUSTOMERS[custId];
  var cr = crFor(custId);
  var svc = cust.services[svcKey];
  var otherKeys = cr.svcOrder.filter(function(k){ return k!==svcKey; });
  for(var i=0;i<otherKeys.length;i++){
    var other = cust.services[otherKeys[i]];
    if(other.days.indexOf(day)===-1) continue;
    var oTime = svcTimeFor(other, day);
    var oStart = oTime.start, oEnd = oTime.end;
    if(overlaps(start,end,oStart,oEnd)){
      return {allowed:false, reason:'Overlaps the '+other.name+' session on '+day+' '+oStart+'–'+oEnd+'.'};
    }
    if(cr.orderMode!=='flexible'){
      var svcIsDry = svc.kind==='dry';
      if(cr.orderMode==='drywet'){
        if(svcIsDry){
          if(toMinutes(end) > toMinutes(oStart) && other.kind==='wet'){
            return {allowed:false, reason:'Dry before wet: '+svc.name+' must end before '+other.name+' starts. Conflicts with '+other.name+' on '+day+' '+oStart+'–'+oEnd+'.'};
          }
        } else if(toMinutes(start) < toMinutes(oEnd) && other.kind==='dry'){
          return {allowed:false, reason:'Dry before wet: '+other.name+' must end before '+svc.name+' starts. Conflicts with '+other.name+' on '+day+' '+oStart+'–'+oEnd+'. Pick a later time, or switch this person to Any order.'};
        }
      } else if(cr.orderMode==='wetdry'){
        if(svc.kind==='wet'){
          if(toMinutes(end) > toMinutes(oStart) && other.kind==='dry'){
            return {allowed:false, reason:'Wet before dry: '+svc.name+' must end before '+other.name+' starts. Conflicts with '+other.name+' on '+day+' '+oStart+'–'+oEnd+'.'};
          }
        } else if(toMinutes(start) < toMinutes(oEnd) && other.kind==='wet'){
          return {allowed:false, reason:'Wet before dry: '+other.name+' must end before '+svc.name+' starts. Conflicts with '+other.name+' on '+day+' '+oStart+'–'+oEnd+'. Pick a later time, or switch this person to Any order.'};
        }
      }
    }
  }
  return {allowed:true};
}

// ============================== FUNDING / OUTCOME ==============================
function rcebMatch(custId, svcKey, code){
  var cust = CUSTOMERS[custId];
  var svc = cust.services[svcKey];
  if(custId==='maria' && code==='RC-2291'){
    return {matched:true, text:'RC Auth #RC-2291 covers '+svc.name+'.'};
  }
  if(custId==='maria' && code){
    var otherKey = Object.keys(cust.services).filter(function(k){return k!==svcKey;})[0];
    var other = cust.services[otherKey];
    return {matched:false, text:'This authorization does not cover '+svc.name+' — it is scoped to '+(other?other.name:'a different service')+' only.'};
  }
  return {matched:false, text:'No Regional Center authorization on file matches this code.'};
}

function computeOutcome(custId, svcKey){
  var cust = CUSTOMERS[custId];
  var cr = crFor(custId);
  var rt = cr.services[svcKey];
  if(state.bookingType==='group' && rt.picks.length && rt.picks[rt.picks.length-1].mode==='waitlist'){
    return {code:'WAITLISTED', line:'On the waitlist. Nothing reserved yet.'};
  }
  if(state.bookingType==='semiprivate'){
    var have = 1 + Object.keys(cr.participants[svcKey]||{}).length;
    if(have < 2) return {code:'PENDING_PARTNER', line:'Waiting for a second participant.'};
  }
  var f = rt.funding;
  if(!f.processed) return {code:'CONFIRMED', line:'Booked. A session is reserved.'};
  if(f.type==='RCEB'){
    if(f.rceb.authStatus==='pending') return {code:'AUTHORIZATION_HOLD', line:'Waiting on Regional Center authorization.'};
    return {code:'CONFIRMED', line:'Booked. A session is reserved.'};
  }
  if(f.type==='SelfPay'){
    var sp = f.selfpay;
    if(sp.method==='card' && sp.cardOnFile && sp.cardOnFile.declined && !sp.newCard){
      return {code:'PAYMENT_HOLD', line:'Waiting on payment.'};
    }
  }
  return {code:'CONFIRMED', line:'Booked. A session is reserved.'};
}
var OUTCOME = {
  CONFIRMED:        {cls:'o-confirmed',   icon:'check_circle',  title:'Confirmed',            chip:'k-ok'},
  PENDING_PARTNER:  {cls:'o-pending',     icon:'hourglass_top', title:'Waiting on a partner', chip:'k-warn'},
  WAITLISTED:       {cls:'o-waitlisted',  icon:'list_alt',      title:'On the waitlist',      chip:'k-info'},
  AUTHORIZATION_HOLD:{cls:'o-authhold',   icon:'hourglass_top', title:'Awaiting authorization',chip:'k-warn'},
  PAYMENT_HOLD:     {cls:'o-paymenthold', icon:'error',         title:'Awaiting payment',     chip:'k-bad'}
};
function allOutcomes(){
  var out = [];
  state.selected.forEach(function(id){
    crFor(id).svcOrder.forEach(function(k){
      var o = computeOutcome(id,k);
      out.push({custId:id, svcKey:k, code:o.code, line:o.line});
    });
  });
  return out;
}
function rcebActive(custId){
  var cr = state.cr[custId];
  if(!cr) return false;
  return cr.svcOrder.some(function(k){ return cr.services[k].funding.type==='RCEB'; });
}

// Money the person owes right now: anything bought from the marketplace in this
// journey, plus per-session private pricing. Packages already paid for cost nothing.
function amountDue(){
  var total = 0;
  state.selected.forEach(function(id){
    var cr = state.cr[id];
    if(!cr) return;
    Object.keys(cr.marketplace).forEach(function(k){
      if(cr.marketplace[k].bought) total += cr.marketplace[k].price;
    });
    if(state.bookingType==='private'){
      cr.svcOrder.forEach(function(k){
        cr.services[k].picks.forEach(function(p){ total += PRIVATE_PRICE[p.length||60]; });
      });
    }
  });
  return total;
}

function renderShell(){

function renderRail(){

function renderPeopleStrip(){
  var list = state.selected;

  list.forEach(function(id,idx){
    var c = CUSTOMERS[id];

function renderDoneRow(n){
  var names = state.selected.map(function(id){ return CUSTOMERS[id].name; }).join(', ');
  var v;
  if(n===1){
    v = names || 'nobody selected yet';
  } else if(n===2){
    var picks = [];
    state.selected.forEach(function(id){
      var cr = state.cr[id];
      if(!cr) return;
      cr.svcOrder.forEach(function(k){
        cr.services[k].picks.forEach(function(p){
          picks.push(CUSTOMERS[id].services[k].name+' '+p.day+' '+p.time);
        });
      });
    });
    v = picks.length ? picks.join(' &middot; ') : 'no class chosen yet';
  } else if(n===3){
    var total = 0;
    state.selected.forEach(function(id){
      crFor(id).svcOrder.forEach(function(k){
        if(PREVIEW[id] && PREVIEW[id][k]) total += PREVIEW[id][k].dates.length;
      });
    });
    v = total ? total+' dates generated' : 'nothing generated';
  } else {
    v = allOutcomes().map(function(o){ return OUTCOME[o.code].title; })
        .filter(function(t,i,a){ return a.indexOf(t)===i; }).join(', ');
  }
  return '<div class="done-row"><span class="tick">'+ic('check')+'</span>'+
         '<span class="dk">'+stepLabel(n)+'</span>'+
         '<span class="dv">'+v+'</span>'+
         '<button type="button" class="link-btn" onclick="Z.goToStep('+n+')">Change</button></div>';
}

function renderPersonDetail(c){
  var cr = crFor(c.id);
  var rows = c.context.filter(function(r){
    return CAN.seeInternal() || (c.internalRows||[]).indexOf(r[0])===-1;
  });
  var h = '<div class="dl">';
  rows.forEach(function(r){
    var isBal = r[0]==='Credits (Balance)';
    var v = raw(r[1]);
    if(isBal){
      var m = /(\d+)\s*\/\s*(\d+)/.exec(v);
      v = m ? balanceLine(parseInt(m[1],10), parseInt(m[2],10)) : v;
    }
    h += '<div class="dl-row"><div class="dl-k">'+raw(r[0])+'</div><div class="dl-v'+(isBal?' bal':'')+'">'+v+'</div></div>';
  });
  h += '</div>';

  cr.svcOrder.forEach(function(k){ h += renderEligibility(c,cr,k); });

  var mktTotal = 0;
  Object.keys(cr.marketplace).forEach(function(k){
    if(cr.marketplace[k].bought) mktTotal += cr.marketplace[k].price;
  });
  if(mktTotal>0){
    h += '<div class="note n-info">'+ic('shopping_cart')+'<div>Buying this booking: $'+mktTotal.toFixed(2)+' for '+esc(c.name)+'.</div></div>';
  }
  return h;
}

function renderEligibility(c,cr,k){
  var svc = c.services[k];
  var mkt = cr.marketplace[k];
  var bought = mkt && mkt.bought;
  var hasPkg = svc.hasPackage || bought;

  var h = '<div class="elig">';
  h += '<div class="elig-hd">'+
       '<h4>'+esc(svc.name)+' &middot; '+esc(svc.level)+'</h4>'+
       '<span class="tag '+svc.kind+'">'+svc.kind.toUpperCase()+'</span>'+
       '<span class="sp"></span>'+
       (svc.levelOk && svc.ageOk && hasPkg
          ? '<span class="chip k-ok">'+ic('check')+'Ready to book</span>'
          : '<span class="chip k-warn">'+ic('priority_high')+'Needs attention</span>')+
       '</div>';

  h += '<div class="kv"><b>Skill level required</b><span class="v">'+esc(svc.level)+' '+
       (svc.levelOk ? '<span class="chip k-ok">Approved</span>'
                    : '<span class="chip k-bad">'+esc(firstName(c.name))+' is '+esc(svc.customerLevel||'a different level')+'</span>')+'</span></div>';
  h += '<div class="kv"><b>Age group</b><span class="v">'+esc(svc.ageGroup)+' '+
       (svc.ageOk ? '<span class="chip k-ok">Approved</span>' : '<span class="chip k-bad">Not approved</span>')+'</span></div>';

  if(hasPkg){
    var pkgName = bought ? mkt.item : svc.packageName;
    var units   = bought ? mkt.units : svc.unitsLeft;
    var total   = bought ? mkt.units : (svc.unitsTotal || svc.unitsLeft);
    h += '<div class="kv"><b>Package</b><span class="v">'+raw(pkgName)+
         (bought ? ' <span class="chip k-info">Buying now</span>' : '')+'</span></div>';
    h += '<div class="kv"><b>Sessions available</b><span class="v">'+balanceLine(units,total)+'</span></div>';
    if(!bought && svc.term){
      h += '<div class="kv"><b>Paid through</b><span class="v">'+raw(svc.term.start)+' – '+raw(svc.term.end)+
           ' &middot; '+svc.term.units+' units unlocked</span></div>';
    } else if(bought){
      h += '<div class="kv"><b>Paid through</b><span class="v">Provisional — units granted pending payment</span></div>';
    }
    if(bought){
      h += '<div class="band"><span class="dot"></span><div class="band-id">'+
           '<div class="band-t">'+raw(mkt.item)+'<span class="tag '+svc.kind+'">'+svc.kind.toUpperCase()+'</span></div>'+
           '<div class="band-s">'+esc(svc.name)+' &middot; '+esc(svc.level)+'</div>'+
           '<div class="band-f"><span>'+ic('check')+' Added to this booking &mdash; $'+mkt.price.toFixed(2)+'</span>'+
           '<span>'+mkt.units+' units</span></div></div>'+
           '<span class="chip k-ok">'+ic('check')+'Selected</span></div>';
    }
  } else {
    h += '<div class="kv"><b>Package</b><span class="v"><span class="chip k-warn">None on file</span></span></div>';
    h += '<div class="note n-warn">'+ic('info')+'<div>'+esc(firstName(c.name))+
         ' has no '+esc(svc.name)+' package, so nothing can be scheduled yet. '+
         (isStaff() ? 'Add one below and it applies to this booking.' : 'Choose one below to continue.')+'</div></div>';
    if(!(mkt && mkt.open)){
      h += '<button type="button" class="btn btn-primary btn-sm" style="margin-top:10px" onclick="Z.openMarketplace(\''+c.id+'\',\''+k+'\')">'+
           ic('add_shopping_cart')+' Choose a package</button>';
    } else {
      h += renderMarketplace(c,cr,k);
    }
  }
  h += '</div>';
  return h;
}

function renderMarketplace(c,cr,k){
  var svc = c.services[k];
  var scheduled = cr.services[k].picks.length;
  var blockTooSmall = scheduled > 5;
  var h = '<div class="sub" style="margin-top:16px">Packages for '+esc(svc.level)+
          '<span class="c">'+esc(firstName(c.name))+'&rsquo;s level</span>'+
          '<span class="sp"></span>'+
          '<button type="button" class="btn btn-quiet btn-sm" onclick="Z.closeMarketplace(\''+c.id+'\',\''+k+'\')">Cancel</button></div>';
  h += '<div class="mkt">';

  h += '<div class="mkt-card"><h4>'+esc(svc.name)+' 5-Pack</h4>'+
       '<p class="what">Five class units. Use them whenever, no monthly commitment.</p>'+
       '<div class="mkt-price">$135.00</div>'+
       '<div class="mkt-was">$150.00 standard &middot; Family Membership Plus price shown</div>'+
       '<div class="mkt-foot">';
  if(blockTooSmall){
    h += '<p class="hint" style="color:var(--danger-dark);margin-bottom:8px">'+scheduled+
         ' classes are already scheduled and this pack covers five. Remove one first.</p>'+
         '<button type="button" class="btn btn-ghost btn-sm btn-block" disabled>Choose 5-Pack</button>';
  } else {
    h += '<button type="button" class="btn btn-primary btn-sm btn-block" onclick="Z.buyItem(\''+c.id+'\',\''+k+'\',\''+esc(svc.name)+' 5-Pack\',135,5)">Choose 5-Pack</button>';
  }
  h += '</div></div>';

  h += '<div class="mkt-card"><h4>'+esc(svc.name)+' Monthly</h4>'+
       '<p class="what">Eight units every month, renews automatically until cancelled.</p>'+
       '<div class="mkt-price">$79.00<span style="font-size:.8rem;font-weight:600;color:var(--text-secondary)">/mo</span></div>'+
       '<div class="mkt-was">$89.00 standard &middot; Family Membership Plus price shown</div>'+
       '<div class="mkt-foot"><button type="button" class="btn btn-primary btn-sm btn-block" onclick="Z.buyItem(\''+c.id+'\',\''+k+'\',\''+esc(svc.name)+' Monthly\',79,8)">Choose Monthly</button></div></div>';

  h += '</div>';
  h += '<p class="hint" style="margin-top:10px">A membership covers this for less overall. <a href="voucher-management.html">Compare memberships</a></p>';
  return h;
}

// ============================== STEP 2 — WHEN ==============================
function renderStep2(){
  var c = activeCustomer();
  if(!c) return emptyPanel(2);
  var cr = crFor(c.id);
  var h = '<div class="panel">'+panelHead(2)+'<div class="p-body">';
  if(cr.svcOrder.length>1) h += renderOrderMode(c,cr);
  cr.svcOrder.forEach(function(k,idx){ h += renderServiceSection(c,cr,k,idx); });
  h += '</div></div>';
  return h;
}
function emptyPanel(n){
  return '<div class="panel">'+panelHead(n)+'<div class="p-body"><div class="empty">'+
         ic('person_off')+'Nobody is selected yet. Go back to '+stepLabel(1)+' to choose someone.</div></div></div>';
}

var ORDER_MODES = [
  {k:'drywet', label:'Dry, then wet'},
  {k:'wetdry', label:'Wet, then dry'},
  {k:'flexible', label:'Any order'}
];
function orderRuleText(cr){
  if(cr.orderMode==='flexible') return 'Any time may be picked for any day. Two sessions still cannot overlap.';
  if(cr.orderMode==='drywet')  return 'On a shared day, the wet session starts after the dry one ends. Overlap is always blocked.';
  return 'On a shared day, the dry session starts after the wet one ends. Overlap is always blocked.';
}
function renderOrderMode(c,cr){
  var h = '<div class="sub">Session order for '+esc(firstName(c.name))+'</div>';
  h += '<div class="pills" role="group" aria-label="Session order">';
  ORDER_MODES.forEach(function(m){
    h += '<button type="button" class="pill" aria-pressed="'+(cr.orderMode===m.k)+'" onclick="Z.setOrderMode(\''+c.id+'\',\''+m.k+'\')">'+m.label+'</button>';
  });
  h += '</div>';
  h += '<p class="hint" style="margin-top:8px">'+orderRuleText(cr)+'</p>';
  return h;
}

function renderServiceSection(c,cr,k,idx){
  var svc = c.services[k];
  var rt = cr.services[k];
  var locked = state.bookingType==='private' && idx>0 && !cr.services[cr.svcOrder[idx-1]].complete;
  var open = cr.openSection===k && !locked;
  var picked = rt.picks[0];

  var h = '<div class="svc'+(locked?' locked':'')+'" style="margin-top:14px">';
  h += '<button type="button" class="svc-hd" aria-expanded="'+open+'" '+(locked?'disabled':'')+
       ' onclick="Z.toggleSection(\''+c.id+'\',\''+k+'\')">';
  h += '<span class="material-symbols-rounded chev">chevron_right</span>';
  h += '<h3>'+esc(svc.name)+' &middot; '+esc(svc.level)+'<span class="tag '+svc.kind+'">'+svc.kind.toUpperCase()+'</span></h3>';
  h += '<span class="sp"></span>';
  if(locked){
    h += '<span class="chip k-mute">Finish '+esc(c.services[cr.svcOrder[idx-1]].name)+' first</span>';
  } else if(picked){
    h += '<span class="chip '+(picked.mode==='waitlist'?'k-info':'k-ok')+'">'+ic(picked.mode==='waitlist'?'list_alt':'check')+
         esc(picked.day)+' '+esc(picked.time)+'</span>';
  } else {
    h += '<span class="chip k-mute">No class chosen</span>';
  }
  h += '</button>';

  if(open){
    h += '<div class="svc-bd">';
    var mkt = cr.marketplace[k];
    if(!svc.hasPackage && !(mkt && mkt.bought)){
      h += '<div class="note n-warn">'+ic('shopping_cart')+'<div>No '+esc(svc.name)+' package for '+esc(firstName(c.name))+
           '. <button type="button" class="link-btn" onclick="Z.goToStep(1)">Choose one in '+stepLabel(1)+'</button> before scheduling.</div></div>';
    } else {
      h += renderDayPicker(c,cr,k,svc);
      if(state.bookingType==='semiprivate') h += renderParticipants(c,cr,k);
      h += renderClassList(c,cr,k,svc,idx);
    }
    h += '</div>';
  }
  h += '</div>';
  return h;
}

// ---- day + time-window picker -------------------------------------------------
function renderDayPicker(c,cr,k,svc){
  var win = cr.services[k].window;
  var onCount = activeDays(cr,k).length;

  var h = '<div class="sub">Which days and times work?<span class="c">'+onCount+' of 7 days on</span></div>';
  h += '<div class="dp">';
  h += '<div class="dp-bar">';
  Object.keys(PRESETS).forEach(function(p){
    h += '<button type="button" class="pill" onclick="Z.applyPreset(\''+c.id+'\',\''+k+'\',\''+p+'\')">'+PRESETS[p].label+'</button>';
  });
  h += '<span class="sp"></span>';
  h += '<button type="button" class="btn btn-quiet btn-sm" onclick="Z.setAllDays(\''+c.id+'\',\''+k+'\',true)">Select all</button>';
  h += '<button type="button" class="btn btn-quiet btn-sm" onclick="Z.setAllDays(\''+c.id+'\',\''+k+'\',false)">Clear all</button>';
  h += '</div>';

  WEEK.forEach(function(d){
    var w = win[d.k];
    h += '<div class="dp-row '+(w.on?'on':'off')+'">';
    h += '<label class="dp-day"><input type="checkbox" '+(w.on?'checked':'')+
         ' onchange="Z.toggleDay(\''+c.id+'\',\''+k+'\',\''+d.k+'\')"/>'+
         '<span><span class="d">'+d.full+'</span><span class="dt">'+d.date+'</span></span></label>';
    h += '<div class="dp-times">';
    h += '<span>from</span><select class="inp" '+(w.on?'':'disabled')+' aria-label="'+d.full+' earliest start" onchange="Z.setWindow(\''+c.id+'\',\''+k+'\',\''+d.k+'\',\'from\',this.value)">';
    HOURS.forEach(function(t){ h += '<option '+(w.from===t?'selected':'')+'>'+t+'</option>'; });
    h += '</select>';
    h += '<span>to</span><select class="inp" '+(w.on?'':'disabled')+' aria-label="'+d.full+' latest start" onchange="Z.setWindow(\''+c.id+'\',\''+k+'\',\''+d.k+'\',\'to\',this.value)">';
    HOURS.forEach(function(t){ h += '<option '+(w.to===t?'selected':'')+'>'+t+'</option>'; });
    h += '</select>';
    h += '</div>';
    h += '<button type="button" class="icon-btn" title="Reset '+d.full+' to all day" aria-label="Reset '+d.full+' times" '+
         (w.on?'':'disabled')+' onclick="Z.resetDay(\''+c.id+'\',\''+k+'\',\''+d.k+'\')">'+ic('restart_alt')+'</button>';
    h += '</div>';
  });
  h += '</div>';

  h += '<div class="sub">How often?</div>';
  h += '<div class="pills"><button type="button" class="pill" aria-pressed="true">Repeats weekly</button>'+
       '<button type="button" class="pill" aria-pressed="false" data-noop>One time only</button></div>';
  h += '<div class="pills" style="margin-top:6px"><button type="button" class="pill" aria-pressed="true">Until cancelled</button>'+
       '<button type="button" class="pill" aria-pressed="false" data-noop>Fixed end date</button></div>';

  h += '<div class="sub">Instructors<span class="c">filtered on location, service, level, qualification, availability and restrictions</span></div>';
  h += '<div class="pills">';
  INSTRUCTORS.forEach(function(name){
    var on = svc.instructor===name;
    h += '<button type="button" class="pill" aria-pressed="'+on+'" data-noop>'+avatar(name,true)+esc(name)+'</button>';
  });
  h += '<button type="button" class="pill" aria-pressed="false" data-noop>Anyone qualified</button>';
  h += '</div>';
  return h;
}

// ---- participants (semi-private) ---------------------------------------------
function renderParticipants(c,cr,k){
  var svc = c.services[k];
  var extra = Object.keys(cr.participants[k]||{});
  var have = 1+extra.length;
  var h = '<div class="sub">Who else is in this session?<span class="c">2 needed</span></div>';
  h += '<div class="p-row sel"><div class="p-main"><span class="cbx">'+ic('check')+'</span>'+avatar(c.name)+
       '<span class="p-id"><span class="p-name">'+esc(c.name)+'</span>'+
       '<span class="p-meta">'+raw(svc.label)+' &middot; added automatically</span></span></div></div>';
  extra.forEach(function(name){
    h += '<div class="p-row sel"><div class="p-main"><span class="cbx">'+ic('check')+'</span>'+avatar(name)+
         '<span class="p-id"><span class="p-name">'+esc(name)+'</span><span class="p-meta">Eligible</span></span>'+
         '<button type="button" class="btn btn-quiet btn-sm" onclick="Z.removeParticipant(\''+c.id+'\',\''+k+'\',\''+esc(name)+'\')">Remove</button></div></div>';
  });
  h += '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="Z.addParticipant(\''+c.id+'\',\''+k+'\')">'+
       ic('person_add')+' Add a participant</button>';
  if(have<2){
    h += '<div class="note n-warn">'+ic('hourglass_top')+'<div>With '+have+' of 2 participants this session shows as '+
         '<strong>Waiting on a partner</strong> on the calendar until someone joins.</div></div>';
  }
  return h;
}

// ---- class list --------------------------------------------------------------
function slotsForType(svcKey){
  if(state.bookingType==='group'){
    if(svcKey==='fitness') return CLASS_SLOTS.groupFitness;
    if(svcKey==='basketball') return CLASS_SLOTS.groupBasketball;
  }
  return CLASS_SLOTS[state.bookingType];
}

function renderClassList(c,cr,k,svc,idx){
  var days = activeDays(cr,k);
  var slots = slotsForType(svc.key);
  var label = state.bookingType==='group' ? 'Classes you can join' : 'Times this instructor is free';

  var h = '<div class="sub" style="margin-top:22px">'+label+
          '<span class="c">'+esc(svc.name)+' &middot; '+esc(svc.level)+'</span><span class="sp"></span>';
  if(CAN.createSlot()){
    h += '<button type="button" class="btn btn-ghost btn-sm staff-only" onclick="Z.openDrawer(\''+c.id+'\',\''+k+'\')">'+
         ic('add')+' Create a class</button>';
  }
  h += '</div>';

  if(!days.length){
    h += '<div class="empty">'+ic('event_busy')+'No days are switched on. Turn one on above to see classes.</div>';
    return h;
  }

  var any = false;
  days.forEach(function(dayKey){
    var daySlots = slots.filter(function(s){ return slotInWindow(cr,k,s); })
                        .filter(function(s){ return s.day.toUpperCase()===dayKey; });
    var w = cr.services[k].window[dayKey];
    h += '<div class="dayband"><h5>'+dayLabel(dayKey)+'</h5>'+
         '<span class="c">'+(daySlots.length ? daySlots.length+(daySlots.length===1?' option':' options') : 'nothing available')+
         ' &middot; '+w.from+' to '+w.to+'</span><span class="ln"></span></div>';
    if(!daySlots.length){
      h += '<div class="empty">'+ic('event_busy')+'Nothing on '+dayLabel(dayKey)+
           ' inside that window. Widen the times, or '+
           (CAN.createSlot() ? 'create a class.' : 'try another day.')+'</div>';
      return;
    }
    any = true;
    h += '<div class="rail-scroll" role="list">';
    daySlots.forEach(function(s){ h += renderSlot(c,cr,k,svc,s,idx); });
    h += '</div>';
  });

  if(!any && CAN.createSlot()){
    h += '<button type="button" class="btn btn-ghost btn-sm staff-only" onclick="Z.openDrawer(\''+c.id+'\',\''+k+'\')">'+
         ic('add')+' No suitable class? Create one now</button>';
  }
  return h;
}

function pickedInfo(cr,k,s){
  return cr.services[k].picks.filter(function(p){ return p.day===s.day && p.time===s.time; })[0];
}

function renderSlot(c,cr,k,svc,s,idx){
  var picked = pickedInfo(cr,k,s);
  var rt = cr.services[k];
  // Skill level is never a filter — the class still shows, with the mismatch stated
  // and selection gated until a staff override is recorded.
  var levelBlocked = !svc.levelOk && !rt.levelOverride;
  var reasons = [];
  if(levelBlocked){
    reasons.push('This class is '+svc.level+' &mdash; '+firstName(c.name)+' is '+(svc.customerLevel||'a different level'));
  }
  if(!svc.ageOk) reasons.push('Ages '+svc.ageGroup+' only');

  var h = '<div class="slot'+(picked?' sel':'')+(levelBlocked?' blocked':'')+'" role="listitem">';
  h += '<div class="slot-time">'+raw(s.time)+'</div>';
  h += '<div class="slot-svc"><span class="dot"></span>'+esc(svc.name)+' &middot; '+esc(svc.level)+
       '<span class="tag '+svc.kind+'">'+svc.kind.toUpperCase()+'</span></div>';
  h += '<div class="slot-line">'+avatar(s.instructor,true)+esc(s.instructor)+'</div>';
  h += '<div class="slot-line">'+ic('place')+esc(s.location)+'</div>';

  if(state.bookingType==='group'){
    var f = fillState(s.booked,s.capacity);
    h += '<div class="slot-fill">'+seatMeter(s.booked,s.capacity)+
         '<span class="fill-w '+f.c+'">'+f.w+'</span></div>';
    h += '<div class="slot-bal">'+esc(s.booked)+' of '+esc(s.capacity)+' spots taken</div>';
  } else if(state.bookingType==='semiprivate'){
    var pf = fillState(s.participants,s.required);
    h += '<div class="slot-fill">'+seatMeter(s.participants,s.required)+
         '<span class="fill-w '+(s.participants>=s.required?'f-open':'f-lim')+'">'+
         s.participants+' of '+s.required+' joined</span></div>';
    h += '<div class="slot-bal">'+(s.participants>=s.required ? 'Ready to confirm' : 'Needs one more participant')+'</div>';
  } else {
    h += '<div class="sub" style="margin:12px 0 6px;font-size:.78rem">Session length</div>';
    h += '<div class="pills">';
    [30,60].forEach(function(len){
      var on = (picked && picked.length===len) || (!picked && len===60);
      h += '<button type="button" class="pill" aria-pressed="'+on+'" onclick="Z.pickPrivate(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+raw(s.time)+'\','+len+')">'+
           len+' min &middot; $'+PRIVATE_PRICE[len]+(len===60?' <small>best rate</small>':'')+'</button>';
    });
    h += '</div>';
  }

  h += '<div class="slot-acts">';
  if(state.bookingType==='group'){
    var full = s.booked>=s.capacity;
    if(full){
      h += '<button type="button" class="btn btn-warn btn-sm btn-block" onclick="Z.pickSlot(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+raw(s.time)+'\',\'waitlist\')">'+
           ic('list_alt')+' Join the waitlist</button>';
      if(CAN.levelOverride()){
        h += '<button type="button" class="btn btn-quiet btn-sm btn-block staff-only" onclick="Z.squeezeIn(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+raw(s.time)+'\')">'+
             ic('lock_open')+' Squeeze in over capacity</button>';
      }
    } else if(picked && picked.mode==='book'){
      h += '<button type="button" class="btn btn-dark btn-sm btn-block" disabled>'+ic('check')+' Chosen</button>';
    } else {
      h += '<button type="button" class="btn btn-primary btn-sm btn-block" '+(levelBlocked?'disabled':'')+
           ' onclick="Z.pickSlot(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+raw(s.time)+'\',\'book\')">Choose this class</button>';
      h += '<button type="button" class="btn btn-quiet btn-sm btn-block" onclick="Z.pickSlot(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+raw(s.time)+'\',\'waitlist\')">Waitlist instead</button>';
    }
  } else if(state.bookingType==='semiprivate'){
    h += '<button type="button" class="btn '+(picked?'btn-dark':'btn-primary')+' btn-sm btn-block" '+
         (levelBlocked||picked?'disabled':'')+' onclick="Z.pickSlot(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+raw(s.time)+'\',\'book\')">'+
         (picked?ic('check')+' Chosen':'Choose this time')+'</button>';
  } else {
    h += '<button type="button" class="btn '+(picked?'btn-dark':'btn-primary')+' btn-sm btn-block" '+
         (levelBlocked?'disabled':'')+' onclick="Z.pickPrivate(\''+c.id+'\',\''+k+'\',\''+s.day+'\',\''+raw(s.time)+'\','+(picked?picked.length:60)+')">'+
         (picked?ic('check')+' Chosen':'Choose this time')+'</button>';
  }
  h += '</div>';

  if(reasons.length || (!svc.levelOk && rt.levelOverride)){
    h += '<div class="slot-foot">';
    if(reasons.length){
      h += '<ul class="reasons">';
      reasons.forEach(function(r){ h += '<li><span>'+raw(r)+'</span></li>'; });
      h += '</ul>';
      if(levelBlocked && CAN.levelOverride()){
        h += '<button type="button" class="btn btn-warn btn-sm btn-block staff-only" style="margin-top:8px" onclick="Z.applyLevelOverride(\''+c.id+'\',\''+k+'\')">'+
             ic('lock_open')+' Override the level check</button>';
      }
    } else {
      h += '<div class="slot-bal" style="color:var(--success-dark);font-weight:600">'+
           ic('lock_open')+'Level override recorded for this booking</div>';
    }
    h += '</div>';
  }

  var joint = jointCapacityMessage(k,s);
  if(joint) h += '<div class="note n-bad">'+ic('error')+'<div>'+joint+'</div></div>';

  h += '</div>';
  return h;
}

function jointCapacityMessage(k,s){
  if(state.bookingType!=='group') return null;
  var assigned = [];
  state.selected.forEach(function(id){
    var cr = state.cr[id];
    if(!cr || !cr.services[k]) return;
    var hit = cr.services[k].picks.filter(function(p){
      return p.day===s.day && p.time===s.time && p.mode==='book';
    })[0];
    if(hit) assigned.push(id);
  });
  if(assigned.length<2) return null;
  var remaining = s.capacity - s.booked;
  if(assigned.length>remaining){
    return 'Only '+remaining+' spot'+(remaining===1?'':'s')+' left and '+assigned.length+
           ' people are assigned here. Move one to another time, or waitlist the second.';
  }
  return null;
}

function renderDateList(c,cr,k,svc,data){
  var byDay = {}, skipByDay = {};
  data.dates.forEach(function(dt){ (byDay[dt.day]=byDay[dt.day]||[]).push(dt); });
  data.skipped.forEach(function(sk){ (skipByDay[sk.day]=skipByDay[sk.day]||[]).push(sk); });

  var h = '<div class="dates">';
  ['MON','TUE','WED','THU','FRI','SAT','SUN'].forEach(function(d){
    if(!byDay[d] && !skipByDay[d]) return;
    var n = (byDay[d]||[]).length;
    h += '<div class="dt-grp">'+dayLabel(d)+' &middot; '+n+(n===1?' session':' sessions')+'</div>';
    (byDay[d]||[]).forEach(function(dt){
      var id = c.id+'_'+k+'_'+dt.date;
      var on = !(cr.previewChecks && cr.previewChecks[id]===false);
      h += '<label class="dt-row"><input type="checkbox" '+(on?'checked':'')+
           ' onchange="Z.togglePreviewDate(\''+c.id+'\',\''+id+'\')"/>'+
           '<span class="d">'+raw(dt.date)+'</span>'+
           '<span class="m">'+raw(data.instructor)+' &middot; '+raw(svcTimeFor(svc,dt.day).start)+'</span></label>';
    });
    (skipByDay[d]||[]).forEach(function(sk){
      h += '<div class="dt-row skip"><span style="width:16px;flex-shrink:0"></span>'+
           '<span class="d">'+raw(sk.date)+'</span>'+
           '<span class="m">Centre closed &mdash; '+raw(sk.reason)+'</span>'+
           '<span class="chip k-mute">Skipped</span></div>';
    });
  });
  h += '</div>';

  h += '<div class="note n-warn">'+ic('flag')+'<div>Stops here because '+raw(data.stopText)+'.'+
       (data.tentative.length ? ' Later dates are shown below as tentative.' : '')+'</div></div>';

  if(data.tentative.length){
    h += '<div class="sub">Beyond what is paid for<span class="c">nothing can be reserved yet</span></div>';
    h += '<div class="dates">';
    data.tentative.forEach(function(dt){
      h += '<div class="dt-row tent"><input type="checkbox" disabled aria-label="Tentative date, not bookable"/>'+
           '<span class="d">'+raw(dt.date)+'</span>'+
           '<span class="m">'+raw(data.instructor)+' &middot; '+raw(svcTimeFor(svc,dt.day).start)+'</span>'+
           '<span class="chip k-mute">Tentative</span></div>';
    });
    h += '</div>';
  }
  return h;
}

function renderCalendar(c,svc,data,idx){
  var color = SVC_COLORS[idx%SVC_COLORS.length];
  var suffix = function(i){
    if(i===1||i===21||i===31) return 'st';
    if(i===2||i===22) return 'nd';
    if(i===3||i===23) return 'rd';
    return 'th';
  };
  var h = '<div class="cal">';
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(function(d){ h += '<div class="cal-h">'+d+'</div>'; });
  // September 2026 starts on a Tuesday.
  for(var pad=0;pad<1;pad++) h += '<div class="cal-c" style="border-color:transparent;background:transparent"></div>';
  for(var i=1;i<=30;i++){
    var key = i+suffix(i)+' Sep';
    var hit = data.dates.filter(function(dt){ return dt.date===key; })[0];
    var skip = data.skipped.filter(function(dt){ return dt.date===key; })[0];
    h += '<div class="cal-c'+(hit?' has':'')+'"><span>'+i+'</span>';
    if(hit) h += '<span class="cd" style="background:'+color+'" title="'+raw(svc.name)+' '+raw(data.time)+'"></span>';
    if(skip) h += '<span class="cd" style="background:transparent;border:1px dashed '+color+'" title="Centre closed"></span>';
    h += '</div>';
  }
  h += '</div>';
  h += '<div class="note n-warn">'+ic('flag')+'<div>Stops here because '+raw(data.stopText)+'.</div></div>';
  return h;
}

  if(ov.duration==='MANUAL'){
    h += '<div class="fld"><label for="ov-m-'+id+'">Review note</label><textarea class="inp" id="ov-m-'+id+'" rows="2" '+
         'oninput="Z.setOverrideField(\''+c.id+'\',\''+k+'\',\'manualNote\',this.value)">'+esc(ov.manualNote)+'</textarea></div>';
  }

  h += '<div class="fld"><label>Which appointments?</label><div class="pills">'+
       '<button type="button" class="pill" aria-pressed="'+(ov.affected==='this')+'" onclick="Z.setOverrideField(\''+c.id+'\',\''+k+'\',\'affected\',\'this\')">This one</button>'+
       '<button type="button" class="pill" aria-pressed="'+(ov.affected==='series')+'" onclick="Z.setOverrideField(\''+c.id+'\',\''+k+'\',\'affected\',\'series\')">This and the whole series</button>'+
       '</div></div>';
  h += '<div class="fld"><label for="ov-x-'+id+'">What funding is expected?</label><input class="inp" id="ov-x-'+id+
       '" placeholder="Renewal expected within 30 days" value="'+esc(ov.expected)+
       '" oninput="Z.setOverrideField(\''+c.id+'\',\''+k+'\',\'expected\',this.value)"/></div>';
  h += '<div class="fld"><label for="ov-r-'+id+'">Review date <span style="color:var(--danger)">*</span></label><input class="inp" id="ov-r-'+id+'" type="date" value="'+esc(ov.expiry)+
       '" oninput="Z.setOverrideField(\''+c.id+'\',\''+k+'\',\'expiry\',this.value)"/></div>';
  h += '<div class="fld"><label for="ov-w-'+id+'">Reason <span style="color:var(--danger)">*</span></label><textarea class="inp" id="ov-w-'+id+'" rows="2" '+
       'placeholder="Why this booking goes ahead without funding cleared" '+
       'oninput="Z.setOverrideField(\''+c.id+'\',\''+k+'\',\'reason\',this.value)">'+esc(ov.reason)+'</textarea></div>';
  h += '<div style="display:flex;gap:10px">'+
       '<button type="button" class="btn btn-ghost" onclick="Z.toggleOverride(\''+c.id+'\',\''+k+'\')">Cancel</button>'+
       '<button type="button" class="btn btn-primary" '+(ov.reason && ov.expiry ? '' : 'disabled')+
       ' onclick="Z.applyOverride(\''+c.id+'\',\''+k+'\')">Apply the override</button></div>';
  if(!(ov.reason && ov.expiry)) h += '<p class="audit">A reason and a review date are both required.</p>';
  h += '</div>';
  return h;
}

function renderReviewPerson(id){
  var c = CUSTOMERS[id];
  var cr = crFor(id);
  var h = '<div class="sub" style="margin-top:0;font-size:1rem">'+avatar(c.name)+esc(c.name)+
          '<span class="c">'+esc(c.household)+'</span></div>';
  var overridesForCust = [];

  cr.svcOrder.forEach(function(k){
    var svc = c.services[k];
    var rt = cr.services[k];
    var o = computeOutcome(id,k);
    var m = OUTCOME[o.code];
    var pv = PREVIEW[id] && PREVIEW[id][k];
    var dates = pv ? pv.dates.map(function(d){ return d.date; }).join(', ') : '—';
    var nDates = pv ? pv.dates.length : 0;

    h += '<div class="out '+m.cls+'">'+ic(m.icon)+
         '<div><div class="out-t">'+esc(svc.name)+' &mdash; '+m.title+'</div>'+
         '<div class="out-s">'+raw(o.line)+'</div></div></div>';

    h += '<div class="dl" style="margin-bottom:14px">';
    [['Service', raw(svc.name)+' &middot; '+raw(svc.level)],
     ['Instructor', raw(svc.instructor)],
     ['Schedule', raw(svcScheduleText(svc))],
     ['Dates', nDates+(nDates===1?' date':' dates')+(nDates?' &mdash; '+raw(dates):'')],
     ['Location', 'Solar Swim &middot; '+(state.bookingType==='private'?'Pool Lane':'Pool Lane 8')],
     ['Repeats', 'Weekly until cancelled &mdash; stops because '+(pv?raw(pv.stopText):'—')],
     ['Paid by', raw(fundingSummaryText(rt.funding,k,id))]
    ].forEach(function(r){
      h += '<div class="dl-row"><div class="dl-k">'+r[0]+'</div><div class="dl-v">'+r[1]+'</div></div>';
    });
    h += '</div>';

    cr.overrides.filter(function(ov){ return ov.svc===k; }).forEach(function(ov){
      overridesForCust.push(svc.name+': '+ov.reason+' — '+ov.who+', '+ov.when);
    });
  });

  if(rcebActive(id) && state.bookingType!=='group'){
    h += '<div class="note n-info">'+ic('info')+'<div>Sessions after the first stay tentative until Regional Center authorization comes back.</div></div>';
  }
  if(overridesForCust.length){
    h += '<div class="sub staff-only">Overrides recorded</div>';
    h += '<div class="staff-only">';
    overridesForCust.forEach(function(t){
      h += '<div class="note n-warn" style="margin-top:6px">'+ic('history_edu')+'<div>'+raw(t)+'</div></div>';
    });
    h += '</div>';
  }
  return h;
}

function fundingSummaryText(funding,k,custId){
  if(!funding.processed) return 'Not processed yet';
  if(funding.type==='RCEB'){
    var m = rcebMatch(custId,k,funding.rceb.code);
    return 'Regional Center — '+m.text+(funding.rceb.authStatus==='pending' ? ' Authorization still pending.' : '');
  }
  if(funding.type==='Voucher') return 'Voucher on file, verified';
  if(funding.type==='MakeUp')  return 'Make-up token — one consumed on confirm';
  var sp = funding.selfpay;
  if(sp.method!=='card') return 'Self pay — '+sp.method;
  if(sp.cardOnFile && sp.cardOnFile.declined && !sp.newCard){
    return 'Self pay — card on file (Visa •••• '+sp.cardOnFile.last4+') declined '+sp.cardOnFile.declinedDate;
  }
  if(sp.newCard) return 'Self pay — new card, Visa •••• 9012';
  return 'Self pay — card';
}

function renderSummaryRail(){

    if(holds.length){
      h += '<div class="sum"><div class="sum-hd"><h3>Needs attention</h3></div><div class="sum-bd">';
      holds.forEach(function(o){

// ============================== FOOTER ==============================
function renderFooter(){
  var backDisabled = state.step===1;
  var nextLabel = 'Continue', note = '', nextDisabled = false, confirm = false;

  if(state.step===1 && !state.selected.length){
    nextDisabled = true;
    note = isStaff() ? 'Choose at least one customer to continue.' : 'Choose who this booking is for.';
  }
  if(state.step===2){
    var missing = [];
    state.selected.forEach(function(id){
      var cr = state.cr[id];
      if(!cr) return;
      cr.svcOrder.forEach(function(k){
        if(!cr.services[k].picks.length) missing.push(firstName(CUSTOMERS[id].name)+'&rsquo;s '+CUSTOMERS[id].services[k].name);
      });
    });
    if(missing.length) note = 'Still to choose: '+missing.join(', ')+'.';
  }
  if(state.step===5){
    confirm = true;
    var outcomes = allOutcomes();
    var hasWaitlist = outcomes.some(function(o){ return o.code==='WAITLISTED'; });
    var hasOther = outcomes.some(function(o){ return o.code!=='WAITLISTED'; });
    nextLabel = hasWaitlist ? (hasOther ? 'Confirm and join the waitlist' : 'Join the waitlist') : 'Confirm booking';
  }

  var h = '<div class="foot-wrap"><div class="foot">';
  h += '<button type="button" class="btn btn-ghost" '+(backDisabled?'disabled':'')+' onclick="Z.back()">'+ic('arrow_back')+' Back</button>';
  h += '<div class="foot-r">';
  if(note) h += '<span class="foot-note">'+raw(note)+'</span>';
  h += confirm
    ? '<button type="button" class="btn btn-go" onclick="Z.confirmBooking()">'+ic('check')+' '+nextLabel+'</button>'
    : '<button type="button" class="btn btn-primary" '+(nextDisabled?'disabled':'')+' onclick="Z.next()">'+nextLabel+' '+ic('arrow_forward')+'</button>';
  h += '</div></div></div>';
  return h;
}

// ============================== ACTIONS ==============================
var Z = {
  setMode:function(m){
    MODE = (m==='client') ? 'client' : 'staff';
    // Client view has no household-wide search and no employee role.
    if(MODE==='client'){
      state.search = '';
      state.selected = state.selected.filter(function(id){ return HOUSEHOLD.indexOf(id)!==-1; });
      if(state.activeTab >= state.selected.length) state.activeTab = Math.max(0,state.selected.length-1);
    }
    var url = new URL(window.location.href);
    if(MODE==='client') url.searchParams.set('mode','client'); else url.searchParams.delete('mode');
    history.replaceState(null,'',url);
    render();
  },
  setRole:function(v){ state.role=v; render(); },

  switchType:function(t){
    if(t===state.bookingType) return;
    if(state.step>1){
      showToast('Changing the booking type clears every class already chosen.', function(){
        state.bookingType=t; state.cr={}; state.step=Math.min(state.step,2); render();
      }, function(){ render(); });
    } else { state.bookingType=t; render(); }
  },

  setActiveTab:function(i){ state.activeTab=i; render(); },
  goToStep:function(n){ state.step=n; render(); document.getElementById('main-area').scrollTop=0; },
  back:function(){ state.step=Math.max(1,state.step-1); render(); document.getElementById('main-area').scrollTop=0; },
  next:function(){
    if(state.step===1 && !state.selected.length) return;
    state.step = Math.min(5,state.step+1);
    if(state.activeTab>=state.selected.length) state.activeTab=0;
    render();
    document.getElementById('main-area').scrollTop=0;
  },

  setSearch:function(v){ state.search=v; render(); },

  selectCustomer:function(id){
    var idx=state.selected.indexOf(id);
    if(idx!==-1){
      state.selected.splice(idx,1);
      delete state.cr[id];
      delete state.expanded[id];
      if(state.activeTab>=state.selected.length) state.activeTab=Math.max(0,state.selected.length-1);
      render();
      return;
    }
    if(state.selected.length>=3) return;
    state.selected.push(id);
    crFor(id);
    state.expanded[id] = true;   // open the detail on first select, so context is one glance away
    render();
  },
  toggleDetail:function(id){ state.expanded[id] = !state.expanded[id]; render(); },

  removeCustomer:function(id){
    var cr = state.cr[id];
    var scheduled = [];
    if(cr){
      cr.svcOrder.forEach(function(k){
        cr.services[k].picks.forEach(function(p){
          scheduled.push(CUSTOMERS[id].services[k].name+' '+p.day+' '+p.time);
        });
      });
    }
    var msg = scheduled.length
      ? 'Removing '+CUSTOMERS[id].name+' drops '+scheduled.length+' chosen class'+(scheduled.length===1?'':'es')+': '+scheduled.join(', ')+'.'
      : 'Remove '+CUSTOMERS[id].name+' from this booking?';
    showToast(msg, function(){
      var idx=state.selected.indexOf(id);
      if(idx!==-1) state.selected.splice(idx,1);
      delete state.cr[id];
      delete state.expanded[id];
      if(state.activeTab>=state.selected.length) state.activeTab=Math.max(0,state.selected.length-1);
      render();
    }, function(){ render(); });
  },

  openMarketplace:function(id,k){
    var cr=crFor(id);
    cr.marketplace[k]=cr.marketplace[k]||{};
    cr.marketplace[k].open=true;
    render();
  },
  closeMarketplace:function(id,k){
    var cr=crFor(id);
    if(cr.marketplace[k]) cr.marketplace[k].open=false;
    render();
  },
  buyItem:function(id,k,name,price,units){
    crFor(id).marketplace[k]={open:false,bought:true,item:name,price:price,units:units};
    render();
  },

  setOrderMode:function(id,mode){
    var cr=crFor(id);
    cr.orderMode=mode;
    var cleared=[];
    cr.svcOrder.forEach(function(k){
      var rt=cr.services[k], kept=[];
      rt.picks.forEach(function(p){
        if(checkSlotAllowed(id,k,p.day,p.start,p.end).allowed) kept.push(p);
        else cleared.push(CUSTOMERS[id].services[k].name+' '+p.day+' '+p.time);
      });
      rt.picks=kept;
    });
    render();
    if(cleared.length){
      var label = ORDER_MODES.filter(function(m){ return m.k===mode; })[0].label;
      showToast('Cleared '+cleared.join(', ')+' — no longer allowed under &ldquo;'+label+'&rdquo;.', null, null);
    }
  },

  toggleSection:function(id,k){
    var cr=crFor(id);
    cr.openSection = (cr.openSection===k ? null : k);
    render();
  },

  // ---- day picker ----
  toggleDay:function(id,k,dayKey){
    var cr=crFor(id);
    var w = cr.services[k].window[dayKey];
    w.on = !w.on;
    syncSvcDays(id,k);
    render();
  },
  setAllDays:function(id,k,on){
    var win=crFor(id).services[k].window;

    render();
  },
  applyPreset:function(id,k,presetKey){
    var p = PRESETS[presetKey];
    var win = crFor(id).services[k].window;
    WEEK.forEach(function(d){
      var on = p.days.indexOf(d.k)!==-1;
      win[d.k].on = on;

  addParticipant:function(id,k){

  pullIn:function(name){
    if(state.drawer){
      state.drawer.pulledIn=state.drawer.pulledIn||[];
      if(state.drawer.pulledIn.indexOf(name)===-1) state.drawer.pulledIn.push(name);
    }
    render();
  },

  pickSlot:function(custId,k,day,time,mode){
    var s = slotsForType(k).filter(function(x){ return x.day===day && x.time===time; })[0];
    if(!s) return;
    if(mode==='book'){
      var chk=checkSlotAllowed(custId,k,day,s.start,s.end);
      if(!chk.allowed){ showToast(chk.reason,null,null); return; }
    }
    var rt=crFor(custId).services[k];
    rt.picks=[{day:day,time:time,start:s.start,end:s.end,instructor:s.instructor,location:s.location,mode:mode}];
    rt.complete=true;
    render();
  },

  squeezeIn:function(custId,k,day,time){
    var s = slotsForType(k).filter(function(x){ return x.day===day && x.time===time; })[0];
    if(!s) return;
    showToast('This class is at capacity. Booking over capacity is recorded against your name.', function(){
      var cr=crFor(custId), rt=cr.services[k];
      rt.picks=[{day:day,time:time,start:s.start,end:s.end,instructor:s.instructor,location:s.location,mode:'book'}];
      rt.complete=true;
      cr.overrides.push({svc:k, who:'Jordan Lee ('+state.role+')', when:'Sep 8, 2026 3:14p',

  },

  pickPrivate:function(custId,k,day,time,length){

    var rt=crFor(custId).services[k];
    var place = function(){
      rt.picks=[{day:day,time:time,start:s.start,end:s.end,instructor:s.instructor,
                 location:s.location,length:length,mode:'book'}];
      rt.complete=true;

    var f=crFor(id).services[k].funding;
    f.selfpay.newCard=true;
    f.processed=false;
    render();
  },

  toggleOverride:function(id,k){
    var rt=crFor(id).services[k];
    rt.overrideOpen=!rt.overrideOpen;
    render();
  },
  setOverrideField:function(id,k,field,val){
    var rt=crFor(id).services[k];
    rt.overrideDraft=rt.overrideDraft||{};
    rt.overrideDraft[field]=val;
    render();
  },
  applyOverride:function(id,k){
    var cr=crFor(id), rt=cr.services[k];
    var ov=rt.overrideDraft||{};
    if(!ov.reason || !ov.expiry) return;
    cr.overrides.push({svc:k, who:'Jordan Lee (Manager)', when:'Sep 8, 2026 3:14p', reason:ov.reason,
      duration:ov.duration, expiry:ov.expiry, affected:ov.affected, expected:ov.expected});
    rt.funding.rcebOverride=true;
    rt.overrideOpen=false;
    render();
  },

  confirmBooking:function(){
    var list=[];
    state.selected.forEach(function(id){
      var c=CUSTOMERS[id], cr=crFor(id);
      cr.svcOrder.forEach(function(k){
        var o=computeOutcome(id,k);
        var svc=c.services[k];
        var pv=PREVIEW[id]&&PREVIEW[id][k];
        var dateSummary = pv
          ? pv.dates.length+' sessions &middot; '+svc.days.join(' and ')+' through Sep 30, 2026'
          : svc.days.join(' and ');
        list.push({custName:c.name, svcName:svc.label, code:o.code, line:o.line, dateSummary:dateSummary});
      });
    });
    state.success=list;
    render();
    document.getElementById('main-area').scrollTop=0;
  },
  goHome:function(){ window.location.href = isStaff() ? 'calendar-master.html' : 'portal-profile-tab.html'; },
  bookAnother:function(){
    state.success=null; state.selected=[]; state.cr={}; state.expanded={};
    state.step=1; state.activeTab=0; state.search='';
    render();
  },

  toastGo:function(){ var t=state.toast; state.toast=null; if(t&&t.onGo) t.onGo(); else render(); },
  toastNo:function(){ var t=state.toast; state.toast=null; if(t&&t.onNo) t.onNo(); else render(); }
};

// The class list and the generated-date preview both read svc.days, so the day
// picker writes back to it rather than keeping two sources of truth.
function syncSvcDays(id,k){
  var win = crFor(id).services[k].window;
  CUSTOMERS[id].services[k].days = WEEK.filter(function(d){ return win[d.k].on; })
                                       .map(function(d){ return d.full; });
}

window.Z = Z;
render();
/*APPEND_MARKER*/
</script>
