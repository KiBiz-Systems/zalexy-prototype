<!--
  Zalexy Prototype — Client Portal Booking Flow
  Spec:   ai-workspace/prototypes/client/booking-flow.md
  Design: ai-workspace/prototypes/_shared/design-system.md
  Static prototype. Not production code. No app dependencies.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Zalexy — Schedule a Class</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root{--primary:#334155;--primary-light:#475569;--primary-dark:#1e293b;--info:#3b82f6;--info-bg:#eff6ff;--info-dark:#1d4ed8;--info-hover:#2563eb;--success:#10b981;--success-bg:#d1fae5;--success-dark:#047857;--warning:#f59e0b;--danger:#ef4444;--text-primary:#0f172a;--text-secondary:#64748b;--border:#f1f5f9;--border-input:#cbd5e1;--bg-default:#f8fafc;--bg-paper:#fff;--radius-card:10px;--radius-base:8px;--shadow-card:0 2px 4px rgba(0,0,0,0.02),0 1px 2px rgba(0,0,0,0.03)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg-default);color:var(--text-primary);font-size:15px;min-height:100vh}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
/* PORTAL HEADER — dark top bar, no sidebar */
.portal-hd{background:var(--primary-dark);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;color:#f8fafc}
.portal-left{display:flex;align-items:center;gap:28px}
.portal-logo{display:flex;align-items:center;gap:10px}
.logo-badge{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#10b981);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.logo-name{font-size:1.1rem;font-weight:700;color:#f8fafc}
.portal-nav{display:flex;align-items:center;gap:22px}
.nav-item{background:none;border:none;color:rgba(248,250,252,.7);font-size:.875rem;font-weight:600;cursor:pointer;padding:4px 0}
.nav-item:hover{color:#f8fafc}
.nav-item.current{color:#fff;border-bottom:2px solid var(--info);cursor:default}
.portal-user{display:flex;align-items:center;gap:10px;font-size:.875rem;color:#f8fafc}
.user-av{width:32px;height:32px;border-radius:50%;background:var(--info);color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:700}
/* MAIN */
.main-wrap{max-width:800px;margin:0 auto;padding:24px 24px 130px}
.breadcrumb{font-size:.8rem;color:var(--text-secondary);margin-bottom:6px}
.page-h-row{display:flex;align-items:center;justify-content:space-between}
.page-title{font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
.page-h{margin-bottom:20px}
/* TYPE TABS */
.type-tabs{display:flex;gap:8px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:8px;margin-bottom:16px;position:sticky;top:8px;z-index:20}
.t-tab{flex:1;padding:10px;border-radius:8px;font-size:.9rem;font-weight:600;border:1.5px solid var(--border-input);background:transparent;color:var(--text-secondary);cursor:pointer;transition:all 140ms;text-align:center}
.t-tab.active{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark)}
/* STEPPER */
.stepper{background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:14px 20px;margin-bottom:12px;display:flex;align-items:center;position:sticky;top:60px;z-index:19}
.s-item{display:flex;align-items:center;gap:7px;flex:1}
.s-item:last-child{flex:0 0 auto}
.s-dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.s-dot.done{background:var(--success-bg);color:var(--success-dark)}
.s-dot.act{background:var(--info);color:#fff}
.s-dot.fut{background:#e2e8f0;color:var(--text-secondary)}
.s-lbl{font-size:.8rem;font-weight:600;white-space:nowrap}
.s-lbl.done{color:var(--success-dark)}.s-lbl.act{color:var(--text-primary)}.s-lbl.fut{color:var(--text-secondary)}
.s-line{flex:1;height:1px;background:var(--border);margin:0 8px}
/* CHILD TABS */
.child-tabs{display:flex;gap:8px;margin-bottom:16px}
.child-pill{display:inline-flex;align-items:center;border-radius:8px;padding:4px 14px;font-size:.8rem;font-weight:600;border:1.5px solid var(--border-input);background:#fff;color:var(--text-secondary);cursor:pointer}
.child-pill.active{border-color:var(--info);color:var(--info-dark);background:var(--info-bg)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}
.dot.grey{background:#cbd5e1}.dot.amber{background:var(--warning)}.dot.green{background:var(--success)}
/* CARD */
.card{background:#fff;border-radius:var(--radius-card);box-shadow:var(--shadow-card);margin-bottom:12px;overflow:hidden}
.card-hd{padding:16px 20px;border-bottom:1px solid var(--border)}
.card-hd h2{font-size:1.05rem;font-weight:700;color:var(--text-primary)}
.card-hd p{font-size:.825rem;color:var(--text-secondary);margin-top:3px}
.card-bd{padding:20px}
/* COLLAPSED */
.coll{display:flex;align-items:center;background:#fff;border:1px solid var(--border);border-radius:10px;padding:13px 16px;margin-bottom:8px;gap:10px}
.chk{width:22px;height:22px;border-radius:50%;background:var(--success-bg);display:grid;place-items:center;flex-shrink:0;font-size:12px;color:var(--success-dark);font-weight:700}
.coll-txt{flex:1;font-size:.9rem;font-weight:600}
.edit-btn{background:none;border:none;color:var(--info);font-size:.825rem;font-weight:600;cursor:pointer}
/* MEMBER CARDS */
.member-grid{display:flex;flex-direction:column;gap:9px}
.member-card{border:1px solid var(--border);border-radius:8px;padding:14px 16px;cursor:pointer;transition:all 140ms;display:flex;align-items:flex-start;gap:12px}
.member-card:hover{border-color:#94a3b8;background:var(--bg-default)}
.member-card.sel{border:1.5px solid var(--info);background:var(--info-bg)}
.member-card.disabled{opacity:.5;cursor:not-allowed}
.m-av{width:38px;height:38px;border-radius:50%;background:var(--info);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.m-toprow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.m-nm{font-size:.9rem;font-weight:700;color:#0f172a}
.m-sub{font-size:.8rem;color:var(--text-secondary);margin-top:2px}
.m-balance{font-weight:700;color:var(--info-dark);font-size:.825rem;white-space:nowrap}
.bal-line{font-weight:700;color:var(--info-dark);font-size:.825rem;margin-top:4px}
.bal-line.buying{color:var(--info-dark)}
.reason-line{font-size:.8rem;color:var(--text-secondary);margin-top:3px}
.makeup-line{font-size:.8rem;color:var(--info-dark);margin-top:5px;cursor:pointer;text-decoration:underline;display:inline-block}
.buy-link{background:none;border:none;color:var(--info);font-weight:700;font-size:.825rem;cursor:pointer;padding:0}
.rm-link,.rm-btn{background:none;border:none;color:var(--danger);font-size:.8rem;font-weight:600;cursor:pointer;margin-left:8px}
.m-check,.m-radio{width:20px;height:20px;border:2px solid var(--border-input);flex-shrink:0;margin-top:2px}
.m-check{border-radius:5px}
.m-radio{border-radius:50%}
.m-check.on{background:var(--info);border-color:var(--info)}
.m-radio.on{background:var(--info);border-color:var(--info);box-shadow:inset 0 0 0 3.5px #fff}
/* SERVICE LIST */
.svc-list{display:flex;flex-direction:column;gap:8px}
.svc-item{border:1px solid var(--border);border-radius:8px;padding:14px 16px;cursor:pointer;transition:all 140ms;display:flex;align-items:flex-start;gap:12px}
.svc-item:hover{border-color:#94a3b8}
.svc-item.sel{border:1.5px solid var(--info);background:var(--info-bg)}
.svc-item.ineligible{opacity:.5;cursor:not-allowed}
.svc-nm{font-size:.95rem;font-weight:700}
.svc-sub{font-size:.8rem;color:var(--text-secondary);margin-top:2px}
.svc-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border-input);flex-shrink:0;margin-left:auto;margin-top:2px}
.svc-radio.on{background:var(--info);border-color:var(--info);box-shadow:inset 0 0 0 3.5px #fff}
/* BUY PANEL */
.buy-panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:20px;margin-top:12px}
.buy-title{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.buy-sub{font-size:.825rem;color:var(--text-secondary);margin:4px 0 12px}
.buy-grid{display:flex;gap:12px;flex-wrap:wrap}
.buy-card{flex:1;min-width:200px;border:1px solid var(--border);border-radius:8px;padding:14px}
.buy-nm{font-size:.825rem;font-weight:700}
.buy-desc{font-size:.775rem;color:var(--text-secondary);margin:4px 0}
.strike{text-decoration:line-through;color:var(--text-secondary);font-size:.875rem}
.buy-mem{font-weight:700;color:var(--info-dark);margin-top:2px}
.buy-save{font-size:.775rem;color:var(--success-dark);margin-top:2px}
.buy-foot{font-size:.775rem;color:var(--text-secondary);margin-top:14px}
/* REMOVE CONFIRM */
.remove-confirm{background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:16px;margin-top:10px}
.rc-title{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.rc-body{font-size:.825rem;margin-top:6px}
.drop-item{font-size:.8rem;color:var(--text-secondary);margin-top:2px}
.rc-note{font-size:.775rem;color:var(--text-secondary);margin-top:8px}
.rc-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
/* SEMI-PRIVATE */
.semi-meta{font-size:.875rem;font-weight:600;margin-bottom:6px}
.req-note{font-size:.825rem;color:var(--text-secondary);background:var(--bg-default);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:14px}
.pax-section{margin-top:6px}
.sec-lbl{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);margin-bottom:9px}
.pax-row{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:8px}
.p-av{width:32px;height:32px;border-radius:50%;background:var(--info);color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:700;flex-shrink:0}
.p-av.fam{background:#7c3aed}
.p-nm{font-size:.875rem;font-weight:700}
.p-sub{font-size:.75rem;color:var(--text-secondary)}
select,input[type=date]{height:36px;padding:6px 10px;font-size:.875rem;border:1px solid var(--border-input);border-radius:6px;background:#fff}
select:hover,input[type=date]:hover{border-color:#94a3b8}
.banner{border-radius:8px;padding:12px 15px;font-size:.83rem;margin-top:12px}
.b-info{background:var(--info-bg);border:1px solid #bfdbfe;color:var(--info-dark)}
.b-warn{background:#fef3c7;border:1px solid #fde68a;color:#b45309}
/* DAY ROWS (checkbox list, not chips) */
.day-rows{display:flex;flex-direction:column;gap:6px}
.day-row{border:1px solid var(--border);border-radius:8px;padding:9px 12px;display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.day-row.on{border-color:var(--success);background:var(--success-bg)}
.day-check{display:flex;align-items:center;gap:8px;font-size:.875rem;font-weight:600;cursor:pointer}
.day-times{font-size:.8rem;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.pref-section{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.rec-opts{display:flex;flex-direction:column;gap:8px}
.rec-opt{display:flex;align-items:center;gap:8px;font-size:.875rem;cursor:pointer}
.dates-preview{background:var(--bg-default);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-top:16px;font-size:.825rem;line-height:1.6}
.skipped-line{color:var(--text-secondary)}
.stop-line{color:var(--info-dark);margin-top:4px}
/* SLOT CARDS */
.dg-lbl{font-size:.825rem;font-weight:700;color:var(--text-primary);margin:14px 0 8px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.slot-list{display:flex;flex-direction:column;gap:9px}
.slot-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;transition:all 140ms;display:flex;align-items:center;gap:14px}
.slot-item.sel{border:1.5px solid var(--info);background:var(--info-bg)}
.slot-time-blk{text-align:center;flex-shrink:0;min-width:56px}
.slot-time-blk .t-main{font-size:1rem;font-weight:700}
.slot-time-blk .t-sub{font-size:.75rem;color:var(--text-secondary);margin-top:1px}
.slot-info{flex:1}
.slot-svc{font-size:.95rem;font-weight:700}
.slot-meta{font-size:.8rem;color:var(--text-secondary);margin-top:3px}
.slot-right{text-align:right;flex-shrink:0}
.cap-bar-w{width:90px}
.cap-bar{height:5px;border-radius:3px;background:#e2e8f0;overflow:hidden;margin-bottom:4px}
.cap-fill{height:100%;border-radius:3px}
.cap-fill.low{background:var(--success)}.cap-fill.med{background:var(--warning)}.cap-fill.full{background:var(--danger)}
.cap-text{font-size:.7rem;color:var(--text-secondary)}
.slot-actions{display:flex;flex-direction:column;gap:5px;align-items:flex-end;margin-top:6px}
.chip{display:inline-flex;align-items:center;height:22px;border-radius:4px;padding:0 8px;font-size:.72rem;font-weight:600;white-space:nowrap}
.c-ok{background:var(--success-bg);color:var(--success-dark)}.c-info{background:var(--info-bg);color:var(--info-dark)}.c-warn{background:#fef3c7;color:#b45309}.c-muted{background:#f1f5f9;color:var(--text-secondary)}
.joint-block{font-size:.8rem;color:#b45309;max-width:220px;margin-bottom:6px}
/* REVIEW */
.review-block{margin-bottom:20px}
.review-name{font-size:.8rem;font-weight:700;letter-spacing:.04em;margin-bottom:8px}
.out-banner{border-radius:10px;padding:12px 16px;border-left:5px solid;margin-bottom:12px}
.out-banner.confirmed{background:var(--success-bg);border-left-color:var(--success)}
.out-banner.pending{background:#fef3c7;border-left-color:var(--warning)}
.out-banner.waitlisted{background:var(--info-bg);border-left-color:var(--info)}
.out-t{font-size:1rem;font-weight:700}
.review-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.review-row{display:grid;grid-template-columns:160px 1fr;border-bottom:1px solid var(--border)}
.review-row:last-child{border-bottom:none}
.rrl{padding:11px 15px;font-size:.75rem;font-weight:600;color:var(--text-secondary);background:var(--bg-default)}
.rrv{padding:11px 15px;font-size:.9rem;color:var(--text-primary)}
.credit-line{font-size:.825rem;color:var(--info-dark);margin-top:10px;font-weight:600}
.purchase-line{display:flex;align-items:flex-start;justify-content:space-between;border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-top:8px;gap:8px}
.purchase-price{text-align:right;font-weight:700;color:var(--info-dark);font-size:.85rem}
.was{font-weight:400;color:var(--text-secondary);font-size:.75rem}
.rceb-note{background:#fef3c7;border:1px solid #fde68a;color:#b45309;border-radius:8px;padding:12px 16px;font-size:.825rem;margin-top:16px}
.total-row{display:flex;justify-content:space-between;font-weight:700;font-size:1rem;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.pay-row{font-size:.825rem;color:var(--text-secondary);margin-top:6px;display:flex;justify-content:space-between;align-items:center}
.link-btn{background:none;border:none;color:var(--info);font-weight:600;font-size:.8rem;cursor:pointer}
/* MAKE-UP */
.makeup-modebar{background:var(--info-bg);border:1px solid #bfdbfe;color:var(--info-dark);border-radius:8px;padding:10px 16px;font-size:.825rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.readonly-note{background:var(--bg-default);border:1px solid var(--border);border-radius:8px;padding:14px 16px;font-size:.9rem;font-weight:600}
/* CANCELLATION */
.upcoming-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.875rem}
.cancel-panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px;margin-top:14px}
.cp-title{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.cp-sub{font-size:.825rem;color:var(--text-secondary);margin-top:4px}
.cp-note{font-size:.85rem;margin-top:12px;font-weight:600}
.cp-outcome{border-radius:8px;padding:10px 12px;font-size:.825rem;margin-top:8px;line-height:1.6}
.cp-outcome.early{background:var(--success-bg)}
.cp-outcome.late{background:#fee2e2}
.cp-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
/* SUCCESS */
.succ-state{text-align:center;padding:60px 20px}
.succ-icon{width:70px;height:70px;border-radius:50%;background:var(--success-bg);display:grid;place-items:center;margin:0 auto 20px;font-size:2rem;color:var(--success-dark);font-weight:700}
.succ-t{font-size:1.4rem;font-weight:700;margin-bottom:6px}
.succ-s{font-size:.9rem;color:var(--text-secondary);margin-bottom:24px}
/* BTNS */
.btn{border-radius:8px;padding:8px 18px;font-size:.9rem;font-weight:600;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 140ms;box-shadow:none}
.btn-blue{background:var(--info);color:#fff}.btn-blue:hover{background:var(--info-hover)}.btn-blue:disabled{opacity:.4;cursor:not-allowed}
.btn-green{background:var(--success);color:#fff}.btn-green:hover{background:var(--success-dark)}
.btn-out{background:#fff;color:var(--text-primary);border:1.5px solid var(--border-input)}.btn-out:hover{border-color:#64748b;background:var(--bg-default)}
.btn-sm{padding:6px 12px;font-size:.825rem}
/* FOOTER */
.sf{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:14px 20px;z-index:30}
.sf-inner{max-width:800px;margin:0 auto;width:100%;display:flex;justify-content:space-between;align-items:center}
.sf-r{display:flex;gap:8px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);background:#1e293b;color:#f8fafc;padding:11px 18px;border-radius:8px;font-size:.875rem;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:100;opacity:0;transition:all 220ms;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<!-- PORTAL HEADER -->
<div class="portal-hd">
  <div class="portal-left">
    <div class="portal-logo"><div class="logo-badge">Z</div><span class="logo-name">Zalexy</span></div>
    <nav class="portal-nav">
      <button class="nav-item" onclick="goHome()">Home</button>
      <span class="nav-item current">Schedule</span>
      <button class="nav-item" data-noop>Purchases</button>
      <button class="nav-item" data-noop>Payments</button>
      <button class="nav-item" data-noop>Documents</button>
    </nav>
  </div>
  <div class="portal-user">
    <span>Solar Swim</span>
    <div class="user-av">CG</div>
  </div>
</div>

<!-- MAIN -->
<div class="main-wrap">
  <div class="page-h">
    <div class="breadcrumb">Home / Schedule a Class</div>
    <div class="page-h-row">
      <h1 class="page-title">Schedule a Class</h1>
      <button class="btn btn-out btn-sm" onclick="goHome()">Cancel</button>
    </div>
  </div>

  <div class="type-tabs">
    <button class="t-tab active" id="tabGroup" onclick="switchType('group')">Group</button>
    <button class="t-tab" id="tabSemi" onclick="switchType('semi')">Semi-Private</button>
    <button class="t-tab" id="tabPrivate" onclick="switchType('private')">Private</button>
  </div>

  <div class="stepper" id="stepper"></div>
  <div id="childTabsWrap"></div>
  <div id="stepsArea"></div>
</div>

<!-- STICKY FOOTER -->
<div class="sf">
  <div class="sf-inner">
    <div>
      <strong id="sfTitle" style="font-size:.9rem;font-weight:700">Choose who's booking</strong>
      <div id="sfSub" style="font-size:.775rem;color:var(--text-secondary);margin-top:2px">Solar Swim</div>
    </div>
    <div class="sf-r">
      <button class="btn btn-out" id="backBtn" onclick="goBack()" style="display:none">&#8592; Back</button>
      <button class="btn btn-blue" id="nextBtn" onclick="goNext()" disabled>Next &#8594;</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- Constants & seed data ---------- */
const TODAY=new Date(2026,8,8);           // Sep 8, 2026 — "now" for horizon / cancellation-window math
const REC_START=new Date(2026,8,13);      // recurrence search begins the day before Mon Sep 14

/* ---------- Helpers ---------- */
function withFocusPreserved(fn){
  const ae=document.activeElement;
  const id=ae&&ae.id?ae.id:null;
  let start=null,end=null;
  if(ae&&typeof ae.selectionStart==='number'){start=ae.selectionStart;end=ae.selectionEnd;}
  fn();
  if(id){
    const el=document.getElementById(id);
    if(el){el.focus();if(start!==null&&el.setSelectionRange){try{el.setSelectionRange(start,end);}catch(e){}}}
  }
}
function fmtDateLong(iso){
  const d=new Date(iso+'T00:00:00');
  const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  return `${wd} ${mo} ${d.getDate()}`;
}
function fmtDayDate(s){return `${DAYFULL[s.day].slice(0,3)} ${s.date}`;}
function capInfo(filled,cap){
  const remaining=cap-filled;
  if(remaining<=0) return {cls:'full',text:'Class full',remaining};
  const pct=filled/cap*100;
  if(pct<60) return {cls:'low',text:`${remaining} spots left`,remaining};
  return {cls:'med',text:`Filling up — ${remaining} spot${remaining===1?'':'s'} left`,remaining};
}
function isoLocal(d){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function generateDates(days,rec,creditsAvail,searchThrough){
  const out=[],skipped=[];let d=new Date(REC_START);d.setDate(d.getDate()+1);
  const maxIter=90;let iter=0;
  const stEnd=searchThrough?new Date(searchThrough+'T00:00:00'):null;
  while(iter<maxIter && out.length<creditsAvail){
    iter++;
    const iso=isoLocal(d);
    const dayName=Object.keys(DAY_JS).find(k=>DAY_JS[k]===d.getDay());
    if(days.includes(dayName)){
      if(CLOSURES[iso]) skipped.push({date:iso,label:CLOSURES[iso]});
      else { out.push(iso); if(rec==='once') break; }
    }
    if(stEnd && d>stEnd) break;
    d.setDate(d.getDate()+1);
  }
  return {dates:out,skipped};
}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(window.__toastT);window.__toastT=setTimeout(()=>t.classList.remove('show'),2600);
}
function initChild(id){
  S.children[id]={svc:null,days:[],dayTimes:{},rec:'recurring',searchThrough:'2026-09-30',slotId:null,wl:false,bookedDates:[],makeup:false,makeupDate:null};
}
function childStatus(id){
  const c=S.children[id];if(!c)return 'grey';
  const svcOk=c.makeup?true:(S.type==='semi'?true:!!c.svc);
  const whenOk=c.makeup?!!c.makeupDate:(c.days&&c.days.length>0);
  const slotOk=!!c.slotId;
  if(svcOk&&whenOk&&slotOk)return 'green';
  if(svcOk||whenOk||slotOk)return 'amber';
  return 'grey';
}
function memberById(id){return MEMBERS.find(m=>m.id===id);}

/* ---------- Render pipeline ---------- */
function render(){withFocusPreserved(()=>{
  renderTypeTabs();renderStepper();renderChildTabs();renderStepsArea();renderFooter();
});}
function renderTypeTabs(){
  ['tabGroup','tabSemi','tabPrivate'].forEach(id=>document.getElementById(id).classList.remove('active'));
  const m={group:'tabGroup',semi:'tabSemi',private:'tabPrivate'};
  document.getElementById(m[S.type]).classList.add('active');
}
function renderStepper(){
  const L=['Who','Service','When','Slots','Confirm'];
  document.getElementById('stepper').innerHTML=L.map((l,i)=>{
    const n=i+1,st=S.success?'done':(n<S.step?'done':n===S.step?'act':'fut'),ic=st==='done'?'&#10003;':n;
    return `<div class="s-item"><div class="s-dot ${st}">${ic}</div><span class="s-lbl ${st}">${l}</span>${n<5?'<div class="s-line"></div>':''}</div>`;
  }).join('');
}
function renderChildTabs(){
  const wrap=document.getElementById('childTabsWrap');
  if(S.type==='semi'||S.sel.length<2||S.step<2||S.step>4||S.success){wrap.innerHTML='';return;}
  wrap.innerHTML=`<div class="child-tabs">${S.sel.map(id=>{
    const m=memberById(id),st=childStatus(id),active=S.activeChild===id;
    return `<button class="child-pill ${active?'active':''}" onclick="setActiveChild('${id}')"><span class="dot ${st}"></span>${m.nm.split(' ')[0]}</button>`;
  }).join('')}</div>`;
}
function setActiveChild(id){S.activeChild=id;render();}

function renderStepsArea(){
  let h='';
  if(S.step===1 && !S.success) h+=cancelDemoHtml();
  if(S.makeup.active) h+=makeupModeBar();
  if(!S.success){ for(let i=1;i<S.step;i++) h+=coll(i); h+=active(S.step); }
  else h+=succ();
  document.getElementById('stepsArea').innerHTML=h;
}
function coll(n){
  const id=S.activeChild||S.sel[0];const c=S.children[id];const m=id?memberById(id):null;
  const sm={
    1:S.sel.map(x=>memberById(x).nm).join(', '),
    2:S.type==='semi'?'Semi-Private Swimming':(c&&c.svc?`${S.type==='group'?'Group':'Private'} ${SERVICES[id].find(s=>s.id===c.svc).nm}`:''),
    3:c?`${c.days.map(d=>DAYFULL[d].slice(0,3)).join(' & ')||''} / ${c.rec==='recurring'?'Recurring':'One time only'}`:'',
    4:c&&c.slotId?slotSm(id):''
  };
  return `<div class="coll"><div class="chk">&#10003;</div><span class="coll-txt">Step ${n} — ${sm[n]||''}</span><button class="edit-btn" onclick="editStep(${n})">Edit</button></div>`;
}
function slotSm(id){
  const c=S.children[id];const pool=c.makeup?SG:(S.type==='semi'?SS:S.type==='private'?SP:SG);
  const s=pool.find(x=>x.id===c.slotId);return s?`${fmtDayDate(s)} · ${s.time} – ${s.end}`:'';
}
function active(n){if(n===1)return step1();if(n===2)return step2();if(n===3)return step3();if(n===4)return step4();if(n===5)return step5();}

function step1(){

   <div class="card-hd"><h2>Who are you booking for?</h2><p>${S.type==='semi'?'Select one household member as the primary participant.':'Select one or more household members below.'}</p></div>
   <div class="card-bd"><div class="member-grid">${MEMBERS.map(memberRow).join('')}</div></div>

}
function memberRow(m){
  const isSemi=S.type==='semi';
  const checked=isSemi?S.sel[0]===m.id:S.sel.includes(m.id);
  const purchase=S.buy[m.id];
  const hasBuySessions=purchase&&purchase.added;
  const noSessions=!m.ineligible&&m.bal===0&&!hasBuySessions;
  const disabled=!!m.ineligible||noSessions;
  let balHtml='';
  if(!m.ineligible){
    if(hasBuySessions) balHtml=`<div class="m-balance">Buying: ${purchase.item.sessions} sessions (pending payment)</div>`;
    else if(m.bal===0) balHtml=`<button class="buy-link" onclick="event.stopPropagation();openBuy('${m.id}','step1')">Buy</button>`;
    else balHtml=`<div class="m-balance">Balance: ${m.bal} / ${m.cap} sessions</div>`;
  }
  const reasonLine = m.ineligible?`<div class="reason-line">${m.reason}</div>`
    : (m.bal===0&&!hasBuySessions?`<div class="reason-line">No sessions left — tap Buy to add sessions.</div>`:'');
  const makeupLine=(!m.ineligible&&m.makeup>0)?`<div class="makeup-line" onclick="event.stopPropagation();openMakeupBanner('${m.id}')">${m.makeup} make-up available</div>`:'';
  const removeLink=hasBuySessions?`<button class="rm-link" onclick="event.stopPropagation();openRemoveConfirm('${m.id}')">Remove</button>`:'';
  const buyPanel=(S.buyPanelFor&&S.buyPanelFor.ctx==='step1'&&S.buyPanelFor.id===m.id)?buyPanelHtml(m.id):'';
  const removePanel=S.removeConfirmFor===m.id?removeConfirmHtml(m.id):'';
  const makeupBanner=(S.makeup.bannerFor===m.id)?makeupBannerHtml(m):'';
  return `<div class="member-card ${checked?'sel':''} ${disabled?'disabled':''}" onclick="${disabled?'':`toggleMember('${m.id}')`}">
    <div class="${isSemi?'m-radio':'m-check'} ${checked?'on':''}"></div>
    <div class="m-av">${m.init}</div>
    <div style="flex:1">
      <div class="m-toprow"><span class="m-nm">${m.nm}${m.age?` (age ${m.age})`:''}</span>${balHtml}${removeLink}</div>
      <div class="m-sub">${m.rel}${m.lvl?` / ${m.lvl}`:''}${m.fund?` / ${m.fund}`:''}</div>
      ${reasonLine}${makeupLine}${makeupBanner}${buyPanel}${removePanel}
    </div>
  </div>`;
}
function toggleMember(id){
  if(S.type==='semi'){ S.sel=[id]; if(!S.children[id]) initChild(id); }
  else {
    if(S.sel.includes(id)){ S.sel=S.sel.filter(x=>x!==id); delete S.children[id]; if(S.activeChild===id) S.activeChild=S.sel[0]||null; }
    else { S.sel.push(id); initChild(id); if(!S.activeChild) S.activeChild=id; }
  }
  render();
}

function openRemoveConfirm(memberId){S.removeConfirmFor=memberId;render();}

  </div>`;
}

     <div class="pax-section">
       <div class="sec-lbl">Participants</div>
       <div class="pax-row"><div class="p-av">${primary.init}</div><div style="flex:1"><div class="p-nm">${primary.nm} (Primary)</div><div class="p-sub">${primary.lvl} / eligible</div></div></div>
       ${S.semiFam?semiFamRow():''}
     </div>
     ${!S.semiFam?`
     <label class="sec-lbl" for="semiFamSelect" style="display:block;margin-top:14px">Add a family member? (optional)</label>
     <select id="semiFamSelect" onchange="pickSemiFam(this.value)">
       <option value="">Select family member…</option>
       ${others.map(o=>{const elig=o.lvl===primary.lvl;return `<option value="${o.id}" ${elig?'':'disabled'}>${o.nm} — ${elig?'eligible':'not eligible — different level'}</option>`;}).join('')}
     </select>
     <div class="banner b-warn">With just ${primary.nm.split(' ')[0]}, this slot will show as "Waiting for a second participant." You can still proceed — a second person can join later.</div>`:''}
   </div>
  </div>`;
}
function semiFamRow(){
  const f=memberById(S.semiFam);
  return `<div class="pax-row"><div class="p-av fam">${f.init}</div><div style="flex:1"><div class="p-nm">${f.nm}</div><div class="p-sub">${f.lvl} / eligible</div></div><button class="rm-btn" onclick="S.semiFam=null;render()">Remove</button></div>`;
}
function pickSemiFam(id){if(!id)return;S.semiFam=id;render();}

/* ---------- STEP 3 ---------- */
function step3(){
  const id=S.activeChild||S.sel[0];const child=S.children[id];const m=memberById(id);
  if(child.makeup) return step3Makeup(child);
  return `<div class="card">
   <div class="card-hd"><h2>When would you like to come?</h2><p>Check the days that work for you and set a time range.</p></div>
   <div class="card-bd">
     <div class="day-rows">${DAYS.map(d=>dayRow(id,child,d)).join('')}</div>
     <div class="pref-section">
       <div class="sec-lbl">How often?</div>
       <div class="rec-opts">
         <label class="rec-opt"><input type="radio" name="rec_${id}" ${child.rec==='recurring'?'checked':''} onchange="setRec('${id}','recurring')"> Recurring (same day/time each week)</label>
         <label class="rec-opt"><input type="radio" name="rec_${id}" ${child.rec==='once'?'checked':''} onchange="setRec('${id}','once')"> One time only</label>
       </div>
     </div>
     <div class="pref-section">
       <label class="sec-lbl" for="search_${id}" style="display:block">Search through</label>
       <input type="date" id="search_${id}" value="${child.searchThrough}" onchange="setSearchThrough('${id}',this.value)">
     </div>
     ${(child.rec==='recurring'&&child.days.length>0)?datesPreview(id,child,m):''}
   </div>
  </div>`;
}
function dayRow(id,child,d){
  const checked=child.days.includes(d);
  const dt=child.dayTimes[d]||{from:TIME_OPTS[0],to:TIME_OPTS[2]};
  return `<div class="day-row ${checked?'on':''}">
    <label class="day-check"><input type="checkbox" ${checked?'checked':''} onchange="toggleDay('${id}','${d}')"> ${DAYFULL[d]}</label>
    ${checked?`<span class="day-times">From <select onchange="setDayTime('${id}','${d}','from',this.value)">${TIME_OPTS.map(t=>`<option ${dt.from===t?'selected':''}>${t}</option>`).join('')}</select> To <select onchange="setDayTime('${id}','${d}','to',this.value)">${TIME_OPTS.map(t=>`<option ${dt.to===t?'selected':''}>${t}</option>`).join('')}</select></span>`:''}
  </div>`;
}
function toggleDay(id,d){
  const c=S.children[id];
  if(c.days.includes(d)) c.days=c.days.filter(x=>x!==d);
  else { c.days.push(d); if(!c.dayTimes[d]) c.dayTimes[d]={from:TIME_OPTS[0],to:TIME_OPTS[2]}; }
  render();
}
function setDayTime(id,d,which,val){S.children[id].dayTimes[d][which]=val;render();}
function setRec(id,val){S.children[id].rec=val;render();}
function setSearchThrough(id,val){S.children[id].searchThrough=val;render();}
function datesPreview(id,child,m){
  const credits=(S.buy[id]&&S.buy[id].added)?S.buy[id].item.sessions:m.bal;
  const {dates,skipped}=generateDates(child.days,'recurring',credits,child.searchThrough);
  child.bookedDates=dates;
  const lastLabel=dates.length?fmtDateLong(dates[dates.length-1]):'';
  return `<div class="dates-preview">
    <div class="sec-lbl">Your Dates</div>
    <div>This will book:<br>${dates.map(fmtDateLong).join(' · ')||'—'}</div>
    ${skipped.length?`<div class="skipped-line">Skipped: ${skipped.map(s=>`${fmtDateLong(s.date)} — ${s.label} (closed)`).join(', ')}</div>`:''}
    ${dates.length?`<div class="stop-line">Stopping at ${lastLabel} — that's all ${dates.length} session${dates.length===1?'':'s'} in ${m.nm.split(' ')[0]}'s balance. Buy more sessions to keep going past this date.</div>`:''}
  </div>`;
}
function step3Makeup(child){
  const opts=[];for(let i=1;i<=HORIZON_DAYS;i++){const d=new Date(TODAY);d.setDate(d.getDate()+i);const iso=isoLocal(d);if(!CLOSURES[iso])opts.push(iso);}
  return `<div class="card"><div class="card-hd"><h2>When would you like to come?</h2><p>You can book a make-up up to 7 days ahead.</p></div>
   <div class="card-bd">
     <label class="sec-lbl" for="muDate" style="display:block">Choose a date</label>
     <select id="muDate" onchange="setMakeupDate(this.value)">
       <option value="">Select a date…</option>
       ${opts.map(iso=>`<option value="${iso}" ${child.makeupDate===iso?'selected':''}>${fmtDateLong(iso)}</option>`).join('')}
     </select>
   </div></div>`;
}
function setMakeupDate(iso){
  const id=S.activeChild;const c=S.children[id];
  c.makeupDate=iso;
  const d=new Date(iso+'T00:00:00');
  c.days=[Object.keys(DAY_JS).find(k=>DAY_JS[k]===d.getDay())];
  render();
}

/* ---------- STEP 4 ---------- */
function step4(){
  const id=S.activeChild||S.sel[0];const child=S.children[id];const m=memberById(id);
  const pool=child.makeup?SG:(S.type==='semi'?SS:S.type==='private'?SP:SG);
  let list=pool;
  if(child.makeup) list=pool.filter(s=>ISO_BY_DAY[s.day]===child.makeupDate);
  else if(child.days.length) list=pool.filter(s=>child.days.includes(s.day));
  const dayGroups=[...new Set(list.map(s=>s.day))];
  return `<div class="card">
   <div class="card-hd"><h2>Available Classes</h2><p>${list.length} classes found for ${m.nm.split(' ')[0]}${child.days.length?` / ${child.days.map(d=>DAYFULL[d]).join(' and ')}`:''}</p></div>
   <div class="card-bd">
     ${dayGroups.length?dayGroups.map(d=>`<div class="dg-lbl">${DAYFULL[d]} ${DDATE[d]}</div><div class="slot-list">${list.filter(s=>s.day===d).map(s=>slotCard(id,s)).join('')}</div>`).join(''):'<p class="reason-line">No classes match your selected days. Go back and choose different days.</p>'}
   </div>
  </div>`;
}
function slotCard(memberId,s){
  const child=S.children[memberId];const sel=child.slotId===s.id;
  if(S.type==='semi'&&!child.makeup){
    const remaining=s.req-s.px;const pend=remaining>0;
    return `<div class="slot-item ${sel?'sel':''}">
      <div class="slot-time-blk"><div class="t-main">${s.time}</div><div class="t-sub">${s.end}</div></div>
      <div class="slot-info"><div class="slot-svc">${s.svc}</div><div class="slot-meta">${s.loc}</div>
        <div style="margin-top:5px"><span class="chip ${pend?'c-warn':'c-ok'}">${pend?'Waiting for a second participant':'Open'} (${s.px} of ${s.req})</span></div>
      </div>
      <div class="slot-actions"><button class="btn btn-blue btn-sm" onclick="selectSlot('${memberId}','${s.id}',false)">${sel?'Selected':'Choose'}</button></div>
    </div>`;
  }
  if(s.cap!==undefined){
    const info=capInfo(s.filled,s.cap);
    const isMulti=(S.type==='group'||S.type==='private')&&S.sel.length>=2;
    if(isMulti&&info.remaining>0&&info.remaining<S.sel.length){
      const names=S.sel.map(x=>memberById(x).nm.split(' ')[0]).join(' and ');
      return `<div class="slot-item">
        <div class="slot-time-blk"><div class="t-main">${s.time}</div><div class="t-sub">${s.end}</div></div>
        <div class="slot-info"><div class="slot-svc">${s.svc}</div><div class="slot-meta">${s.loc}</div></div>
        <div class="slot-right">
          <div class="joint-block">Only ${info.remaining} spot${info.remaining===1?'':'s'} left — not enough for both ${names}. Choose a different class, or join the waitlist together.</div>
          <button class="btn btn-out btn-sm" onclick="joinWaitlistForBoth('${s.id}')">Join Waitlist for Both</button>
        </div>
      </div>`;
    }
    const full=info.remaining<=0;
    return `<div class="slot-item ${sel?'sel':''}">
      <div class="slot-time-blk"><div class="t-main">${s.time}</div><div class="t-sub">${s.end}</div></div>
      <div class="slot-info"><div class="slot-svc">${s.svc}</div><div class="slot-meta">${s.loc}</div></div>
      <div class="slot-right">
        <div class="cap-bar-w"><div class="cap-bar"><div class="cap-fill ${info.cls}" style="width:${Math.round(s.filled/s.cap*100)}%"></div></div><div class="cap-text">${info.text}</div></div>
        <div class="slot-actions">
          ${!full?`<button class="btn btn-blue btn-sm" onclick="selectSlot('${memberId}','${s.id}',false)">Book</button>`:''}
          <button class="btn btn-out btn-sm" onclick="selectSlot('${memberId}','${s.id}',true)">Join Waitlist</button>
          ${full?`<span class="chip c-info">Class full — join waitlist</span>`:''}
        </div>
      </div>
    </div>`;
  }
  return `<div class="slot-item ${sel?'sel':''}">
    <div class="slot-time-blk"><div class="t-main">${s.time}</div><div class="t-sub">${s.end}</div></div>
    <div class="slot-info"><div class="slot-svc">${s.svc}</div><div class="slot-meta">${s.loc}</div></div>
    <div class="slot-actions"><button class="btn btn-blue btn-sm" onclick="selectSlot('${memberId}','${s.id}',false)">Book</button></div>
  </div>`;
}
function selectSlot(memberId,slotId,wl){S.children[memberId].slotId=slotId;S.children[memberId].wl=wl;render();}
function joinWaitlistForBoth(slotId){S.sel.forEach(id=>{S.children[id].slotId=slotId;S.children[id].wl=true;});render();}

/* ---------- STEP 5 ---------- */
function step5(){
  const ids=S.sel;
  const cards=ids.map(participantSummary).join('');
  const purchases=Object.entries(S.buy).filter(([id,b])=>b.added&&ids.includes(id));
  const total=purchases.reduce((sum,[,b])=>sum+b.item.mem,0);
  const anyRC=ids.some(id=>{const c=S.children[id];const m=memberById(id);return m.fund==='Regional Center'&&c.rec==='recurring'&&!c.wl;});
  const singleWL=ids.length===1&&S.children[ids[0]].wl;
  S.__confirmLabel=singleWL?'Join Waitlist':(total>0?`Confirm & Pay $${total.toFixed(2)}`:'Confirm Booking');
  return `<div class="card"><div class="card-hd"><h2>Confirm Your Booking</h2></div><div class="card-bd">
    ${cards}
    ${purchases.length?`<div class="sec-lbl" style="margin-top:8px">Purchases</div>${purchases.map(([id,b])=>purchaseLine(id,b)).join('')}`:''}
    ${anyRC?`<div class="rceb-note">Your recurring class will show as tentative until your Regional Center authorization is confirmed. This is normal — we'll update you when it's confirmed.</div>`:''}
    ${!singleWL?`<div class="total-row"><span>Total Due Today</span><span>$${total.toFixed(2)}</span></div>
    <div class="pay-row"><span>Pay with card ending 4242</span><button class="link-btn" data-noop>Use a different card</button></div>`:''}
  </div></div>`;
}
function participantSummary(id){
  const m=memberById(id);const c=S.children[id];
  const pool=c.makeup?SG:(S.type==='semi'?SS:S.type==='private'?SP:SG);
  const s=pool.find(x=>x.id===c.slotId);
  let oc,label;
  if(c.wl){oc='waitlisted';label='Added to waitlist';}
  else if(S.type==='semi'&&!S.semiFam){oc='pending';label='Waiting for a second participant';}
  else if(!c.makeup&&m.fund==='Regional Center'&&m.fundStatus==='RCEB Pending'){oc='pending';label='Pending Regional Center authorization';}
  else {oc='confirmed';label='Confirmed';}
  let creditLine;
  if(c.wl) creditLine="Joining the waitlist doesn't use a session — nothing is reserved until a seat opens and you're moved in.";
  else if(c.makeup) creditLine="This booking uses your make-up token — your regular session balance isn't touched.";
  else if(S.buy[id]&&S.buy[id].added) creditLine=`Uses the ${S.buy[id].item.sessions} sessions just purchased below.`;
  else { const n=(c.rec==='recurring'&&c.bookedDates&&c.bookedDates.length)?c.bookedDates.length:1; creditLine=`${n} session${n===1?'':'s'} reserved — not used yet.`; }
  let datesRow;
  if(c.rec==='recurring'&&c.bookedDates&&c.bookedDates.length){
    const {skipped}=generateDates(c.days,'recurring',999,c.searchThrough);
    datesRow=`${c.bookedDates.map(fmtDateLong).join(' · ')}${skipped.length?`<br><span class="skipped-line">Skipped: ${skipped.map(sk=>`${fmtDateLong(sk.date)} — ${sk.label}`).join(', ')}</span>`:''}`;
  } else if(s) datesRow=`${fmtDayDate(s)}, ${s.time}–${s.end}`;
  else if(c.makeupDate) datesRow=fmtDateLong(c.makeupDate);
  else datesRow='—';
  return `<div class="review-block">
   <div class="review-name">${m.nm.toUpperCase()}</div>
   <div class="out-banner ${oc}"><div class="out-t">${label}</div></div>
   <div class="review-list">
     <div class="review-row"><div class="rrl">For</div><div class="rrv">${m.nm}</div></div>
     <div class="review-row"><div class="rrl">Class</div><div class="rrv">${s?s.svc:(c.makeup?'Swimming — Beginner 2 (make-up)':'—')}</div></div>
     <div class="review-row"><div class="rrl">Dates</div><div class="rrv">${datesRow}</div></div>
     <div class="review-row"><div class="rrl">Location</div><div class="rrv">Solar Swim</div></div>
     <div class="review-row"><div class="rrl">Funding</div><div class="rrv">${m.fund}</div></div>
     ${c.makeup?`<div class="review-row"><div class="rrl">Entitlement source</div><div class="rrv">1 Make-Up Token</div></div>`:''}
   </div>
   <div class="credit-line">Credit effect: ${creditLine}</div>
  </div>`;
}
function purchaseLine(id,b){
  const m=memberById(id);
  return `<div class="purchase-line">
    <div><div>${b.item.nm} for ${m.nm.split(' ')[0]}</div>${S.removeConfirmFor===id?removeConfirmHtml(id):''}</div>
    <div style="display:flex;align-items:flex-start;gap:8px">
      <div class="purchase-price">Member price $${b.item.mem}<br><span class="was">(was $${b.item.std} — you save $${b.item.save})</span></div>
      <button class="rm-link" onclick="openRemoveConfirm('${id}')">Remove</button>
    </div>
  </div>`;
}

/* ---------- Success ---------- */
function succ(){
  const ids=S.sel;const first=memberById(ids[0]);const c0=S.children[ids[0]];
  const typeLabel=S.type==='group'?'Group Swimming':S.type==='semi'?'Semi-Private Swimming':'Private Swimming';
  const pool=c0.makeup?SG:(S.type==='semi'?SS:S.type==='private'?SP:SG);
  const s0=pool.find(x=>x.id===c0.slotId);
  const dayDate=s0?fmtDayDate(s0):'';
  const subtitle=ids.length>1
    ? `${ids.map(id=>memberById(id).nm).join(' & ')} / ${typeLabel}`
    : `${first.nm} / ${typeLabel}${dayDate?` / ${dayDate}`:''}`;
  const chipLabel=c0.wl?'Added to waitlist'
    :(S.type==='semi'&&!S.semiFam?'Waiting for a second participant'
    :(!c0.makeup&&first.fund==='Regional Center'&&first.fundStatus==='RCEB Pending'?'Pending Regional Center authorization':'Confirmed'));
  return `<div class="card"><div class="card-bd"><div class="succ-state">
    <div class="succ-icon">&#10003;</div>
    <div class="succ-t">You're all set!</div>
    <div class="succ-s">${subtitle}</div>
    <div style="margin-bottom:20px"><span class="chip c-ok" style="font-size:.875rem;height:28px;padding:0 14px">${chipLabel}</span></div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn btn-out" onclick="backToHome()">Back to Home</button>
      <button class="btn btn-blue" onclick="scheduleAnother()">Schedule Another Class</button>
    </div>
  </div></div></div>`;
}
function backToHome(){showToast('Returning to Home (simulated).');}
function scheduleAnother(){resetAll();render();}
function goHome(){showToast('Returning to Home (simulated).');}

/* ---------- Navigation ---------- */
function resetAll(){
  S.step=1;S.sel=[];S.children={};S.activeChild=null;S.semiFam=null;
  S.buy={};S.buyPanelFor=null;S.removeConfirmFor=null;
  S.makeup={active:false,memberId:null,bannerFor:null};S.cancelPanelOpen=false;S.success=false;
}
function switchType(t){
  if(t===S.type)return;
  const hasProgress=S.sel.length>0||Object.keys(S.buy).length>0;
  S.type=t;resetAll();
  if(hasProgress) showToast('Switched booking type — previous selections were cleared.');
  render();
}
function canAdvanceToStep5(){
  if((S.type==='group'||S.type==='private')&&S.sel.length>=2) return S.sel.every(id=>childStatus(id)==='green');
  const id=S.activeChild||S.sel[0];return !!(S.children[id]&&S.children[id].slotId);
}
function goNext(){
  if(S.step===5){S.success=true;render();return;}
  if(S.step===4&&!canAdvanceToStep5())return;
  S.step=Math.min(5,S.step+1);
  render();
}
function goBack(){S.step=Math.max(1,S.step-1);render();}
function editStep(n){S.step=n;render();}

function renderFooter(){
  const bb=document.getElementById('backBtn'),nb=document.getElementById('nextBtn');
  const sfTitle=document.getElementById('sfTitle'),sfSub=document.getElementById('sfSub');
  sfSub.textContent='Solar Swim';
  bb.style.display=(S.step>1&&!S.success)?'inline-flex':'none';
  if(S.success){nb.style.display='none';sfTitle.textContent='Booking complete';return;}
  nb.style.display='inline-flex';
  const id=S.activeChild||S.sel[0];const c=id?S.children[id]:null;
  let enabled=false,label='Next →';
  if(S.step===1){ enabled=S.sel.length>0; sfTitle.textContent=enabled?`Booking for ${S.sel.map(x=>memberById(x).nm.split(' ')[0]).join(', ')}`:'Choose who’s booking'; }
  else if(S.step===2){ enabled=S.type==='semi'?true:(c&&(c.makeup||!!c.svc)); sfTitle.textContent='Choose a service'; }
  else if(S.step===3){ enabled=c&&(c.makeup?!!c.makeupDate:c.days.length>0); sfTitle.textContent='Set your preferences'; }
  else if(S.step===4){ enabled=canAdvanceToStep5(); sfTitle.textContent=enabled?'Ready to review':'Choose a class'; }
  else if(S.step===5){ enabled=true; label=S.__confirmLabel||'Confirm Booking'; sfTitle.textContent='Ready to confirm'; }
  nb.disabled=!enabled;
  nb.textContent=label;
  nb.className=`btn ${S.step===5?'btn-green':'btn-blue'}`;
}

render();
</script>
</body>
</html>
