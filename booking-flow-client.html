<!--
  Zalexy Prototype — Client Portal Booking Flow
  Spec:   ai-workspace/prototypes/client/booking-flow.md
  Design: ai-workspace/prototypes/_shared/design-system.md
  Static prototype. Not production code. No app dependencies.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Zalexy — Book a Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root{--info:#3b82f6;--info-bg:#eff6ff;--info-dark:#1d4ed8;--info-hover:#2563eb;--success:#10b981;--success-bg:#d1fae5;--success-dark:#047857;--warning:#f59e0b;--danger:#ef4444;--text-primary:#0f172a;--text-secondary:#64748b;--border:#f1f5f9;--border-input:#cbd5e1;--bg-default:#f8fafc;--bg-paper:#fff;--radius-card:12px;--radius-base:8px;--shadow-card:0 2px 6px rgba(0,0,0,0.04),0 1px 2px rgba(0,0,0,0.03)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg-default);color:var(--text-primary);font-size:15px;min-height:100vh}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;vertical-align:middle}
/* PORTAL HEADER */
.portal-hd{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}
.portal-logo{display:flex;align-items:center;gap:10px}
.logo-badge{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#10b981);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.logo-name{font-size:1.1rem;font-weight:700;color:var(--text-primary)}
.portal-user{display:flex;align-items:center;gap:8px;font-size:.875rem;color:var(--text-secondary)}
.user-av{width:32px;height:32px;border-radius:50%;background:var(--info);color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:700}
/* MAIN */
.main-wrap{max-width:680px;margin:0 auto;padding:28px 20px 120px}
.back-link{display:inline-flex;align-items:center;gap:5px;color:var(--text-secondary);font-size:.875rem;font-weight:600;cursor:pointer;border:none;background:none;margin-bottom:16px;padding:0}
.back-link:hover{color:var(--text-primary)}
.page-h{margin-bottom:20px}
.page-title{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.page-sub{font-size:.9rem;color:var(--text-secondary)}
/* TYPE TABS */
.type-tabs{display:flex;gap:8px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:8px;margin-bottom:16px}
.t-tab{flex:1;padding:10px;border-radius:8px;font-size:.9rem;font-weight:600;border:1.5px solid var(--border-input);background:transparent;color:var(--text-secondary);cursor:pointer;transition:all 140ms;text-align:center}
.t-tab.active{background:var(--info);color:#fff;border-color:var(--info)}
/* STEPPER */
.stepper{background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:14px 20px;margin-bottom:20px;display:flex;align-items:center}
.s-item{display:flex;align-items:center;gap:7px;flex:1}
.s-item:last-child{flex:0 0 auto}
.s-dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.s-dot.done{background:var(--success-bg);color:var(--success-dark)}
.s-dot.act{background:var(--info);color:#fff}
.s-dot.fut{background:#e2e8f0;color:var(--text-secondary)}
.s-lbl{font-size:.8rem;font-weight:600;white-space:nowrap}
.s-lbl.done{color:var(--success-dark)}.s-lbl.act{color:var(--text-primary)}.s-lbl.fut{color:var(--text-secondary)}
.s-line{flex:1;height:1px;background:var(--border);margin:0 8px}
/* CARD */
.card{background:#fff;border-radius:var(--radius-card);box-shadow:var(--shadow-card);margin-bottom:12px;overflow:hidden}
.card-hd{padding:16px 20px;border-bottom:1px solid var(--border)}
.card-hd h2{font-size:1.05rem;font-weight:700;color:var(--text-primary)}
.card-hd p{font-size:.825rem;color:var(--text-secondary);margin-top:3px}
.card-bd{padding:20px}
/* COLLAPSED */
.coll{display:flex;align-items:center;background:#fff;border:1px solid var(--border);border-radius:10px;padding:13px 16px;margin-bottom:8px;gap:10px}
.chk{width:22px;height:22px;border-radius:50%;background:var(--success-bg);display:grid;place-items:center;flex-shrink:0;font-size:12px;color:var(--success-dark);font-weight:700}
.coll-txt{flex:1;font-size:.9rem;font-weight:600}
.edit-btn{background:none;border:none;color:var(--info);font-size:.825rem;font-weight:600;cursor:pointer}
/* MEMBER CARDS */
.member-grid{display:flex;flex-direction:column;gap:9px}
.member-card{border:1px solid var(--border);border-radius:10px;padding:15px 16px;cursor:pointer;transition:all 140ms;display:flex;align-items:center;gap:12px}
.member-card:hover{border-color:#94a3b8;background:var(--bg-default)}
.member-card.sel{border:2px solid var(--info);background:var(--info-bg)}
.m-av{width:40px;height:40px;border-radius:50%;background:var(--info);color:#fff;display:grid;place-items:center;font-size:.825rem;font-weight:700;flex-shrink:0}
.m-nm{font-size:.95rem;font-weight:700}
.m-sub{font-size:.8rem;color:var(--text-secondary);margin-top:2px}
.m-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border-input);flex-shrink:0;margin-left:auto;transition:all 140ms}
.m-radio.on{background:var(--info);border-color:var(--info);box-shadow:inset 0 0 0 4px #fff}
/* SERVICE LIST */
.svc-list{display:flex;flex-direction:column;gap:8px}
.svc-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all 140ms;display:flex;align-items:center;gap:12px}
.svc-item:hover{border-color:#94a3b8}
.svc-item.sel{border:2px solid var(--info);background:var(--info-bg)}
.svc-icon{font-size:1.6rem;flex-shrink:0;width:40px;text-align:center}
.svc-nm{font-size:.95rem;font-weight:700}
.svc-sub{font-size:.8rem;color:var(--text-secondary);margin-top:2px}
.svc-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border-input);flex-shrink:0;margin-left:auto;transition:all 140ms}
.svc-radio.on{background:var(--info);border-color:var(--info);box-shadow:inset 0 0 0 4px #fff}
/* SEMI-PRIVATE PAX */
.pax-section{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.sec-lbl{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);margin-bottom:9px}
.pax-row{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:8px}
.p-av{width:32px;height:32px;border-radius:50%;background:var(--info);color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:700;flex-shrink:0}
.p-av.fam{background:#7c3aed}
.p-nm{font-size:.875rem;font-weight:700}
.p-sub{font-size:.75rem;color:var(--text-secondary)}
.rm-btn{background:none;border:none;color:var(--danger);font-size:.8rem;font-weight:600;cursor:pointer;margin-left:auto}
.add-fam-btn{display:flex;align-items:center;gap:6px;border:1.5px dashed var(--border-input);border-radius:8px;padding:10px 14px;background:transparent;color:var(--text-secondary);font-size:.875rem;font-weight:600;cursor:pointer;width:100%;transition:all 140ms}
.add-fam-btn:hover{border-color:var(--info);color:var(--info)}
.fam-dropdown{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:6px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.fam-opt{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 100ms}
.fam-opt:last-child{border-bottom:none}
.fam-opt:hover{background:var(--bg-default)}
.banner{border-radius:8px;padding:12px 15px;font-size:.83rem;margin-top:12px}
.b-info{background:var(--info-bg);border:1px solid #bfdbfe;color:#1e40af}
.b-ok{background:var(--success-bg);border:1px solid #a7f3d0;color:var(--success-dark)}
/* DAY PREFS */
.chip-grid{display:flex;flex-wrap:wrap;gap:8px}
.day-chip{padding:8px 16px;border-radius:20px;border:2px solid var(--border-input);font-size:.875rem;font-weight:600;cursor:pointer;background:transparent;color:var(--text-secondary);transition:all 140ms}
.day-chip.sel{background:var(--info);color:#fff;border-color:var(--info)}
.time-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.time-chip{padding:7px 14px;border-radius:20px;border:2px solid var(--border-input);font-size:.825rem;font-weight:600;cursor:pointer;background:transparent;color:var(--text-secondary);transition:all 140ms}
.time-chip.sel{background:#f3e8ff;color:#7c3aed;border-color:#7c3aed}
.pref-section{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
/* SLOT CARDS */
.dg-lbl{font-size:.825rem;font-weight:700;color:var(--text-primary);margin:14px 0 8px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.slot-list{display:flex;flex-direction:column;gap:9px}
.slot-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all 140ms;display:flex;align-items:center;gap:14px}
.slot-item:hover{border-color:#94a3b8;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.slot-item.sel{border:2px solid var(--info);background:var(--info-bg)}
.slot-time-blk{text-align:center;flex-shrink:0;min-width:56px}
.slot-time-blk .t-main{font-size:1rem;font-weight:700}
.slot-time-blk .t-sub{font-size:.75rem;color:var(--text-secondary);margin-top:1px}
.slot-info{flex:1}
.slot-svc{font-size:.95rem;font-weight:700}
.slot-meta{font-size:.8rem;color:var(--text-secondary);margin-top:3px}
.slot-right{text-align:right;flex-shrink:0}
.cap-bar-w{width:80px}
.cap-bar{height:5px;border-radius:3px;background:#e2e8f0;overflow:hidden;margin-bottom:4px}
.cap-fill{height:100%;border-radius:3px}
.cap-fill.low{background:var(--success)}.cap-fill.med{background:var(--warning)}.cap-fill.full{background:var(--danger)}
.slot-actions{display:flex;flex-direction:column;gap:5px;align-items:flex-end;margin-top:6px}
.chip{display:inline-flex;align-items:center;height:22px;border-radius:4px;padding:0 8px;font-size:.72rem;font-weight:600;white-space:nowrap}
.c-ok{background:var(--success-bg);color:var(--success-dark)}.c-info{background:var(--info-bg);color:var(--info-dark)}.c-warn{background:#fef3c7;color:#b45309}.c-muted{background:#f1f5f9;color:var(--text-secondary)}
/* REVIEW */
.out-banner{border-radius:10px;padding:15px 18px;border-left:5px solid;margin-bottom:16px}
.out-banner.confirmed{background:var(--success-bg);border-left-color:var(--success)}
.out-banner.pending{background:#fef3c7;border-left-color:var(--warning)}
.out-banner.waitlisted{background:var(--info-bg);border-left-color:var(--info)}
.out-t{font-size:1.05rem;font-weight:700}
.out-s{font-size:.825rem;margin-top:4px;opacity:.85}
.review-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.review-row{display:grid;grid-template-columns:140px 1fr;border-bottom:1px solid var(--border)}
.review-row:last-child{border-bottom:none}
.rrl{padding:11px 15px;font-size:.75rem;font-weight:600;color:var(--text-secondary);background:var(--bg-default)}
.rrv{padding:11px 15px;font-size:.9rem;color:var(--text-primary)}
/* SUCCESS */
.succ-state{text-align:center;padding:60px 20px}
.succ-icon{width:70px;height:70px;border-radius:50%;background:var(--success-bg);display:grid;place-items:center;margin:0 auto 20px;font-size:2rem;color:var(--success-dark);font-weight:700}
.succ-t{font-size:1.4rem;font-weight:700;margin-bottom:6px}
.succ-s{font-size:.9rem;color:var(--text-secondary);margin-bottom:24px}
/* BTNS */
.btn{border-radius:8px;padding:8px 18px;font-size:.9rem;font-weight:600;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 140ms}
.btn-blue{background:var(--info);color:#fff}.btn-blue:hover{background:var(--info-hover)}.btn-blue:disabled{opacity:.4;cursor:not-allowed}
.btn-green{background:var(--success);color:#fff}.btn-green:hover{background:var(--success-dark)}
.btn-out{background:#fff;color:var(--text-primary);border:1.5px solid var(--border-input)}.btn-out:hover{border-color:#64748b;background:var(--bg-default)}
.btn-sm{padding:6px 12px;font-size:.825rem}
/* FOOTER */
.sf{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;z-index:30;max-width:100%}
.sf-inner{max-width:680px;margin:0 auto;width:100%;display:flex;justify-content:space-between;align-items:center}
.sf-r{display:flex;gap:8px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);background:#1e293b;color:#f8fafc;padding:11px 18px;border-radius:8px;font-size:.875rem;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:100;opacity:0;transition:all 220ms;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.divider{height:1px;background:var(--border);margin:16px 0}
</style>
</head>
<body>
<!-- HEADER -->
<div class="portal-hd">
  <div class="portal-logo">
    <div class="logo-badge">Z</div>
    <span class="logo-name">Zalexy</span>
  </div>
  <div class="portal-user">
    <span>Caroline Garcia</span>
    <div class="user-av">CG</div>
  </div>
</div>

<!-- MAIN -->
<div class="main-wrap">
  <button class="back-link" onclick="history.back()"><span class="ms" style="font-size:18px">arrow_back</span> Back to My Schedule</button>
  <div class="page-h">
    <h1 class="page-title">Book a Session</h1>
    <p class="page-sub">Solar Swim and Gym · September 2026</p>
  </div>

  <div class="type-tabs">
    <button class="t-tab active" id="tabGroup" onclick="switchType('group')">Group Class</button>
    <button class="t-tab" id="tabSemi" onclick="switchType('semi')">Semi-Private</button>
    <button class="t-tab" id="tabPrivate" onclick="switchType('private')">Private</button>
  </div>

  <div class="stepper" id="stepper"></div>
  <div id="stepsArea"></div>
</div>

<!-- FOOTER -->
<div class="sf">
  <div class="sf-inner">
    <div>
      <strong id="sfTitle" style="font-size:.9rem;font-weight:700">Choose who's booking</strong>
      <div id="sfSub" style="font-size:.775rem;color:var(--text-secondary);margin-top:2px">Solar Swim and Gym</div>
    </div>
    <div class="sf-r">
      <button class="btn btn-out" id="backBtn" onclick="goBack()" style="display:none">&#8592; Back</button>
      <button class="btn btn-blue" id="nextBtn" onclick="goNext()" disabled>Next</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const S={type:'group',step:1,member:null,wl:false,days:['MON','WED'],times:['Morning'],famOpen:false,famMember:null,slot:null,success:false};

const MEMBERS=[{id:'mg',nm:'Maria Garcia',lvl:'Swim Beginner 2',rel:'Your child',init:'MG',age:10,fund:'Regional Center'},
  {id:'cg',nm:'Caroline Garcia',lvl:'No active plan',rel:'Yourself',init:'CG',age:38,fund:'Self Pay'}];

const FAM_MEMBERS=[{id:'mg',nm:'Maria Garcia',lvl:'Swim Beginner 2',init:'MG',rel:'Child'}];

const SG=[{id:'g1',day:'MON Sep 14',time:'12:30',end:'1:55 PM',svc:'Group Swim · Beginner 2',inst:'Michael Torres',loc:'Pool Lane 8',spots:3,cap:8},
  {id:'g2',day:'MON Sep 14',time:'4:00',end:'5:00 PM',svc:'Group Swim · Beginner 2',inst:'Sarah Chen',loc:'Pool Lane 4',spots:8,cap:8},
  {id:'g3',day:'WED Sep 16',time:'9:00',end:'10:30 AM',svc:'Group Swim · Beginner 2',inst:'Sarah Chen',loc:'Pool Lane 10',spots:6,cap:8}];
const SS=[{id:'s1',day:'MON Sep 14',time:'12:30',end:'1:30 PM',svc:'Semi-Private Swim · Beginner 2',inst:'Michael Torres',loc:'Pool Lane 8',px:1,max:3},
  {id:'s2',day:'WED Sep 16',time:'9:00',end:'10:00 AM',svc:'Semi-Private Swim · Beginner 2',inst:'Sarah Chen',loc:'Pool Lane 10',px:2,max:3}];
const SP=[{id:'p1',day:'MON Sep 14',time:'12:30',end:'1:30 PM',svc:'Private Swim · Beginner 2',inst:'Michael Torres',loc:'Pool Lane 8'},
  {id:'p2',day:'MON Sep 14',time:'3:00',end:'4:00 PM',svc:'Private Swim · Beginner 2',inst:'James Wright',loc:'Pool Lane 6'},
  {id:'p3',day:'WED Sep 16',time:'8:00',end:'9:00 AM',svc:'Private Swim · Beginner 2',inst:'Sarah Chen',loc:'Pool Lane 4'}];

const DAYS=['MON','TUE','WED','THU','FRI','SAT','SUN'];
const DDATE={MON:'Sep 14',TUE:'Sep 15',WED:'Sep 16',THU:'Sep 17',FRI:'Sep 18',SAT:'Sep 19',SUN:'Sep 20'};
const TIMES=['Morning (6–12)','Afternoon (12–5)','Evening (5–8)'];

function render(){renderStepper();renderSteps();renderFooter();}
function renderStepper(){
  const L=['Who','Service','Preferences','Slots','Review'];
  document.getElementById('stepper').innerHTML=L.map((l,i)=>{
    const n=i+1,st=n<S.step?'done':n===S.step?'act':'fut',ic=st==='done'?'&#10003;':n;
    return`<div class="s-item"><div class="s-dot ${st}">${ic}</div><span class="s-lbl ${st}">${l}</span>${n<5?'<div class="s-line"></div>':''}</div>`;
  }).join('');}
function renderSteps(){
  let h='';for(let i=1;i<S.step;i++)h+=coll(i);
  h+=S.success?succ():active(S.step);
  document.getElementById('stepsArea').innerHTML=h;}
function coll(n){
  const sm={
    1:S.member?`${S.member.nm} \u00b7 ${S.member.lvl}`:'',
    2:S.type==='semi'?`Semi-Private Swimming${S.famMember?' \u00b7 '+S.famMember.nm+' included':''}`:S.type==='private'?'Private Swimming':'Group Swimming',
    3:`${S.days.slice(0,3).join(' & ')} \u00b7 ${S.times[0]||'Any time'}`,
    4:S.slot?slotSm():''};
  return`<div class="coll"><div class="chk">&#10003;</div><span class="coll-txt">Step ${n} \u2014 ${sm[n]}</span><button class="edit-btn" onclick="editStep(${n})">Edit</button></div>`;}
function slotSm(){const a=S.type==='group'?SG:S.type==='semi'?SS:SP;const s=a.find(x=>x.id===S.slot);return s?`${s.day} \u00b7 ${s.time} \u2013 ${s.end}`:''}
function active(n){if(n===1)return step1();if(n===2)return step2();if(n===3)return step3();if(n===4)return step4();if(n===5)return step5();}

// STEP 1
function step1(){return`<div class="card">
  <div class="card-hd"><h2>Who are you booking for?</h2><p>Select a household member below.</p></div>
  <div class="card-bd">
    <div class="member-grid">${MEMBERS.map(m=>`<div class="member-card ${S.member&&S.member.id===m.id?'sel':''}" onclick="selM('${m.id}')">
      <div class="m-av">${m.init}</div>
      <div style="flex:1"><div class="m-nm">${m.nm}</div><div class="m-sub">${m.rel} \u00b7 ${m.lvl}</div></div>
      <div class="m-radio ${S.member&&S.member.id===m.id?'on':''}"></div>
    </div>`).join('')}
    </div>
  </div>
</div>`;}

// STEP 2
function step2(){
  const isSemi=S.type==='semi';
  return`<div class="card">
  <div class="card-hd"><h2>${isSemi?'Semi-Private Session':'Choose a Service'}</h2><p>Available for ${S.member.nm}</p></div>
  <div class="card-bd">
    <div class="svc-list">
      <div class="svc-item sel"><div class="svc-icon">\U0001f3ca</div><div style="flex:1"><div class="svc-nm">Swimming</div><div class="svc-sub">Beginner 2 \u00b7 Active plan \u00b7 5 sessions remaining</div></div><div class="svc-radio on"></div></div>
    </div>
    ${isSemi?semiPax():''}
  </div>
</div>`;}

function semiPax(){
  const hasFam=S.famMember!==null;
  return`<div class="pax-section">
  <div class="sec-lbl">Who's joining?</div>
  <div class="pax-row"><div class="p-av">${S.member.init}</div><div style="flex:1"><div class="p-nm">${S.member.nm}</div><div class="p-sub">You \u00b7 ${S.member.lvl} \u00b7 eligible</div></div></div>
  ${hasFam?`<div class="pax-row"><div class="p-av fam">${S.famMember.init}</div><div style="flex:1"><div class="p-nm">${S.famMember.nm}</div><div class="p-sub">Family member \u00b7 ${S.famMember.lvl} \u00b7 eligible</div></div><button class="rm-btn" onclick="S.famMember=null;render()">Remove</button></div>`:''}
  ${!hasFam?`<button class="add-fam-btn" onclick="S.famOpen=!S.famOpen;render()"><span class="ms" style="font-size:18px">person_add</span> Add a Family Member</button>
  ${S.famOpen?`<div class="fam-dropdown">${FAM_MEMBERS.map(f=>`<div class="fam-opt" onclick="addFam('${f.id}')"><div class="p-av fam" style="width:28px;height:28px;font-size:.65rem">${f.init}</div><div><div style="font-size:.875rem;font-weight:700">${f.nm}</div><div style="font-size:.75rem;color:var(--text-secondary)">${f.rel} \u00b7 ${f.lvl}</div></div></div>`).join('')}</div>`:''}`:''}
  ${!hasFam?`<div class="banner b-info" style="margin-top:10px">A second participant can be added later from your booking details if you can't confirm now.</div>`:''}
</div>`;}

// STEP 3
function step3(){
  return`<div class="card">
  <div class="card-hd"><h2>When do you prefer?</h2><p>We'll find available slots that match your preferences.</p></div>
  <div class="card-bd">
    <div class="sec-lbl">Days of the week</div>
    <div class="chip-grid">${DAYS.map(d=>`<button class="day-chip ${S.days.includes(d)?'sel':''}" onclick="togD('${d}')">${d}<br><span style="font-size:.7rem;font-weight:400">${DDATE[d].split(' ')[1]}</span></button>`).join('')}</div>
    <div class="pref-section">
      <div class="sec-lbl">Time of day</div>
      <div class="time-chips">${TIMES.map(t=>`<button class="time-chip ${S.times.includes(t)?'sel':''}" onclick="togT('${t}')">${t}</button>`).join('')}</div>
    </div>
    <div class="pref-section">
      <div class="sec-lbl">How often?</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${[['once','Just once'],['weekly','Every week'],['credits','Until my sessions are used']].map(([v,l])=>`<button class="day-chip ${S.rec===v?'sel':''}" onclick="S.rec='${v}';render()" style="border-radius:8px;padding:8px 14px">${l}</button>`).join('')}
      </div>
    </div>
  </div>
</div>`;}

// STEP 4
function step4(){
  const all=S.type==='group'?SG:S.type==='semi'?SS:SP;
  const days=[...new Set(all.map(s=>s.day))];
  return`<div class="card">
  <div class="card-hd"><h2>Available Sessions</h2><p>${all.length} sessions match your preferences</p></div>
  <div class="card-bd">
    ${days.map(day=>`<div class="dg-lbl">${day}</div><div class="slot-list">${all.filter(s=>s.day===day).map(sCard).join('')}</div>`).join('')}
    ${S.days.includes('TUE')?'<div class="dg-lbl">TUE Sep 15</div><p style="color:var(--text-secondary);font-size:.825rem;padding:4px;font-style:italic">No sessions available on this day for your preferences.</p>':''}
  </div>
</div>`;}

function sCard(s){
  const sel=S.slot===s.id;
  if(S.type==='group'){
    const pct=Math.round(s.spots/s.cap*100),fc=pct<60?'low':pct<90?'med':'full',full=s.spots===s.cap;
    return`<div class="slot-item ${sel?'sel':''}" onclick="selS('${s.id}')">
      <div class="slot-time-blk"><div class="t-main">${s.time}</div><div class="t-sub">${s.end}</div></div>
      <div class="slot-info"><div class="slot-svc">${s.svc}</div><div class="slot-meta">\U0001f464 ${s.inst} \u00b7 \U0001f4cd ${s.loc}</div></div>
      <div class="slot-right">
        <div class="cap-bar-w"><div class="cap-bar"><div class="cap-fill ${fc}" style="width:${pct}%"></div></div>
          <div style="font-size:.7rem;color:var(--text-secondary)">${full?'Full':`${s.cap-s.spots} left`}</div></div>
        <div class="slot-actions">
          ${!full?`<button class="btn btn-blue btn-sm" onclick="event.stopPropagation();doBook('${s.id}')">Book</button>`:''}
          <button class="btn btn-out btn-sm" onclick="event.stopPropagation();doWL('${s.id}')">${full?'Join Waitlist':'Waitlist'}</button>
        </div>
      </div>
    </div>`;
  }else if(S.type==='semi'){
    const pend=s.px<2;
    return`<div class="slot-item ${sel?'sel':''}" onclick="selS('${s.id}')">
      <div class="slot-time-blk"><div class="t-main">${s.time}</div><div class="t-sub">${s.end}</div></div>
      <div class="slot-info"><div class="slot-svc">${s.svc}</div><div class="slot-meta">\U0001f464 ${s.inst} \u00b7 \U0001f4cd ${s.loc}</div>
        <div style="margin-top:5px"><span class="chip ${pend?'c-warn':'c-ok'}">${s.px}/${s.max} joined</span></div>
      </div>
      <div class="slot-actions"><button class="btn btn-blue btn-sm" onclick="event.stopPropagation();doBook('${s.id}')">Join</button><button class="btn btn-out btn-sm" onclick="event.stopPropagation();doWL('${s.id}')">Waitlist</button></div>
    </div>`;
  }else{
    return`<div class="slot-item ${sel?'sel':''}" onclick="doBook('${s.id}')">
      <div class="slot-time-blk"><div class="t-main">${s.time}</div><div class="t-sub">${s.end}</div></div>
      <div class="slot-info"><div class="slot-svc">${s.svc}</div><div class="slot-meta">\U0001f464 ${s.inst} \u00b7 \U0001f4cd ${s.loc}</div></div>
      <div class="slot-actions"><button class="btn btn-blue btn-sm" onclick="event.stopPropagation();doBook('${s.id}')">Book</button><button class="btn btn-out btn-sm" onclick="event.stopPropagation();doWL('${s.id}')">Waitlist</button></div>
    </div>`;
  }
}

// STEP 5
function step5(){
  const all=S.type==='group'?SG:S.type==='semi'?SS:SP;
  const sl=all.find(s=>s.id===S.slot);
  const isSemi=S.type==='semi',onePax=isSemi&&!S.famMember;
  let out,oc,os;
  if(S.wl){out='You\'re on the Waitlist';oc='waitlisted';os='We\'ll notify you right away if a spot opens up. No session is reserved until you\'re moved off the waitlist.';}
  else if(onePax){out='Almost confirmed \u2014 waiting for second participant';oc='pending';os='Your spot is held. You can add a family member now or later from your bookings. The session confirms once two participants are enrolled.';}
  else{out='Ready to confirm!';oc='confirmed';os='Your session looks great. Tap Confirm below to lock it in. One session will be reserved from your plan.';}
  const rows=[['For',S.member.nm],['Service',`${S.type==='group'?'Group':S.type==='semi'?'Semi-Private':'Private'} Swimming \u00b7 Beginner 2`],
    sl?['Date',sl.day]:null,sl?['Time',`${sl.time} \u2013 ${sl.end}`]:null,
    sl?['Coach',sl.inst]:null,sl?['Location',`Solar Swim \u00b7 ${sl.loc}`]:null,
    ['Plan',S.member.fund+' \u00b7 5 sessions remaining'],
    ['Sessions used',S.wl?'None until promoted':'1 session reserved on confirm']
  ].filter(Boolean);
  return`<div class="card">
  <div class="card-hd"><h2>Review &amp; Confirm</h2></div>
  <div class="card-bd">
    <div class="out-banner ${oc}"><div class="out-t">${out}</div><div class="out-s">${os}</div></div>
    <div class="sec-lbl">Booking Summary</div>
    <div class="review-list">${rows.map(([l,v])=>`<div class="review-row"><div class="rrl">${l}</div><div class="rrv">${v}</div></div>`).join('')}</div>
    ${isSemi&&!S.wl?`<div class="banner b-info" style="margin-top:14px">${S.famMember?`<strong>${S.famMember.nm}</strong> is joining this session.`:'<strong>No family member added yet</strong> \u2014 your spot is held. You can add one later from your bookings.'}</div>`:''}
  </div>
</div>`;}

function succ(){
  const t=S.type==='group'?'Group':S.type==='semi'?'Semi-Private':'Private';
  const sl=(S.type==='group'?SG:S.type==='semi'?SS:SP).find(s=>s.id===S.slot);
  const headline=S.wl?'You\'re on the Waitlist':'Session Booked!';
  const sub=S.wl?`We'll notify you if a spot opens for ${sl?.day||'your selected day'}.`:`${S.member.nm} \u00b7 ${t} Swimming \u00b7 ${sl?.day||''} \u00b7 ${sl?.time||''}`;
  return`<div class="card"><div class="card-bd"><div class="succ-state">
    <div class="succ-icon">${S.wl?'\u23f3':'&#10003;'}</div>
    <div class="succ-t">${headline}</div>
    <div class="succ-s">${sub}</div>
    <div style="margin-bottom:20px"><span class="chip ${S.wl?'c-info':'c-ok'}" style="font-size:.875rem;height:28px;padding:0 14px">${S.wl?'WAITLISTED':'CONFIRMED'}</span></div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn btn-out" onclick="location.href='#'">View My Bookings</button>
      <button class="btn btn-blue" onclick="bookAnother()">Book Another Session</button>
    </div>
  </div></div></div>`;}

function renderFooter(){
  const tm={1:S.member?`Booking for ${S.member.nm}`:'Choose who\'s booking',2:'Choose a service',3:'Set your preferences',4:S.slot?'Session selected \u2014 review next':'Choose a session',5:S.wl?'Joining waitlist':'Ready to confirm'};
  document.getElementById('sfTitle').textContent=S.success?'Booking complete':tm[S.step]||'';
  document.getElementById('sfSub').textContent='Solar Swim and Gym';
  const bb=document.getElementById('backBtn'),nb=document.getElementById('nextBtn');
  bb.style.display=S.step>1&&!S.success?'inline-flex':'none';
  if(S.success){nb.style.display='none';return;}nb.style.display='inline-flex';
  nb.disabled=(S.step===1&&!S.member)||(S.step===4&&!S.slot);
  nb.textContent=S.step===5?(S.wl?'Join Waitlist':'Confirm Booking'):S.step===4&&!S.slot?'Choose a Session':'Next \u2192';
  nb.className=`btn ${S.step===5?'btn-green':'btn-blue'}`;}

function selM(id){S.member=MEMBERS.find(m=>m.id===id);render();}
function switchType(t){
  if(S.step>1){S.step=Math.min(S.step,2);}
  S.type=t;S.slot=null;S.famMember=null;S.wl=false;
  ['tabGroup','tabSemi','tabPrivate'].forEach(id=>document.getElementById(id)?.classList.remove('active'));
  const m={group:'tabGroup',semi:'tabSemi',private:'tabPrivate'};
  document.getElementById(m[t])?.classList.add('active');render();}
function goNext(){if(S.step===5){S.success=true;render();return;}S.step=Math.min(5,S.step+1);render();}
function goBack(){S.step=Math.max(1,S.step-1);S.success=false;render();}
function editStep(n){S.step=n;S.success=false;render();}
function selS(id){S.slot=id;render();}
function doBook(id){S.slot=id;S.wl=false;S.step=5;render();}
function doWL(id){S.slot=id;S.wl=true;S.step=5;render();}
function togD(d){if(S.days.includes(d))S.days=S.days.filter(x=>x!==d);else S.days.push(d);render();}
function togT(t){if(S.times.includes(t))S.times=S.times.filter(x=>x!==t);else S.times.push(t);render();}
function addFam(id){S.famMember=FAM_MEMBERS.find(f=>f.id===id);S.famOpen=false;render();}
function bookAnother(){S.member=null;S.step=1;S.slot=null;S.success=false;S.famMember=null;S.wl=false;render();}
if(!S.rec)S.rec='credits';
render();
</script>
</body>
</html>
