  Zalexy Prototype — Client Portal Booking Flow
  Spec:   ai-workspace/prototypes/client/booking-flow.md
  Design: ai-workspace/prototypes/_shared/design-system.md
  Static prototype. Not production code. No app dependencies.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Zalexy — Schedule a Class</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root{
  --primary:#334155;--primary-light:#475569;--primary-dark:#1e293b;
  --secondary:#10b981;--secondary-dark:#059669;
  --success:#10b981;--success-bg:#d1fae5;--success-dark:#047857;
  --info:#3b82f6;--info-bg:#eff6ff;--info-dark:#1d4ed8;--info-hover:#2563eb;
  --bg-default:#f8fafc;--bg-paper:#fff;
  --text-primary:#0f172a;--text-secondary:#64748b;
  --border:#f1f5f9;--border-input:#cbd5e1;--border-input-hover:#94a3b8;
  --danger:#ef4444;--warning:#f59e0b;
  --radius-card:10px;--radius-base:8px;--radius-control:6px;--radius-chip:4px;
  --shadow-card:0 2px 4px rgba(0,0,0,0.02),0 1px 2px rgba(0,0,0,0.03);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Roboto','Helvetica','Arial',sans-serif;background:var(--bg-default);color:var(--text-primary);font-size:14px;min-height:100vh}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
h1,h2,h3,h4{font-weight:600;color:var(--text-primary)}

/* ---- Portal shell: top bar only, NO sidebar ---- */
.portal-hd{background:var(--primary-dark);padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;color:#f8fafc}
.portal-left{display:flex;align-items:center;gap:30px}
.portal-logo{display:flex;align-items:center;gap:9px}
.logo-badge{width:30px;height:30px;border-radius:8px;background:#3b82f6;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.logo-name{font-size:1.05rem;font-weight:700;color:#f8fafc;letter-spacing:-.01em}
.gallery-link{font-size:.8rem;color:rgba(248,250,252,.7);text-decoration:none;white-space:nowrap}
.gallery-link:hover{color:#f8fafc;text-decoration:underline}
.portal-nav{display:flex;align-items:center;gap:22px}
.nav-item{background:none;border:none;color:rgba(248,250,252,.68);font-size:.85rem;font-weight:600;cursor:pointer;padding:4px 0}
.nav-item:hover{color:#f8fafc}
.nav-item.current{color:#fff;border-bottom:2px solid var(--info);cursor:default}
.portal-user{display:flex;align-items:center;gap:10px;font-size:.85rem;color:#f8fafc}
.user-av{width:30px;height:30px;border-radius:50%;background:var(--info);color:#fff;display:grid;place-items:center;font-size:.7rem;font-weight:700}

.main-wrap{max-width:800px;margin:0 auto;padding:24px 24px 140px}
.breadcrumb{font-size:.78rem;color:var(--text-secondary);margin-bottom:6px}
.page-h-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.page-title{font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
.btn{border-radius:var(--radius-control);padding:8px 16px;font-weight:600;font-size:.85rem;border:none;box-shadow:none}
.btn-outline{background:#fff;color:var(--text-primary);border:1px solid var(--border-input)}
.btn-outline:hover{border-color:var(--primary);background:rgba(71,85,105,.04)}
.btn-primary{background:var(--info);color:#fff}
.btn-primary:hover{background:var(--info-hover)}
.btn-primary:disabled{background:#cbd5e1;cursor:not-allowed}
.btn-emerald{background:var(--secondary);color:#fff}
.btn-emerald:hover{background:var(--secondary-dark)}
.btn-danger{background:var(--danger);color:#fff}
.btn-link{background:none;border:none;color:var(--info);font-weight:600;font-size:.85rem;padding:0}

/* Booking type tabs */
.type-tabs{display:flex;gap:8px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:8px;margin-bottom:14px;position:sticky;top:8px;z-index:22;box-shadow:var(--shadow-card)}
.t-tab{flex:1;padding:10px;border-radius:8px;font-size:.85rem;font-weight:600;border:1.5px solid var(--border-input);background:transparent;color:var(--text-secondary);cursor:pointer;text-align:center}
.t-tab.active{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark)}

/* Stepper */
.stepper{background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:14px 20px;margin-bottom:12px;display:flex;align-items:center;position:sticky;top:64px;z-index:21;box-shadow:var(--shadow-card)}
.s-item{display:flex;align-items:center;gap:7px;flex:1;background:none;border:none;cursor:default;text-align:left}
.s-item.clickable{cursor:pointer}
.s-item:last-child{flex:0 0 auto}
.s-dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;flex-shrink:0}
.s-dot.done{background:var(--success-bg);color:var(--success-dark)}
.s-dot.act{background:var(--info);color:#fff}
.s-dot.fut{background:#e2e8f0;color:var(--text-secondary)}
.s-lbl{font-size:.78rem;font-weight:600;white-space:nowrap}
.s-lbl.done{color:var(--success-dark)}.s-lbl.act{color:var(--text-primary)}.s-lbl.fut{color:var(--text-secondary)}
.s-line{flex:1;height:1px;background:var(--border);margin:0 8px}

/* Household tab strip */
.tab-strip{display:flex;gap:8px;margin-bottom:16px}
.tab-pill{display:inline-flex;align-items:center;border-radius:8px;padding:6px 14px;font-size:.8rem;font-weight:600;border:1.5px solid var(--border-input);background:#fff;color:var(--text-secondary);cursor:pointer}
.tab-pill.active{border-color:var(--info);color:var(--info-dark);background:var(--info-bg)}
.tdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}
.tdot.grey{background:#cbd5e1}.tdot.amber{background:var(--warning)}.tdot.green{background:var(--success)}

.card{background:#fff;border-radius:var(--radius-card);box-shadow:var(--shadow-card);margin-bottom:14px;overflow:hidden}
.card-hd{padding:16px 20px;border-bottom:1px solid var(--border)}
.card-hd h2{font-size:1.05rem;font-weight:700}
.card-hd p{font-size:.8rem;color:var(--text-secondary);margin-top:3px}
.card-bd{padding:20px}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-secondary);margin:14px 0 8px}
.eyebrow:first-child{margin-top:0}

/* Toast */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:#fff;padding:10px 18px;border-radius:8px;font-size:.82rem;font-weight:600;z-index:100;box-shadow:0 6px 16px rgba(0,0,0,.2)}

/* Step 1 member rows */
.member-row{border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:9px}
.member-row.sel{border:1.5px solid var(--info);background:var(--info-bg)}
.member-row.disabled{opacity:.55}
.m-head{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.m-head input{margin-top:3px;width:16px;height:16px}
.m-name{font-size:.9rem;font-weight:700;color:var(--text-primary)}
.m-age{font-size:.8rem;color:var(--text-secondary)}
.m-reason{font-size:.78rem;color:var(--text-secondary);margin-top:2px}
.m-body{margin-top:12px;margin-left:28px;display:flex;flex-direction:column;gap:10px}

.svc{border:1px solid var(--border);border-radius:8px;padding:12px 16px;background:var(--bg-paper)}
.svc.ineligible{opacity:.55}
.svc-name{font-size:.9rem;font-weight:600}
.svc-balance{color:var(--info-dark);font-weight:700;font-size:.85rem;margin-top:4px}
.svc-plan{color:var(--text-secondary);font-size:.8rem;margin-top:2px}
.svc-buy{color:var(--info);font-weight:700;font-size:.85rem;cursor:pointer;background:none;border:none;padding:0}
.svc-noSess{color:var(--text-secondary);font-size:.8rem;margin-top:2px}
.svc-buying{color:var(--info-dark);font-weight:700;font-size:.85rem;margin-top:4px}
.svc-remove{color:var(--danger);font-size:.78rem;font-weight:600;background:none;border:none;cursor:pointer;margin-left:8px}
.svc-warn{background:#fee2e2;color:#b91c1c;border-radius:8px;padding:8px 12px;font-size:.78rem;margin-top:8px}

.makeup-banner{background:var(--info-bg);border:1px solid #bfdbfe;border-radius:8px;padding:12px 16px;color:var(--info-dark);font-size:.82rem;margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.makeup-banner .btn{white-space:nowrap}
.makeup-strip{background:var(--info-bg);border:1px solid #bfdbfe;border-radius:8px;padding:10px 16px;color:var(--info-dark);font-size:.82rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}

.buy-panel{background:var(--bg-paper);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:20px;margin-top:12px}
.buy-panel h3{font-size:.85rem;letter-spacing:.03em;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.buy-panel .sub{font-size:.8rem;color:var(--text-secondary);margin-bottom:14px}
.buy-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.buy-item{border:1px solid var(--border);border-radius:8px;padding:14px}
.buy-item h4{font-size:.85rem;font-weight:700}
.buy-item .desc{font-size:.78rem;color:var(--text-secondary);margin:4px 0 8px}
.price-std{text-decoration:line-through;color:var(--text-secondary);font-size:.85rem}
.price-mem{font-weight:700;color:var(--text-primary);font-size:.95rem;margin-left:6px}
.save-line{font-size:.76rem;color:var(--success-dark);margin-top:4px}
.buy-note{font-size:.76rem;color:var(--text-secondary);margin-top:12px}
.add-picker{margin-top:10px;border:1px dashed var(--border-input);border-radius:8px;padding:10px}
.pick-row{display:flex;justify-content:space-between;align-items:center;padding:7px 4px;font-size:.82rem}
.pick-row.ok{cursor:pointer;color:var(--text-primary)}
.pick-row.ok:hover{background:var(--bg-default)}
.pick-row.no{color:var(--text-secondary);opacity:.7}

.remove-confirm{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:14px;margin-top:8px;font-size:.82rem}
.remove-confirm .rows{margin:8px 0;padding-left:16px;color:var(--text-secondary)}

/* Step 2 */
.day-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:.85rem}
.day-row input{width:16px;height:16px}
.day-row select{height:32px;padding:4px 8px;border:1px solid var(--border-input);border-radius:6px;font-size:.8rem}
.day-row.checked .day-label{color:var(--success-dark);font-weight:700}
.day-label{width:88px;flex-shrink:0}
.radio-row{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:4px 0}
.rule-text{font-size:.8rem;color:var(--text-secondary);margin-top:4px;margin-left:24px}
.searchline{font-size:.8rem;color:var(--text-secondary);margin:10px 0}

.day-heading{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-secondary);border-bottom:1px solid var(--border);padding-bottom:6px;margin:18px 0 10px}
.slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot-card{border:1px solid var(--border-input);border-radius:8px;padding:12px}
.slot-card.sel{border:1.5px solid var(--info);background:var(--info-bg)}
.slot-time{font-size:.88rem;font-weight:700}
.slot-loc{font-size:.78rem;color:var(--text-secondary);margin:2px 0 8px}
.seat-row{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px}
.seat{width:14px;height:14px;border-radius:3px;display:inline-block}
.seat.filled{background:var(--primary)}
.seat.free{background:transparent;border:1px solid var(--border-input)}
.ratio{font-size:.78rem;color:var(--text-secondary);margin-bottom:8px}
.full-tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;background:#f1f5f9;color:var(--text-secondary);font-size:.7rem;font-weight:700;margin-left:6px}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1;font-size:.78rem;padding:7px 10px;text-align:center}
.block-msg{background:#fef3c7;color:#b45309;border-radius:8px;padding:9px 10px;font-size:.78rem;margin-top:2px}
.joint-msg{background:#eff6ff;color:#1d4ed8;border-radius:8px;padding:10px;font-size:.8rem}
.joint-msg .btn{margin-top:8px;width:100%}
.no-days{font-size:.82rem;color:var(--text-secondary);padding:14px;background:var(--bg-default);border-radius:8px}

/* Semi private */
.radio-member{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.87rem;font-weight:600}
.semi-note{font-size:.82rem;color:var(--text-secondary);background:var(--bg-default);border-radius:8px;padding:10px 12px;margin:10px 0}
.participant-row{border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:.85rem;margin-bottom:8px}
.participant-row b{font-weight:700}
.select-fm{height:36px;padding:6px 10px;border:1px solid var(--border-input);border-radius:6px;width:100%;margin-top:6px}
.amber-box{background:#fef3c7;color:#b45309;border-radius:8px;padding:12px 16px;font-size:.82rem;margin-top:10px}

/* Preview */
.preview-toggle{display:flex;gap:6px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:4px}
.pv-btn{padding:5px 12px;border-radius:6px;border:none;background:transparent;font-size:.78rem;font-weight:600;color:var(--text-secondary)}
.pv-btn.active{background:var(--primary-dark);color:#fff}
.pv-block-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.pv-service-title{font-size:.9rem;font-weight:700}
.pv-plan-line{font-size:.8rem;color:var(--text-secondary);margin-bottom:10px}
.pv-day{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-secondary);margin:10px 0 4px}
.pv-date-row{display:flex;align-items:center;gap:8px;font-size:.84rem;padding:3px 0}
.pv-date-row input{width:15px;height:15px}
.pv-skip{font-size:.8rem;color:var(--text-secondary);padding:3px 0}
.pv-stop{background:var(--bg-default);border-radius:8px;padding:10px 12px;font-size:.8rem;margin:12px 0 20px;color:var(--text-primary)}
.pv-beyond-hd{font-size:.78rem;font-weight:700;color:var(--text-secondary);margin:10px 0 6px}
.pv-tentative{display:flex;align-items:center;gap:8px;font-size:.82rem;color:#b45309;padding:3px 0}
.pv-tentative input{width:15px;height:15px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal-cell{min-height:44px;border:1px solid var(--border);border-radius:6px;padding:4px;font-size:.68rem;color:var(--text-secondary)}
.cal-chip{display:block;margin-top:2px;border-radius:4px;padding:1px 4px;font-size:.66rem;font-weight:700}
.cal-chip.booked{background:var(--info-bg);color:var(--info-dark)}
.cal-chip.tentative{background:#fef3c7;color:#b45309}
.cal-chip.skip{background:#f1f5f9;color:var(--text-secondary)}

/* Step 4 funding */
.fund-block{border-bottom:1px solid var(--border);padding:14px 0}
.fund-block:last-child{border-bottom:none}
.fund-title{font-size:.9rem;font-weight:700;margin-bottom:6px}
.fund-rc{font-size:.84rem;color:var(--text-primary);background:var(--bg-default);border-radius:8px;padding:10px 12px}
.fund-radio{display:flex;flex-direction:column;gap:2px}
.fund-radio label{display:flex;align-items:flex-start;gap:8px;font-size:.85rem;padding:6px 0;cursor:pointer}
.fund-radio input{margin-top:3px}
.fund-sub{font-size:.78rem;color:var(--text-secondary);margin-left:24px}

/* Step 5 summary */
.summary-name{font-size:.95rem;font-weight:700;margin:18px 0 8px}
.summary-name:first-child{margin-top:0}
.banner{border-left:4px solid var(--success);background:var(--success-bg);color:var(--success-dark);padding:10px 14px;border-radius:6px;font-weight:700;font-size:.85rem;margin-bottom:10px}
.banner.warn{border-left-color:var(--warning);background:#fef3c7;color:#b45309}
.banner.info{border-left-color:var(--info);background:var(--info-bg);color:var(--info-dark)}
.dgrid{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;font-size:.84rem;margin-bottom:10px}
.dgrid .lbl{color:var(--text-secondary);font-weight:600}
.credit-line{font-size:.82rem;color:var(--text-secondary);font-style:italic;margin:2px 0 14px}
.purchase-line{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;font-size:.84rem;border-bottom:1px solid var(--border)}
.rc-note{background:#fef3c7;color:#b45309;border-radius:8px;padding:10px 12px;font-size:.8rem;margin:10px 0}
.total-row{display:flex;justify-content:space-between;align-items:center;padding-top:14px;margin-top:6px;border-top:2px solid var(--text-primary);font-weight:700;font-size:1rem}
.pay-row{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--text-secondary);margin-top:6px}

/* Footer */
.step-footer{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);padding:14px 24px;display:flex;justify-content:space-between;max-width:800px;margin:0 auto;left:0;right:0}

/* Success */
.success-wrap{text-align:center;padding:50px 20px}
.success-check{width:64px;height:64px;border-radius:50%;background:var(--success-bg);color:var(--success-dark);display:grid;place-items:center;margin:0 auto 18px;font-size:34px}
.success-wrap h1{font-size:1.4rem;margin-bottom:6px}
.success-sub{color:var(--text-secondary);font-size:.9rem;margin-bottom:10px}
.success-chip{display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:4px;background:var(--success-bg);color:var(--success-dark);font-weight:700;font-size:.8rem;margin-bottom:22px}
.success-actions{display:flex;gap:10px;justify-content:center}

.demo-block{margin-top:40px;padding-top:24px;border-top:1px dashed var(--border-input);text-align:left}
.demo-block h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-secondary);margin-bottom:10px}
.booking-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:8px;padding:12px 16px}
.cancel-panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px;margin-top:10px}
.cancel-panel h4{font-size:.9rem;text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
.cancel-panel .booking-line{font-size:.85rem;font-weight:600;margin-bottom:10px}
.cancel-panel .window-line{font-size:.83rem;margin-bottom:12px}
.what-happens{border-radius:8px;padding:10px 12px;font-size:.82rem;margin-bottom:14px}
.what-happens.early{background:var(--success-bg);color:var(--success-dark)}
.what-happens.late{background:#fee2e2;color:#b91c1c}
.cancel-actions{display:flex;gap:10px;justify-content:flex-end}

.check{color:var(--success-dark);font-weight:700}

/* Print */
@media print {
  .portal-hd, .type-tabs, .stepper, .tab-strip, .step-footer, button:not(.print-exempt) { display: none !important; }
  body, .step-panel-summary { background: #fff !important; }
  .step-panel-summary { max-width: none; margin: 0; padding: 0; box-shadow: none; }
  .main-wrap{padding:0}
}
</style>
</head>
<body>
<div id="app-root"></div>

<script>
(function(){

var ADD_OPTIONS_EXTRA = {

    {key:'gym', name:'Gymnastics', eligible:true},
    {key:'basketball_demo', name:'Basketball', eligible:false, reason:"This class is for ages 13+. Maria is age 10. Only staff can adjust this — contact the front desk."},
    {key:'advswim_demo', name:'Advanced Swim', eligible:false, reason:"This class is for Level 4 swimmers. Maria is Level 2. Only staff can move her up a level — contact the front desk to request an assessment."},
    {key:'trampoline_demo', name:'Trampoline', eligible:false, reason:"Voucher required. Contact us to add a voucher to your account."},
    {key:'diving_demo', name:'Diving', eligible:false, reason:"Requires in-person assessment. Contact us to schedule your assessment."}
  ]

// Short order-mode names for the two seeded services (D9 exact-label wording)
var SHORT_NAME = {swim:'Swim', gym:'Gym'};
function shortCap(k){ return SHORT_NAME[k] || (svcData('maria',k)||{name:k}).name; }

// Validate picking `slot` for member m / service s. Returns {ok:true} or {ok:false,msg:string}
function validateSlotPick(m,s,slot){
  var other = otherServiceOf(m,s);
  if (!other) return {ok:true};
  var oSched = getSched(m,other);
  if (!oSched.slot) return {ok:true};
  var oSlot = oSched.slot;
  if (oSlot.day !== slot.day) return {ok:true}; // different day, no clash possible
  var oData = svcData(m,other);
  var mine = svcData(m,s);
  // true overlap check (blocked in every mode, including Flexible)
  if (overlaps(slot.start, slot.end, oSlot.start, oSlot.end)){
    return {ok:false, msg:memberFirst(m)+' already has a class at that time — '+oData.name+', '+dayShort(oSlot.day)+' '+oSlot.label+'. Pick a different time for '+mine.name+'.'};
  }
  var mode = getSched(m, memberServices(m)[0]).orderMode; // order mode is stored per pair, on every service
  var firstKey = memberServices(m)[0], secondKey = memberServices(m)[1];
  if (mode === 'flex') return {ok:true};
  if (mode === 'a-first'){
    // firstKey must run, then secondKey after
    if (s === secondKey){
      var fSched = getSched(m, firstKey);
      if (fSched.slot && fSched.slot.day === slot.day && slot.start < fSched.slot.end){
        var fData = svcData(m, firstKey);
        return {ok:false, msg: shortCap(firstKey)+' first, then '+shortCap(secondKey).toLowerCase()+' is set for '+memberFirst(m)+' — this class would come before her '+fData.name+' class ends. Pick a time after '+fSched.slot.label.split(' – ')[1]+', or switch '+memberFirst(m)+' to No preference (classes still can\'t overlap).'};
      }
    } else if (s === firstKey){
      var sSched = getSched(m, secondKey);
      if (sSched.slot && sSched.slot.day === slot.day && sSched.slot.start < slot.end){
        var sDataX = svcData(m, secondKey);
        return {ok:false, msg: shortCap(firstKey)+' first, then '+shortCap(secondKey).toLowerCase()+' is set for '+memberFirst(m)+' — this class would come after her '+sDataX.name+' class starts. Pick a different time, or switch '+memberFirst(m)+' to No preference (classes still can\'t overlap).'};
      }
    }
  } else if (mode === 'b-first'){
    if (s === firstKey){
      var sSched2 = getSched(m, secondKey);
      if (sSched2.slot && sSched2.slot.day === slot.day && slot.start < sSched2.slot.end){
        var sData2 = svcData(m, secondKey);
        return {ok:false, msg: shortCap(secondKey)+' first, then '+shortCap(firstKey).toLowerCase()+' is set for '+memberFirst(m)+' — this class would come before her '+sData2.name+' class ends. Pick a time after '+sSched2.slot.label.split(' – ')[1]+', or switch '+memberFirst(m)+' to No preference (classes still can\'t overlap).'};
      }
    } else if (s === secondKey){
      var fSched2 = getSched(m, firstKey);
      if (fSched2.slot && fSched2.slot.day === slot.day && slot.start < fSched2.slot.end){
        var fData2 = svcData(m, firstKey);
        return {ok:false, msg: shortCap(secondKey)+' first, then '+shortCap(firstKey).toLowerCase()+' is set for '+memberFirst(m)+' — this class would come before her '+fData2.name+' class ends. Pick a different time, or switch '+memberFirst(m)+' to No preference (classes still can\'t overlap).'};
      }
    }
  }
  return {ok:true};
}

function orderRuleSentence(m){
  var svcs = memberServices(m);
  if (svcs.length < 2) return '';
  var aData = svcData(m, svcs[0]), bData = svcData(m, svcs[1]);
  var mode = getSched(m, svcs[0]).orderMode;
  if (mode === 'a-first') return 'On days '+memberFirst(m)+' has both classes, '+bData.name+' will be scheduled to start after '+aData.name+' ends.';
  if (mode === 'b-first') return 'On days '+memberFirst(m)+' has both classes, '+aData.name+' will be scheduled to start after '+bData.name+' ends.';
  return 'Classes can be scheduled in any order — they still can\'t overlap.';
}

function memberComplete(id){
  var svcs = memberServices(id);
  if (!svcs.length) return 'grey';
  var done = 0;
  svcs.forEach(function(s){
    var sc = getSched(id,s);
    if (sc.slot || sc.waitlist) done++;
  });
  if (done === 0) return 'grey';
  if (done === svcs.length) return 'green';
  return 'amber';
}

function bookSlot(m,s,slot){
  if (slot.jointRisk){
    var risked = jointRiskMembers(slot);
    if (risked.length >= 2 && (slot.cap - slot.filled) < risked.length){
      return; // blocked, handled via joint UI — no direct booking
    }
  }
  var v = validateSlotPick(m,s,slot);
  if (!v.ok){ getSched(m,s).blockMsg = v.msg; render(); return; }
  var sc = getSched(m,s);
  sc.slot = slot; sc.waitlist = false; sc.blockMsg = '';
  render();
}

function canAdvance(){
  if (S.step === 1){
    if (S.type === 'semi') return !!S.semiPrimary;
    return S.selected.length > 0;
  }
  if (S.step === 2){
    var mem = activeMembers();
    if (!mem.length) return false;
    return mem.every(function(m){
      return memberServices(m).every(function(s){
        var sc = getSched(m,s);
        return !!(sc.slot || sc.waitlist);
      });
    });
  }
  return true;
}

function goNext(){
  if (!canAdvance()) return;
  if (S.step < 5){
    S.step++;
    S._maxStep = Math.max(S._maxStep||1, S.step);
  }
  render();
}

function renderStep1(){
  if (S.type === 'semi') return renderStep1Semi();
  var html = '<div class="card"><div class="card-hd"><h2>Who is this for?</h2><p>Select who this booking is for, then the class(es) they want.</p></div><div class="card-bd">';
  MEMBERS.forEach(function(mem){
    var sel = S.selected.indexOf(mem.id) !== -1;
    html += '<div class="member-row'+(sel?' sel':'')+'">';
    html += '<div class="m-head" onclick="ZC.toggleMember(\''+mem.id+'\')">';
    html += '<input type="checkbox" '+(sel?'checked':'')+' onclick="event.stopPropagation();ZC.toggleMember(\''+mem.id+'\')" aria-label="Select '+mem.name+'"/>';
    html += '<div><div class="m-name">'+mem.name+' (age '+mem.age+')</div></div></div>';
    if (sel){
      html += '<div class="m-body">';
      memberServices(mem.id).forEach(function(s){
        html += renderServiceSection(mem.id, s);
      });
      if (memberServices(mem.id).length < 3){
        html += '<button class="btn-link" onclick="ZC.toggleAddPicker(\''+mem.id+'\')">+ Add another class for '+memberFirst(mem.id)+'</button>';
        if (S.addPickerOpen[mem.id]) html += renderAddPicker(mem.id);
      }
      var mkKey = key(mem.id, memberServices(mem.id)[0]);
      if (mem.id === 'maria'){
        html += '<div class="makeup-banner"><span><b>'+mem.name.split(' ')[0]+'</b> has 1 make-up available for Swimming Beginner 2 at Solar Swim. You can book a make-up up to 7 days ahead.</span><button class="btn btn-outline" onclick="ZC.useMakeUp(\'maria\')">Use Make-Up Token</button></div>';
      }
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div></div>';
  return html;
}

function renderAddPicker(m){
  var opts = ADD_OPTIONS_EXTRA[m] || [];
  var already = memberServices(m);
  var html = '<div class="add-picker">';
  opts.forEach(function(o){
    if (already.indexOf(o.key) !== -1) return;
    if (o.eligible){
      html += '<div class="pick-row ok" onclick="ZC.addService(\''+m+'\',\''+o.key+'\')">'+o.name+' <span style="color:var(--info);font-weight:600">Add</span></div>';
    } else {
      html += '<div class="pick-row no">'+o.name+' — '+o.reason+'</div>';
    }
  });
  html += '</div>';
  return html;
}

function renderServiceSection(m,s){
  var d = svcData(m,s);
  var pk = key(m,s);
  var bought = S.purchase[pk];
  var html = '<div class="svc">';
  html += '<div class="svc-name">'+d.name+(d.level? ' — '+d.level : '')+'</div>';
  if (d.balance.avail === 0 && !bought){
    html += '<button class="svc-buy" onclick="ZC.openBuy(\''+m+'\',\''+s+'\')">Buy</button>';
    html += '<div class="svc-noSess">No sessions left — tap Buy to add sessions.</div>';
  } else if (bought){
    html += '<div class="svc-buying">Buying: 8 sessions (pending payment) <button class="svc-remove" onclick="ZC.toggleRemoveConfirm(\''+m+'\',\''+s+'\',true)">Remove</button></div>';
  } else {
    html += '<div class="svc-balance">Balance: '+d.balance.avail+' / '+d.balance.total+' sessions</div>';
  }
  html += '<div class="svc-plan">Active plan: '+d.plan+'</div>';
  if (S.buyOpen[pk]) html += renderBuyPanel(m,s);
  if (S.removeConfirm[pk]) html += renderRemoveConfirm(m,s,pk);
  html += '</div>';
  return html;
}

function renderBuyPanel(m,s){
  var d = svcData(m,s);
  var html = '<div class="buy-panel"><h3>Buy Sessions for '+memberFirst(m)+' — '+d.name+' '+(d.level||'')+'</h3>';
  html += '<div class="sub">No sessions left.</div><div class="buy-grid">';
  BUY_CATALOG.forEach(function(item){
    html += '<div class="buy-item"><h4>'+item.name+'</h4><div class="desc">'+item.desc+'</div>';
    html += '<div><span class="price-std">$'+item.standard+(item.monthly?'/mo':'')+'</span><span class="price-mem">Member price: $'+item.member+(item.monthly?'/mo':'')+'</span></div>';
    html += '<div class="save-line">You save $'+item.saving+(item.monthly?'/mo':'')+' ('+item.membership+')</div>';
    html += '<button class="btn btn-primary" style="margin-top:10px;width:100%" onclick="ZC.addToBooking(\''+m+'\',\''+s+'\',\''+item.key+'\')">Add to Booking</button></div>';
  });
  html += '</div><div class="buy-note">Only options '+memberFirst(m)+' is eligible for are shown. A pack her age group or level doesn\'t allow, or a purchase for another account, is never offered here.</div>';
  html += '<div style="margin-top:10px;text-align:right"><button class="btn btn-outline" onclick="ZC.closeBuy(\''+m+'\',\''+s+'\')">Close</button></div>';
  html += '</div>';
  return html;
}

function renderRemoveConfirm(m,s,pk){
  var item = S.purchase[pk];
  var html = '<div class="remove-confirm"><b>Remove this purchase?</b>';
  html += '<div class="rows">Removing the '+item.name+' for '+memberFirst(m)+' will also remove:<div class="rows">— any class scheduled using this purchase</div></div>';
  html += '<div>Nothing has been charged yet — this only clears the booking.</div>';
  html += '<div style="text-align:right;margin-top:10px"><button class="btn btn-outline" onclick="ZC.toggleRemoveConfirm(\''+m+'\',\''+s+'\',false)">Cancel</button> ';
  html += '<button class="btn btn-danger" onclick="ZC.confirmRemovePurchase(\''+m+'\',\''+s+'\')">Remove</button></div></div>';
  return html;
}

function renderStep1Semi(){
  var html = '<div class="card"><div class="card-hd"><h2>Semi-Private</h2><p>Choose the primary participant, then optionally add a second.</p></div><div class="card-bd">';
  MEMBERS.forEach(function(mem){
    html += '<div class="radio-member"><input type="radio" name="semiPrimary" '+(S.semiPrimary===mem.id?'checked':'')+' onclick="ZC.selectSemiPrimary(\''+mem.id+'\')"/> '+mem.name+' (age '+mem.age+')</div>';
  });
  var d = svcData('maria','swim');
  html += '<div class="semi-note"><b>Service: Swimming &nbsp; Level: Beginner 2</b><br/>Required Participants for this class: 2 (set by the service) — so this slot needs one more person to be confirmed.</div>';
  html += '<div class="eyebrow">Participants</div>';
  html += '<div class="participant-row"><b>'+memberName(S.semiPrimary)+'</b> — Beginner 2 / eligible &nbsp; <span style="color:var(--text-secondary)">(Primary)</span></div>';
  html += '<div style="font-size:.85rem;font-weight:600;margin-top:10px">Add a family member? (optional)</div>';
  html += '<select class="select-fm" onchange="ZC.selectSemiSecond(this.value)">';
  html += '<option value="">Select family member…</option>';
  MEMBERS.forEach(function(mem){
    if (mem.id === S.semiPrimary) return;
    var disabled = mem.id === 'carlos';
    html += '<option value="'+mem.id+'" '+(disabled?'disabled':'')+' '+(S.semiSecond===mem.id?'selected':'')+'>'+mem.name+' — '+(disabled?'not eligible — different level':'eligible')+'</option>';
  });
  html += '</select>';
  if (!S.semiSecond){
    html += '<div class="amber-box">With just '+memberFirst(S.semiPrimary)+', this slot will show as "Waiting for a second participant." You can still proceed — a second person can join later.</div>';
  }
  html += '</div></div>';
  return html;
}

/* ---- STEP 2 ---- */
function renderStep2(){
  var mem = activeMembers();
  if (!mem.length) return '<div class="card"><div class="card-bd">Select at least one person in Step 1.</div></div>';
  var html = '';
  mem.forEach(function(m){
    if (mem.length > 1 && S.activeTab && S.activeTab !== m) return;
    memberServices(m).forEach(function(s){
      html += renderStep2Service(m,s);
    });
  });
  return html;
}

function renderStep2Service(m,s){
  var d = svcData(m,s);
  var sc = getSched(m,s);
  var html = '<div class="card"><div class="card-hd"><h2>When would you like to come? ('+memberFirst(m)+' / '+d.name+')</h2>';
  if (S.makeUp.active){
    html += '<p>You can book a make-up up to 7 days ahead — filtered to the same service, level and location.</p>';
  } else {
    html += '<p>Check the days that work for you and set a time range. '+(S.type==='group' ? 'These are scheduled classes you can join.' : 'These are times you can book for this class.')+'</p>';
  }
  html += '</div><div class="card-bd">';

  if (S.makeUp.active){
    html += renderMakeupPicker(m);
    html += '</div></div>';
    return html;
  }

  DAYS.forEach(function(dayName){
    var checked = !!sc.days[dayName];
    html += '<div class="day-row'+(checked?' checked':'')+'"><input type="checkbox" '+(checked?'checked':'')+' onchange="ZC.toggleDay(\''+m+'\',\''+s+'\',\''+dayName+'\')" id="d_'+m+'_'+s+'_'+dayName+'"/><label class="day-label" for="d_'+m+'_'+s+'_'+dayName+'">'+dayName+'</label>';
    if (checked){
      html += '<select onchange="ZC.setFrom(\''+m+'\',\''+s+'\',\''+dayName+'\',this.value)">';
      TIME_OPTS.forEach(function(o){ html += '<option value="'+o.v+'">'+o.t+'</option>'; });
      html += '</select> to <select onchange="ZC.setTo(\''+m+'\',\''+s+'\',\''+dayName+'\',this.value)">';
      TIME_OPTS.forEach(function(o){ html += '<option value="'+o.v+'">'+o.t+'</option>'; });
      html += '</select>';
    }
    html += '</div>';
  });

  html += '<div class="eyebrow">How often?</div>';
  html += '<div class="radio-row"><input type="radio" name="rec_'+m+'_'+s+'" '+(sc.recurrence==='recurring'?'checked':'')+' onclick="ZC.setRecurrence(\''+m+'\',\''+s+'\',\'recurring\')"/> Recurring (same day/time each week)</div>';
  html += '<div class="radio-row"><input type="radio" name="rec_'+m+'_'+s+'" '+(sc.recurrence==='once'?'checked':'')+' onclick="ZC.setRecurrence(\''+m+'\',\''+s+'\',\'once\')"/> One time only</div>';
  html += '<div class="searchline">Search through: Sep 30, 2026</div>';

  // order mode selector
  if (memberServices(m).length === 2 && memberServices(m)[0] === s){
    var svcs = memberServices(m);
    html += '<div class="eyebrow">How should '+memberFirst(m)+"'s classes fit together?</div>";
    html += '<div class="radio-row"><input type="radio" name="ord_'+m+'" '+(sc.orderMode==='a-first'?'checked':'')+' onclick="ZC.setOrderMode(\''+m+'\',\'a-first\')"/> '+shortCap(svcs[0])+' first, then '+shortCap(svcs[1]).toLowerCase()+'</div>';
    html += '<div class="radio-row"><input type="radio" name="ord_'+m+'" '+(sc.orderMode==='b-first'?'checked':'')+' onclick="ZC.setOrderMode(\''+m+'\',\'b-first\')"/> '+shortCap(svcs[1])+' first, then '+shortCap(svcs[0]).toLowerCase()+'</div>';
    html += '<div class="radio-row"><input type="radio" name="ord_'+m+'" '+(sc.orderMode==='flex'?'checked':'')+' onclick="ZC.setOrderMode(\''+m+'\',\'flex\')"/> No preference (classes still can\'t overlap)</div>';
    html += '<div class="rule-text">'+orderRuleSentence(m)+'</div>';
  }

  var checkedDays = Object.keys(sc.days).filter(function(dn){ return sc.days[dn]; });
  if (!checkedDays.length){
    html += '<div class="no-days" style="margin-top:14px">Check the days that work for you to see class options.</div>';
  } else {
    var slots = slotsForService(m,s);
    var shortDays = checkedDays.map(dayShort);
    var byDay = {};
    slots.forEach(function(sl){
      var dShort = sl.day.split(' ').slice(0,2).join(' ');
      var dPrefix = sl.day.slice(0,3);
      if (shortDays.indexOf(dPrefix) === -1) return;
      byDay[sl.day] = byDay[sl.day] || [];
      byDay[sl.day].push(sl);
    });
    if (sc.blockMsg){
      html += '<div class="block-msg" style="margin-top:12px">'+sc.blockMsg+'</div>';
    }
    if (!Object.keys(byDay).length){
      html += '<div class="no-days" style="margin-top:14px">No classes on the days you checked yet — try another day.</div>';
    }
    Object.keys(byDay).forEach(function(dayFull){
      html += '<div class="day-heading">'+dayFull+'</div><div class="slot-grid">';
      byDay[dayFull].forEach(function(slot){
        html += renderSlotCard(m,s,slot);
      });
      html += '</div>';
    });
  }
  html += '</div></div>';
  return html;
}

function renderMakeupPicker(m){
  var sc = getSched(m,'swim');
  var isSel = sc.slot && sc.slot.day === MAKEUP_SLOT.day;
  var html = '<div class="day-heading">'+MAKEUP_SLOT.day+' <span style="text-transform:none;font-weight:400">(within your 7-day make-up horizon)</span></div>';
  html += '<div class="slot-grid"><div class="slot-card'+(isSel?' sel':'')+'">';
  html += '<div class="slot-time">'+MAKEUP_SLOT.label+'</div><div class="slot-loc">📍 '+MAKEUP_SLOT.loc+'</div>';
  html += '<button class="btn btn-primary" style="width:100%" onclick="ZC.pickMakeupSlot(\''+m+'\')">'+(isSel?'Selected':'Book')+'</button>';
  html += '</div></div>';
  return html;
}

function renderSlotCard(m,s,slot){
  var sc = getSched(m,s);
  var isSel = sc.slot && sc.slot.id === slot.id;
  var html = '<div class="slot-card'+(isSel?' sel':'')+'">';
  html += '<div class="slot-time">'+slot.label+'</div><div class="slot-loc">📍 '+slot.loc+'</div>';

  if (S.type === 'group'){
    var full = slot.filled >= slot.cap;
    // joint capacity check
    if (slot.jointRisk){
      var risked = jointRiskMembers(slot);
      if (risked.length >= 2 && (slot.cap - slot.filled) < risked.length){
        html += renderSeatIcons(slot);
        html += '<div class="ratio">'+slot.filled+' booked / '+slot.cap+' spots</div>';
        var names = risked.map(memberFirst).join(' and ');
        html += '<div class="joint-msg">Only '+(slot.cap-slot.filled)+' spot left — not enough for both '+names+'. Choose a different class, or join the waitlist together.<button class="btn btn-outline" onclick="ZC.jointWaitlist(\''+slot.id+'\')">Join Waitlist for Both</button></div>';
        html += '</div>';
        return html;
      }
    }
    html += renderSeatIcons(slot);
    html += '<div class="ratio">'+slot.filled+' booked / '+slot.cap+' spots'+(full?'<span class="full-tag">Full</span>':'')+'</div>';
    if (full){
      html += '<div class="btn-row"><button class="btn btn-outline" style="flex:1" onclick="ZC.waitlistSlot(\''+m+'\',\''+s+'\','+slotJson(slot)+')">Join Waitlist</button></div>';
    } else {
      html += '<div class="btn-row"><button class="btn btn-primary" onclick="ZC.bookSlot(\''+m+'\',\''+s+'\','+slotJson(slot)+')">'+(isSel&&!sc.waitlist?'Selected':'Book')+'</button><button class="btn btn-outline" onclick="ZC.waitlistSlot(\''+m+'\',\''+s+'\','+slotJson(slot)+')">Join Waitlist</button></div>';
    }
  } else if (S.type === 'semi'){
    var seats = [1,2].map(function(i){ return i<=slot.filled; });
    html += '<div class="seat-row">'+seats.map(function(f){return '<span class="seat '+(f?'filled':'free')+'"></span>';}).join('')+'</div>';
    var open = slot.status === 'open';
    html += '<div class="ratio">'+(open? 'Open (2 of 2)' : 'Waiting for a second participant (1 of 2)')+'</div>';
    html += '<div class="btn-row"><button class="btn btn-primary" onclick="ZC.bookSlot(\''+m+'\',\''+s+'\','+slotJson(slot)+')">'+(isSel?'Selected':'Book')+'</button></div>';
  } else {
    html += '<div class="btn-row"><button class="btn btn-primary" onclick="ZC.bookSlot(\''+m+'\',\''+s+'\','+slotJson(slot)+')">'+(isSel?'Selected':'Book')+'</button></div>';
  }
  html += '</div>';
  return html;
}

function renderSeatIcons(slot){
  var out = '<div class="seat-row">';
  for (var i=0;i<slot.cap;i++){
    out += '<span class="seat '+(i<slot.filled?'filled':'free')+'"></span>';
  }
  out += '</div>';
  return out;
}

function slotJson(slot){
  // minimal safe inline JSON for onclick handlers (no quotes in values)
  return "{id:'"+slot.id+"',day:'"+slot.day+"',label:'"+slot.label+"',loc:'"+slot.loc+"',start:"+(slot.start||0)+",end:"+(slot.end||0)+",cap:"+(slot.cap||0)+",filled:"+(slot.filled||0)+",jointRisk:"+(!!slot.jointRisk)+"}";
}

/* ---- STEP 3 : Preview ---- */
function renderStep3(){
  var mem = activeMembers();
  var html = '<div class="card"><div class="card-hd" style="display:flex;justify-content:space-between;align-items:center">';
  html += '<div><h2>Preview</h2><p>The real dates your selections produce, before anything is confirmed.</p></div>';
  html += '<div class="preview-toggle"><button class="pv-btn'+(S.previewView==='list'?' active':'')+'" onclick="ZC.togglePreviewView()">List</button><button class="pv-btn'+(S.previewView==='calendar'?' active':'')+'" onclick="ZC.togglePreviewView()">Calendar</button></div>';
  html += '</div><div class="card-bd">';
  mem.forEach(function(m){
    if (mem.length > 1 && S.activeTab && S.activeTab !== m) return;
    memberServices(m).forEach(function(s){
      html += renderPreviewService(m,s);
    });
  });
  html += '</div></div>';
  return html;
}

function renderPreviewService(m,s){
  var d = svcData(m,s);
  var pk = key(m,s);
  var data = PREVIEW_DATA[pk];
  if (!data) return '';
  var checks = ensurePreviewChecks(m,s);
  var html = '<div class="pv-block-hd"><div class="pv-service-title">'+memberFirst(m).toUpperCase()+' — '+d.name.toUpperCase()+(d.level?' ('+d.level+')':'')+'</div></div>';
  if (S.makeUp.active){
    html += '<div class="pv-plan-line">Make-up session — no plan-period limit applies.</div>';
    var sc = getSched(m,s);
    if (sc.slot){
      html += '<div class="pv-date-row"><input type="checkbox" checked disabled/> '+sc.slot.day+', '+sc.slot.label+'</div>';
    } else {
      html += '<div class="pv-skip">Pick a make-up time on Step 2 to preview it here.</div>';
    }
    return html;
  }
  if (data.planLine) html += '<div class="pv-plan-line">'+data.planLine+'</div>';

  if (S.previewView === 'calendar'){
    html += renderCalendarGrid(data);
  } else {
    var byDay = {};
    data.dates.forEach(function(dt){
      var dayShortName = dt.split(' ')[0];
      byDay[dayShortName] = byDay[dayShortName] || [];
      byDay[dayShortName].push(dt);
    });
    Object.keys(byDay).forEach(function(dn){
      html += '<div class="pv-day">'+dn+'</div>';
      byDay[dn].forEach(function(dt){
        html += '<div class="pv-date-row"><input type="checkbox" '+(checks[dt]?'checked':'')+' onchange="ZC.togglePreviewDate(\''+m+'\',\''+s+'\',\''+dt+'\')"/> '+dt+', '+data.time+'</div>';
      });
      data.skipped.forEach(function(sk){
        if (sk.date.split(' ')[0] === dn){
          html += '<div class="pv-skip">Skipped: '+sk.date+' — '+sk.reason+' (closed)</div>';
        }
      });
    });
  }

  if (data.stop) html += '<div class="pv-stop">'+data.stop+'</div>';
  if (data.tentative && data.tentative.length){
    html += '<div class="pv-beyond-hd">Beyond your plan (shown, not booked):</div>';
    data.tentative.forEach(function(t){
      html += '<div class="pv-tentative"><input type="checkbox" disabled/> '+t.date+' — Tentative. Shown from your repeating schedule. Not reserved.</div>';
    });
  }
  return html;
}

function renderCalendarGrid(data){
  var html = '<div class="cal-grid">';
  var all = data.dates.map(function(d){return {d:d,cls:'booked'};})
    .concat(data.skipped.map(function(s){return {d:s.date,cls:'skip'};}))
    .concat((data.tentative||[]).map(function(t){return {d:t.date,cls:'tentative'};}));
  all.forEach(function(item){
    html += '<div class="cal-cell">'+item.d.split(' ').slice(1).join(' ')+'<span class="cal-chip '+item.cls+'">'+(item.cls==='booked'?'Booked':item.cls==='skip'?'Closed':'Tentative')+'</span></div>';
  });
  html += '</div>';
  return html;
}

/* ---- STEP 4 : Funding ---- */
function renderStep4(){
  var mem = activeMembers();
  var html = '<div class="card"><div class="card-hd"><h2>How you\'ll pay</h2><p>Choose, per class, how it will be paid for.</p></div><div class="card-bd">';
  mem.forEach(function(m){
    memberServices(m).forEach(function(s){
      html += renderFundingBlock(m,s);
    });
  });
  html += '</div></div>';
  return html;
}

function renderFundingBlock(m,s){
  var d = svcData(m,s);
  var pk = key(m,s);
  var html = '<div class="fund-block"><div class="fund-title">'+memberFirst(m).toUpperCase()+' — '+d.name.toUpperCase()+(d.level?' ('+d.level+')':'')+'</div>';

  if (S.makeUp.active){
    html += '<div class="fund-radio"><label><input type="radio" checked disabled/> Use my make-up token</label></div>';
    return html+'</div>';
  }

  if (d.funding === 'rc'){
    html += '<div class="fund-rc">Covered by your Regional Center funding for this class. Approval is pending — you\'ll be notified once it\'s approved. No action needed from you.</div>';
    return html+'</div>';
  }

  var bought = S.purchase[pk];
  var chosen = S.funding[pk] || (bought ? 'card-purchase' : 'balance');
  html += '<div class="fund-radio">';
  if (bought){
    html += '<label><input type="radio" name="fund_'+pk+'" '+(chosen==='card-purchase'?'checked':'')+' onclick="ZC.setFunding(\''+m+'\',\''+s+'\',\'card-purchase\')"/> Pay now by card — using the '+bought.name+' you just added</label>';
    html += '<div class="fund-sub">Member price $'+bought.member+' (was $'+bought.standard+' — you save $'+bought.saving+')</div>';
    html += '<label><input type="radio" name="fund_'+pk+'" '+(chosen==='other-pack'?'checked':'')+' onclick="ZC.setFunding(\''+m+'\',\''+s+'\',\'other-pack\')"/> Add a different pack or subscription</label>';
  } else {
    html += '<label><input type="radio" name="fund_'+pk+'" '+(chosen==='balance'?'checked':'')+' onclick="ZC.setFunding(\''+m+'\',\''+s+'\',\'balance\')"/> Use my class balance — Balance: '+d.balance.avail+' / '+d.balance.total+' sessions</label>';
    html += '<div class="fund-sub">This booking uses '+sessionsUsedFor(m,s)+' of those sessions.</div>';
    html += '<label><input type="radio" name="fund_'+pk+'" '+(chosen==='voucher'?'checked':'')+' onclick="ZC.setFunding(\''+m+'\',\''+s+'\',\'voucher\')"/> Use a voucher</label>';
    html += '<label><input type="radio" name="fund_'+pk+'" '+(chosen==='card'?'checked':'')+' onclick="ZC.setFunding(\''+m+'\',\''+s+'\',\'card\')"/> Pay now by card</label>';
  }
  html += '</div></div>';
  return html;
}

/* ---- STEP 5 : Summary ---- */
// Sessions this booking actually consumes = the checked (kept) dates on the Preview step
function sessionsUsedFor(m,s){
  var pk = key(m,s);
  var data = PREVIEW_DATA[pk];
  if (!data) return 1;
  var checks = ensurePreviewChecks(m,s);
  var n = data.dates.filter(function(d){ return checks[d]; }).length;
  return n || 1;
}
function fundingLabel(m,s){
  var d = svcData(m,s);
  var pk = key(m,s);
  if (S.makeUp.active) return 'Make-up token';
  if (d.funding === 'rc') return 'Regional Center (approval pending)';
  var bought = S.purchase[pk];
  var chosen = S.funding[pk] || (bought?'card-purchase':'balance');
  if (chosen === 'card-purchase' && bought) return 'Card ending 4242 ('+bought.name+')';
  if (chosen === 'voucher') return 'Voucher';
  if (chosen === 'card') return 'Card ending 4242';
  return 'Class balance ('+sessionsUsedFor(m,s)+' of '+d.balance.total+' sessions)';
}
function creditEffectLine(m,s){
  var sc = getSched(m,s);
  if (sc.waitlist) return "Joining the waitlist doesn't use a session — nothing is reserved until a seat opens and you're moved in.";
  if (S.makeUp.active) return "This booking uses your make-up token — your regular session balance isn't touched.";
  var pk = key(m,s);
  if (S.purchase[pk] && (S.funding[pk]||'card-purchase')==='card-purchase') return 'Uses the sessions just purchased.';
  var n = sessionsUsedFor(m,s);
  return n+' session'+(n===1?'':'s')+' reserved — not used yet.';
}

function renderStep5(){
  var mem = activeMembers();
  var html = '<div class="card"><div class="card-hd" style="display:flex;justify-content:space-between;align-items:center"><div><h2>Your booking</h2><p>Complete detail of this booking.</p></div>';
  html += '<button class="btn btn-outline" onclick="ZC.doPrint()">Print</button></div><div class="card-bd">';

  var anyRC = false;
  mem.forEach(function(m){
    html += '<div class="summary-name">'+memberName(m).toUpperCase()+'</div>';
    var banner = bannerFor(m);
    html += '<div class="banner '+banner.cls+'">'+banner.text+'</div>';
    memberServices(m).forEach(function(s,idx){
      var d = svcData(m,s);
      var sc = getSched(m,s);
      html += '<div class="dgrid">';
      if (idx===0) html += '<div class="lbl">For</div><div>'+memberName(m)+'</div>';
      html += '<div class="lbl">Class</div><div>'+(S.type==='group'?'Group ':S.type==='semi'?'Semi-Private ':'Private ')+d.name+(d.level?' / '+d.level:'')+'</div>';
      var pk = key(m,s);
      var data = PREVIEW_DATA[pk];
      if (S.makeUp.active && sc.slot){
        html += '<div class="lbl">Date</div><div>'+sc.slot.day+', '+sc.slot.label+'</div>';
      } else if (data){
        var checks = ensurePreviewChecks(m,s);
        var kept = data.dates.filter(function(dt){return checks[dt];});
        html += '<div class="lbl">Dates</div><div>'+kept.join(' · ')+(data.skipped.length?('<br/><span style="color:var(--text-secondary);font-size:.78rem">Skipped: '+data.skipped.map(function(sk){return sk.date+' — '+sk.reason;}).join(', ')+'</span>'):'')+'</div>';
      } else if (sc.slot){
        html += '<div class="lbl">Day &amp; Time</div><div>'+sc.slot.day+', '+sc.slot.label+'</div>';
      }
      html += '<div class="lbl">Location</div><div>Solar Swim</div>';
      html += '<div class="lbl">Paying with</div><div>'+fundingLabel(m,s)+'</div>';
      html += '</div>';
      html += '<div class="credit-line">Credit effect: '+creditEffectLine(m,s)+'</div>';
      if (S.makeUp.active){
        html += '<div class="dgrid"><div class="lbl">Entitlement source</div><div>1 Make-Up Token</div></div>';
      }
      if (d.funding==='rc') anyRC = true;
    });
  });

  var purchasedAny = Object.keys(S.purchase).length > 0;
  if (purchasedAny){
    html += '<div class="eyebrow">Purchases</div>';
    Object.keys(S.purchase).forEach(function(pk){
      var item = S.purchase[pk];
      var parts = pk.split('|');
      html += '<div class="purchase-line"><div>'+item.name+' for '+memberFirst(parts[0])+'</div><div style="text-align:right">Member price $'+item.member+'<br/><span style="color:var(--text-secondary);font-size:.76rem">(was $'+item.standard+' — you save $'+item.saving+')</span></div></div>';
    });
  }

  if (anyRC){
    html += '<div class="rc-note">Your recurring class will show as tentative until your Regional Center authorization is confirmed. This is normal — we\'ll update you when it\'s confirmed.</div>';
  }

  var due = totalDue();
  var wl = anyBooked();
  html += '<div class="total-row"><div>TOTAL DUE TODAY</div><div>$'+due.toFixed(2)+'</div></div>';
  if (due > 0){
    html += '<div class="pay-row"><div>Pay with card ending 4242</div><button class="btn-link" data-noop onclick="return false">Use a different card</button></div>';
  }
  html += '</div></div>';
  return html;
}

function bannerFor(m){
  var svcs = memberServices(m);
  var allWaitlist = svcs.length && svcs.every(function(s){ return getSched(m,s).waitlist; });
  var anyRC = svcs.some(function(s){ return svcData(m,s).funding === 'rc'; });
  var anySemiPending = (S.type==='semi' && !S.semiSecond);
  if (allWaitlist) return {cls:'info', text:'Added to waitlist'};
  if (S.makeUp.active) return {cls:'', text:'Confirmed'};
  if (anySemiPending) return {cls:'warn', text:'Waiting for a second participant'};
  if (anyRC) return {cls:'warn', text:'Pending Regional Center authorization'};
  return {cls:'', text:'Confirmed'};
}

/* ---- Footer / Success ---- */
function renderFooter(){
  var mem = activeMembers();
  var wl = anyBooked();
  var nextLabel = 'Next Step';
  var action = 'ZC.goNext()';
  var disabled = !canAdvance();
  if (S.step === 5){
    nextLabel = wl.allWaitlist ? 'Join Waitlist' : (totalDue()>0 ? 'Confirm & Pay $'+totalDue().toFixed(2) : 'Confirm Booking');
    action = 'ZC.confirmBooking()';
    disabled = false;
  }
  var btnCls = (S.step===5) ? (wl.allWaitlist? 'btn-outline':'btn-emerald') : 'btn-primary';
  return '<div class="step-footer"><button class="btn btn-outline" onclick="ZC.goBack()" '+(S.step===1?'disabled':'')+'>Back</button>' +
    '<button class="btn '+btnCls+'" onclick="'+action+'" '+(disabled?'disabled':'')+'>'+nextLabel+'</button></div>';
}

function successSubtitle(){
  var mem = activeMembers();
  var svcName = mem.length ? (svcData(mem[0], memberServices(mem[0])[0])||{}).name : '';
  var clsLabel = (S.type==='group'?'Group ':S.type==='semi'?'Semi-Private ':'Private ') + (svcName||'');
  if (mem.length <= 1){
    var m = mem[0];
    var sc = m ? getSched(m, memberServices(m)[0]) : null;
    var dayPart = sc && sc.slot ? sc.slot.day : '';
    return memberName(m||'maria')+' / '+clsLabel+(dayPart?(' / '+dayPart):'');
  }
  if (mem.length === 2){
    return memberName(mem[0])+' & '+memberName(mem[1])+' / '+clsLabel;
  }
  return memberFirst(mem[0])+', '+memberFirst(mem[1])+' & '+memberFirst(mem[2])+' / '+clsLabel;
}

function renderSuccess(){
  var banner = bannerFor((activeMembers()[0])||'maria');
  var html = '<div class="success-wrap"><div class="success-check material-symbols-rounded">check_circle</div>';
  html += '<h1>You\'re all set!</h1>';
  html += '<div class="success-sub">'+successSubtitle()+'</div>';
  html += '<div class="success-chip">Status: '+banner.text+'</div>';
  html += '<div class="success-actions"><button class="btn btn-outline" onclick="ZC.backHome()">Back to Home</button><button class="btn btn-primary" onclick="ZC.scheduleAnother()">Schedule Another Class</button></div>';

  html += '<div class="demo-block"><h3>Manage an existing booking (demo)</h3>';
  html += '<div class="booking-row"><div>Maria Garcia — Group Swimming, Mon Sep 14, 12:30–1:55 PM</div>';
  if (!S.cancelDemoOpen) html += '<button class="btn btn-outline" onclick="ZC.openCancelDemo()">Cancel</button>';
  html += '</div>';
  if (S.cancelDemoOpen) html += renderCancelPanel();
  html += '</div>';
  html += '</div>';
  return html;
}

function renderCancelPanel(){
  var early = isEarlyCancel();
  var html = '<div class="cancel-panel"><h4>Cancelling this booking</h4>';
  html += '<div class="booking-line">Maria Garcia — Group Swimming, Mon Sep 14, 12:30–1:55 PM</div>';
  if (early){
    html += '<div class="window-line">This is an early cancellation — outside the 24-hour cancellation window.</div>';
    html += '<div class="what-happens early"><b>What happens:</b><br/>Session returned to your balance.<br/>You\'ll also receive 1 make-up token, usable within 7 days, for the same service, level and location.</div>';
  } else {
    html += '<div class="window-line">This is a late cancellation — inside the 24-hour cancellation window.</div>';
    html += '<div class="what-happens late"><b>What happens:</b><br/>This session will be used — nothing is returned.<br/>No make-up token is issued for a late cancellation.<br/>If you think this is wrong, contact the front desk.</div>';
  }
  html += '<div class="cancel-actions"><button class="btn btn-outline" onclick="ZC.closeCancelDemo()">Keep My Booking</button><button class="btn btn-danger" onclick="ZC.confirmCancel()">Cancel Booking</button></div></div>';
  return html;
}

/* ============================= EXPOSE + INIT ============================= */
window.ZC = {
  switchType: switchType, toggleMember: toggleMember, setActiveTab: setActiveTab,
  selectSemiPrimary: selectSemiPrimary, selectSemiSecond: selectSemiSecond,
  toggleAddPicker: toggleAddPicker, addService: addService,
  openBuy: openBuy, closeBuy: closeBuy, addToBooking: addToBooking,
  toggleRemoveConfirm: toggleRemoveConfirm, confirmRemovePurchase: confirmRemovePurchase,
  toggleDay: toggleDay, setFrom: setFrom, setTo: setTo, setRecurrence: setRecurrence, setOrderMode: setOrderMode,
  bookSlot: bookSlot, waitlistSlot: waitlistSlot, jointWaitlist: jointWaitlist,
  togglePreviewView: togglePreviewView, togglePreviewDate: togglePreviewDate,
  setFunding: setFunding, goStep: goStep, goNext: goNext, goBack: goBack,
  useMakeUp: useMakeUp, exitMakeUp: exitMakeUp, pickMakeupSlot: pickMakeupSlot,
  confirmBooking: confirmBooking, scheduleAnother: scheduleAnother, backHome: backHome, doPrint: doPrint,
  openCancelDemo: openCancelDemo, closeCancelDemo: closeCancelDemo, confirmCancel: confirmCancel,
  noop: noop
};

// Patch bookSlot/waitlistSlot to accept inline object literals (built by slotJson) since we call them as `ZC.bookSlot('m','s',{...})`
S._maxStep = 1;
render();

})();
</script>
